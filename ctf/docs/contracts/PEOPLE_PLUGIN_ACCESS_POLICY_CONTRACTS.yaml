policies:
  - pluginId: people
    command: people.list
    version: 1.0.0
    requiredRoles:
      - member
    attributePolicies:
      tenancy: same_workspace
      minUnlockTier: approved_full
      readsOnly: true
      sources:
        - directory live profiles (deleted_at IS NULL), the same set the Directory list shows
        - foundation offered skills of a claimed profile's owner
    consentRequirements:
      scopes:
        - platform_terms
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - actor_not_authenticated
      - actor_not_approved
      - account_restricted
