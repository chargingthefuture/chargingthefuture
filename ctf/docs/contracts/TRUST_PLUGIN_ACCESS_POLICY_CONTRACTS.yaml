policies:
  - pluginId: trust
    command: trust.summary.read
    version: 1.0.0
    requiredRoles:
      - member
      - contributor
      - moderator
      - admin
    attributePolicies:
      activeSessionRequired: true
      publicSafeProjectionOnly: true
      trustVisibilityLevelEnforced: true
      noExactTimestampExposure: enforced
      viewedUserScope: same_workspace_or_public_profile
    consentRequirements:
      scopes:
        - trust_summary_read
      fallbackLawfulBasis: legitimate_interest_with_safety_controls
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    disclosureLevels:
      # `restricted` is served, not refused: a non-owner non-admin viewer receives the summary
      # projection (headline counts, no timestamps, per-plugin items collapsed to one breadth
      # line). Only `private` refuses. The owner and admins always read `full`.
      public: full
      restricted: summary
      private: denied_for_non_owner_non_admin
    denyConditions:
      - unauthenticated_session
      - unauthorized_scope
      - trust_visibility_private
      - raw_signal_request_detected

  - pluginId: trust
    command: trust.visibility.update
    version: 1.0.0
    requiredRoles:
      - member
      - contributor
      - moderator
      - admin
    attributePolicies:
      activeSessionRequired: true
      selfScopeOnly: true
      allowedVisibilityLevelsOnly: true
    consentRequirements:
      scopes:
        - trust_visibility_manage
      fallbackLawfulBasis: explicit_consent_required
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - unauthenticated_session
      - unauthorized_scope
      - invalid_visibility_level

  - pluginId: trust
    command: trust.admin.verification.review
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      activeSessionRequired: true
      adminOnly: required
      allowedStatusTransitionsOnly: true
    consentRequirements:
      scopes:
        - trust_admin_write
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - invalid_trust_status
      - missing_target_user

  - pluginId: trust
    command: trust.signal.snapshot.refresh
    version: 1.0.0
    requiredRoles:
      - member
      - contributor
      - moderator
      - admin
    attributePolicies:
      activeSessionRequired: true
      selfScopeOnly: true
      realDataOnlyAggregation: true
      noNumericScoreProduced: true
      statusUnchanged: enforced
    consentRequirements:
      scopes:
        - trust_signal_aggregation
      fallbackLawfulBasis: legitimate_interest_with_safety_controls
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - unauthenticated_session
      - unauthorized_scope
