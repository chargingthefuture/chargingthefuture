policies:
  - pluginId: trust
    command: trust.summary.read
    version: 1.0.0
    requiredRoles:
      - member
      - contributor
      - moderator
      - admin
    attributePolicies:
      activeSessionRequired: true
      publicSafeProjectionOnly: true
      fixedDisclosureLevelInCode: true
      noExactTimestampExposure: enforced
      viewedUserScope: same_workspace_or_public_profile
    consentRequirements:
      scopes:
        - trust_summary_read
      fallbackLawfulBasis: legitimate_interest_with_safety_controls
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    disclosureLevels:
      # Fixed in code, not chosen by the member: the owner and admins read `full`; every other
      # member reads the summary projection (headline counts, no timestamps, per-plugin items
      # collapsed to one breadth line). No viewer is refused - hiding a member's participation from
      # other members would defeat the point of the panel.
      owner_or_admin: full
      any_other_member: summary
    denyConditions:
      - unauthenticated_session
      - unauthorized_scope
      - raw_signal_request_detected

  - pluginId: trust
    command: trust.signal.snapshot.refresh
    version: 1.0.0
    requiredRoles:
      - member
      - contributor
      - moderator
      - admin
    attributePolicies:
      activeSessionRequired: true
      selfScopeOnly: true
      realDataOnlyAggregation: true
      noNumericScoreProduced: true
      statusUnchanged: enforced
    consentRequirements:
      scopes:
        - trust_signal_aggregation
      fallbackLawfulBasis: legitimate_interest_with_safety_controls
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - unauthenticated_session
      - unauthorized_scope
