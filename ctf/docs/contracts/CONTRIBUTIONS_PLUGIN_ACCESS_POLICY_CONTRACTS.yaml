      activeSessionRequired: true
      minUnlockTier: any_authenticated
      aggregateProgressOnly: enforced
    consentRequirements:
      scopes:
        - contributions_read_progress
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
