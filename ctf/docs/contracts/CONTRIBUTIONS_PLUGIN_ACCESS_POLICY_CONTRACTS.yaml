# Contributions plugin access policies.
#
# Plugin-wide policy statements:
# - User commands require only a signed-in member (minUnlockTier any_authenticated). A
#   contribution does NOT require Unlock verification and never alters Unlock state. A
#   not-yet-verified member can contribute and hold the thank-you credits; they simply cannot
#   spend them inside verification-gated plugins until they finish Unlock (deliberate owner
#   decision, 2026-06-10).
# - Contributions takes Amazon gift cards only, open all year. The code is entered in the app,
#   stored encrypted under the server-only CONTRIBUTIONS_CODE_KEY with the member's account id
#   bound in, shown only to an admin one claim at a time (audited), and erased on review.
# - With CONTRIBUTIONS_CODE_KEY unset the app takes no codes (503 contributions_paused).
# - Credits granted on confirmation are thank-you grants of ServiceCredits, an internal credits
#   unit, never redeemable for money.
# - Access to the platform is never gated on contributing; declining or never contributing
#   has no effect on any feature.
policies:
  - pluginId: contributions
    command: contributions.submission.create
    version: 2.0.0
    requiredRoles:
      - member
      - contributor
      - moderator
      - admin
    attributePolicies:
      activeSessionRequired: true
      minUnlockTier: any_authenticated
      submitterScopeOnly: true
      giftCardCodeEncryptedAtRest: enforced
      giftCardCodeNeverReturnedOrLogged: enforced
      codeKeyRequired: enforced
      csrfHeaderAndSameOrigin: enforced
    consentRequirements:
      scopes:
        - contributions_submit
      fallbackLawfulBasis: explicit_consent_required
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - unauthenticated_session
      - csrf_denied
      - invalid_payload
      - amount_out_of_bounds
      - invalid_gift_card_code
      - contributions_paused

  - pluginId: contributions
    command: contributions.status.get
    version: 2.0.0
    requiredRoles:
      - member
      - contributor
      - moderator
      - admin
    attributePolicies:
      activeSessionRequired: true
      minUnlockTier: any_authenticated
      ownRowsOnly: enforced
    consentRequirements:
      scopes:
        - contributions_read_own
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - unauthenticated_session

  - pluginId: contributions
    command: contributions.admin.submission.list
    version: 2.0.0
    requiredRoles:
      - admin
    attributePolicies:
      adminOnlyQueueAccess: required
      giftCardCodeNeverListed: enforced
    consentRequirements:
      scopes:
        - contributions_admin_read
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role

  - pluginId: contributions
    command: contributions.admin.code.reveal
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      adminOnlyCodeAccess: required
      oneClaimPerRequest: enforced
      everyRevealAudited: enforced
      codeNeverInAuditOrLogs: enforced
      noStoreCaching: enforced
      csrfHeaderAndSameOrigin: enforced
    consentRequirements:
      scopes:
        - contributions_admin_read
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - csrf_denied
      - submission_not_found
      - code_not_stored
      - code_key_missing_or_changed

  - pluginId: contributions
    command: contributions.admin.submission.review
    version: 2.0.0
    requiredRoles:
      - admin
    attributePolicies:
      adminOnlyModerationDecision: required
      pendingStatusRequired: enforced
      confirmExactlyOnce: enforced
      perUserYearCreditCap: enforced
      giftCardCodeErasedOnReview: enforced
      csrfHeaderAndSameOrigin: enforced
      creditGrantDelegatedToServiceCredits: enforced
      idempotencyKeyRequired: true
    consentRequirements:
      scopes:
        - contributions_admin_write
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - submission_not_found
      - submission_not_pending
      - missing_confirmed_amount
      - mint_budget_exceeded

  - pluginId: contributions
    command: contributions.admin.config.get
    version: 2.0.0
    requiredRoles:
      - admin
    attributePolicies:
      adminOnlyConfigAccess: required
    consentRequirements:
      scopes:
        - contributions_admin_read
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - insufficient_role

  - pluginId: contributions
    command: contributions.admin.config.update
    version: 2.0.0
    requiredRoles:
      - admin
    attributePolicies:
      adminOnlyConfigAccess: required
      positiveNumericKnobs: enforced
      csrfHeaderAndSameOrigin: enforced
    consentRequirements:
      scopes:
        - contributions_admin_write
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - invalid_config_value
