# Bug Reporting audit events.
#
# Written from the code as it stands on 2026-10-04 (docs only; no behavior changed):
# ctf/packages/web/lib/bug-reports/audit.ts (recordBugReportAdminAudit) and its only caller,
# ctf/packages/web/app/api/bug-reports/admin/[id]/resolve/route.ts.
#
# One event is written, for the admin resolve decision. Not audited:
#   - bug-reports.report.submit — no audit row or audit log line. The stored bug_reports row
#     (user_id, created_at) is the only record that someone filed a report.
#   - bug-reports.admin.list — admin reads are not recorded.
#   - bug-reports.admin.audit-events.list — reads of the trail are not recorded.
#   - The create-issues job (ctf/scripts/createBugReportIssues.mjs) records no audit event; the
#     report row's own status, issue_number and issue_url show that it was sent.
#
# Each event is written twice: a log line tagged `[bug-reports.audit]` with the shape below, and a
# row in bug_report_admin_audit_trail. The row is the durable record. The write never throws: if
# the insert fails, the failure goes to the observability channel (area bug-reports, op
# admin_audit_write) and the request carries on, so a completed resolve is never turned into an
# error by a failed audit write.
#
# What is deliberately never recorded: the report text and the reporter. The trail names which
# report was decided and by which admin. There is no column for either.
auditEvents:
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: bug-reports
    command: bug-reports.admin.resolve
    commandVersion: 1.0.0
    purpose: product_problem_triage
    policyDecision:
      status: allow_or_deny
      reason: admin_route_guard_or_not_resolvable
    dataClassesAccessed:
      - bug_report_status
    targetContext:
      targetType: bug_report
      targetId: bug_report_identifier
    metadata:
      action: release_or_reject
      toStatus: new_or_rejected (only on success)
    result:
      status: success_or_failure
      errorCategory: none_or_conflict_or_persistence_error
    requestId: not_recorded
    traceId: not_recorded
    outcomes:
      - when: Status changed (HTTP 200)
        policyStatus: allow
        reason: admin_route_guard
        result: success
        errorCategory: null in the row, none in the log line
        metadata: '{ action, toStatus }'
      - when: No row changed, report missing or already past the status the action needs (HTTP 409)
        policyStatus: deny
        reason: not_resolvable
        result: failure
        errorCategory: conflict
        metadata: '{ action }'
      - when: The status update threw (HTTP 503)
        policyStatus: allow
        reason: admin_route_guard
        result: failure
        errorCategory: persistence_error
        metadata: '{ action }'
    notWritten: >-
      A request refused before the status update writes nothing: not signed in (401), not an admin
      or a failed CSRF check (403), or a bad id, body or action (400).
    storage:
      table: bug_report_admin_audit_trail
      columns:
        id: uuid primary key, database default (not the same value as the log line eventId)
        actor_id: the admin's user id (auth userId)
        command: bug-reports.admin.resolve
        policy_status: allow or deny
        reason: admin_route_guard or not_resolvable
        target_type: always bug_report
        target_id: the report id from the path
        result: success or failure
        error_category: null, conflict or persistence_error
        metadata: jsonb, the action and on success the new status
        created_at: database default NOW()
      index: idx_bug_report_admin_audit_trail_lookup (created_at DESC, actor_id, command)
      readBy: GET /api/bug-reports/admin/audit-events (Audit log panel on /admin/bug-reports)
    logLineOnly:
      - eventId (random uuid made for the log line)
      - timestamp
      - pluginId
      - commandVersion
