policies:
  - pluginId: socket-relay
    command: socket-relay.request.create
    version: 1.0.0
    requiredRoles:
      - member
    attributePolicies:
      tenancy: same_workspace
      requestOwnership: actor_is_owner
    consentRequirements:
      scopes:
        - socket_relay_request_management
      fallbackLawfulBasis: explicit_consent_required
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - actor_not_authenticated
      - invalid_request_payload

  - pluginId: socket-relay
    command: socket-relay.fulfillment.claim
    version: 1.0.0
    requiredRoles:
      - member
    attributePolicies:
      tenancy: same_workspace
      requestMustBeClaimable: true
      actorCannotOwnRequest: true
    consentRequirements:
      scopes:
        - socket_relay_fulfillment_actions
      fallbackLawfulBasis: contract_preparation
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - actor_not_authenticated
      - request_not_claimable
      - actor_is_request_owner

  - pluginId: socket-relay
    command: socket-relay.fulfillment.resolve
    version: 1.0.0
    requiredRoles:
      - member
      - admin
    attributePolicies:
      tenancy: same_workspace
      # Only the requester (the person who posted the request) — or an admin — may resolve it. A
      # helper can chat on the Direct Line but cannot close someone else's request.
      actorMustBeRequester: true
    consentRequirements:
      scopes:
        - socket_relay_fulfillment_actions
      fallbackLawfulBasis: contract_preparation
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - actor_not_authenticated
      - actor_not_requester
      - invalid_outcome

  - pluginId: socket-relay
    command: socket-relay.fulfillment.message.send
    version: 1.0.0
    requiredRoles:
      - member
    attributePolicies:
      tenancy: same_workspace
      participantMembershipRequired: true
      moderationGate: required
    consentRequirements:
      scopes:
        - socket_relay_fulfillment_communication
      fallbackLawfulBasis: explicit_consent_required
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: true
      requiresAdditionalAudit: true
    denyConditions:
      - actor_not_authenticated
      - actor_not_fulfillment_participant
      - prohibited_content_detected
