# Fireside — threaded conversation under published blog posts.
#
# The one thing to read before changing anything here: `fireside.thread.read` is PUBLIC. It answers
# a caller with no account, because the blog is public and the conversation under it is too. Every
# other command needs a signed-in member.
commands:
  - pluginId: fireside
    command: fireside.thread.read
    version: 1.0.0
    inputSchema:
      type: object
      required: [repo, slug]
      properties:
        repo:
          type: string
        slug:
          type: string
    outputSchema:
      type: object
      properties:
        thread:
          type: object
          properties:
            id:
              type: string
            isClosed:
              type: boolean
            commentCount:
              type: integer
        comments:
          type: array
          items:
            $ref: '#/definitions/PublicComment'
        viewer:
          type: object
          properties:
            isSignedIn:
              type: boolean
    dataAccess:
      - fireside_threads (select)
      - fireside_comments (select)
      - fireside_reactions (select)
      - unlock_verification_submissions (select, access_tier only, to decide whose comments are public)
    purpose: Read the public conversation under one blog post, plus the signed-in reader's own held comments
    retentionClass: community_content
  - pluginId: fireside
    command: fireside.comment.create
    version: 1.0.0
    inputSchema:
      type: object
      required: [postRepo, postSlug, body]
      properties:
        postRepo:
          type: string
        postSlug:
          type: string
        postTitle:
          type: string
        parentCommentId:
          type: [string, 'null']
        body:
          type: string
          minLength: 2
          maxLength: 4000
    outputSchema:
      type: object
      properties:
        commentId:
          type: string
        isPubliclyVisible:
          type: boolean
        notice:
          type: [string, 'null']
    dataAccess:
      - fireside_threads (insert, select)
      - fireside_comments (insert, select)
      - fireside_audit_events (insert)
      - unlock_verification_submissions (select, access_tier only)
      - notifications (insert, when the comment is a visible reply, to tell the author it answered)
    purpose: Write a comment under a post; held from public view until the author is approved in Unlock
    retentionClass: community_content
  - pluginId: fireside
    command: fireside.comment.withdraw
    version: 1.0.0
    inputSchema:
      type: object
      required: [commentId]
      properties:
        commentId:
          type: string
    outputSchema:
      type: object
      properties:
        ok:
          type: boolean
    dataAccess:
      - fireside_comments (update)
      - fireside_audit_events (insert)
    purpose: The author takes their own comment down. `body` empties and the row is kept so replies keep their parent; the words are copied to `withdrawn_body`, which only that author's own read returns. Cannot be undone, so the screen asks first.
    retentionClass: community_content
  - pluginId: fireside
    command: fireside.comment.set_export
    version: 1.0.0
    inputSchema:
      type: object
      required: [commentId, exportToBlog]
      properties:
        commentId:
          type: string
        exportToBlog:
          type: boolean
    outputSchema:
      type: object
      properties:
        exportToBlog:
          type: boolean
        exportReview:
          type: string
          enum: [not_requested, pending, approved, refused]
    dataAccess:
      - fireside_comments (select, update)
      - fireside_audit_events (insert)
    purpose: The author asks for this comment to be copied into the blog's published build, or takes the ask back. Off by default, and asking only queues it — an admin has to approve before anything leaves the app. A comment an admin already declined cannot be re-queued.
    retentionClass: community_content
  - pluginId: fireside
    command: fireside.reaction.toggle
    version: 1.0.0
    inputSchema:
      type: object
      required: [commentId, kind]
      properties:
        commentId:
          type: string
        kind:
          type: string
          enum: [recognize, helpful, same_here, upvote, downvote]
    outputSchema:
      type: object
      properties:
        outcome:
          type: string
          enum: [added, removed]
    dataAccess:
      - fireside_comments (select)
      - fireside_reactions (insert, delete)
      - fireside_audit_events (insert)
    purpose: Leave or take back a reaction, or a vote, on a comment. A vote changes a number beside the comment and nothing else — it never moves the comment, because the thread is ordered oldest first and nothing reads a count to decide position. Pressing one vote clears the other. No count of `downvote` is returned by this or any other command.
    retentionClass: community_content
  - pluginId: fireside
    command: fireside.own.read
    version: 1.0.0
    inputSchema:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
    outputSchema:
      type: object
      properties:
        comments:
          type: array
          items:
            $ref: '#/definitions/OwnComment'
        page:
          type: integer
        lastPage:
          type: integer
        total:
          type: integer
    dataAccess:
      - fireside_comments (select)
      - fireside_threads (select)
      - fireside_reactions (select)
      - unlock_verification_submissions (select, access_tier only)
    purpose: Everything the signed-in member has written here, each labeled live, held, removed or withdrawn
    retentionClass: community_content
  - pluginId: fireside
    command: fireside.comment.remove
    version: 1.0.0
    inputSchema:
      type: object
      required: [commentId, action]
      properties:
        commentId:
          type: string
        action:
          type: string
          enum: [remove, restore]
        reason:
          type: string
    outputSchema:
      type: object
      properties:
        ok:
          type: boolean
    dataAccess:
      - fireside_comments (update)
      - fireside_audit_events (insert)
    purpose: Admin moderation. Separate from whether the author is approved, so approving somebody never resurrects a removed comment
    retentionClass: moderation_record

  - pluginId: fireside
    command: fireside.export.queue.read
    version: 1.0.0
    inputSchema:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
    outputSchema:
      type: object
      properties:
        requests:
          type: array
          items:
            type: object
            properties:
              commentId:
                type: string
              body:
                type: string
              authorName:
                type: string
              authorRecord:
                type: object
                properties:
                  comments:
                    type: integer
                  removed:
                    type: integer
                  exportsRefused:
                    type: integer
                  exportsApproved:
                    type: integer
        page:
          type: integer
        lastPage:
          type: integer
        total:
          type: integer
    dataAccess:
      - fireside_comments (select)
      - fireside_threads (select)
      - unlock_verification_submissions (select, access_tier only)
    purpose: The pending blog-export requests an admin works, oldest first, each carrying the author's own record here so a repeated offender is answered as an account rather than item by item
    retentionClass: community_content
  - pluginId: fireside
    command: fireside.export.approve
    version: 1.0.0
    inputSchema:
      type: object
      required: [commentId, action]
      properties:
        commentId:
          type: string
        action:
          type: string
          enum: [approve, refuse]
        reason:
          type: string
          maxLength: 500
    outputSchema:
      type: object
      properties:
        ok:
          type: boolean
    dataAccess:
      - fireside_comments (update)
      - fireside_audit_events (insert)
    purpose: An admin turns the second of the two keys on copying a comment into the blog's published build, or declines it. Only a pending request can be decided, and a refusal is final for that comment.
    retentionClass: community_content
  - pluginId: fireside
    command: fireside.thread.set_closed
    version: 1.0.0
    inputSchema:
      type: object
      required: [threadId, isClosed]
      properties:
        threadId:
          type: string
        isClosed:
          type: boolean
        reason:
          type: string
          maxLength: 500
    outputSchema:
      type: object
      properties:
        ok:
          type: boolean
        isClosed:
          type: boolean
    dataAccess:
      - fireside_threads (update)
      - fireside_audit_events (insert)
    purpose: Close a conversation to new comments or open it again. Nothing already written is touched, hidden, or removed — this is about what happens next, not about what was said.
    retentionClass: moderation_record
  - pluginId: fireside
    command: fireside.export.feed.read
    version: 1.0.0
    inputSchema:
      type: object
      properties:
        cursor:
          type: string
          description: Where the previous read stopped. Omit it to start from the oldest comment.
        limit:
          type: integer
          minimum: 1
          maximum: 200
    outputSchema:
      type: object
      properties:
        comments:
          type: array
          items:
            type: object
            properties:
              commentId:
                type: string
              parentCommentId:
                type: [string, 'null']
              authorName:
                type: string
              body:
                type: string
              createdAt:
                type: string
              postRepo:
                type: string
              postSlug:
                type: string
              postTitle:
                type: string
        scanned:
          type: integer
          description: How many rows were looked at, which is more than were returned when a row was refused.
        nextCursor:
          type: [string, 'null']
    dataAccess:
      - fireside_comments (select)
      - fireside_threads (select)
      - unlock_verification_submissions (select, access_tier only, to decide whose comments may be copied out)
    purpose: The comments the blog's published build may copy in, so the conversation ships inside the build rather than being fetched into the page afterwards. Every row is decided by mayExportToBlog and nothing else, so neither key alone lets a comment out.
    retentionClass: community_content
definitions:
  PublicComment:
    type: object
    description: What a public reader receives. A display name, never a user id or an email.
    properties:
      id:
        type: string
      parentCommentId:
        type: [string, 'null']
      authorName:
        type: string
      body:
        type: string
      createdAt:
        type: string
      reactions:
        type: object
      viewerReactions:
        type: array
        items:
          type: string
      isOwn:
        type: boolean
  OwnComment:
    type: object
    description: The author's own view, including comments nobody else can see yet.
    allOf:
      - $ref: '#/definitions/PublicComment'
      - type: object
        properties:
          state:
            type: string
            enum: [live, held_for_approval, removed, withdrawn]
          exportToBlog:
            type: boolean
          postRepo:
            type: string
          postSlug:
            type: string
          postTitle:
            type: string
