contracts:
  - pluginId: weekly-performance
    command: weekly-performance.week.list
    version: 1.0.0
    description: List available weekly windows for authorized operator review flows.
    inputSchema:
      page:
        type: integer
        required: false
      pageSize:
        type: integer
        required: false
    outputSchema:
      items:
        type: array
      nextCursor:
        type: string
    dataAccess:
      - weekly_performance_weeks
    purpose: operational_metrics_review
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: weekly-performance
    command: weekly-performance.week.get
    version: 1.0.0
    description: Retrieve canonical metadata and status for a selected weekly window.
    inputSchema:
      weekStart:
        type: string
        required: true
    outputSchema:
      weekStart:
        type: string
      weekEnd:
        type: string
      isCurrentWeek:
        type: boolean
    dataAccess:
      - weekly_performance_weeks
    purpose: operational_metrics_review
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: weekly-performance
    command: weekly-performance.admin.sign_in_record.get
    version: 1.0.0
    description: >-
      Health check of the sign-in record (login_events) behind the Active Members and Daily Active
      Members rows. Runs the once-per-day sign-in write for the calling admin and reports the
      outcome with the database's own error text when it fails, then reads aggregates: totals,
      today, the current week exactly as the dashboard computes it, the last fourteen days, and
      whether the v2 foreign key to users(id) that post/0034 dropped is present. Aggregate only; the
      one per-member fact returned is the caller's own row for today.
    inputSchema: {}
    outputSchema:
      selfWrite:
        type: object
      health:
        type: object
    dataAccess:
      - login_events
      - pg_constraint
      - weekly_performance_audit_trail
    purpose: operational_metrics_review
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: weekly-performance
    command: weekly-performance.metrics.get
    version: 1.0.0
    description: Read deterministic weekly metrics snapshot for approved growth, revenue, and engagement fields.
    inputSchema:
      weekStart:
        type: string
        required: true
      metricSetVersion:
        type: string
        required: false
    outputSchema:
      weekStart:
        type: string
      metrics:
        type: object
      generatedAt:
        type: string
    dataAccess:
      - canonical_metrics_registry
      - weekly_performance_goal_snapshots
      # Workforce recruited goal: the count of all Directory profiles.
      - directory_profiles
      # Active members and signed in per day: the sign-in record, aggregate counts only.
      - login_events
      # Full-account deletions a member chose, for the deleted-accounts adoption row. Aggregate
      # count only — no member is ever named.
      - account_deletion_events
    purpose: operational_metrics_review
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: weekly-performance
    command: weekly-performance.comparison.get
    version: 1.0.0
    description: Compute and return week-over-week comparison values for approved canonical metrics.
    inputSchema:
      weekStart:
        type: string
        required: true
      baselineWeekStart:
        type: string
        required: false
      metricSetVersion:
        type: string
        required: false
    outputSchema:
      weekStart:
        type: string
      baselineWeekStart:
        type: string
      comparisons:
        type: array
    dataAccess:
      - canonical_metrics_registry
      - weekly_performance_goal_snapshots
      # Workforce recruited goal: the count of all Directory profiles.
      - directory_profiles
      # Active members and signed in per day: the sign-in record, aggregate counts only.
      - login_events
      # Full-account deletions a member chose, for the deleted-accounts adoption row. Aggregate
      # count only — no member is ever named.
      - account_deletion_events
    purpose: operational_metrics_comparison
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: weekly-performance
    command: weekly-performance.goal-snapshot.capture
    version: 1.0.0
    description: >-
      Internal, schedule-driven capture of the two goal readings (GDP Community Value Index toward
      300B; Workforce recruited toward 2,000,000) into weekly_performance_goal_snapshots for the
      current week. Goal metrics are state totals - past weeks cannot be recomputed - so each week
      needs at least one stored reading; the daily workflow calling this command makes goal history
      independent of anyone opening the dashboard. Guarded by INTERNAL_SERVICE_SECRET (bearer);
      never member or browser callable. Each goal is read live and its snapshot row upserted (last
      capture of the week wins). A goal that was not stored answers 503 with code
      goal_snapshot_not_stored and each goal's reason, so the scheduled run fails visibly. The GDP
      reading comes from the GDP plugin's live report - see the GDP contracts for that command's own
      reads.
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      weekStartDate:
        type: string
      goals:
        type: array
    dataAccess:
      - weekly_performance_goal_snapshots
      - directory_profiles
    purpose: operational_metrics_capture
    retentionClass: derived_long_lived
    idempotency: true

changelog:
  - date: 2026-10-28
    change: >-
      3.1.0 Measures: the per-plugin weekly counts retired from the dashboard, so the metrics and
      comparison reads no longer touch the plugin tables behind them (Foundation, TrustTransport,
      LightHouse, SocketRelay, ServiceCredits, Contributions, SkillsHunt, WhatWorks, SkillUp,
      Recurring Activity, PeerProgramming, Directory skills, Mood and ClickLog). dataAccess now lists
      only what is still read: the goal snapshots, directory_profiles for the Workforce goal,
      login_events for the two turnout rows, and account_deletion_events. The GDP goal still comes
      from the GDP plugin's live report. The daily active members row is labeled signed in per day;
      its key is unchanged.
  - date: 2026-07-19
    change: >-
      Removed the weekly-performance.report.export command (owner request to delete the export
      feature). The GET /api/weekly-performance/export route, its UI entry points, and the
      WEEKLY_PERFORMANCE_EXPORT_ENABLED flag are gone. No schema change; the audit and access-policy
      contracts drop their matching report.export entries.
  - date: 2026-07-18
    change: >-
      Metrics rebuild (owner-locked decision record ctf/docs/developer/PLUGIN_VALUE_METRICS.md): the
      metrics/comparison/export reads now compute each plugin's defining value event live from the
      upstream plugin tables, plus two goal rows (GDP Community Value Index toward 300B via the GDP
      plugin's live report - see the GDP contracts for that command's own reads - and Workforce
      recruited toward 2,000,000) snapshotted weekly in the new weekly_performance_goal_snapshots
      table so week-over-week works for state metrics. dataAccess lists updated to the real read set;
      the current-week read also upserts the goal snapshot row.
  - date: 2026-02-25
    change: Initial Weekly Performance command contract skeleton added for week listing, snapshot retrieval, comparison, and export workflows.
  - date: 2026-06-27
    change: Aligned dataAccess table names to the shipped schema — weekly_performance_week_windows -> weekly_performance_weeks, weekly_performance_metric_snapshots -> weekly_performance_metrics, weekly_performance_audit_log -> weekly_performance_audit_trail. Documentation alignment only; no schema or table rename.
  - date: 2026-06-27
    change: >-
      Reconciled weekly-performance.report.export to the shipped behavior (#1128). The route returns
      the metrics snapshot as a synchronous inline JSON download, not an asynchronous artifact, so the
      output schema is now {weekStartDate, metrics}; the unbuilt {exportId, status, artifactUrl,
      expiresAt} shape and the unbuilt weekly_performance_exports dataAccess entry were removed, and
      the never-read format and includeComparison inputs were dropped. This is contract-to-reality
      documentation alignment, not a feature removal — a real async artifact-export pipeline (with a
      weekly_performance_exports table) can be added later if the owner wants it.
