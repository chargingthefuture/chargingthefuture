contracts:
  # ─── @comic message routing ────────────────────────────────────────────
  - pluginId: comic
    command: comic.message.route
    version: 1.1.0
    description: Route an inbound chat message to the AI Assistant when it mentions @comic; capture the user turn, run consent/moderation/safety checks, and branch to draft+review or human-first. The background draft is grounded in top-ranked comic_knowledge_entries excerpts (retrieval, #504). Messages without an @comic mention are peer-to-peer and never reach the assistant.
    inputSchema:
      body:
        type: string
        required: true
      channel:
        type: string
        enum: [hub, feed]
        required: false
      conversationId:
        type: string
        required: false
      consentGranted:
        type: boolean
        required: true
    outputSchema:
      routedToAssistant:
        type: boolean
      status:
        type: string
        enum: [review_pending, human_first, not_mentioned]
      conversationId:
        type: string
      holdingResponse:
        type: string
    dataAccess:
      - comic_conversations
      - comic_turns
      - comic_review_queue
      - comic_knowledge_entries
    purpose: assistant_message_routing
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: comic
    command: comic.reply.generate
    version: 1.1.0
    description: Generate an AI Assistant draft reply for a captured @comic turn via the self-hosted Ollama backend, grounded in top-ranked comic_knowledge_entries excerpts (retrieval, #504); the grounding entry ids are recorded on the draft turn. Every draft is enqueued for human review and never surfaced to the asker.
    inputSchema:
      turnId:
        type: string
        required: true
    outputSchema:
      draftTurnId:
        type: string
      engine:
        type: string
        enum: [rasa, ollama, template, human]
      reviewId:
        type: string
    dataAccess:
      - comic_turns
      - comic_review_queue
      - comic_knowledge_entries
    purpose: assistant_reply_generation
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: comic
    command: comic.review.list
    version: 1.0.0
    description: Admin list of pending AI Assistant review items for the owner review dashboard. Paginated; each item carries the asker's question, the draft body, intent/confidence, and the safety category.
    inputSchema:
      page:
        type: integer
        required: false
      pageSize:
        type: integer
        required: false
    outputSchema:
      items:
        type: array
      pagination:
        type: object
    dataAccess:
      - comic_review_queue
      - comic_turns
      - comic_conversations
    purpose: admin_review_queue
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: comic
    command: comic.review.resolve
    version: 1.1.0
    description: Owner resolution of a pending AI Assistant draft — approve, correct (edit), or reject. A corrected resolution persists the asker's question as a training example for the training-data export. On approve/correct the reviewer may tag applicable plugins; the validated slugs are stored on the published answer turn and rendered as tappable plugin links beneath the answer.
    inputSchema:
      reviewId:
        type: string
        required: true
      resolution:
        type: string
        enum: [approve, correct, reject]
        required: true
      correctedBody:
        type: string
        required: false
      reason:
        type: string
        required: false
      # Plugin slugs the reviewer tagged as applicable to this answer. Validated against the visible
      # plugin registry, deduped, and capped (max 5) server-side before being stored on the published
      # answer turn (comic_turns.linked_plugin_slugs). Unknown/hidden slugs are dropped. Ignored for a
      # reject resolution (no answer is published).
      linkedPluginSlugs:
        type: array
        items:
          type: string
        required: false
    # A `correct` resolution must carry the reviewer's corrected text. Expressed as JSON-Schema
    # if/then and enforced in the resolve repository (`correction_required`) so the contract matches
    # the code.
    if:
      properties:
        resolution:
          const: correct
    then:
      required:
        - correctedBody
    outputSchema:
      reviewId:
        type: string
      status:
        type: string
        enum: [approved, corrected, rejected]
      trainingExampleId:
        type: string
      decidedAt:
        type: string
    dataAccess:
      - comic_review_queue
      - comic_turns
      - comic_turns.linked_plugin_slugs
      - comic_training_examples
      - ctf_plugin_registry
    purpose: assistant_human_review
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: comic
    command: comic.conversation.read
    version: 1.0.0
    description: Read the requesting user's own AI Assistant Q&A history for the unified Hub/Feed stream. Returns answered cards (approved/corrected reviews only) and pending "Reviewing for safety" cards. Never returns an unreviewed draft and is scoped to the caller's own conversations.
    inputSchema:
      limit:
        type: integer
        required: false
    outputSchema:
      items:
        type: array
    dataAccess:
      - comic_conversations
      - comic_turns
      - comic_review_queue
      - comic_answer_ratings
    purpose: assistant_asker_stream
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: comic
    command: comic.answer.rate
    version: 1.0.0
    description: Rate an answered AI Assistant turn (helpful, not_helpful, or flagged). Only answers a human has approved/corrected and that belong to the rater's own conversation are ratable; one rating per user per turn, re-rating updates in place. Feeds the conversation-driven training flywheel.
    inputSchema:
      turnId:
        type: string
        required: true
      rating:
        type: string
        enum: [helpful, not_helpful, flagged]
        required: true
    outputSchema:
      turnId:
        type: string
      rating:
        type: string
        enum: [helpful, not_helpful, flagged]
      ratedAt:
        type: string
    dataAccess:
      - comic_turns
      - comic_review_queue
      - comic_answer_ratings
    purpose: assistant_answer_rating
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: comic
    command: comic.training.export
    version: 1.1.0
    description: >-
      Export accumulated AI Assistant training data as NLU-style training YAML (or JSON). The dataset
      now has two parts. 1) Owner corrections — asker questions plus owner-assigned intent labels from
      corrections (the byIntent map / the YAML nlu: block). 2) Rated answers — every answered turn
      paired with its question text, the published answer text, and the most-recent helpful /
      not_helpful / flagged rating plus when it was rated (ratedAnswers). The rated-answer data is
      de-identified: no user id and no other PII is included, only question/answer text, the rating
      value, and timestamps. Supersedes the feed category-only export by sourcing real turns,
      corrections, and human feedback ratings.
    inputSchema:
      format:
        type: string
        enum: [yaml, json]
        required: false
    outputSchema:
      totalExamples:
        type: integer
      byIntent:
        type: object
      ratedAnswers:
        type: array
        description: >-
          De-identified answered turns with their rating: { question, answer, rating, ratedAt }. No
          user id or other PII.
    dataAccess:
      - comic_training_examples
      - comic_answer_ratings
      - comic_turns
      - comic_review_queue
    purpose: assistant_training_export
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: comic
    command: comic.training.stats
    version: 1.0.0
    description: >-
      Admin-only at-a-glance counts of the accumulated training signal for the @comic review
      dashboard: the total non-discarded owner-correction training examples (with a per-status
      breakdown of pending vs exported) and the number of distinct answered turns that carry at least
      one rating. Read-only aggregate counts only — no question, answer, rating, or user data is
      returned, so there is no PII.
    inputSchema: {}
    outputSchema:
      trainingExamplesTotal:
        type: integer
      trainingExamplesByStatus:
        type: object
      ratedAnswersTotal:
        type: integer
    dataAccess:
      - comic_training_examples
      - comic_answer_ratings
    purpose: assistant_training_stats
    retentionClass: derived_short_lived
    idempotency: true
