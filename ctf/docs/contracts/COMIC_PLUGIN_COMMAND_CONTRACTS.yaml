contracts:
  # ─── @comic message routing ────────────────────────────────────────────
  - pluginId: comic
    command: comic.message.route
    version: 1.1.0
    description: Route an inbound chat message to the AI Assistant when it mentions @comic; capture the user turn, run consent/moderation/safety checks, and branch to draft+review or human-first. The background draft is grounded in top-ranked comic_knowledge_entries excerpts (retrieval, #504). Messages without an @comic mention are peer-to-peer and never reach the assistant.
    inputSchema:
      body:
        type: string
        required: true
      channel:
        type: string
        # 'hub' was renamed to 'commons' on 2026-08-09. It is still accepted on input because the
        # route coerces every non-'feed' value to 'commons' anyway, so an older client that still
        # sends 'hub' is stored correctly rather than rejected.
        enum: [commons, feed, hub]
        required: false
      conversationId:
        type: string
        required: false
      consentGranted:
        type: boolean
        required: true
    outputSchema:
      routedToAssistant:
        type: boolean
      status:
        type: string
        enum: [review_pending, human_first, not_mentioned]
      conversationId:
        type: string
      holdingResponse:
        type: string
    dataAccess:
      - comic_conversations
      - comic_turns
      - comic_review_queue
      - comic_knowledge_entries
    purpose: assistant_message_routing
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: comic
    command: comic.reply.generate
    version: 1.1.0
    description: Generate an AI Assistant draft reply for a captured @comic turn via the self-hosted Ollama backend, grounded in top-ranked comic_knowledge_entries excerpts (retrieval, #504); the grounding entry ids are recorded on the draft turn. Every draft is enqueued for human review and never surfaced to the asker.
    inputSchema:
      turnId:
        type: string
        required: true
    outputSchema:
      draftTurnId:
        type: string
      engine:
        type: string
        enum: [rasa, ollama, template, human]
      reviewId:
        type: string
    dataAccess:
      - comic_turns
      - comic_review_queue
      - comic_knowledge_entries
    purpose: assistant_reply_generation
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: comic
    command: comic.review.list
    version: 1.0.0
    description: Admin list of pending AI Assistant review items for the owner review dashboard. Paginated; each item carries the asker's question, the draft body, intent/confidence, and the safety category.
    inputSchema:
      page:
        type: integer
        required: false
      pageSize:
        type: integer
        required: false
    outputSchema:
      items:
        type: array
      pagination:
        type: object
    dataAccess:
      - comic_review_queue
      - comic_turns
      - comic_conversations
    purpose: admin_review_queue
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: comic
    command: comic.review.resolve
    version: 1.1.0
    description: Owner resolution of a pending AI Assistant draft — approve, correct (edit), or reject. A corrected resolution persists the asker's question as a training example for the training-data export. On approve/correct the reviewer may tag applicable plugins; the validated slugs are stored on the published answer turn and rendered as tappable plugin links beneath the answer.
    inputSchema:
      reviewId:
        type: string
        required: true
      resolution:
        type: string
        enum: [approve, correct, reject]
        required: true
      correctedBody:
        type: string
        required: false
      reason:
        type: string
        required: false
      # Plugin slugs the reviewer tagged as applicable to this answer. Validated against the visible
      # plugin registry, deduped, and capped (max 5) server-side before being stored on the published
      # answer turn (comic_turns.linked_plugin_slugs). Unknown/hidden slugs are dropped. Ignored for a
      # reject resolution (no answer is published).
      linkedPluginSlugs:
        type: array
        items:
          type: string
        required: false
    # A `correct` resolution must carry the reviewer's corrected text. Expressed as JSON-Schema
    # if/then and enforced in the resolve repository (`correction_required`) so the contract matches
    # the code.
    if:
      properties:
        resolution:
          const: correct
    then:
      required:
        - correctedBody
    outputSchema:
      reviewId:
        type: string
      status:
        type: string
        enum: [approved, corrected, rejected]
      trainingExampleId:
        type: string
      decidedAt:
        type: string
    dataAccess:
      - comic_review_queue
      - comic_turns
      - comic_turns.linked_plugin_slugs
      - comic_training_examples
      - ctf_plugin_registry
    purpose: assistant_human_review
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: comic
    command: comic.conversation.read
    version: 1.0.0
    description: Read the requesting user's own AI Assistant Q&A history for the unified Hub/Feed stream. Returns answered cards (approved/corrected reviews only) and pending "Reviewing for safety" cards. Never returns an unreviewed draft and is scoped to the caller's own conversations.
    inputSchema:
      limit:
        type: integer
        required: false
    outputSchema:
      items:
        type: array
    dataAccess:
      - comic_conversations
      - comic_turns
      - comic_review_queue
      - comic_answer_ratings
    purpose: assistant_asker_stream
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: comic
    command: comic.answer.rate
    version: 1.0.0
    description: Rate an answered AI Assistant turn (helpful, not_helpful, or flagged). Only answers a human has approved/corrected and that belong to the rater's own conversation are ratable; one rating per user per turn, re-rating updates in place. Feeds the conversation-driven training flywheel.
    inputSchema:
      turnId:
        type: string
        required: true
      rating:
        type: string
        enum: [helpful, not_helpful, flagged]
        required: true
    outputSchema:
      turnId:
        type: string
      rating:
        type: string
        enum: [helpful, not_helpful, flagged]
      ratedAt:
        type: string
    dataAccess:
      - comic_turns
      - comic_review_queue
      - comic_answer_ratings
    purpose: assistant_answer_rating
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: comic
    command: comic.contribution.submit
    version: 1.0.0
    description: >-
      Accept a member's own public Quora writing as candidate reference material for the assistant.
      Signed-in members. TWO PATHS: kind=links (DEFAULT) takes posts the member picked, each with a
      quora.com URL kept as provenance and NEVER fetched — most accounts are mixed, nothing here sorts
      on-topic from off-topic automatically, and picking is both far less reviewer reading and a more
      honest consent than handing over a whole account. kind=export takes the whole Quora export for
      the rarer member whose public writing is nearly all on-topic. Consent is validated BEFORE the file is
      read at all, and the submitted consentVersion must match the current wording — a page cached
      from before a consent change is refused rather than recorded as agreement to wording it never
      displayed. The archive is parsed in memory (only index.html decompressed, entry names
      validated, decompressed-size ceiling against a zip bomb); nothing is written to disk or
      executed, and THE UPLOADED FILE IS NEVER STORED. Inbox messages, drafts, and profile data are
      dropped by an allowlist before any human reads the submission. Nothing accepted here is visible
      to the assistant until a human promotes it into comic_knowledge_entries. Rate-limited to 5 per
      member per 24 hours. The audit records the CONSENT, never the content.
    inputSchema:
      kind:
        type: string
        enum: [links, export]
        required: false
      posts:
        type: array
        required: false
      archive:
        type: file
        required: false
      consentVersion:
        type: string
        required: true
      agreedClauseIds:
        type: array
        required: true
      thirdPartyNote:
        type: string
        required: false
      quoraProfileUrl:
        type: string
        required: false
    outputSchema:
      contribution:
        type: object
      unlockLink:
        type: string
        enum: [submitted, already_on_file, invalid_url, not_provided, failed]
    dataAccess:
      - comic_contributions
      - comic_contribution_entries
      - unlock_verification_submissions
      - unlock_audit_log
    purpose: assistant_knowledge_contribution
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: comic
    command: comic.contribution.withdraw
    version: 1.0.0
    description: >-
      Withdraw a contribution at the contributor's own request. Scoped to the caller inside the query,
      so another member's id is indistinguishable from one that does not exist. Marks the contribution
      withdrawn and deactivates every comic_knowledge_entries row it produced in the SAME transaction,
      so there is no window in which it reads as withdrawn while the assistant is still quoting it.
      This command is what makes the consent form's promise of withdrawal real, and it is only
      possible because the assistant retrieves from a table at answer time rather than being trained
      on the text — words in model weights could not be withdrawn.
    inputSchema:
      contributionId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - comic_contributions
      - comic_contribution_entries
      - comic_knowledge_entries
    purpose: assistant_knowledge_contribution
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: comic
    command: comic.contribution.review
    version: 1.0.0
    description: >-
      Admin. Accept or decline a member's contributed writing. Accept promotes the chosen entries into
      comic_knowledge_entries — the moment a member's writing becomes something the assistant can
      quote — stamping contribution_id on each row so withdrawal and account deletion can still reach
      it, and using the same content_hash formula as the seed importer with ON CONFLICT DO NOTHING so
      two members quoting the same passage collapse onto one row. Promotion and the status flip share
      one transaction. Decline REQUIRES a reason, which the contributor reads on their own page.
      On accept, a flat ServiceCredits recognition grant is made — but ONLY to a member who has
      finished Unlock (owner decision, 2026-07-29); anyone signed in may contribute, and an accepted
      contribution from a not-yet-verified member stays accepted and ungranted. granted_at is stamped
      before the mint and the mint carries a per-contribution idempotency key, so a retried review
      cannot mint twice. The grant runs after promotion and may fail without undoing it: a mint outage
      must not cost the library the writing.
    inputSchema:
      contributionId:
        type: string
        required: true
      action:
        type: string
        enum: [accept, decline]
        required: true
      excludedEntryIds:
        type: array
        required: false
      reason:
        type: string
        required: false
    outputSchema:
      status:
        type: string
      promoted:
        type: integer
      alreadyPresent:
        type: integer
      grant:
        type: object
    dataAccess:
      - comic_contributions
      - comic_contribution_entries
      - comic_knowledge_entries
      - service_credits_governance_events
    purpose: assistant_knowledge_contribution
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: comic
    command: comic.training.export
    version: 1.2.0
    description: >-
      Export accumulated AI Assistant training data as NLU-style training YAML (or JSON). The dataset
      now has two parts. 1) Owner corrections — asker questions plus owner-assigned intent labels from
      corrections (the byIntent map / the YAML nlu: block). 2) Rated answers — every answered turn
      paired with its question text, the published answer text, and the most-recent helpful /
      not_helpful / flagged rating plus when it was rated (ratedAnswers). The rated-answer data is
      de-identified: no user id and no other PII is included, only question/answer text, the rating
      value, and timestamps. Supersedes the feed category-only export by sourcing real turns,
      corrections, and human feedback ratings. Running the export also records it: every owner
      correction that reached the file and was still awaiting export is set to exported with an
      exported_at stamp, which is what moves the admin dashboard's awaiting-export / exported counts.
      The file is unchanged by this — it is the whole dataset on every call, not a take-once queue.
      Pass preview=1 to read it without marking anything.
    inputSchema:
      format:
        type: string
        enum: [yaml, json]
        required: false
      preview:
        type: string
        enum: ['1', 'true']
        required: false
        description: >-
          When set, return the file without marking any training example as exported.
    outputSchema:
      totalExamples:
        type: integer
      byIntent:
        type: object
      ratedAnswers:
        type: array
        description: >-
          De-identified answered turns with their rating: { question, answer, rating, ratedAt }. No
          user id or other PII.
      markedExported:
        type: integer
        description: >-
          How many training examples this run moved from awaiting export to exported. Also returned
          on the YAML download as the X-Marked-Exported header.
      markSkippedReason:
        type: string
        description: >-
          Null when the rows were marked. Otherwise a plain reason they were not — preview mode, or
          the update failing after the file was already built.
    dataAccess:
      - comic_training_examples
      - comic_answer_ratings
      - comic_turns
      - comic_review_queue
    purpose: assistant_training_export
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: comic
    command: comic.training.stats
    version: 1.0.0
    description: >-
      Admin-only at-a-glance counts of the accumulated training signal for the @comic review
      dashboard: the total non-discarded owner-correction training examples (with a per-status
      breakdown of pending vs exported) and the number of distinct answered turns that carry at least
      one rating. Read-only aggregate counts only — no question, answer, rating, or user data is
      returned, so there is no PII.
    inputSchema: {}
    outputSchema:
      trainingExamplesTotal:
        type: integer
      trainingExamplesByStatus:
        type: object
      ratedAnswersTotal:
        type: integer
    dataAccess:
      - comic_training_examples
      - comic_answer_ratings
    purpose: assistant_training_stats
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: comic
    command: comic.admin.knowledge.list
    version: 1.0.0
    description: >-
      Admin. Browse the assistant's grounding library (comic_knowledge_entries) with each entry's
      active flag — the read half of knowledge curation (/admin/comic/knowledge). Returns paginated
      entries with source, type, title/question, a content snippet, and active state, plus total and
      active counts. Implemented by GET /api/comic/admin/knowledge.
    inputSchema:
      page:
        type: integer
        required: false
      pageSize:
        type: integer
        required: false
      filter:
        type: string
        enum: [all, active, inactive]
        required: false
    outputSchema:
      items:
        type: array
      total:
        type: integer
      activeTotal:
        type: integer
    dataAccess:
      - comic_knowledge_entries
    purpose: assistant_knowledge_curation
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: comic
    command: comic.admin.knowledge.set-active
    version: 1.0.0
    description: >-
      Admin. Switch one grounding entry on or off for retrieval — the write half of knowledge
      curation. Deactivating never deletes: the row stays (history, withdrawal, deletion contracts
      all still reach it) and retrieval simply skips inactive rows; the entry can be switched back
      on. Implemented by PUT /api/comic/admin/knowledge/:entryId (CSRF-guarded).
    inputSchema:
      entryId:
        type: string
        required: true
      active:
        type: boolean
        required: true
    outputSchema:
      entry:
        type: object
    dataAccess:
      - comic_knowledge_entries
    purpose: assistant_knowledge_curation
    retentionClass: transactional_long_lived
    idempotency: true
