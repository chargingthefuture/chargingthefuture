# Owner directive, 2026-08-28: every admin action is recorded, on every surface. Until that date these
# events were written by logMutualTimeAudit, which builds the whole shape below and ends in
# console.info — a line in the server's log, which nothing can query, no screen can show, and which
# ages out of the host's retention window. Every admin event here is now also a durable row in
# mutual_time_admin_audit_trail, written by recordMutualTimeAdminAudit on every outcome including a
# refusal. mutual-time.vote.save keeps the log line alone: it is a member's action, not an admin's,
# and a row per member's picks would put voter identity into a trail that deliberately has none.
pluginId: mutual-time
commandVersion: 1.0.0
description: >
  Audit events emitted by Mutual Time commands (spec #1780). Reads (mutual-time.event.read) and the
  poll-driven state are high-frequency and not audited. Emitted as structured log lines
  ([mutual-time.audit]); the platform log pipeline is the sink.

auditEvents:
  - eventId: <uuid>
    timestamp: <iso8601>
    actorId: <admin user id>
    pluginId: mutual-time
    command: mutual-time.event.create
    commandVersion: 1.0.0
    purpose: scheduling_event_create
    policyDecision:
      status: allow
      reason: admin
      evidence: role=admin
    dataClassesAccessed: [mutual_time_events]
    targetContext:
      eventId: <event id>
      slug: <event slug>
      meetingPlugin: <chyme|peer-programming|beacon>
    requestId: <request id>
    traceId: <trace id>
    result: success

  - eventId: <uuid>
    timestamp: <iso8601>
    actorId: <admin user id>
    pluginId: mutual-time
    command: mutual-time.event.close
    commandVersion: 1.0.0
    purpose: scheduling_event_close
    policyDecision:
      status: allow
      reason: admin
      evidence: role=admin;owner=true
    dataClassesAccessed: [mutual_time_events, mutual_time_votes]
    targetContext:
      eventId: <event id>
      slug: <event slug>
      resultSlotStart: <iso8601 winning slot, or empty when no votes>
    requestId: <request id>
    traceId: <trace id>
    result: success

  - eventId: <uuid>
    timestamp: <iso8601>
    actorId: <approved member user id>
    pluginId: mutual-time
    command: mutual-time.vote.save
    commandVersion: 1.0.0
    purpose: scheduling_vote_save
    policyDecision:
      status: allow
      reason: approved_member
      evidence: unlockTier=approved_full
    dataClassesAccessed: [mutual_time_events, mutual_time_votes]
    targetContext:
      slug: <event slug>
      pickCount: <0-3>
    requestId: <request id>
    traceId: <trace id>
    result: success

  # An admin reading the trail from the Audit log panel on the Mutual Time dashboard.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: mutual-time
    command: mutual-time.admin.audit.list
    commandVersion: 1.0.0
    purpose: governance_transparency
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - mutual_time_admin_audit_trail
    targetContext:
      targetType: audit_trail
      targetId: row_count_requested
    result:
      status: success_or_failure
      errorCategory: none_or_error_class
