commands:
  - pluginId: click-log
    command: click-log.incident.create
    version: 1.3.0
    inputSchema:
      type: object
      properties:
        metadata:
          $ref: '#/definitions/IncidentMetadata'
        sharedWithOwner:
          type: boolean
        problemTag:
          type: string
        schemeTag:
          type: string
        schemeSuggestion:
          type: string
        schemeQuoraUrl:
          type: string
      # metadata is not required, matches implementation.
      # sharedWithOwner is optional: when omitted, the member's stored global default
      # (click_log_preferences.share_with_owner, itself defaulting to false) is applied.
      # problemTag / schemeTag are optional coarse tags — one, both, or neither may be sent.
      # Each is validated against the canonical slug list in packages/web/lib/click-log/tags.ts
      # (problems mirror the landing-page 50+ problems list; schemes started from the owner's
      # "A post for each gang stalker game" Discourse thread — now deprecated, so tags.ts is
      # the living canonical scheme list); an unknown slug is a 400.
      # When either or both tags are present, metadata.latitude and metadata.longitude are
      # required (owner decision, 2026-08-02: tagged trend data needs location to be detailed
      # enough); a tagged request without a location is a 400.
      # schemeSuggestion is REQUIRED (1–200 chars after trim) when schemeTag is the catch-all
      # 'other-scheme' ("Not listed") and rejected with any other schemeTag. It is member text
      # EXPLICITLY shared with the owner (the form says so; metadata.notes stays never-shared)
      # and is stored in click_log_scheme_suggestions for the scheme-naming pipeline.
      # schemeQuoraUrl is optional with 'other-scheme' only: an https quora.com link to the
      # member's own post about a similar incident (a spam signal for the owner).
      # The 'other-scheme' flow is limited to Weavers of the Commons badge holders
      # (contributor_access_eligibility: eligible and not revoked); others receive a 403.
    outputSchema:
      $ref: '#/definitions/ClickLogIncident'
    dataAccess:
      - click_log_incidents (insert)
      - click_log_preferences (select)
      - click_log_scheme_suggestions (insert — only when schemeTag is 'other-scheme')
      - contributor_access_eligibility (select — Weavers badge check, only when schemeTag is 'other-scheme')
    purpose: Log a new incident for the authenticated user
    retentionClass: user_event
  - pluginId: click-log
    command: click-log.incident.list
    version: 1.1.0
    inputSchema:
      type: object
      properties:
        userId:
          type: string
      # userId is optional: the list route never accepts a caller-supplied userId — it
      # always derives the user from the authenticated Clerk token server-side and scopes
      # the query to the caller's own incidents. Marking it required would put the declared
      # contract out of step with both clients, which send no userId.
    outputSchema:
      type: object
      properties:
        incidents:
          type: array
          items:
            $ref: '#/definitions/ClickLogIncident'
        count:
          type: integer
        canSuggestScheme:
          type: boolean
      # canSuggestScheme: whether this member may pick the "Not listed" scheme tag (Weavers of
      # the Commons badge holders only). The client hides the option when false; the create
      # route enforces the same rule independently.
    dataAccess:
      - click_log_incidents (select)
      - contributor_access_eligibility (select — Weavers badge check for canSuggestScheme)
    purpose: List incidents for a user
    retentionClass: user_event
  - pluginId: click-log
    command: click-log.incident.delete
    version: 1.0.0
    inputSchema:
      type: object
      properties:
        id:
          type: string
      required: [id]
    outputSchema:
      type: object
      properties:
        success:
          type: boolean
    dataAccess:
      - click_log_incidents (delete)
    purpose: Delete an incident by id
    retentionClass: user_event
  - pluginId: click-log
    command: click-log.incident.share.set
    version: 1.0.0
    inputSchema:
      type: object
      properties:
        id:
          type: string
        sharedWithOwner:
          type: boolean
      required: [id, sharedWithOwner]
    outputSchema:
      type: object
      properties:
        success:
          type: boolean
        sharedWithOwner:
          type: boolean
    dataAccess:
      - click_log_incidents (update)
    purpose: Set whether a single incident is shared with the owner for aggregate trends (owner of the incident only)
    retentionClass: user_event
  - pluginId: click-log
    command: click-log.preferences.fetch
    version: 1.0.0
    inputSchema:
      type: object
      properties: {}
    outputSchema:
      $ref: '#/definitions/ClickLogPreferences'
    dataAccess:
      - click_log_preferences (select)
    purpose: Read the member's global owner-share default
    retentionClass: user_event
  - pluginId: click-log
    command: click-log.preferences.update
    version: 1.0.0
    inputSchema:
      type: object
      properties:
        shareWithOwner:
          type: boolean
      required: [shareWithOwner]
    outputSchema:
      $ref: '#/definitions/ClickLogPreferences'
    dataAccess:
      - click_log_preferences (upsert)
    purpose: Set the member's global owner-share default for newly logged incidents
    retentionClass: user_event
  - pluginId: click-log
    command: click-log.trends.fetch
    version: 1.1.0
    inputSchema:
      type: object
      properties: {}
    outputSchema:
      type: object
      properties:
        buckets:
          type: array
          items:
            $ref: '#/definitions/SharedIncidentTrendBucket'
        tagTrends:
          type: array
          items:
            $ref: '#/definitions/SharedIncidentTagTrend'
    dataAccess:
      - click_log_incidents (select, aggregate only — shared_with_owner rows; the SQL projects
        only day buckets, 1-decimal location cells, counts, and per-tag counts over the
        canonical problem/scheme tag slugs, never notes, precise coordinates, incident ids,
        or member identity)
    purpose: Owner/admin-only aggregate trends over incidents members opted to share
    retentionClass: user_event

definitions:
  IncidentMetadata:
    type: object
    properties:
      latitude:
        type: number
      longitude:
        type: number
      notes:
        type: string
    additionalProperties: false
  ClickLogIncident:
    type: object
    properties:
      id:
        type: string
      user_id:
        type:
          - string
          - 'null'
      metadata:
        $ref: '#/definitions/IncidentMetadata'
      shared_with_owner:
        type: boolean
      # Optional coarse tags; slugs from packages/web/lib/click-log/tags.ts, null when untagged.
      problem_tag:
        type:
          - string
          - 'null'
      scheme_tag:
        type:
          - string
          - 'null'
      created_at:
        type: string
    required: [id, user_id, metadata, shared_with_owner, problem_tag, scheme_tag, created_at]
  ClickLogPreferences:
    type: object
    properties:
      shareWithOwner:
        type: boolean
    required: [shareWithOwner]
  SharedIncidentTrendBucket:
    type: object
    properties:
      day:
        type: string
      latitudeCell:
        type:
          - number
          - 'null'
      longitudeCell:
        type:
          - number
          - 'null'
      count:
        type: integer
    required: [day, latitudeCell, longitudeCell, count]
  SharedIncidentTagTrend:
    type: object
    properties:
      tagType:
        type: string
        enum: [problem, scheme]
      tag:
        type: string
      count:
        type: integer
    required: [tagType, tag, count]
