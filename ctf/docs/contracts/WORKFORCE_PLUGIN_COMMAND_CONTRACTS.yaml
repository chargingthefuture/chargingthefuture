contracts:
  - pluginId: workforce
    command: workforce.dashboard.fetch
    version: 2.0.0
    description: >-
      Fetch the live workforce dashboard: population-scaled demand (from Skills Taxonomy sector
      workforce shares and the workforce config) vs Directory supply (members + recruited). Read-only.
    inputSchema:
      scope:
        type: object
        required: false
    outputSchema:
      dashboard:
        type: object
      generatedAt:
        type: string
    dataAccess:
      - directory_profiles
      - directory_profile_skills
      - skills_taxonomy_sectors
      - skills_taxonomy_job_titles
      - skills_taxonomy_skills
      - workforce_config
    purpose: workforce_visibility
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: workforce
    command: workforce.profile.fetch
    version: 2.0.0
    description: >-
      Fetch the caller's read-only workforce profile (occupation/skill derived live from their claimed
      Directory profile) plus the workforce-owned extension preferences and deletion marker.
    inputSchema:
      userScope:
        type: self
        required: true
    outputSchema:
      profile:
        type: object
    dataAccess:
      - directory_profiles
      - skills_taxonomy_job_titles
      - workforce_user_extension
    purpose: workforce_profile_management
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: workforce
    command: workforce.profile.delete
    version: 2.0.0
    description: >-
      Service-scoped workforce profile soft delete: set service_deleted_at and reset the workforce
      extension preferences. Directory and Skills Taxonomy are never written.
    inputSchema:
      scope:
        type: string
        enum: [service]
    outputSchema:
      status:
        type: string
      requestedAtIso:
        type: string
    dataAccess:
      - workforce_user_extension
      - workforce_deletion_events
      - workforce_admin_audit_trail
    purpose: workforce_profile_management
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: workforce
    command: workforce.occupations.list
    version: 2.0.0
    description: >-
      List occupations (Skills Taxonomy job titles) with their demand/supply overlay, largest gap
      first. Read-only; occupations are owned by Skills Taxonomy, never by Workforce.
    inputSchema:
      pagination:
        type: object
    outputSchema:
      items:
        type: array
      pagination:
        type: object
    dataAccess:
      - skills_taxonomy_job_titles
      - skills_taxonomy_skills
      - skills_taxonomy_sectors
      - directory_profiles
      - directory_profile_skills
      - workforce_config
    purpose: workforce_catalog
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: workforce
    command: workforce.occupations.detail.fetch
    version: 2.0.0
    description: Fetch one occupation (Skills Taxonomy job title) with its demand/supply overlay.
    inputSchema:
      occupationId:
        type: string
        required: true
    outputSchema:
      occupation:
        type: object
    dataAccess:
      - skills_taxonomy_job_titles
      - skills_taxonomy_skills
      - skills_taxonomy_sectors
      - directory_profiles
      - directory_profile_skills
      - workforce_config
    purpose: workforce_catalog
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: workforce
    command: workforce.report.skillLevel.fetch
    version: 2.0.0
    description: >-
      Fetch the workforce breakdown grouped by skill level (demand vs recruited per level). For a
      specific (non-`all`) level, also returns `detail` with the matched-member list (the V2 drilldown).
    inputSchema:
      skillLevel:
        type: string
        required: false
    outputSchema:
      items:
        type: array
      detail:
        type: object
        required: false
    dataAccess:
      - directory_profiles
      - directory_profile_skills
      - skills_taxonomy_sectors
      - skills_taxonomy_job_titles
      - skills_taxonomy_skills
      - workforce_config
    purpose: workforce_reporting
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: workforce
    command: workforce.report.sector.fetch
    version: 2.0.0
    description: >-
      Fetch the workforce breakdown grouped by sector (demand vs recruited and the gap per sector). For
      a specific (non-`all`) sector, also returns `detail` with the matched-member list (the V2 drilldown).
    inputSchema:
      sector:
        type: string
        required: false
    outputSchema:
      items:
        type: array
      detail:
        type: object
        required: false
    dataAccess:
      - directory_profiles
      - directory_profile_skills
      - skills_taxonomy_sectors
      - skills_taxonomy_job_titles
      - skills_taxonomy_skills
      - workforce_config
    purpose: workforce_reporting
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: workforce
    command: workforce.report.occupations.fetch
    version: 1.0.0
    description: >-
      Fetch per-occupation training gaps (demand vs recruited per Skills Taxonomy job title), largest
      gap first. This is the signal that later tells SkillUp which training cohorts to stand up.
    inputSchema:
      limit:
        type: number
        required: false
    outputSchema:
      items:
        type: array
    dataAccess:
      - directory_profiles
      - directory_profile_skills
      - skills_taxonomy_sectors
      - skills_taxonomy_job_titles
      - skills_taxonomy_skills
      - workforce_config
    purpose: workforce_reporting
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: workforce
    command: workforce.report.communityPlanning.fetch
    version: 1.0.0
    description: >-
      Fetch the community-planning team rosters for the survivor-built gated community planning
      document (issue #1465). Returns the ten planning teams, each a named union of Workforce sectors,
      with the team's de-duplicated matched-member roster (same 3-way match as the sector drilldown),
      the summed demand target/recruited/gap of its sectors, and any team sector absent from the Skills
      Taxonomy. Read-only; recomputes live from the model on every call. Same read access as the other
      reports, so member names are only ever returned to a signed-in member.
    inputSchema: {}
    outputSchema:
      report:
        type: object
    dataAccess:
      - directory_profiles
      - directory_profile_skills
      - skills_taxonomy_sectors
      - skills_taxonomy_job_titles
      - skills_taxonomy_skills
      - workforce_config
    purpose: workforce_reporting
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: workforce
    command: workforce.admin.config.fetch
    version: 2.0.0
    description: Fetch the workforce config (population model — population, participation rate, min/max recruitable).
    inputSchema:
      scope:
        type: object
    outputSchema:
      config:
        type: object
    dataAccess:
      - workforce_config
    purpose: workforce_governance
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: workforce
    command: workforce.admin.config.update
    version: 2.0.0
    description: >-
      Update the workforce config (population, participation rate, min/max recruitable). This is the
      only workforce-owned, admin-editable state; Directory and Skills Taxonomy are never written.
    inputSchema:
      config:
        type: object
        required: true
    outputSchema:
      config:
        type: object
      updatedAt:
        type: string
    dataAccess:
      - workforce_config
      - workforce_admin_audit_trail
    purpose: workforce_governance
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: workforce
    command: workforce.admin.auditEvents.fetch
    version: 1.0.0
    description: Fetch workforce admin audit trail.
    inputSchema:
      pagination:
        type: object
    outputSchema:
      items:
        type: array
      pagination:
        type: object
    dataAccess:
      - workforce_admin_audit_trail
    purpose: workforce_governance
    retentionClass: audit_long_lived
    idempotency: true
