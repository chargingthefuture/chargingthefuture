contracts:
  - pluginId: trust
    command: trust.summary.read
    version: 1.0.0
    description: Read a member's trust panel (status, derived evidence). Implemented by GET /api/trust/user/self and GET /api/trust/user/[userId]. The disclosure level is fixed in code, not by any member setting - the owner and admins read full, every other member reads the summary projection. No read is refused.
    inputSchema:
      subjectUserId:
        type: string
        required: true
      surface:
        type: string
        required: false
      viewerContext:
        type: string
        required: false
    outputSchema:
      userId:
        type: string
      trustEvidence:
        type: array
      updatedAt:
        type: string
      trustDisclosure:
        type: string
        enum:
          - full
          - summary
        description: Which projection the viewer received. summary carries headline counts only — no timestamps, no supporting detail, per-plugin items collapsed to a single breadth line.
    dataAccess:
      - trust_user_extension
      - trust_signal_snapshot
    purpose: trust_signal_display
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: trust
    command: trust.signal.snapshot.refresh
    version: 1.4.0
    description: Recompute the CALLER's trust signal from real cross-plugin engagement across every applicable plugin (sign-in history — the all-time count of days the member signed in on, plus their current unbroken run of consecutive sign-in days, which counts only while it reaches today or yesterday; SocketRelay trades/requests; ServiceCredits received; accepted/completed/claimed participation in LightHouse, TrustTransport, SkillsHunt, LevelUp, Chyme, Directory, WhatWorks, PeerProgramming, and Contributions; Foundation connections where the member is the provider — provider side only; and the count of DISTINCT members with a confirmed recurring activity, either side, from recurring_activities), persist a snapshot row, and refresh derived evidence. Reads only coarse COUNTs (never amounts, balances, or sensitive per-row detail) and produces no numeric score. Privacy-sensitive personal-wellbeing/verification plugins (ClickLog, Mood, Unlock) and the Foundation seeker side are excluded by design. Implemented by POST /api/trust/signal/snapshot.
    inputSchema: {}
    outputSchema:
      snapshotId:
        type: string
      generatedAt:
        type: string
      metrics:
        type: object
        description: Real counts derived from upstream plugins (login* including loginDays and loginStreakDays, socketRelay*, serviceCredits*, lighthouseMatchesAccepted, trustTransportTripsCompleted, skillsHuntSubmissionsAccepted, levelUpCohortsCompleted, chymeRoomsJoined, directoryProfilesClaimed, whatWorksEndorsements, peerProgrammingCohortsJoined, contributionsConfirmed).
      trustEvidence:
        type: array
    dataAccess:
      - trust_signal_snapshot
      - trust_user_extension
      - trust_admin_audit_trail
      - login_events
      - socket_relay_fulfillments
      - socket_relay_requests
      - service_credits_transfers
      - service_credits_disputes
      - lighthouse_matches
      - trust_transport_trips
      - skills_hunt_submissions
      - level_up_enrollments
      - chyme_room_members
      - directory_profiles
      - what_works_endorsements
      - peer_programming_cohort_members
      - contributions_submissions
      - foundation_connection_threads
      - recurring_activities
    purpose: trust_signal_aggregation
    retentionClass: derived_short_lived
    idempotency: true
