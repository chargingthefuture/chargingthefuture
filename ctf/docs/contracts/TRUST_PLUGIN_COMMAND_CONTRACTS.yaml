contracts:
  - pluginId: trust
    command: trust.summary.read
    version: 1.0.0
    description: Read a member's trust panel (status, derived evidence, visibility). Implemented by GET /api/trust/user/self and GET /api/trust/user/[userId]; cross-user reads enforce the subject's trustVisibility.
    inputSchema:
      subjectUserId:
        type: string
        required: true
      surface:
        type: string
        required: false
      viewerContext:
        type: string
        required: false
    outputSchema:
      userId:
        type: string
      trustStatus:
        type: string
      trustEvidence:
        type: array
      trustVisibility:
        type: string
      updatedAt:
        type: string
    dataAccess:
      - trust_user_extension
      - trust_signal_snapshot
    purpose: trust_signal_display
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: trust
    command: trust.visibility.update
    version: 1.0.0
    description: Update the caller's own trust visibility (self-scope only). Implemented by POST /api/trust/visibility.
    inputSchema:
      trustVisibility:
        type: string
        required: true
        enum:
          - public
          - private
          - restricted
    outputSchema:
      userId:
        type: string
      trustVisibility:
        type: string
      updatedAt:
        type: string
    dataAccess:
      - trust_user_extension
      - trust_admin_audit_trail
    purpose: privacy_safety_preference_update
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: trust
    command: trust.admin.verification.review
    version: 1.0.0
    description: Admin-only decision setting a target user's Trust status to verified or flagged, with an appended admin evidence note. Implemented by POST /api/trust/admin/verification.
    inputSchema:
      targetUserId:
        type: string
        required: true
      trustStatus:
        type: string
        required: true
        enum:
          - verified
          - flagged
      note:
        type: string
        required: false
    outputSchema:
      userId:
        type: string
      trustStatus:
        type: string
      trustEvidence:
        type: array
      updatedAt:
        type: string
      reviewedByUserId:
        type: string
    dataAccess:
      - trust_user_extension
      - trust_admin_audit_trail
    purpose: trust_verification_moderation
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: trust
    command: trust.signal.snapshot.refresh
    version: 1.1.0
    description: Recompute the CALLER's trust signal from real cross-plugin engagement (login frequency, completed SocketRelay trades, and ServiceCredits received — distinct payers and undisputed completed transfers), persist a snapshot row, and refresh derived evidence. Reads only coarse COUNTs from ServiceCredits (never amounts or balances) and produces no numeric score. Never changes trustStatus. Implemented by POST /api/trust/signal/snapshot.
    inputSchema: {}
    outputSchema:
      snapshotId:
        type: string
      generatedAt:
        type: string
      metrics:
        type: object
        description: Real counts derived from upstream plugins (loginDays, loginEvents, lastLoginAt, socketRelayCompletedTrades, socketRelayRequestsOpened, serviceCreditsDistinctPayers, serviceCreditsCompletedReceived, serviceCreditsDisputesAgainst).
      trustEvidence:
        type: array
      trustStatus:
        type: string
      trustVisibility:
        type: string
    dataAccess:
      - trust_signal_snapshot
      - trust_user_extension
      - trust_admin_audit_trail
      - login_events
      - socketrelay_fulfillments
      - socketrelay_requests
      - service_credits_transfers
      - service_credits_disputes
    purpose: trust_signal_aggregation
    retentionClass: derived_short_lived
    idempotency: true
