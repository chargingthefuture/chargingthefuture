policies:
  - pluginId: weekly-performance
    command: weekly-performance.week.list
    version: 1.0.0
    requiredRoles:
      - admin
      - operations
    attributePolicies:
      tenancy: same_workspace
      metricScope: approved_only
    consentRequirements:
      scopes:
        - weekly_performance_admin
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - insufficient_role
      - cross_workspace_access

  - pluginId: weekly-performance
    command: weekly-performance.week.get
    version: 1.0.0
    requiredRoles:
      - admin
      - operations
    attributePolicies:
      tenancy: same_workspace
      weekStartFormat: iso_date_required
    consentRequirements:
      scopes:
        - weekly_performance_admin
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - insufficient_role
      - invalid_week_window

  - pluginId: weekly-performance
    command: weekly-performance.metrics.get
    version: 1.0.0
    requiredRoles:
      - admin
      - operations
    attributePolicies:
      tenancy: same_workspace
      canonicalMetricRegistryMatch: required
      financialDataScope: aggregate_only
    consentRequirements:
      scopes:
        - weekly_performance_admin
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - invalid_metric_set
      - unauthorized_metric_scope

  - pluginId: weekly-performance
    command: weekly-performance.comparison.get
    version: 1.0.0
    requiredRoles:
      - admin
      - operations
    attributePolicies:
      tenancy: same_workspace
      canonicalMetricRegistryMatch: required
      comparisonWindowPolicy: enforced
    consentRequirements:
      scopes:
        - weekly_performance_admin
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - invalid_comparison_window
      - invalid_metric_set

changelog:
  - date: 2026-07-19
    change: >-
      Removed the report.export access policy (owner request to delete the export feature). The
      command, its route, and the WEEKLY_PERFORMANCE_EXPORT_ENABLED gate are gone.
  - date: 2026-02-25
    change: Initial Weekly Performance access policy skeleton added with admin-only controls, canonical metric safeguards, and export policy gates.
  - date: 2026-06-27
    change: >-
      Reconciled the report.export access policy to the shipped behavior (#1128). The shipped export is
      a single inline JSON download with no format selection, so the exportFormatPolicy attribute and
      the invalid_export_format deny condition were removed; the route's real gate (the
      WEEKLY_PERFORMANCE_EXPORT_ENABLED environment flag) is now reflected as the export_disabled deny
      condition.
