# Removed 2026-08-28 (governance plan task 7): the nine Skills Taxonomy write commands —
# sector/job-title/skill create, update and delete. The taxonomy is governed by the append-only
# change list in ctf/scripts/lib/taxonomyChange.mjs: a change is appended in a PR, validated by the
# taxonomy-change-gate, and applied to production by the owner-run workflow. The HTTP write routes
# behind these commands were a second write path that bypassed all of it, and no screen ever called
# them. The read commands are unchanged.
# See ctf/docs/developer/SKILLS_TAXONOMY_CHANGE_GOVERNANCE_PLAN.md.
contracts:
  - pluginId: skills-taxonomy
    command: skills-taxonomy.hierarchy.get
    version: 1.0.0
    description: Read the ordered sector to job title to skill hierarchy for approved consumers.
    inputSchema:
      includeInactive:
        type: boolean
        required: false
      locale:
        type: string
        required: false
    outputSchema:
      items:
        type: array
      generatedAt:
        type: string
    dataAccess:
      - skills_taxonomy_sectors
      - skills_taxonomy_job_titles
      - skills_taxonomy_skills
    purpose: taxonomy_read_model
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: skills-taxonomy
    command: skills-taxonomy.summary.get
    version: 1.0.0
    description: Public, unauthenticated aggregate counts of active sectors, job titles, and skills for the signed-out splash teaser. Returns only counts (read live from the tables), never taxonomy rows or member data, so it carries no access gate.
    inputSchema: {}
    outputSchema:
      sectors:
        type: number
      jobTitles:
        type: number
      skills:
        type: number
    dataAccess:
      - skills_taxonomy_sectors
      - skills_taxonomy_job_titles
      - skills_taxonomy_skills
    purpose: taxonomy_read_model
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: skills-taxonomy
    command: skills-taxonomy.flattened.get
    version: 1.0.0
    description: Read flattened taxonomy projection for selector and compatibility consumers.
    inputSchema:
      includeInactive:
        type: boolean
        required: false
      includeAliases:
        type: boolean
        required: false
    outputSchema:
      items:
        type: array
      generatedAt:
        type: string
    dataAccess:
      - skills_taxonomy_flattened_projection
    purpose: taxonomy_read_model
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: skills-taxonomy
    command: skills-taxonomy.dependency-impact.preview
    version: 1.0.0
    description: Preview cross-plugin dependency impact before sector, job title, or skill destructive changes.
    inputSchema:
      targetType:
        type: string
        required: true
      targetId:
        type: string
        required: true
      operation:
        type: string
        required: true
    outputSchema:
      targetType:
        type: string
      targetId:
        type: string
      impactedConsumers:
        type: array
      riskLevel:
        type: string
    dataAccess:
      - skills_taxonomy_dependency_graph
      - skills_taxonomy_consumer_bindings
    purpose: taxonomy_dependency_governance
    retentionClass: audit_long_lived
    idempotency: true

changelog:
  - date: 2026-02-25
    change: Initial Skills Taxonomy command contract skeleton added with hierarchy reads, CRUD commands, and dependency-impact preview governance.
  - date: 2026-06-27
    change: Reconciled the audit data class name from skills_taxonomy_audit_log to skills_taxonomy_change_events to match the actual durable audit store written by the delete path; no skills_taxonomy_audit_log table exists.
