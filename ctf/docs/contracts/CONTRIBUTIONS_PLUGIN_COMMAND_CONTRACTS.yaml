# Contributions plugin command contracts.
#
# Core invariants, repeated where they matter:
# - Contributions takes Amazon gift cards only, open all year. There are no drives, goals,
#   progress or banner, and no Quora comment or GitHub star claims. Older rows keep their
#   kind ('quora_comment', 'github_star'); pending ones were closed by post/0075 with a note.
# - The gift card code is entered in the app and stored encrypted in
#   contributions_submissions.gift_card_code_encrypted (AES-256-GCM, key derived from the
#   server-only CONTRIBUTIONS_CODE_KEY, the member's account id bound in as additional data).
#   It is never returned to the member, never logged, and never written into audit metadata.
#   It is erased in the same statement that records the review (confirm or reject).
# - When CONTRIBUTIONS_CODE_KEY is unset the app takes no codes: submission.create answers
#   503 contributions_paused and the member screen shows a paused card.
# - Credits granted on confirmation are thank-you grants of ServiceCredits, the platform's
#   internal credits unit. They are not money and are never redeemable for money.
# - Contributing never requires Unlock verification and never changes Unlock state. No
#   command reads or writes any unlock_* table.
contracts:
  - pluginId: contributions
    command: contributions.submission.create
    version: 2.0.0
    description: Send an Amazon gift card. The member enters the amount and the code; the code is sealed (AES-256-GCM) before it is stored and is never returned.
    inputSchema:
      claimedAmountUsd:
        type: integer
        required: true
        note: >-
          An integer number of US dollars, from 1 to 500 (400 contributions_invalid_amount otherwise).
          Real gift cards are not sold in parts of a dollar (owner decision, 2026-08-09). Grants are
          still rounded when they are issued, because the credits-per-dollar rate is admin-set.
      code:
        type: string
        required: true
        note: >-
          The gift card code. Spaces are removed and letters upper-cased, then it must be 6 to 40
          letters, digits or dashes (400 contributions_invalid_code otherwise). Sealed with the
          member's account id bound in, so it does not decrypt on another member's row. Never
          logged or audited.
    outputSchema:
      ok:
        type: boolean
      submission:
        type: object
        note: The created submission (no code). Fields id, userId, kind (gift_card), method (amazon), claimedAmountUsd, status (pending), confirmedAmountUsd, creditsGranted, creditGovernanceEventId, reviewedByUserId, reviewedAt, reviewNote, createdAt, updatedAt.
      refusals:
        type: object
        note: >-
          503 contributions_paused when CONTRIBUTIONS_CODE_KEY is unset, so nothing is stored. 400
          contributions_invalid_payload when the body is not a JSON object. 403
          contributions_csrf_denied without the x-ctf-csrf header or from another origin.
    dataAccess:
      - contributions_submissions
      - contributions_audit_log
    purpose: voluntary_contribution_claim
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: contributions
    command: contributions.status.get
    version: 2.0.0
    description: The signed-in member's own claims, and what the form needs (whether gift cards are being taken, the amount range, the thank-you rate).
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      submissions:
        type: array
        note: The member's own submissions, newest first, at most 100 (no code, and no flag saying whether one is stored).
      open:
        type: boolean
        note: True when CONTRIBUTIONS_CODE_KEY is set. False shows the paused card instead of the form.
      minUsd:
        type: integer
        note: 1.
      maxUsd:
        type: integer
        note: 500.
      creditsPerUsd:
        type: number
        note: Live thank-you ServiceCredits per dollar from the runtime config, so the form copy matches the admin settings.
    dataAccess:
      - contributions_submissions
      - contributions_runtime_config
    purpose: own_contribution_history
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: contributions
    command: contributions.admin.submission.list
    version: 2.0.0
    description: Admin review queue of claims, filterable by status. Each item says whether a code is still stored (hasCode); the code itself is read one claim at a time through contributions.admin.code.reveal, never in the list.
    inputSchema:
      status:
        type: string
        required: false
        enum: [pending, confirmed, rejected]
      limit:
        type: integer
        required: false
        note: Clamped to 1..100 (default 100); non-positive or non-numeric input is rejected with 400.
    outputSchema:
      ok:
        type: boolean
      submissions:
        type: array
        note: Admin projection — the member fields plus hasCode (boolean). No code.
    dataAccess:
      - contributions_submissions
      - contributions_audit_log
    purpose: moderation_queue
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: contributions
    command: contributions.admin.code.reveal
    version: 1.0.0
    description: Show one claim's gift card code to the admin redeeming it. A POST so it is never prefetched or cached (Cache-Control no-store). Every reveal is audited as contributions.admin.code.reveal with the reviewed member and whether a code was shown, never the code.
    inputSchema:
      submissionId:
        type: string
        required: true
        note: Path parameter; must be a UUID (400 contributions_invalid_payload otherwise).
    outputSchema:
      ok:
        type: boolean
      code:
        type: string
        note: The decrypted code. Only on success.
      refusals:
        type: object
        note: >-
          404 contributions_not_found for an unknown claim. 409 contributions_code_unavailable, with
          the reason in message, when no code is stored (erased on review, or a claim from before
          codes were entered in the app), when CONTRIBUTIONS_CODE_KEY is unset, or when the code does
          not decrypt with the current key (the key was changed after it was sent).
    dataAccess:
      - contributions_submissions
      - contributions_audit_log
    purpose: gift_card_redemption
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: contributions
    command: contributions.admin.submission.review
    version: 2.0.0
    description: Confirm or reject a pending claim, exactly once. Either way the stored code is erased in the same statement. On confirm, the credit grant (confirmedAmountUsd x credits_per_usd, clamped by the per-member cap over the last 365 days, then rounded to an integer number of credits) is delegated to the service-credits plugin's canonical governance.mint.grant command (idempotency key contribution-<submissionId>); contributions never writes service_credits tables directly.
    inputSchema:
      submissionId:
        type: string
        required: true
        note: Path parameter; must be a UUID.
      action:
        type: string
        required: true
        enum: [confirm, reject]
      confirmedAmountUsd:
        type: integer
        required: false
        note: >-
          Required for confirm, as an integer number of US dollars from 1 to 500 — the same rule the
          member's claim had to clear, re-checked here because the admin records what was actually
          redeemed and that can differ from the claim (400 contributions_confirmed_amount_required).
      reviewNote:
        type: string
        required: false
    outputSchema:
      ok:
        type: boolean
      submission:
        type: object
        note: Admin projection of the reviewed submission, with status confirmed|rejected, confirmedAmountUsd, creditsGranted, creditGovernanceEventId, reviewedByUserId, reviewedAt, reviewNote populated and hasCode false.
      refusals:
        type: object
        note: >-
          404 contributions_not_found. 409 contributions_already_reviewed when the claim is no longer
          pending. 409 contributions_mint_budget_exceeded when the ServiceCredits per-period mint
          budget is on and this confirm's grant would go over it; the review rolls back, so the claim
          stays pending with its code and can be confirmed once the period resets or the budget is
          raised.
      yearCap:
        type: object
        note: >-
          The credits already granted are the larger of two sums over the last 365 days: confirmed
          contributions_submissions.credits_granted, and the kept service_credits_governance_events
          mint_grant rows with reason contributions_confirmed. The second keeps the cap in place after
          a member deletes their Contributions data and sends again. A grant that rounds to 0 still
          confirms the claim with 0 credits.
    dataAccess:
      - contributions_submissions
      - contributions_runtime_config
      - contributions_audit_log
      # Credit grant path — delegated to the service-credits plugin's governance.mint.grant
      # command (canonical mintGrant()); listed here for traceability only, plus the read of
      # kept grants for the 365-day cap:
      - service_credits_wallets
      - service_credits_governance_events
      - service_credits_ledger_entries
    purpose: moderation_and_thank_you_grant
    retentionClass: financial_audit_long_lived
    idempotency: true

  - pluginId: contributions
    command: contributions.admin.config.get
    version: 2.0.0
    description: Read the runtime settings (credits per dollar, most credits per member over 365 days).
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      config:
        type: object
        note: creditsPerUsd, perUserYearCreditCap, updatedByUserId, updatedAt. Defaults 10 and 300 when no row exists.
    dataAccess:
      - contributions_runtime_config
    purpose: configuration_read
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: contributions
    command: contributions.admin.config.update
    version: 2.0.0
    description: Update the runtime settings. An omitted field keeps its current value.
    inputSchema:
      creditsPerUsd:
        type: number
        required: false
        note: Must be a positive finite number.
      perUserYearCreditCap:
        type: number
        required: false
        note: Most thank-you credits one member is granted over the last 365 days. Must be a positive finite number.
    outputSchema:
      ok:
        type: boolean
      config:
        type: object
    dataAccess:
      - contributions_runtime_config
      - contributions_audit_log
    purpose: configuration_update
    retentionClass: audit_long_lived
    idempotency: true
