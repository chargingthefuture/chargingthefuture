# Room scope note (2026-07-23): the room/join/messages/heartbeat/hand/leave commands below accept an
# optional `?room=contributors` scope selecting the private "Weavers of the Commons" room. For that
# scope, on top of the standard approved_user_or_admin gate the caller must ALSO clear the contributor
# gate — the contributor channel-open switch AND (their contributor-access eligibility flag OR admin);
# a member who fails receives a bare 404 (no-shaming), matching the gated Commons chat channel. The
# default/absent scope is the open main room with the policies exactly as stated below. Tips
# (chyme.transfer.*) and the back-channel commands are main-room only (no room scope).
policies:
  - pluginId: chyme
    command: chyme.room.state.fetch
    version: 1.0.0
    requiredRoles:
      - member
      - admin
    attributePolicies:
      tenancy: same_workspace
      approvalGate: approved_user_or_admin
      roomMembershipUpsertAllowed: true
    consentRequirements:
      scopes:
        - chyme_room_access
      fallbackLawfulBasis: legitimate_interest_safety_support
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - actor_not_authenticated
      - actor_not_approved
      - cross_workspace_access

  - pluginId: chyme
    command: chyme.messages.list
    version: 1.0.0
    requiredRoles:
      - member
      - admin
    attributePolicies:
      tenancy: same_workspace
      approvalGate: approved_user_or_admin
      messageReadLimit: "1_to_100"
    consentRequirements:
      scopes:
        - chyme_chat_participation
      fallbackLawfulBasis: legitimate_interest_safety_support
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: true
      requiresAdditionalAudit: true
    denyConditions:
      - actor_not_authenticated
      - actor_not_approved
      - cross_workspace_access

  - pluginId: chyme
    command: chyme.message.send
    version: 1.0.0
    requiredRoles:
      - member
      - admin
    attributePolicies:
      tenancy: same_workspace
      approvalGate: approved_user_or_admin
      messageLengthBounds: "1_to_1000"
      messageTrimRequired: true
    consentRequirements:
      scopes:
        - chyme_chat_participation
      fallbackLawfulBasis: explicit_consent_required
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: true
      requiresAdditionalAudit: true
    denyConditions:
      - actor_not_authenticated
      - actor_not_approved
      - empty_or_oversized_message
      - cross_workspace_access

  - pluginId: chyme
    command: chyme.call.join
    version: 1.0.0
    requiredRoles:
      - member
      - admin
    attributePolicies:
      tenancy: same_workspace
      approvalGate: approved_user_or_admin
      streamConfigurationRequired: true
    consentRequirements:
      scopes:
        - chyme_voice_participation
      fallbackLawfulBasis: explicit_consent_required
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - actor_not_authenticated
      - actor_not_approved
      - stream_not_configured
      - cross_workspace_access

  - pluginId: chyme
    command: chyme.hand
    version: 1.0.0
    requiredRoles:
      - member
      - admin
    attributePolicies:
      tenancy: same_workspace
      approvalGate: approved_user_or_admin
      raisedFlagBooleanRequired: true
    consentRequirements:
      scopes:
        - chyme_voice_participation
      fallbackLawfulBasis: explicit_consent_required
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - actor_not_authenticated
      - actor_not_approved
      - invalid_raised_flag
      - cross_workspace_access

  - pluginId: chyme
    command: chyme.profile.delete.service
    version: 1.0.0
    requiredRoles:
      - member
      - admin
    attributePolicies:
      tenancy: same_workspace
      actorMustOwnTargetProfile: true
      deletionScopeLocked: service_only
    consentRequirements:
      scopes:
        - chyme_service_deletion
      fallbackLawfulBasis: legal_obligation_data_rights
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: true
      requiresAdditionalAudit: true
    denyConditions:
      - actor_not_authenticated
      - actor_not_profile_owner
      - deletion_scope_invalid
      - cross_workspace_access

  - pluginId: chyme
    command: account.profile.delete.full
    version: 1.0.0
    requiredRoles:
      - member
      - admin
    attributePolicies:
      tenancy: same_workspace
      actorMustOwnTargetProfile: true
      deletionScopeLocked: account
      orchestratorRequired: true
    consentRequirements:
      scopes:
        - account_deletion_request
      fallbackLawfulBasis: legal_obligation_data_rights
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: true
      requiresAdditionalAudit: true
    denyConditions:
      - actor_not_authenticated
      - actor_not_profile_owner
      - deletion_scope_invalid
      - cross_workspace_access

  # Public listener path (2026-09-19). No account: the actor is a browser holding a random guest id
  # in an httpOnly cookie. The only gates are the room being live, the Stream quota policy not having
  # guests paused, the guest cap, the same-origin CSRF header on the writes, and the per-IP brake.
  - pluginId: chyme
    command: chyme.public.room.read
    version: 1.0.0
    requiredRoles:
      - anonymous
    attributePolicies:
      tenancy: public
      approvalGate: none
      rateLimit: per_ip_30_per_minute
    consentRequirements:
      scopes: []
      fallbackLawfulBasis: legitimate_interest_public_listen
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - rate_limit_exceeded

  - pluginId: chyme
    command: chyme.public.listen
    version: 1.0.0
    requiredRoles:
      - anonymous
    attributePolicies:
      tenancy: public
      approvalGate: none
      csrfSameOriginRequired: true
      rateLimit: per_ip_30_per_minute
      guestCap: CHYME_MAX_GUEST_LISTENERS
      quotaPolicy: paused_from_orange_band
    consentRequirements:
      scopes: []
      fallbackLawfulBasis: legitimate_interest_public_listen
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - room_not_live
      - guest_listen_paused_by_quota_policy
      - guest_cap_reached
      - csrf_header_missing_or_cross_origin
      - rate_limit_exceeded

  - pluginId: chyme
    command: chyme.public.heartbeat
    version: 1.0.0
    requiredRoles:
      - anonymous
    attributePolicies:
      tenancy: public
      approvalGate: none
      csrfSameOriginRequired: true
      rateLimit: per_ip_30_per_minute
    consentRequirements:
      scopes: []
      fallbackLawfulBasis: legitimate_interest_public_listen
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - guest_identity_cookie_missing
      - csrf_header_missing_or_cross_origin
      - rate_limit_exceeded

  - pluginId: chyme
    command: chyme.public.leave
    version: 1.0.0
    requiredRoles:
      - anonymous
    attributePolicies:
      tenancy: public
      approvalGate: none
      csrfSameOriginRequired: true
      rateLimit: per_ip_30_per_minute
    consentRequirements:
      scopes: []
      fallbackLawfulBasis: legitimate_interest_public_listen
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - csrf_header_missing_or_cross_origin
      - rate_limit_exceeded

  # The Stream Video minute meter. Admin-only, read-only; carries the quota numbers rule 110 keeps
  # off member surfaces.
  - pluginId: chyme
    command: chyme.admin.stream-usage.read
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      tenancy: same_workspace
      approvalGate: admin_only
    consentRequirements:
      scopes:
        - chyme_room_access
      fallbackLawfulBasis: legitimate_interest_safety_support
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - actor_not_authenticated
      - actor_not_admin
      - cross_workspace_access
