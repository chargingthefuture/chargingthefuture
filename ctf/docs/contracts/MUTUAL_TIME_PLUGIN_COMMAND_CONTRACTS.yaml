pluginId: mutual-time
version: 1.0.0
description: >
  Mutual Time — a one-link meeting-time picker (spec #1780). An admin creates an event; approved
  members vote on one-hour windows in their own timezone; the app picks the window with the most
  overlap when the survey closes. No ServiceCredits are involved in any command.

contracts:
  - pluginId: mutual-time
    command: mutual-time.event.create
    version: 1.0.0
    description: Create a meeting-time event with one shareable link. Admin-only.
    inputSchema:
      title:
        type: string
        required: false
      description:
        type: string
        required: false
      meetingPlugin:
        type: string
        required: true
        enum: [chyme, peer-programming, beacon]
      opensAt:
        type: string
        required: false
      closesAt:
        type: string
        required: false
    outputSchema:
      ok:
        type: boolean
      event:
        type: object
    dataAccess:
      - mutual_time_events
      - mutual_time_admin_audit_trail
    purpose: scheduling_event_create
    retentionClass: operational_medium_lived
    idempotency: false

  - pluginId: mutual-time
    command: mutual-time.vote.save
    version: 1.0.0
    description: Save (replace) the signed-in, Unlock-approved member's picks for an event — up to 3 one-hour windows snapped to the half-hour. Rejected when the event is not open or a pick is not a valid candidate slot; while a survey is open the candidate window rolls forward from the current moment, so a pick whose time has passed is no longer valid.
    inputSchema:
      slots:
        type: array
        required: true
        items:
          type: string
    outputSchema:
      ok:
        type: boolean
      picks:
        type: array
        items:
          type: string
    dataAccess:
      - mutual_time_events
      - mutual_time_votes
    purpose: scheduling_vote_save
    retentionClass: operational_medium_lived
    idempotency: true

  - pluginId: mutual-time
    command: mutual-time.event.close
    version: 1.0.0
    description: Close a survey now and compute the winning one-hour window (most distinct voters; ties go to the earliest). Admin-only; only the event's creator may close it.
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      event:
        type: object
    dataAccess:
      - mutual_time_events
      - mutual_time_votes
      - mutual_time_admin_audit_trail
    purpose: scheduling_event_close
    retentionClass: operational_medium_lived
    idempotency: true

  - pluginId: mutual-time
    command: mutual-time.event.read
    version: 1.0.0
    description: Public read of one event by its shareable slug (title, description, status, candidate slots, and result after close). Candidate slots roll forward from the current moment while the survey is open. Never returns who voted or their picks; a signed-in approved member's own upcoming picks, plus a count of their picks whose time has passed, are added for hydration only.
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      event:
        type: object
      viewer:
        type: object
    dataAccess:
      - mutual_time_events
      - mutual_time_votes
    purpose: scheduling_event_read
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: mutual-time
    command: mutual-time.admin.audit.list
    version: 1.0.0
    description: >-
      Admin reads the Mutual Time admin audit trail, newest first. Read-only. The trail names the
      event acted on and the acting admin — never a voter — so it holds no member identity and is not
      removed on a member's account deletion.
    inputSchema:
      limit:
        type: integer
        required: false
        description: How many rows to return. Defaults to 100, capped at 200.
    outputSchema:
      events:
        type: array
    dataAccess:
      - mutual_time_admin_audit_trail
    purpose: governance_transparency
    retentionClass: audit_long_lived
    idempotency: true
