# ServiceCredits are non-fiat internal credits — not money, never redeemable for fiat value.
# Statement of record: ctf/docs/DISCLAIMER.md. Money-framing of credits anywhere is an error.
contracts:
  - pluginId: service-credits
    command: wallet.create
    version: 1.0.0
    description: Create or activate a ServiceCredits wallet bound to a canonical user profile.
    inputSchema:
      userId:
        type: string
        required: true
      workspaceId:
        type: string
        required: true
      walletType:
        type: string
        required: true
        enum:
          - personal
          - treasury
          - escrow
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      walletId:
        type: string
      status:
        type: string
      createdAt:
        type: string
    dataAccess:
      - canonical_user_profile
      - service_credits_user_extension
      - service_credits_wallets
      - service_credits_command_idempotency
    purpose: wallet_lifecycle
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: service-credits
    command: wallet.balance.get
    version: 1.1.0
    description: Retrieve current available, held, and total ServiceCredits wallet balance, plus the caller's own mutual-credit line (whether the rail is enabled, the limit that applies to them, and the resulting floor) so the member can see how far below zero a send may take them. The line is read-only here — the transfer path resolves the floor itself.
    inputSchema:
      walletId:
        type: string
        required: true
      asOf:
        type: string
        required: false
    outputSchema:
      walletId:
        type: string
      availableBalance:
        type: number
      heldBalance:
        type: number
      totalBalance:
        type: number
      asOf:
        type: string
      mutualCreditEnabled:
        type: boolean
        description: Whether the mutual-credit rail is switched on in treasury policy. When false the floor is 0 for everyone.
      creditLimit:
        type: number
        description: The limit that applies to this member — their per-account override when an admin has granted one, else the flat policy defaultLimit. Never a behavioral or social score; no such score exists.
      creditFloor:
        type: number
        description: The lowest balance a send may leave the member at, i.e. -(creditLimit) while the rail is enabled and 0 otherwise.
    dataAccess:
      - service_credits_wallets
      - service_credits_transfers
      - service_credits_escrow_holds
      - service_credits_treasury_config
      - service_credits_credit_limits
    purpose: balance_visibility
    retentionClass: derived_medium_lived
    idempotency: true

  - pluginId: service-credits
    command: wallet.transactions.list
    version: 1.1.0
    description: List one page of the calling member's own wallet ledger entries (mints, transfers in/out, escrow holds/releases, treasury fees, allocations), newest first, with the member's total entry count so the caller can page through the history. Read-only and scoped to the caller's wallet.
    inputSchema:
      walletId:
        type: string
        required: true
      limit:
        type: number
        required: false
        description: Page size. Defaults to 50; clamped to the range 1–200 (caller values above 200 are capped).
      offset:
        type: number
        required: false
        description: How many entries to skip before the page starts. Defaults to 0; negative or non-numeric values are treated as 0.
    outputSchema:
      entries:
        type: array
      total:
        type: number
        description: Total ledger entries the member has, across all pages.
      limit:
        type: number
      offset:
        type: number
    dataAccess:
      - service_credits_ledger_entries
    purpose: balance_visibility
    retentionClass: derived_medium_lived
    idempotency: true

  - pluginId: service-credits
    command: transfer.create
    version: 1.1.0
    description: Create a credit transfer between source and destination wallets under plugin-path constraints. The optional rail selects whether the sender pays from balance or on mutual credit (going negative down to their credit limit).
    inputSchema:
      sourceWalletId:
        type: string
        required: true
      destinationWalletId:
        type: string
        required: true
      amount:
        type: number
        required: true
      reasonCode:
        type: string
        required: true
      originPlugin:
        type: string
        required: true
      rail:
        type: string
        required: false
        enum:
          - balance
          - mutual_credit
        description: Defaults to balance. mutual_credit lets the sender pay past zero down to -(credit limit); requires mutualCredit.enabled in treasury policy. Denied with credit_limit_exceeded over the limit.
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      transferId:
        type: string
      status:
        type: string
      ledgerReference:
        type: string
      rail:
        type: string
      createdAt:
        type: string
    dataAccess:
      - service_credits_wallets
      - service_credits_transfers
      - service_credits_credit_limits
      - service_credits_treasury_config
      - service_credits_command_idempotency
      - service_credits_adapter_outbox
    purpose: value_transfer
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: service-credits
    command: escrow.hold.create
    version: 1.0.0
    description: Hold credits in escrow for cross-plugin transactional commitments.
    inputSchema:
      escrowId:
        type: string
        required: true
      sourceWalletId:
        type: string
        required: true
      amount:
        type: number
        required: true
      originPlugin:
        type: string
        required: true
      releasePolicy:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      escrowId:
        type: string
      holdStatus:
        type: string
      heldAmount:
        type: number
      createdAt:
        type: string
    dataAccess:
      - service_credits_wallets
      - service_credits_escrow_holds
      - service_credits_command_idempotency
      - service_credits_adapter_outbox
    purpose: escrow_management
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: service-credits
    command: escrow.release
    version: 1.0.0
    description: Release escrowed credits to the destination member's wallet (resolved from their user id) when release conditions are satisfied.
    inputSchema:
      escrowId:
        type: string
        required: true
      destinationUserId:
        type: string
        required: true
      releaseReason:
        type: string
        required: true
      originPlugin:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      escrowId:
        type: string
      releaseStatus:
        type: string
      transferId:
        type: string
      releasedAt:
        type: string
    dataAccess:
      - service_credits_escrow_holds
      - service_credits_transfers
      - service_credits_wallets
      - service_credits_command_idempotency
      - service_credits_adapter_outbox
    purpose: escrow_management
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: service-credits
    command: escrow.refund
    version: 1.0.0
    description: Refund escrowed credits to the originating wallet when release conditions fail.
    inputSchema:
      escrowId:
        type: string
        required: true
      refundReason:
        type: string
        required: true
      originPlugin:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      escrowId:
        type: string
      refundStatus:
        type: string
      refundedAt:
        type: string
    dataAccess:
      - service_credits_escrow_holds
      - service_credits_transfers
      - service_credits_wallets
      - service_credits_command_idempotency
      - service_credits_adapter_outbox
    purpose: escrow_management
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: service-credits
    command: governance.mint.grant
    version: 1.1.0
    description: Grant newly issued ServiceCredits under governance policy controls. When issuance enforcement is on, the grant is denied with mint_budget_exceeded if it would push minting over the per-period budget configured in treasury policy.
    inputSchema:
      targetWalletId:
        type: string
        required: true
      amount:
        type: number
        required: true
      grantReason:
        type: string
        required: true
      governanceTicketId:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      governanceEventId:
        type: string
      mintStatus:
        type: string
      mintedAt:
        type: string
    dataAccess:
      - service_credits_wallets
      - service_credits_governance_events
      - service_credits_treasury_config
      - service_credits_command_idempotency
      - service_credits_adapter_outbox
    purpose: governance_monetary_control
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: service-credits
    command: governance.burn
    version: 1.0.0
    description: Burn ServiceCredits from a wallet under governance policy controls.
    inputSchema:
      targetWalletId:
        type: string
        required: true
      amount:
        type: number
        required: true
      burnReason:
        type: string
        required: true
      governanceTicketId:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      governanceEventId:
        type: string
      burnStatus:
        type: string
      burnedAt:
        type: string
    dataAccess:
      - service_credits_wallets
      - service_credits_governance_events
      - service_credits_command_idempotency
      - service_credits_adapter_outbox
    purpose: governance_monetary_control
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: service-credits
    command: treasury.fee.collect
    version: 1.0.0
    description: Collect treasury fees from transactional flows according to policy-configured fee rules.
    inputSchema:
      sourceWalletId:
        type: string
        required: true
      treasuryWalletId:
        type: string
        required: true
      amount:
        type: number
        required: true
      feeReasonCode:
        type: string
        required: true
      originPlugin:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      treasuryEventId:
        type: string
      transferId:
        type: string
      collectionStatus:
        type: string
      collectedAt:
        type: string
    dataAccess:
      - service_credits_wallets
      - service_credits_treasury_events
      - service_credits_transfers
      - service_credits_command_idempotency
      - service_credits_adapter_outbox
    purpose: treasury_operations
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: service-credits
    command: dispute.adjustment.apply
    version: 1.0.0
    description: Apply a dispute-authorized credit adjustment between involved wallets.
    inputSchema:
      disputeCaseId:
        type: string
        required: true
      sourceWalletId:
        type: string
        required: true
      destinationWalletId:
        type: string
        required: true
      amount:
        type: number
        required: true
      adjustmentReason:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      adjustmentId:
        type: string
      transferId:
        type: string
      adjustmentStatus:
        type: string
      appliedAt:
        type: string
    dataAccess:
      - service_credits_dispute_adjustments
      - service_credits_wallets
      - service_credits_transfers
      - service_credits_command_idempotency
      - service_credits_adapter_outbox
    purpose: dispute_resolution
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: service-credits
    command: account.deletion.reclaim.execute
    version: 1.0.0
    description: Execute an atomic transfer-to-treasury and wallet tombstone reclaim after a 7-day account deletion window, only when no unresolved escrow holds exist.
    inputSchema:
      accountId:
        type: string
        required: true
      deletionRequestId:
        type: string
        required: true
      treasuryWalletId:
        type: string
        required: true
      requestedAt:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
      requestId:
        type: string
        required: true
      traceId:
        type: string
        required: true
    outputSchema:
      reclaimStatus:
        type: string
      amountTransferred:
        type: number
      transferId:
        type: string
      tombstoneId:
        type: string
      processedAt:
        type: string
    dataAccess:
      - service_credits_wallets
      - service_credits_transfers
      - service_credits_escrow_holds
      - service_credits_treasury_events
      - service_credits_command_idempotency
      - service_credits_wallet_tombstones
      - service_credits_account_deletion_reclaims
    purpose: account_deletion_reclaim
    retentionClass: audit_long_lived
    idempotency: true
    idempotencyNotes: idempotencyKey must be composed as accountId + deletionRequestId.

  - pluginId: service-credits
    command: circulation.metrics.get
    version: 1.0.0
    description: Read aggregate circulation metrics. The public projection returns only non-identifying totals; the admin projection adds the operator levers (mint budget remaining, concentration, open disputes). No figure is a fiat amount.
    inputSchema:
      includeAdmin:
        type: boolean
        required: false
        description: Admin-only. When true (admin endpoint), adds operator levers to the public totals.
    outputSchema:
      inCirculation:
        type: number
      totalIssued:
        type: number
      totalBurned:
        type: number
      treasuryBalance:
        type: number
      outstandingMutualCreditDebt:
        type: number
      transferVolume30d:
        type: number
        description: Public. Total credits transferred in the last 30 days (shown as "Sent in last 30 days").
      velocity:
        type: number
      issuanceEnforced:
        type: boolean
        description: Admin projection only.
      issuancePeriodDays:
        type: number
        description: Admin projection only.
      mintBudgetCeiling:
        type: number
        description: Admin projection only. Null when minting is not budget-constrained.
      mintedThisPeriod:
        type: number
        description: Admin projection only.
      mintBudgetRemaining:
        type: number
        description: Admin projection only. Null when minting is not budget-constrained.
      concentrationTop5Share:
        type: number
        description: Admin projection only.
      openDisputes:
        type: number
        description: Admin projection only.
      treasuryUserIdConfigured:
        type: boolean
        description: Admin projection only.
    dataAccess:
      - service_credits_wallets
      - service_credits_governance_events
      - service_credits_transfers
      - service_credits_disputes
      - service_credits_treasury_config
    purpose: circulation_reporting
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: service-credits
    command: credit-limit.set
    version: 1.0.0
    description: Admin-only. Grant or revoke a member's mutual-credit limit (the most negative their balance may go). New accounts default to 0; capped by treasury policy mutualCredit.maxLimit; set to 0 to revoke.
    inputSchema:
      targetUserId:
        type: string
        required: true
      creditLimit:
        type: number
        required: true
    outputSchema:
      targetUserId:
        type: string
      creditLimit:
        type: number
    dataAccess:
      - service_credits_credit_limits
      - service_credits_treasury_config
      - service_credits_admin_audit_trail
    purpose: governance_monetary_control
    retentionClass: audit_long_lived
    idempotency: false

  - pluginId: service-credits
    command: credit-limit.get
    version: 1.0.0
    description: Admin-only read of a member's mutual-credit limit (the flat policy default, or a per-account override) and freeze state. No behavioral score is computed or returned — there is no credit or social score on this platform.
    inputSchema:
      targetUserId:
        type: string
        required: true
    outputSchema:
      targetUserId:
        type: string
      creditLimit:
        type: number
      isDefault:
        type: boolean
      frozen:
        type: boolean
    dataAccess:
      - service_credits_credit_limits
      - service_credits_wallets
      - service_credits_treasury_config
    purpose: governance_monetary_control
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: service-credits
    command: wallet-status.set
    version: 1.0.0
    description: Admin-only. Freeze or unfreeze a member's wallet. While frozen, the wallet cannot spend ServiceCredits on either rail. Trust & safety lever for a risk-flagged account.
    inputSchema:
      targetUserId:
        type: string
        required: true
      frozen:
        type: boolean
        required: true
      reason:
        type: string
        required: false
    outputSchema:
      targetUserId:
        type: string
      frozen:
        type: boolean
    dataAccess:
      - service_credits_wallets
      - service_credits_admin_audit_trail
    purpose: trust_and_safety
    retentionClass: audit_long_lived
    idempotency: false
