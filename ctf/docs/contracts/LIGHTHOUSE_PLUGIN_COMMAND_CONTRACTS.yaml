contracts:
  - pluginId: lighthouse
    command: lighthouse.profile.upsert
    version: 1.0.0
    description: Create or update a seeker or host profile with role-bound validation.
    inputSchema:
      profileType:
        type: string
        required: true
      profile:
        type: object
        required: true
    outputSchema:
      profileId:
        type: string
      updatedAt:
        type: string
    dataAccess:
      - lighthouse_profiles
    purpose: profile_management
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: lighthouse
    command: lighthouse.match.request.create
    version: 1.0.0
    description: Create a match request from seeker to host property with duplicate safeguards.
    inputSchema:
      propertyId:
        type: string
        required: true
      message:
        type: string
        required: false
      desiredMoveInDate:
        type: string
        required: false
    outputSchema:
      matchId:
        type: string
      status:
        type: string
      createdAt:
        type: string
    dataAccess:
      - lighthouse_matches
      - lighthouse_properties
    purpose: housing_matching
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: lighthouse
    command: lighthouse.property.create
    version: 1.0.0
    description: >-
      Member self-service — create a property listing. Listing a place transparently provisions the
      member's host profile (no separate host-profile form). The host identity shown on the listing
      is composed from existing data (name/username, Quora link, Trust signals), not re-entered.
    inputSchema:
      title:
        type: string
        required: true
      description:
        type: string
        required: true
      propertyType:
        type: string
        required: false
      addressLine:
        type: string
        required: false
      city:
        type: string
        required: false
      state:
        type: string
        required: false
      country:
        type: string
        required: false
      zipCode:
        type: string
        required: false
      bedrooms:
        type: number
        required: false
      bathrooms:
        type: number
        required: false
      monthlyRent:
        type: number
        required: false
      rentCurrency:
        type: string
        required: false
        description: >-
          Currency the monthly rent is listed in (references currencies.code). Null/omitted leaves it
          unset. Independent of acceptedCurrencies.
      acceptedCurrencies:
        type: array
        required: false
        description: >-
          Currency codes (references currencies.code) the listing accepts; persisted to
          lighthouse_property_accepted_currencies. Unknown/inactive codes are skipped. Including the
          ServiceCredits code means the listing accepts ServiceCredits — never derived from rentCurrency.
      availableFromIso:
        type: string
        required: false
      amenities:
        type: array
        required: false
      houseRules:
        type: array
        required: false
      airbnbProfileUrl:
        type: string
        required: false
    outputSchema:
      propertyId:
        type: string
      updatedAt:
        type: string
    dataAccess:
      - lighthouse_properties
      - lighthouse_property_accepted_currencies
      - lighthouse_profiles
    purpose: property_listing_management
    retentionClass: transactional_long_lived
    idempotency: false
