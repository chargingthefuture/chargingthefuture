contracts:
  - pluginId: contributor-access
    command: contributor-access.config.get
    version: 1.1.0
    description: >-
      Read the single owner-tunable eligibility config row (weights, threshold, gate minimums,
      channel_open); defaults when the row has never been written. Also returns the best-effort
      synced Stream member count for the admin status card (null when Stream is unconfigured or
      the channel is not open).
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      config:
        type: object
      channelMemberCount:
        type: number
        required: false
    dataAccess:
      - contributor_access_config
      - contributor_access_audit_trail
    purpose: eligibility_configuration
    retentionClass: derived_long_lived
    idempotency: true

  - pluginId: contributor-access
    command: contributor-access.config.update
    version: 1.1.0
    description: >-
      Update the eligibility config (per-event weight overrides keyed by the fixed value-event key
      list, score threshold, minimum account age, minimum distinct plugins, minimum distinct
      counterparties, the eligible-member minimum for opening the gated channel, and the
      channel_open toggle). CSRF-confirmed mutation. Launch-gate precondition (server-side):
      channel_open may only turn on when the eligible count is at least
      min_eligible_to_open_channel - otherwise 409 with the stable code
      contributor_access_channel_below_minimum (the deny is audited). A successful open creates
      the gated Stream channel and runs the first membership sync; a Stream failure never rolls
      the config back and is returned as a channelSyncWarning field.
    inputSchema:
      weights:
        type: object
        required: false
      threshold:
        type: number
        required: false
      minAccountAgeDays:
        type: number
        required: false
      minDistinctPlugins:
        type: number
        required: false
      minCounterparties:
        type: number
        required: false
      minEligibleToOpenChannel:
        type: number
        required: false
      channelOpen:
        type: boolean
        required: false
    outputSchema:
      ok:
        type: boolean
      config:
        type: object
      channelSyncWarning:
        type: string
        required: false
    dataAccess:
      - contributor_access_config
      - contributor_access_eligibility
      - contributor_access_audit_trail
    purpose: eligibility_configuration
    retentionClass: derived_long_lived
    idempotency: true

  - pluginId: contributor-access
    command: contributor-access.eligible.list
    version: 1.0.0
    description: >-
      List members who earned eligibility - user id, username (via the users table), first earned
      date, and revoke flag/reason. Categorical only - no score and no reason_snapshot is ever
      returned by this or any other surface (proposal hard guardrail).
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      members:
        type: array
      eligibleCount:
        type: integer
    dataAccess:
      - contributor_access_eligibility
      - users
      - contributor_access_audit_trail
    purpose: eligibility_review
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: contributor-access
    command: contributor-access.member.revoke
    version: 1.1.0
    description: >-
      For-cause revoke - the ONLY path that removes eligibility (a reviewed harm/abuse action;
      never inactivity, never an unreviewed report alone). Requires a non-empty reason; sets
      revoked_for_cause and turns the eligible flag off until reinstated. When the gated channel
      is open, a guarded membership sync removes the member from the Stream channel right away; a
      Stream failure never fails the revoke and is returned as channelSyncWarning.
      CSRF-confirmed mutation.
    inputSchema:
      userId:
        type: string
        required: true
      reason:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
      channelSyncWarning:
        type: string
        required: false
    dataAccess:
      - contributor_access_eligibility
      - contributor_access_config
      - contributor_access_audit_trail
    purpose: eligibility_moderation
    retentionClass: audit_long_lived
    idempotency: false

  - pluginId: contributor-access
    command: contributor-access.member.reinstate
    version: 1.1.0
    description: >-
      Clear a for-cause revocation. Eligibility returns because it was previously earned
      (first_earned_at is permanent) - this is not a fresh grant. When the gated channel is open,
      a guarded membership sync re-adds the member to the Stream channel; a Stream failure never
      fails the reinstate and is returned as channelSyncWarning. CSRF-confirmed mutation.
    inputSchema:
      userId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
      channelSyncWarning:
        type: string
        required: false
    dataAccess:
      - contributor_access_eligibility
      - contributor_access_config
      - contributor_access_audit_trail
    purpose: eligibility_moderation
    retentionClass: audit_long_lived
    idempotency: false

  - pluginId: contributor-access
    command: contributor-access.eligibility.recompute
    version: 1.0.0
    description: >-
      Internal, schedule-driven recompute of the categorical eligibility flag for every member with
      at least one value event. Counts the same fifteen per-plugin value events as Weekly
      Performance (owner-locked decision record ctf/docs/developer/PLUGIN_VALUE_METRICS.md), per
      member, all-time; applies the owner-tuned weights, the score threshold, and the gates
      (account age from the first login_events row, distinct plugins, distinct counterparties
      across the two-sided events). Additive only - it admits newly-qualified members and never
      revokes on signal decay. Guarded by INTERNAL_SERVICE_SECRET (bearer); never member or browser
      callable; called weekly by .github/workflows/contributor-access-recompute.yml. Foundation
      per-member counts feed the math internally and are never exposed (rule 132). Reads no
      trust_* table.
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      evaluated:
        type: integer
      eligible:
        type: integer
      channelSyncWarning:
        type: string
        required: false
    dataAccess:
      - contributor_access_config
      - contributor_access_eligibility
      - foundation_call_sessions
      - socket_relay_fulfillments
      - trust_transport_trips
      - lighthouse_matches
      - service_credits_transfers
      - contributions_submissions
      - skills_hunt_submissions
      - what_works_products
      - what_works_endorsements
      - level_up_enrollments
      - level_up_disbursements
      - recurring_activities
      - peer_programming_messages
      - beacon_events
      - feed_community_post_reactions
      - feed_community_replies
      - login_events
    purpose: eligibility_recompute
    retentionClass: derived_long_lived
    idempotency: true

  - pluginId: contributor-access
    command: contributor-access.channel.membership.sync
    version: 1.0.0
    description: >-
      Internal membership sync for the gated Stream channel - the ONLY membership path. Reads the
      eligibility rows and reconciles the Stream channel: every eligible member is added, every
      for-cause-revoked member is removed. No other add path exists (no invites, no self-join for
      the non-eligible). Not a standalone route: it runs inside the weekly recompute, the admin
      revoke/reinstate, and the config channel-open flip, only while channel_open is TRUE, and is
      always guarded - a Stream failure never fails the invoking command (it surfaces as that
      command's channelSyncWarning). Talks to Stream via the shared credential resolver (demo mode
      selects the *_STAGING app).
    inputSchema: {}
    outputSchema:
      added:
        type: integer
      removed:
        type: integer
    dataAccess:
      - contributor_access_config
      - contributor_access_eligibility
    purpose: channel_membership_sync
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: contributor-access
    command: contributor-access.channel.messages.list
    version: 1.0.0
    description: >-
      Read the gated contributor channel's recent messages (oldest-first, quoted-reply references,
      the viewer's reaction state). Member-facing but gated three ways server-side: approved
      member, channel_open TRUE, and the caller's eligibility flag (admins/moderators keep read
      access - disclosed in-channel). A caller who fails the gate receives a bare 404 with no
      trace of the channel (no-shaming rule: no locked teaser, no absence state).
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      messages:
        type: array
    dataAccess:
      - contributor_access_config
      - contributor_access_eligibility
      - contributor_access_channel_posts
      - contributor_access_channel_post_reactions
    purpose: channel_messaging
    retentionClass: user_content
    idempotency: true

  - pluginId: contributor-access
    command: contributor-access.channel.message.create
    version: 1.1.0
    description: >-
      Post to the gated channel (optionally as a Signal-style quoted reply - the channel's thread
      mechanism). Same three-way gate as the list command. Text only, up to 4000 characters
      (longer than the Commons' 1200); there is NO image or file path - uploads are also disabled
      on the Stream channel type. CSRF-confirmed mutation. Runs the same two pre-store guards the
      Commons runs on community posts: the content gate (no raw angle-bracket markup, at most
      three links - a failing post is refused with 422 and the stable code
      content_policy_violation, never stored, never visible to anyone) and the per-member posting
      rate limit (8 posts per 30 minutes counted in the database, the Commons community-post
      threshold - over the window is 429 with the stable code rate_limit_exceeded). A stored post
      carries moderation_status 'accepted' and every read filters to that status.
    inputSchema:
      text:
        type: string
        required: true
      replyToPostId:
        type: string
        required: false
    outputSchema:
      ok:
        type: boolean
      message:
        type: object
    dataAccess:
      - contributor_access_config
      - contributor_access_eligibility
      - contributor_access_channel_posts
    purpose: channel_messaging
    retentionClass: user_content
    idempotency: false

  - pluginId: contributor-access
    command: contributor-access.channel.post.delete
    version: 1.0.0
    description: >-
      Soft-delete a gated-channel post (DELETE on the post id - the same route shape as the
      Commons author delete). Two allowed paths - the post's author, or an admin removing any
      post (the moderator power the in-channel disclosure line discloses). Soft delete only:
      deleted_at/deleted_by are set and every read excludes the row - content is hidden, not
      erased. Anyone else gets 403 (the denied attempt is audited). Both allowed paths write the
      audit trail under distinct commands - the author path as
      contributor-access.channel.post.delete (reason author_delete), the admin path as
      contributor-access.channel.post.moderator-delete (reason admin_moderation_delete). There is
      no Stream-side message to remove: the database is the message source of truth and Stream
      carries only presence/typing for this channel. Same three-way gate as the list command;
      CSRF-confirmed mutation.
    inputSchema:
      postId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
      postId:
        type: string
    dataAccess:
      - contributor_access_config
      - contributor_access_eligibility
      - contributor_access_channel_posts
      - contributor_access_audit_trail
    purpose: channel_messaging
    retentionClass: user_content
    idempotency: false

  - pluginId: contributor-access
    command: contributor-access.channel.reaction.toggle
    version: 1.0.0
    description: >-
      Toggle the caller's emoji reaction on a gated-channel post. The emoji must belong to the
      fixed gated reaction set (twelve emojis - richer than the Commons' six), validated
      server-side. Same three-way gate as the list command. CSRF-confirmed mutation.
    inputSchema:
      emoji:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
      reacted:
        type: boolean
    dataAccess:
      - contributor_access_config
      - contributor_access_eligibility
      - contributor_access_channel_posts
      - contributor_access_channel_post_reactions
    purpose: channel_messaging
    retentionClass: user_content
    idempotency: true

  - pluginId: contributor-access
    command: contributor-access.channel.join
    version: 1.1.0
    description: >-
      Mint Stream live-layer credentials for the gated channel (same posture as the Commons'
      /api/hub/join): the client opens a live connection beneath the custom UI for instant refresh
      and typing indicators; when Stream is unconfigured the response says configured false and
      the client stays on polling. Same three-way gate as the list command - the add to the Stream
      channel only reconciles a flag-verified member into the synced membership, never grants
      access. Reuses the existing Stream credential helpers unchanged (demo mode selects the
      *_STAGING app). CSRF-confirmed mutation.
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      configured:
        type: boolean
    dataAccess:
      - contributor_access_config
      - contributor_access_eligibility
    purpose: channel_messaging
    retentionClass: derived_short_lived
    idempotency: true

changelog:
  - date: 2026-07-18
    change: >-
      Badge slice - the "Weavers of the Commons" badge (owner-picked name and braid emblem) is now
      surfaced on Directory profiles. No new contributor-access route or command: the Directory
      read commands (directory.list.fetch, directory.profile.get in
      DIRECTORY_PLUGIN_COMMAND_CONTRACTS.yaml) perform the cross-plugin read via
      lib/contributor-access/badge.ts (getWeaversBadgeHolders) - a single guarded query over
      contributor_access_eligibility returning only the categorical holder set (eligible = TRUE
      and revoked_for_cause = FALSE); those two commands' dataAccess lists now record
      contributor_access_eligibility. Boolean only, claimed profiles only, positive-only surfaces.
  - date: 2026-07-18
    change: >-
      Initial Contributor Access contract set - the first slice of the trusted-channel /
      contributor-badge module (proposal:
      ctf/docs/developer/TRUSTED_CHANNELS_AND_CONTRIBUTOR_BADGE_PROPOSAL.md). Admin config,
      eligible list, for-cause revoke/reinstate, and the internal weekly recompute. Categorical
      output only; no member-facing surface exists yet (badge and gated channel are later slices).
  - date: 2026-07-18
    change: >-
      Gated channel slice. New commands - channel.membership.sync (internal, the only membership
      path), channel.messages.list, channel.message.create, channel.reaction.toggle, channel.join
      (the member surface: DB-backed history, Stream live layer, threads via quoted replies,
      twelve-emoji reaction set, 4000-char messages, NO images). config.update gains the
      server-side launch-gate precondition (409 contributor_access_channel_below_minimum) and
      creates + syncs the channel on open; revoke/reinstate/recompute run the guarded membership
      sync and may return channelSyncWarning. The member channel commands are deliberately not
      audit-trailed (same posture as the Commons hub routes); the launch-gate deny IS audited.
      Membership visibility is server-filtered: the Hub channel list includes the gated channel
      only for eligible members and admins - never a teaser for anyone else.
  - date: 2026-07-18
    change: >-
      Channel moderation, rate limit, and delete (closes the two recorded inventory gaps).
      channel.message.create 1.1.0 - gains the Commons-mirrored content gate (422
      content_policy_violation; the post is never stored) and the Commons community-post rate
      limit (8 per 30 minutes per member, counted in the database; 429 rate_limit_exceeded);
      stored posts carry moderation_status 'accepted' and reads filter to it (new guarded column).
      New channel.post.delete - author or admin soft delete (deleted_at/deleted_by guarded
      columns; reads exclude deleted rows; a quote of a deleted post resolves to nothing); the
      author and admin paths are audited under distinct commands
      (contributor-access.channel.post.delete / contributor-access.channel.post.moderator-delete)
      and a non-owner attempt is a 403 with an audited deny.
  - date: 2026-08-06
    change: >-
      channel.join 1.1.0 - now a CSRF-confirmed mutation like every other mutation in this
      plugin: the route requires the x-ctf-csrf header before minting credentials, because the
      join has a Stream-side effect (the member is reconciled into the channel) that a
      cross-origin POST must not be able to trigger. config.get 1.1.0 - the output schema now
      records the channelMemberCount field the route has always returned for the admin status
      card (best-effort synced Stream member count; null when Stream is unconfigured or the
      channel is not open). Code-review issues #2122 and #2128.
