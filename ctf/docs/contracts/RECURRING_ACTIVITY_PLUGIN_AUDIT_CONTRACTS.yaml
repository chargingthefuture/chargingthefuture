auditEvents:
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: recurring-activity
    command: recurring-activity.create
    commandVersion: 1.0.0
    purpose: recurring_activity_declaration
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - recurring_activity_metadata
    targetContext:
      ownerUserId: user_identifier
      activityId: activity_identifier
      sector: sector_enum
      currencyCode: currency_code
      cadence: cadence_enum
      hasScValue: boolean
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

