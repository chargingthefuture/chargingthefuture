policies:
  - pluginId: beacon
    command: event.current.get
    version: 1.0.0
    requiredRoles:
      - member
      - guest
      - unauthenticated
    attributePolicies:
      publicWatchAllowed: true
      hlsPlaybackPublic: true
    consentRequirements:
      scopes: []
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions: []

  - pluginId: beacon
    command: event.chat-token.mint
    version: 1.0.0
    requiredRoles:
      - member
    attributePolicies:
      signedInMemberRequired: true
      anonymousChatForbidden: true
    consentRequirements:
      scopes:
        - beacon_chat_participation
      fallbackLawfulBasis: contract_performance
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - no_active_session
      - event_not_live
      - stream_not_configured

  - pluginId: beacon
    command: event.create
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      adminOnly: true
    consentRequirements:
      scopes:
        - beacon_event_manage
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - invalid_payload

  - pluginId: beacon
    command: event.ingest.get
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      adminOnly: true
      onlyHostMayPublish: true
    consentRequirements:
      scopes:
        - beacon_event_manage
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - event_not_found
      - stream_not_configured

  - pluginId: beacon
    command: event.go-live
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      adminOnly: true
      singleLiveEvent: true
      autoPostCommonsOnGoLive: true
    consentRequirements:
      scopes:
        - beacon_event_manage
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - event_not_found
      - stream_not_configured
      - another_event_live

  - pluginId: beacon
    command: event.start-broadcast
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      adminOnly: true
      startsEgressWhenPublisherLive: true
    consentRequirements:
      scopes:
        - beacon_event_manage
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - event_not_found
      - stream_not_configured

  - pluginId: beacon
    command: event.end
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      adminOnly: true
      stopBillingOnEnd: true
    consentRequirements:
      scopes:
        - beacon_event_manage
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - event_not_found

  - pluginId: beacon
    command: event.delete
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      adminOnly: true
      # Drafts only. A live or ended event is public broadcast history and is never deletable
      # through the app; the route refuses it with 409 and the SQL predicate refuses it again.
      draftStatusOnly: true
    consentRequirements:
      scopes:
        - beacon_event_manage
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - event_not_found
      - event_not_draft

  - pluginId: beacon
    command: event.admin.list
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      adminOnly: true
    consentRequirements:
      scopes:
        - beacon_event_manage
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - insufficient_role

  - pluginId: beacon
    command: event.moderate
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      adminOnly: true
      channelModeratorRequired: true
    consentRequirements:
      scopes:
        - beacon_chat_moderation
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - event_not_found
      - invalid_action
      - stream_not_configured

  - pluginId: beacon
    command: event.stream-webhook.ingest
    version: 1.0.0
    requiredRoles:
      - system
    attributePolicies:
      signatureVerificationRequired: true
      idempotentRecordingPost: true
    consentRequirements:
      scopes: []
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - invalid_signature
      - unknown_event
