policies:
  - pluginId: clicklog
    command: clicklog.incident.create
    version: 1.0.0
    requiredRoles: [user]
    attributePolicies:
      - attribute: userId
        mustMatch: authenticatedUserId
    consentRequirements: []
  - pluginId: clicklog
    command: clicklog.incident.list
    version: 1.0.0
    requiredRoles: [user, admin]
    attributePolicies:
      - attribute: userId
        mustMatch: authenticatedUserId
    consentRequirements: []
  - pluginId: clicklog
    command: clicklog.incident.delete
    version: 1.0.0
    requiredRoles: [user, admin]
    attributePolicies:
      - attribute: id
        mustBeOwnedBy: authenticatedUserId
    consentRequirements: []
