contracts:
  - pluginId: skills-hunt
    command: skills-hunt.round.create
    version: 1.1.0
    description: Create a SkillsHunt round with scoring config, ServiceCredits reward config, schedule window, and governance metadata.
    inputSchema:
      name:
        type: string
        required: true
      description:
        type: string
        required: false
      startsAtIso:
        type: string
        required: true
      endsAtIso:
        type: string
        required: true
      scoringConfig:
        type: object
        required: false
      rewardCreditsPerAccept:
        type: integer
        required: false
        description: Whole ServiceCredits minted to the scout on each accepted nomination. Default 0 (no reward).
      rewardPerUserRoundCap:
        type: integer
        required: false
        description: Optional ceiling on total reward credits one scout can earn in this round. Null = no cap.
    outputSchema:
      roundId:
        type: string
      status:
        type: string
      createdAt:
        type: string
    dataAccess:
      - skills_hunt_rounds
      - skills_hunt_audit_log
    purpose: campaign_governance
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.round.update
    version: 1.1.0
    description: Update round schedule, status, scoring controls, and ServiceCredits reward config for an existing SkillsHunt campaign.
    inputSchema:
      roundId:
        type: string
        required: true
      name:
        type: string
        required: false
      description:
        type: string
        required: false
      status:
        type: string
        required: false
      startsAtIso:
        type: string
        required: false
      endsAtIso:
        type: string
        required: false
      scoringConfig:
        type: object
        required: false
      rewardCreditsPerAccept:
        type: integer
        required: false
        description: Whole ServiceCredits minted to the scout on each accepted nomination. Default 0 (no reward).
      rewardPerUserRoundCap:
        type: integer
        required: false
        description: Optional ceiling on total reward credits one scout can earn in this round. Null = no cap.
    outputSchema:
      roundId:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    dataAccess:
      - skills_hunt_rounds
      - skills_hunt_audit_log
    purpose: campaign_governance
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.round.list
    version: 1.0.0
    description: List SkillsHunt rounds for contributor and admin discovery surfaces.
    inputSchema:
      status:
        type: string
        required: false
      page:
        type: integer
        required: false
      pageSize:
        type: integer
        required: false
    outputSchema:
      items:
        type: array
      nextCursor:
        type: string
    dataAccess:
      - skills_hunt_rounds
    purpose: campaign_discovery
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.submission.create
    version: 1.1.0
    description: >-
      Create a contributor submission with validated profile URL, skill set, profession claims, and
      the nominee's location. `country` is required; `state`/`city` are optional. On accept the
      location carries into the generated directory profile (the shared member profile). Admins are
      exempt from the scout rate limits (the rolling weekly submission cap and the reputation-driven
      pre-approval/restricted gate); the active-round window and the one-active-submission-per-Quora-URL
      duplicate guard still apply to everyone.
    inputSchema:
      roundId:
        type: string
        required: true
      fullName:
        type: string
        required: true
      bio:
        type: string
        required: true
      quoraProfileUrl:
        type: string
        required: true
      skills:
        type: array
        required: true
      claimedProfessions:
        type: array
        required: false
      country:
        type: string
        required: true
      state:
        type: string
        required: false
      city:
        type: string
        required: false
    outputSchema:
      submissionId:
        type: string
      status:
        type: string
      createdAt:
        type: string
    dataAccess:
      - skills_hunt_submissions
      - skills_hunt_rare_skills_lookup
      - skills_hunt_audit_log
    purpose: community_contribution
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.submission.list
    version: 1.0.0
    description: List round submissions with role-scoped filtering and pagination.
    inputSchema:
      roundId:
        type: string
        required: true
      status:
        type: string
        required: false
      submitterUserId:
        type: string
        required: false
      page:
        type: integer
        required: false
      limit:
        type: integer
        required: false
    outputSchema:
      items:
        type: array
      nextCursor:
        type: string
    dataAccess:
      - skills_hunt_submissions
    purpose: moderation_and_progress
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.submission.review
    version: 1.1.0
    description: >-
      Apply moderator/admin review decision including accept/reject/edit/flag and scoring updates.
      On accept, when the round has a ServiceCredits reward configured, mint that reward to the
      scout via the ServiceCredits treasury (best-effort, idempotent per submission, bounded by the
      per-scout round cap and the per-period mint budget). The mint never fails the review decision.
    inputSchema:
      submissionId:
        type: string
        required: true
      action:
        type: string
        required: true
      notes:
        type: string
        required: false
      edit:
        type: object
        required: false
    outputSchema:
      submissionId:
        type: string
      status:
        type: string
      pointsAwarded:
        type: integer
      creditGranted:
        type: boolean
      creditAmount:
        type: integer
      reviewedAt:
        type: string
    dataAccess:
      - skills_hunt_submissions
      - skills_hunt_leaderboard
      - skills_hunt_audit_log
      # ServiceCredits reward on accept (mirrors the Unlock approval reward).
      - service_credits_wallets
      - service_credits_governance_events
      - service_credits_ledger_entries
      - service_credits_command_idempotency
      - service_credits_adapter_outbox
      - service_credits_admin_audit_trail
    purpose: moderation_and_scoring
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.submission.remove
    version: 1.0.0
    description: >-
      Admin-only soft-delete of a submission (sets deleted_at). Voids a duplicate,
      test, or mistaken row WITHOUT it counting as a scout rejection — a soft-deleted
      row is excluded from reputation/rate-limit, leaderboard, mission progress, My
      Finds, and directory eligibility. Rebuilds the round leaderboard and recomputes
      the scout's mission progress. Does not touch the ServiceCredits ledger.
    inputSchema:
      submissionId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
      alreadyRemoved:
        type: boolean
      roundId:
        type: string
    dataAccess:
      - skills_hunt_submissions
      - skills_hunt_leaderboard
      - skills_hunt_mission_progress
      - skills_hunt_audit_log
    purpose: moderation_and_scoring
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.leaderboard.list
    version: 1.0.0
    description: Retrieve round leaderboard entries in individual or team mode.
    inputSchema:
      roundId:
        type: string
        required: true
      mode:
        type: string
        required: true
      limit:
        type: integer
        required: false
    outputSchema:
      items:
        type: array
      generatedAtIso:
        type: string
    dataAccess:
      - skills_hunt_leaderboard
    purpose: progress_visibility
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.leaderboard.rebuild
    version: 1.0.0
    description: Admin-only manual rebuild of a round's cached leaderboard (individual and team) from its current accepted submissions.
    inputSchema:
      roundId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - skills_hunt_leaderboard
      - skills_hunt_submissions
    purpose: progress_visibility
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.achievement.list
    version: 1.0.0
    description: List achievements awarded to the authenticated user.
    inputSchema:
      userId:
        type: string
        required: true
      page:
        type: integer
        required: false
    outputSchema:
      items:
        type: array
      nextCursor:
        type: string
    dataAccess:
      - skills_hunt_achievements
    purpose: reward_visibility
    retentionClass: derived_medium_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.notification.list
    version: 1.0.0
    description: List SkillsHunt notifications for the authenticated user.
    inputSchema:
      userId:
        type: string
        required: true
      unreadOnly:
        type: boolean
        required: false
    outputSchema:
      items:
        type: array
    dataAccess:
      - skills_hunt_notifications
    purpose: user_notification_delivery
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.notification.ack
    version: 1.0.0
    description: Mark a SkillsHunt notification as read.
    inputSchema:
      notificationId:
        type: string
        required: true
    outputSchema:
      notificationId:
        type: string
      isRead:
        type: boolean
      readAt:
        type: string
    dataAccess:
      - skills_hunt_notifications
    purpose: user_notification_delivery
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.feature-reward-card.get
    version: 1.0.0
    description: Read the active feature reward card for SkillsHunt UI surfaces.
    inputSchema: {}
    outputSchema:
      title:
        type: string
      description:
        type: string
      ctaLabel:
        type: string
      ctaUrl:
        type: string
      isActive:
        type: boolean
    dataAccess:
      - skills_hunt_feature_reward_card
    purpose: reward_promotion
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.feature-reward-card.update
    version: 1.0.0
    description: Update the global feature reward card configuration.
    inputSchema:
      title:
        type: string
        required: true
      description:
        type: string
        required: true
      ctaLabel:
        type: string
        required: true
      ctaUrl:
        type: string
        required: true
      isActive:
        type: boolean
        required: true
    outputSchema:
      title:
        type: string
      updatedAt:
        type: string
    dataAccess:
      - skills_hunt_feature_reward_card
      - skills_hunt_audit_log
    purpose: reward_promotion_governance
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.directory-profile.generate
    version: 1.0.0
    description: Generate an unclaimed Directory profile projection from an accepted submission.
    inputSchema:
      submissionId:
        type: string
        required: true
      invitedByUsername:
        type: string
        required: true
        description: Canonical auth-provider handle of the inviter; must not be a plugin-local username or display-name surrogate.
    outputSchema:
      generatedProfileId:
        type: string
      profileStatus:
        type: string
      createdAt:
        type: string
    dataAccess:
      - skills_hunt_submissions
      - skills_hunt_directory_profiles
      - skills_hunt_audit_log
      # Reads the Directory takedown suppression list to skip generating a profile for a Quora URL that
      # was removed at the person's request; logs the skip to the Directory change/audit log.
      - directory_suppressed_quora_urls
      - directory_profile_change_events
    purpose: directory_projection_generation
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.submission.report
    version: 1.0.0
    description: File a community moderation report against a submission or a community-generated Directory profile.
    inputSchema:
      submissionId:
        type: string
        required: false
      directoryProfileId:
        type: string
        required: false
      reason:
        type: string
        required: true
        description: One of no_permission | inaccurate | duplicate | spam | other.
      details:
        type: string
        required: false
        description: Optional free-text context (max 1000 chars).
    outputSchema:
      report:
        type: object
        description: The created report row including status ('open').
    dataAccess:
      - skills_hunt_submission_reports
      - skills_hunt_audit_log
    purpose: community_moderation
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: skills-hunt
    command: skills-hunt.profile.delete
    version: 1.0.0
    description: GDPR-style soft-delete of every submission authored by the caller. Audit log retained.
    inputSchema: {}
    outputSchema:
      deleted:
        type: number
        description: Count of submissions soft-deleted.
    dataAccess:
      - skills_hunt_submissions
      - skills_hunt_audit_log
    purpose: gdpr_self_delete
    retentionClass: gdpr_soft_delete
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.mission.list
    version: 1.0.0
    description: List a round's missions. The admin surface sees every status; the member surface sees active/locked missions with the caller's own progress attached.
    inputSchema:
      roundId:
        type: string
        required: true
    outputSchema:
      items:
        type: array
        description: Mission rows; the member view includes per-caller progress.
    dataAccess:
      - skills_hunt_missions
      - skills_hunt_mission_progress
    purpose: campaign_governance
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.mission.create
    version: 1.0.0
    description: Admin creates a mission (themed sub-goal) inside a round.
    inputSchema:
      roundId:
        type: string
        required: true
      title:
        type: string
        required: true
      description:
        type: string
        required: false
      goalType:
        type: string
        required: true
        description: One of count_total_accepted, count_skills_in_sector, count_rare_skill_finds, count_distinct_sectors.
      goalTarget:
        type: integer
        required: true
      goalMetadata:
        type: object
        required: false
        description: sectorName (and optional sectorId) for count_skills_in_sector; empty otherwise.
      bonusPoints:
        type: integer
        required: false
      colorHex:
        type: string
        required: false
      status:
        type: string
        required: false
      displayOrder:
        type: integer
        required: false
    outputSchema:
      mission:
        type: object
    dataAccess:
      - skills_hunt_missions
      - skills_hunt_audit_log
    purpose: campaign_governance
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: skills-hunt
    command: skills-hunt.mission.update
    version: 1.0.0
    description: Admin updates a mission's fields; partial update, scoped to the mission's round.
    inputSchema:
      roundId:
        type: string
        required: true
      missionId:
        type: string
        required: true
    outputSchema:
      mission:
        type: object
    dataAccess:
      - skills_hunt_missions
      - skills_hunt_audit_log
    purpose: campaign_governance
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.mission.archive
    version: 1.0.0
    description: Admin soft-archives a mission (status 'archived'). Hard delete is intentionally not exposed so progress history survives.
    inputSchema:
      roundId:
        type: string
        required: true
      missionId:
        type: string
        required: true
    outputSchema:
      mission:
        type: object
    dataAccess:
      - skills_hunt_missions
      - skills_hunt_audit_log
    purpose: campaign_governance
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.mission.auto_generate
    version: 1.0.0
    description: Scheduled/admin run that opens 'count_skills_in_sector' missions in every active round for the sectors with the largest Workforce talent gaps. Reads the gap signal through the platform Workforce interface; never writes into Workforce, Directory, or Skills Taxonomy. Idempotent — at most one live auto mission per (round, sector).
    inputSchema:
      source:
        type: string
        required: false
        description: Run provenance ('cron' or 'admin').
    outputSchema:
      rounds:
        type: array
        description: Per-round list of missions opened this run.
    dataAccess:
      - skills_hunt_missions
      - skills_hunt_rounds
      - skills_hunt_auto_mission_config
      - skills_taxonomy_sectors
      - skills_hunt_audit_log
    purpose: campaign_governance
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: skills-hunt
    command: skills-hunt.mission.auto_config_update
    version: 1.0.0
    description: Admin updates the auto-mission knobs (kill switch, minimum sector gap, per-round cap, default goal target and bonus points).
    inputSchema:
      enabled:
        type: boolean
        required: true
      minGapThreshold:
        type: number
        required: true
      maxPerRound:
        type: integer
        required: true
      defaultGoalTarget:
        type: integer
        required: true
      defaultBonusPoints:
        type: integer
        required: true
    outputSchema:
      config:
        type: object
    dataAccess:
      - skills_hunt_auto_mission_config
      - skills_hunt_audit_log
    purpose: campaign_governance
    retentionClass: transactional_long_lived
    idempotency: true

changelog:
  - date: 2026-02-24
    change: Initial SkillsHunt v1 command contracts added for round governance, submission/review flows, leaderboard/reward surfaces, and Directory unclaimed-profile generation.
  - date: 2026-05-12
    change: Added skills-hunt.submission.report (community moderation) and skills-hunt.profile.delete (GDPR erasure) commands.
  - date: 2026-06-20
    change: Bumped skills-hunt.round.create, skills-hunt.round.update, and skills-hunt.submission.review to v1.1.0 — round create/update gain the rewardCreditsPerAccept and rewardPerUserRoundCap inputs, and submission.review mints the configured ServiceCredits reward to the scout on accept (idempotent, cap- and budget-bounded).
  - date: 2026-08-27
    change: Added the previously undocumented mission commands (mission.list, mission.create, mission.update, mission.archive) and the new auto-mission commands (mission.auto_generate, mission.auto_config_update) for missions auto-opened from Workforce sector gaps.
