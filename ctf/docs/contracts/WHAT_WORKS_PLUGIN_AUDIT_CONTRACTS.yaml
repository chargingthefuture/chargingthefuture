# Owner directive, 2026-08-28: every admin action is recorded, on every surface. Until that date these
# events were written by logWhatWorksAudit, which builds the whole shape below and ends in
# console.info — a line in the server's log, which nothing can query, no screen can show, and which
# ages out of the host's retention window. Every admin decision event here is now also a durable row
# in what_works_admin_audit_trail, written by recordWhatWorksAdminAudit on every outcome including a
# refusal. A row names the product or problem and the acting admin, never suggested_by, so the trail
# keeps the plugin's anonymity guarantee. The member-facing events keep the log line alone.
auditEvents:
  - eventId: what-works.list.read
    pluginId: what-works
    command: what-works.list.read
    version: 1.0.0
    policyDecision: allow
    dataClassesAccessed: [community_content]
    targetContext: user
  - eventId: what-works.public.read
    pluginId: what-works
    command: what-works.public.read
    version: 1.0.0
    policyDecision: allow
    dataClassesAccessed: [community_content]
    targetContext: public
  - eventId: what-works.problems.list
    pluginId: what-works
    command: what-works.problems.list
    version: 1.0.0
    policyDecision: allow
    dataClassesAccessed: [community_content]
    targetContext: user
  - eventId: what-works.product.suggest
    pluginId: what-works
    command: what-works.product.suggest
    version: 1.0.0
    policyDecision: allow
    dataClassesAccessed: [community_content, user_event]
    targetContext: user
  - eventId: what-works.product.endorse
    pluginId: what-works
    command: what-works.product.endorse
    version: 1.0.0
    policyDecision: allow
    dataClassesAccessed: [user_event]
    targetContext: user
  - eventId: what-works.product.unendorse
    pluginId: what-works
    command: what-works.product.unendorse
    version: 1.0.0
    policyDecision: allow
    dataClassesAccessed: [user_event]
    targetContext: user
  - eventId: what-works.admin.problem.list
    pluginId: what-works
    command: what-works.admin.problem.list
    version: 1.0.0
    policyDecision: allow
    dataClassesAccessed: [community_content]
    targetContext: admin
  - eventId: what-works.admin.problem.create
    pluginId: what-works
    command: what-works.admin.problem.create
    version: 1.0.0
    policyDecision: allow
    dataClassesAccessed: [community_content]
    targetContext: admin
  - eventId: what-works.admin.problem.update
    pluginId: what-works
    command: what-works.admin.problem.update
    version: 1.0.0
    policyDecision: allow
    dataClassesAccessed: [community_content]
    targetContext: admin
  - eventId: what-works.admin.problem.delete
    pluginId: what-works
    command: what-works.admin.problem.delete
    version: 1.0.0
    policyDecision: allow
    # Cascades to what_works_products and what_works_endorsements (user-linked rows).
    dataClassesAccessed: [community_content, user_event]
    targetContext: admin
  - eventId: what-works.admin.product.list
    pluginId: what-works
    command: what-works.admin.product.list
    version: 1.0.0
    policyDecision: allow
    dataClassesAccessed: [community_content]
    targetContext: admin
  - eventId: what-works.admin.product.review
    pluginId: what-works
    command: what-works.admin.product.review
    version: 1.0.0
    policyDecision: allow
    dataClassesAccessed: [community_content]
    targetContext: admin
  - eventId: what-works.admin.product.update
    pluginId: what-works
    command: what-works.admin.product.update
    version: 1.0.0
    policyDecision: allow
    dataClassesAccessed: [community_content]
    targetContext: admin
  - eventId: what-works.admin.product.delete
    pluginId: what-works
    command: what-works.admin.product.delete
    version: 1.0.0
    policyDecision: allow
    # Cascades to what_works_endorsements (user-linked rows).
    dataClassesAccessed: [community_content, user_event]
    targetContext: admin

  # An admin reading the trail from the Audit log panel on the What Works admin screen.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: what-works
    command: what-works.admin.audit.list
    commandVersion: 1.0.0
    purpose: governance_transparency
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - what_works_admin_audit_trail
    targetContext:
      targetType: audit_trail
      targetId: row_count_requested
    result:
      status: success_or_failure
      errorCategory: none_or_error_class
