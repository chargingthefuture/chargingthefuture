contracts:
  - pluginId: beacon
    command: event.current.get
    version: 1.0.0
    description: Return the currently-live Beacon event (or null) and the public HLS playback URL. Open to the public; no sign-in required.
    inputSchema: {}
    outputSchema:
      event:
        type: object
      hlsPlaybackUrl:
        type: string
    dataAccess:
      - beacon_events
    purpose: public_viewer
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: beacon
    command: event.replays.list
    version: 1.0.0
    description: List every ended Beacon event that has a recording, newest first, one page at a time (GET /api/beacon/replays?page=). Public; no sign-in. Returns title, description, start and end times, the app's recording address, and the watch page. Never returns the host user id or Stream call id. Read by the blog's streams page.
    inputSchema:
      page:
        type: integer
        required: false
    outputSchema:
      replays:
        type: array
      page:
        type: integer
      pageCount:
        type: integer
      total:
        type: integer
      feedUrl:
        type: string
    dataAccess:
      - beacon_events
    purpose: public_viewer
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: beacon
    command: event.replays.feed
    version: 1.0.0
    description: Serve the podcast feed (RSS 2.0 with iTunes tags) of the newest 100 recorded Beacon broadcasts (GET /api/beacon/replays/feed). Public; no sign-in. Each item's enclosure is the app's recording address.
    inputSchema: {}
    outputSchema:
      rss:
        type: string
    dataAccess:
      - beacon_events
    purpose: public_viewer
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: beacon
    command: event.replay.recording.get
    version: 1.0.0
    description: Redirect to the recording file of one ended Beacon event (GET /api/beacon/replays/[id]/recording). Prefers this project's own copy (archived_recording_url, a GitHub release asset); otherwise asks Stream for a current file address, because the stored one is signed and can expire; otherwise the stored address. Public; no sign-in. 404 for a draft, live, or unrecorded event.
    inputSchema:
      eventId:
        type: string
        required: true
    outputSchema:
      redirect:
        type: string
    dataAccess:
      - beacon_events
    purpose: public_viewer
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: beacon
    command: event.recording.archive
    version: 1.0.0
    description: Cron-only (CRON_SECRET Bearer), GET and POST /api/internal/beacon/recordings-archive. GET lists up to 5 ended, recorded events with no kept copy, each with a signed download address. POST records where the copy now lives; only <eventId>.mp4 on this repository's beacon-recording-<eventId> release is accepted. Run by the beacon-recordings-archive workflow.
    inputSchema:
      eventId:
        type: string
        required: false
      archivedUrl:
        type: string
        required: false
    outputSchema:
      pending:
        type: array
    dataAccess:
      - beacon_events
    purpose: operational_maintenance
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: beacon
    command: event.chat-token.mint
    version: 1.0.0
    description: Mint a Stream Chat token for the live event chat channel. Requires a signed-in member, so only members can post; this is the sign-in-to-chat gate. Anonymous callers are denied.
    inputSchema:
      eventId:
        type: string
        required: true
    outputSchema:
      streamApiKey:
        type: string
      streamChannelId:
        type: string
      streamUserId:
        type: string
      streamToken:
        type: string
    dataAccess:
      - beacon_events
      - canonical_user_profile
    purpose: member_chat
    retentionClass: transactional_short_lived
    idempotency: false

  - pluginId: beacon
    command: event.create
    version: 1.0.0
    description: Create a draft Beacon event (title plus optional description). Admin-only.
    inputSchema:
      title:
        type: string
        required: true
      description:
        type: string
        required: false
    outputSchema:
      event:
        type: object
    dataAccess:
      - beacon_events
      - beacon_events_admin_audit_trail
    purpose: event_lifecycle
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: beacon
    command: event.ingest.get
    version: 1.0.0
    description: Return the per-event RTMP ingest URL plus stream key (for a phone broadcaster app) and a host token (for desktop in-browser screen-share). Admin-only. Only the host token can publish.
    inputSchema:
      eventId:
        type: string
        required: true
    outputSchema:
      rtmpIngestUrl:
        type: string
      streamKey:
        type: string
      streamApiKey:
        type: string
      streamCallType:
        type: string
      streamCallId:
        type: string
      streamUserId:
        type: string
      hostToken:
        type: string
    dataAccess:
      - beacon_events
      - beacon_events_admin_audit_trail
    purpose: broadcast_ingest
    retentionClass: transactional_short_lived
    idempotency: false

  - pluginId: beacon
    command: event.go-live
    version: 1.0.0
    description: Flip the event to live (Stream goLive on the livestream call) and auto-post a live-now notice to the Commons. Admin-only. Idempotent on the Commons post (stored on the event row).
    inputSchema:
      eventId:
        type: string
        required: true
    outputSchema:
      event:
        type: object
    dataAccess:
      - beacon_events
      - feed_community_posts
      - feed_items
      - beacon_events_admin_audit_trail
    purpose: event_lifecycle
    idempotency: true

  - pluginId: beacon
    command: event.start-broadcast
    version: 1.0.0
    description: Start the public HLS broadcast and recording once a host is publishing media to the livestream call. Admin-only. Idempotent.
    inputSchema:
      eventId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - beacon_events
      - beacon_events_admin_audit_trail
    purpose: event_lifecycle
    idempotency: true

  - pluginId: beacon
    command: event.end
    version: 1.0.0
    description: End the broadcast, stop the Stream call so video billing stops, and flip the event to ended. Admin-only.
    inputSchema:
      eventId:
        type: string
        required: true
    outputSchema:
      event:
        type: object
    dataAccess:
      - beacon_events
      - beacon_events_admin_audit_trail
    purpose: event_lifecycle
    idempotency: true

  - pluginId: beacon
    command: event.delete
    version: 1.0.0
    description: >-
      Delete a DRAFT Beacon event. Admin-only. Drafts only — a live or ended event is refused with a
      409, because an ended event is public broadcast history with a recording attached and is
      retained per the Beacon deletion contract. A draft was never broadcast, has no recording, and
      never appeared in the member view, so deleting a mistyped one removes nothing a member saw.
      The draft-only rule is enforced in the route AND in the SQL predicate. A refused attempt is
      itself written to the audit trail.
    inputSchema:
      eventId:
        type: string
        required: true
    outputSchema:
      deletedId:
        type: string
    dataAccess:
      - beacon_events
      - beacon_events_admin_audit_trail
    purpose: event_lifecycle
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: beacon
    command: event.admin.list
    version: 1.0.0
    description: List Beacon events newest-first, including past events and their recordings. Admin-only.
    inputSchema: {}
    outputSchema:
      events:
        type: array
    dataAccess:
      - beacon_events
    purpose: event_administration
    retentionClass: derived_medium_lived
    idempotency: true

  - pluginId: beacon
    command: event.moderate
    version: 1.0.0
    description: Moderate the live event chat — mute a member, ban a member from the event channel, or toggle slow-mode. Admin-only; targets the Stream Chat channel for the event.
    inputSchema:
      eventId:
        type: string
        required: true
      action:
        type: string
        required: true
        enum:
          - mute
          - ban
          - slow_mode
      targetUserId:
        type: string
        required: false
      cooldownSeconds:
        type: integer
        required: false
    outputSchema:
      status:
        type: string
    dataAccess:
      - beacon_events
      - beacon_events_admin_audit_trail
    purpose: chat_moderation
    retentionClass: audit_long_lived
    idempotency: false

  - pluginId: beacon
    command: event.stream-webhook.ingest
    version: 1.0.0
    description: Ingest Stream Video webhook events (recording-ready and call lifecycle). Verifies the Stream signature, stores the recording URL on the event, and posts the replay to the Commons. Idempotent — never double-posts the replay.
    inputSchema:
      type:
        type: string
        required: true
      call_cid:
        type: string
        required: false
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - beacon_events
      - feed_community_posts
      - feed_items
    purpose: recording_ingest
    retentionClass: transactional_long_lived
    idempotency: true
