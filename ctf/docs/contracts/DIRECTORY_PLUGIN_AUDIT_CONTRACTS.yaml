# Owner directive, 2026-08-28: every admin action is recorded, on every surface. Until that date these
# events were written by logDirectoryAudit, which builds the whole shape below and ends in
# console.info — a line in the server's log, which nothing can query, no screen can show, and which
# ages out of the host's retention window. Every admin mutation event here is now also a durable row
# in directory_admin_audit_trail, written by recordDirectoryAdminAudit on every outcome including a
# refusal. The read and member self-service events keep the log line alone: a row per page load
# would be volume, not accountability.
auditEvents:
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: directory
    command: directory.profile.upsert
    commandVersion: 1.0.0
    purpose: profile_management
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        roleCheck: pass_or_fail
        profileOwnershipCheck: pass_or_fail
        claimedUnclaimedGuardCheck: pass_or_fail
    dataClassesAccessed:
      - directory_profile_metadata
      - profile_visibility_metadata
    targetContext:
      workspaceId: workspace_identifier
      profileId: profile_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal_or_public
    pluginId: directory
    command: directory.public.fetch
    commandVersion: 1.0.0
    purpose: public_projection
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        publicVisibilityCheck: pass_or_fail
        antiScrapingCheck: pass_or_fail
    dataClassesAccessed:
      - directory_public_projection_metadata
    targetContext:
      workspaceId: workspace_identifier
      profileId: profile_identifier_or_none
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: directory
    command: directory.admin.profile.assign
    commandVersion: 1.0.0
    purpose: admin_profile_assignment
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        roleCheck: pass_or_fail
        csrfCheck: pass_or_fail
        assignmentGuardCheck: pass_or_fail
    dataClassesAccessed:
      - directory_profile_metadata
      - admin_mutation_audit_metadata
    targetContext:
      workspaceId: workspace_identifier
      profileId: profile_identifier
      assignedUserId: user_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: directory
    command: directory.admin.profile.delete
    commandVersion: 1.0.0
    purpose: admin_profile_moderation
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        roleCheck: pass_or_fail
        csrfCheck: pass_or_fail
        unclaimedGuardCheck: pass_or_fail
    dataClassesAccessed:
      - directory_profile_metadata
      - admin_mutation_audit_metadata
    targetContext:
      workspaceId: workspace_identifier
      profileId: profile_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: directory
    command: directory.profile.delete.service
    commandVersion: 1.0.0
    purpose: deletion_request
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        ownershipCheck: pass_or_fail
        scopeCheck: pass_or_fail
    dataClassesAccessed:
      - directory_deletion_metadata
      - directory_profile_metadata
    targetContext:
      workspaceId: workspace_identifier
      userId: user_identifier
      scope: service
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: directory
    command: directory.list.fetch
    commandVersion: 1.0.0
    purpose: directory_discovery
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        roleCheck: pass_or_fail
        visibilityFilterCheck: pass_or_fail
    dataClassesAccessed:
      - directory_public_projection_metadata
      - selector_filter_metadata
    targetContext:
      workspaceId: workspace_identifier
      listingRequestId: request_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: directory
    command: directory.profile.get
    commandVersion: 1.0.0
    purpose: directory_discovery
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        roleCheck: pass_or_fail
        visibilityFilterCheck: pass_or_fail
    dataClassesAccessed:
      - directory_public_projection_metadata
    targetContext:
      workspaceId: workspace_identifier
      targetType: directory_profile
      targetId: directory_profile_id
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: directory
    command: directory.admin.announcement.upsert
    commandVersion: 1.0.0
    purpose: admin_communications
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        roleCheck: pass_or_fail
        csrfCheck: pass_or_fail
        payloadValidationCheck: pass_or_fail
    dataClassesAccessed:
      - directory_announcement_metadata
      - admin_mutation_audit_metadata
    targetContext:
      workspaceId: workspace_identifier
      announcementId: announcement_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  # Taking an announcement down. Split out on 2026-08-28: the DELETE handler recorded its events
  # under directory.admin.announcement.upsert, so a takedown was written into the trail as a save.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: directory
    command: directory.admin.announcement.deactivate
    commandVersion: 1.0.0
    purpose: admin_communications
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        roleCheck: pass_or_fail
        csrfCheck: pass_or_fail
    dataClassesAccessed:
      - directory_announcement_metadata
      - admin_mutation_audit_metadata
    targetContext:
      workspaceId: workspace_identifier
      announcementId: announcement_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  # An admin reading the trail from the Audit log panel on /admin/directory. A read, so it records
  # who looked and when; the trail it reads is append-only.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: directory
    command: directory.admin.audit.list
    commandVersion: 1.0.0
    purpose: governance_transparency
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        roleCheck: pass_or_fail
    dataClassesAccessed:
      - admin_mutation_audit_metadata
    targetContext:
      workspaceId: workspace_identifier
      limit: row_count_requested
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class
