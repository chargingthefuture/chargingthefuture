# Notifications center — access policy contracts.
# Every command is scoped to the requesting member's own rows, derived from the authenticated session
# (never a client-supplied user id). A member can only read/mark their own notifications and
# read/update their own preferences. The in-app feed is never gated by push preferences; only device
# push is (a later delivery step).

policies:
  - pluginId: notifications
    command: notifications.list
    version: 1.0.0
    requiredRoles:
      - member
      - admin
    attributePolicies:
      tenancy: same_workspace
      actorMustOwnRows: true
    consentRequirements:
      scopes:
        - notifications_self_service
      fallbackLawfulBasis: legitimate_interest_safety_support
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - actor_not_authenticated
      - actor_not_row_owner

  - pluginId: notifications
    command: notifications.read.mark
    version: 1.0.0
