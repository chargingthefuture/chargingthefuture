contracts:
  - pluginId: foundation
    command: foundation.search.providers
    version: 1.0.0
    description: Search survivor-safe provider options using Directory read-only projections, with trauma-informed and accessibility-aware ranking.
    inputSchema:
      query:
        type: string
        required: true
      filters:
        type: object
        required: false
      location:
        type: object
        required: false
      page:
        type: integer
        required: false
      pageSize:
        type: integer
        required: false
      accessibilityNeeds:
        type: array
        required: false
    outputSchema:
      providers:
        type: array
      total:
        type: integer
      nextCursor:
        type: string
      rankingSignals:
        type: object
      viewerUserId:
        type: string
      instantCallEnabled:
        type: boolean
      instantCallRateCredits:
        type: integer
      instantCallIntervalMinutes:
        type: integer
      shortDescription:
        type: string
        nullable: true
    dataAccess:
      - foundation_provider_search_index
      - directory_provider_profiles_read_model
      - directory_service_regions_read_model
      - foundation_user_extension
      - member_blocks
    purpose: survivor_provider_matching
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.provider.get
    version: 1.0.0
    description: Fetch one Foundation provider by directory-profile id, behind the same read gate as search. Backs the auth-gated deep-link page so a shared provider link opens that provider for a signed-in member.
    inputSchema:
      providerId:
        type: string
        required: true
    outputSchema:
      provider:
        type: object
      viewerUserId:
        type: string
    dataAccess:
      - directory_provider_profiles_read_model
      - foundation_provider_skills
      - foundation_user_extension
    purpose: survivor_provider_matching
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.connection.thread.create
    version: 1.0.0
    description: Create or return the survivor-provider 1:1 Stream text channel for initial connection handoff.
    inputSchema:
      providerId:
        type: string
        required: true
      initialContext:
        type: object
        required: false
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      threadId:
        type: string
      streamChannelId:
        type: string
      state:
        type: string
    dataAccess:
      - foundation_connection_threads
      - foundation_thread_participants
      - stream_chat_channel_metadata
      - directory_provider_profiles_read_model
      - member_blocks
    purpose: secure_initial_connection
    retentionClass: communication_medium_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.connection.thread.token.create
    version: 1.0.0
    description: Re-mint fresh Stream credentials for a participant re-opening an existing connection thread's Direct Line. Creates no new channel; only issues a token for the already-existing channel.
    inputSchema:
      threadId:
        type: string
        required: true
    outputSchema:
      streamApiKey:
        type: string
      streamUserId:
        type: string
      streamToken:
        type: string
      streamChannelId:
        type: string
    dataAccess:
      - foundation_connection_threads
      - foundation_thread_participants
      - stream_chat_channel_metadata
    purpose: survivor_provider_communication
    retentionClass: communication_short_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.connection.message.send
    version: 1.0.0
    description: Send a 1:1 text message in a Foundation connection thread through shared Stream adapters.
    inputSchema:
      threadId:
        type: string
        required: true
      messageText:
        type: string
        required: true
      attachments:
        type: array
        required: false
      clientMessageId:
        type: string
        required: true
    outputSchema:
      messageId:
        type: string
      sentAt:
        type: string
      moderationStatus:
        type: string
    dataAccess:
      - foundation_connection_threads
      - foundation_message_metadata
      - stream_chat_messages
      - stream_moderation_metadata
    purpose: survivor_provider_communication
    retentionClass: communication_medium_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.connection.call.session.create
    version: 1.0.0
    description: Create a 1:1 voice or video call session token and metadata for survivor-provider communication.
    inputSchema:
      threadId:
        type: string
        required: true
      modality:
        type: string
        required: true
        enum:
          - voice
          - video
      requestedDurationMinutes:
        type: integer
        required: false
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      callSessionId:
        type: string
      streamCallId:
        type: string
      joinToken:
        type: string
      expiresAt:
        type: string
    dataAccess:
      - foundation_connection_threads
      - foundation_call_sessions
      - stream_video_call_metadata
      - stream_participant_minute_meter
    purpose: survivor_provider_communication
    retentionClass: communication_short_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.connection.instant-call.ring
    version: 1.1.0
    description: Place an instant 1:1 audio call ring on an existing Direct Line thread (Foundation "Connect now", issue #808 tasks 3 and 4). The caller rings the other thread participant (the provider). Audio only for v1. Rate limited so one member cannot spam a provider with repeated rings. Ringing moves NO credits. The buyer pre-authorizes a maximum number of blocks here (authorizedBlocks, the per-session cap the call can never extend past in v1; default 6); the ring is rejected up front if the caller cannot afford even the first block at the provider's current rate, or if the provider has no valid paid-call rate set. No push happens here (issue #808 task 5 — the ring is in-app only for now).
    inputSchema:
      threadId:
        type: string
        required: true
      authorizedBlocks:
        type: integer
        required: false
    outputSchema:
      callId:
        type: string
      ringStatus:
        type: string
      ringExpiresAt:
        type: string
      authorizedBlocks:
        type: integer
    dataAccess:
      - foundation_connection_threads
      - foundation_thread_participants
      - foundation_call_sessions
      - foundation_rate_limit_counters
      - foundation_user_extension
      - service_credits_wallets
      - member_blocks
    purpose: survivor_provider_communication
    retentionClass: communication_short_lived
    idempotency: false

  - pluginId: foundation
    command: foundation.connection.instant-call.answer
    version: 1.1.0
    description: Answer a ringing instant 1:1 call AND take the first per-block charge (issue #808 tasks 3 and 4). Only the callee may answer, and only while it is still ringing. Answering snapshots the provider's rate + block length onto the call (so a later rate change cannot affect this call) and charges the first block from the caller to the provider via the canonical peer-to-peer ServiceCredits transfer (direct, no escrow; idempotency key foundation-instant-call-<callId>-block-1, so an answer retry never double-charges). If the caller cannot afford the first block the call ends cleanly with no credits moved and the answer fails — the call is never opened.
    inputSchema:
      callId:
        type: string
        required: true
    outputSchema:
      callId:
        type: string
      ringStatus:
        type: string
      answeredAt:
        type: string
      blocksCharged:
        type: integer
      rateCreditsLocked:
        type: integer
      paidThroughAt:
        type: string
      lastTransferId:
        type: string
    dataAccess:
      - foundation_call_sessions
      - foundation_user_extension
      - service_credits_wallets
      - service_credits_transfers
      - service_credits_ledger_entries
      - service_credits_escrow_holds
      - service_credits_command_idempotency
      - service_credits_adapter_outbox
    purpose: survivor_provider_communication
    retentionClass: financial_record_long_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.connection.instant-call.extend
    version: 1.0.0
    description: Charge one more paid block on an in-progress instant 1:1 call (issue #808 task 4). Caller-only (only the buyer who started the call). The call must be active and still under the buyer-set block cap (blocks_charged < authorized_blocks; otherwise rejected as block_cap_reached). The next block is charged at the rate LOCKED on the call at answer (never the provider's live rate), via the canonical peer-to-peer ServiceCredits transfer (direct, no escrow; idempotency key foundation-instant-call-<callId>-block-<n>, so a retry never double-charges). On insufficient funds the call ends cleanly with no credits moved. Advances paid_through_at by one interval on success.
    inputSchema:
      callId:
        type: string
        required: true
    outputSchema:
      callId:
        type: string
      ringStatus:
        type: string
      blocksCharged:
        type: integer
      authorizedBlocks:
        type: integer
      paidThroughAt:
        type: string
      lastTransferId:
        type: string
    dataAccess:
      - foundation_call_sessions
      - service_credits_wallets
      - service_credits_transfers
      - service_credits_ledger_entries
      - service_credits_escrow_holds
      - service_credits_command_idempotency
      - service_credits_adapter_outbox
    purpose: survivor_provider_communication
    retentionClass: financial_record_long_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.connection.instant-call.decline
    version: 1.0.0
    description: Decline a ringing instant 1:1 call (issue #808 task 3). Only the callee may decline, and only while it is still ringing. Terminal — no call and no charge.
    inputSchema:
      callId:
        type: string
        required: true
    outputSchema:
      callId:
        type: string
      ringStatus:
        type: string
    dataAccess:
      - foundation_call_sessions
    purpose: survivor_provider_communication
    retentionClass: communication_short_lived
    idempotency: false

  - pluginId: foundation
    command: foundation.connection.instant-call.end
    version: 1.0.0
    description: End an instant 1:1 call (issue #808 task 3). Either participant may end it from any non-terminal state — the caller can cancel a still-ringing call, and either party can hang up an in-progress call. Idempotent on an already-ended call.
    inputSchema:
      callId:
        type: string
        required: true
    outputSchema:
      callId:
        type: string
      ringStatus:
        type: string
      endedAt:
        type: string
    dataAccess:
      - foundation_call_sessions
    purpose: survivor_provider_communication
    retentionClass: communication_short_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.connection.instant-call.state.read
    version: 1.0.0
    description: Read the current state of an instant 1:1 call the caller participates in (issue #808 task 3). Drives the caller and callee poll. When the call is answered, also returns the participant-only Stream audio-join credentials (the same token path the Direct Line uses — no parallel token path). Realizes the ~60s ring timeout lazily on read.
    inputSchema:
      callId:
        type: string
        required: true
    outputSchema:
      ringStatus:
        type: string
      role:
        type: string
      streamApiKey:
        type: string
      streamUserId:
        type: string
      streamToken:
        type: string
      streamChannelId:
        type: string
    dataAccess:
      - foundation_call_sessions
      - foundation_connection_threads
      - stream_video_call_metadata
    purpose: survivor_provider_communication
    retentionClass: communication_short_lived
    idempotency: false

  - pluginId: foundation
    command: foundation.connection.incoming-call.read
    version: 1.0.0
    description: Read the signed-in member's one live incoming instant 1:1 call ring, if any (issue #808 task 3). The in-app incoming-call surface polls this so a member being rung can answer or decline. v1 delivers the ring in-app only; out-of-app push is issue #808 task 5. Realizes the ~60s ring timeout lazily on read.
    inputSchema: {}
    outputSchema:
      callId:
        type: string
      ringStatus:
        type: string
      ringExpiresAt:
        type: string
    dataAccess:
      - foundation_call_sessions
    purpose: survivor_provider_communication
    retentionClass: communication_short_lived
    idempotency: false

  - pluginId: foundation
    command: foundation.quote.request.create
    version: 1.0.0
    description: Create a quote request in requested state for survivor-selected providers.
    inputSchema:
      threadId:
        type: string
        required: true
      serviceType:
        type: string
        required: true
      requestDetails:
        type: object
        required: true
      maxProviders:
        type: integer
        required: false
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      quoteRequestId:
        type: string
      lifecycleState:
        type: string
      sentProviderCount:
        type: integer
      createdAt:
        type: string
    dataAccess:
      - foundation_quote_requests
      - foundation_quote_request_provider_links
      - foundation_rate_limit_counters
    purpose: quote_lifecycle_management
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.quote.request.state.update
    version: 1.1.0
    description: >-
      Move quote request lifecycle between requested, provider_responded, and closed with policy and
      audit enforcement. On the provider_responded transition the provider attaches a one-off price
      (quotedAmount + quotedCurrency); on close, a quote that carries a value stamps settled_at and its
      settled value feeds GDP recognition per currency. Recurring engagements are out of scope (handled
      by the Recurring Activity plugin).
    inputSchema:
      quoteRequestId:
        type: string
        required: true
      transitionTo:
        type: string
        required: true
        enum:
          - requested
          - provider_responded
          - closed
      transitionReason:
        type: string
        required: false
      quotedAmount:
        type: number
        required: false
        description: >-
          Provider-only, and required only on the provider_responded transition. Must be a finite
          number >= 0. Ignored (not persisted) on any other transition. Only the quote's provider may
          set it; a survivor attempting to set a price is denied.
      quotedCurrency:
        type: string
        required: false
        description: >-
          Provider-only, and required only on the provider_responded transition. A non-empty currency
          code from the shared currency catalog. Ignored on any other transition.
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      quoteRequestId:
        type: string
      previousState:
        type: string
      currentState:
        type: string
      transitionedAt:
        type: string
    dataAccess:
      - foundation_quote_requests
      - foundation_quote_status_events
      - foundation_notification_jobs
    purpose: quote_lifecycle_management
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.quote.request.history.list
    version: 1.0.0
    description: List survivor and provider quote history with lifecycle transitions and response metadata.
    inputSchema:
      actorScope:
        type: string
        required: true
        enum:
          - survivor
          - provider
      statusFilter:
        type: array
        required: false
      cursor:
        type: string
        required: false
      pageSize:
        type: integer
        required: false
    outputSchema:
      items:
        type: array
      nextCursor:
        type: string
      summary:
        type: object
    dataAccess:
      - foundation_quote_requests
      - foundation_quote_status_events
      - foundation_provider_response_summaries
    purpose: quote_history_review
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.connection.history.list
    version: 1.0.0
    description: Retrieve survivor-provider 1:1 connection history for text, voice, and video sessions.
    inputSchema:
      includeMessages:
        type: boolean
        required: false
      includeCalls:
        type: boolean
        required: false
      cursor:
        type: string
        required: false
      pageSize:
        type: integer
        required: false
    outputSchema:
      threads:
        type: array
      callSummaries:
        type: array
      nextCursor:
        type: string
    dataAccess:
      - foundation_connection_threads
      - foundation_message_metadata
      - foundation_call_sessions
      - stream_chat_messages
      - stream_video_call_metadata
    purpose: survivor_support_continuity
    retentionClass: communication_medium_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.notification.preferences.update
    version: 1.0.0
    description: Update notification channels and quiet-hour preferences for Foundation alerts.
    inputSchema:
      inAppEnabled:
        type: boolean
        required: true
      pushEnabled:
        type: boolean
        required: true
      emailEnabled:
        type: boolean
        required: false
      quietHours:
        type: object
        required: false
    outputSchema:
      notificationPreferenceId:
        type: string
      updatedAt:
        type: string
      effectiveChannels:
        type: array
    dataAccess:
      - foundation_notification_preferences
      - foundation_user_extension
    purpose: notification_preference_management
    retentionClass: profile_long_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.notification.event.ack
    version: 1.0.0
    description: Mark in-app Foundation notifications as seen or acknowledged to reduce repeat alerting.
    inputSchema:
      notificationEventId:
        type: string
        required: true
      status:
        type: string
        required: true
        enum:
          - seen
          - acknowledged
      acknowledgedAt:
        type: string
        required: false
    outputSchema:
      notificationEventId:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    dataAccess:
      - foundation_notification_events
      - foundation_notification_delivery_log
    purpose: notification_delivery_management
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.safeguards.rate_limit.evaluate
    version: 1.0.0
    description: Evaluate command-specific rate limits and return throttle/degrade directives for resilient operation.
    inputSchema:
      actorId:
        type: string
        required: true
      commandName:
        type: string
        required: true
      scope:
        type: string
        required: true
      requestWeight:
        type: integer
        required: false
    outputSchema:
      decision:
        type: string
      nextAllowedAt:
        type: string
      activeThreshold:
        type: string
      degradeMode:
        type: string
    dataAccess:
      - foundation_rate_limit_counters
      - foundation_quota_threshold_states
      - stream_quota_usage_rollups
    purpose: reliability_protection
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.admin.capacity.policy.update
    version: 1.0.0
    description: Update Foundation operational capacity thresholds and graceful degradation rules for Stream Maker-tier usage.
    inputSchema:
      monthlyBudgets:
        type: object
        required: true
      thresholdBands:
        type: object
        required: true
      nonCriticalFeatureDegradePolicy:
        type: object
        required: true
      effectiveFrom:
        type: string
        required: true
    outputSchema:
      policyVersion:
        type: string
      status:
        type: string
      activatedAt:
        type: string
    dataAccess:
      - foundation_capacity_policies
      - foundation_capacity_policy_events
      - foundation_admin_audit_trail
    purpose: operational_governance
    retentionClass: audit_long_lived
    idempotency: false

  - pluginId: foundation
    command: foundation.provider.instant-call.get
    version: 1.0.0
    description: Read the signed-in member's own Foundation instant 1:1 call settings (whether they are reachable for an immediate paid call, the rate in ServiceCredits, and the per-block interval in minutes).
    inputSchema: {}
    outputSchema:
      enabled:
        type: boolean
      rateCredits:
        type: integer
      intervalMinutes:
        type: integer
    dataAccess:
      - foundation_user_extension
    purpose: provider_self_settings
    retentionClass: profile_long_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.provider.instant-call.set
    version: 1.0.0
    description: Save the signed-in member's own Foundation instant 1:1 call settings. When enabled, rateCredits must be a whole number of ServiceCredits of at least 1; intervalMinutes must be a whole number between 5 and 60.
    inputSchema:
      enabled:
        type: boolean
        required: true
      rateCredits:
        type: integer
        required: false
      intervalMinutes:
        type: integer
        required: true
    outputSchema:
      enabled:
        type: boolean
      rateCredits:
        type: integer
      intervalMinutes:
        type: integer
    dataAccess:
      - foundation_user_extension
    purpose: provider_self_settings
    retentionClass: profile_long_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.provider.description.get
    version: 1.0.0
    description: Read the signed-in member's own Foundation listing blurb (a short description, one or two sentences, shown on their provider card and profile before a member requests a quote).
    inputSchema: {}
    outputSchema:
      shortDescription:
        type: string
        nullable: true
      maxLength:
        type: integer
    dataAccess:
      - foundation_user_extension
    purpose: provider_self_settings
    retentionClass: profile_long_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.provider.description.update
    version: 1.0.0
    description: Save the signed-in member's own Foundation listing blurb. A blank string clears it. The value is trimmed and must be at most 200 characters, otherwise the command is rejected.
    inputSchema:
      shortDescription:
        type: string
        required: true
    outputSchema:
      shortDescription:
        type: string
        nullable: true
      maxLength:
        type: integer
    dataAccess:
      - foundation_user_extension
    purpose: provider_self_settings
    retentionClass: profile_long_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.push.subscribe
    version: 1.1.0
    description: Save the signed-in member's push subscription for one device. A provider who enabled instant calls turns on "call alerts on this device" so the instant-call ring can wake that device with the app closed. Two kinds share this command, branched on the body's kind field — kind 'web' (default, issue #808 task 5) stores the browser's Web Push subscription (endpoint + the p256dh/auth encryption keys); kind 'expo' (issue #884) stores the Android app's Expo push token (the token is the identity, stored as the endpoint; no encryption keys). Both store into the user-global push_subscriptions table on (user_id, endpoint). The member acts only on their own subscription; the endpoint/token and any keys are stored but never logged.
    inputSchema:
      kind:
        type: string
        required: false
        description: "'web' (default) or 'expo'. Selects which subscription shape the body carries."
      endpoint:
        type: string
        required: false
        description: Web Push only — required when kind is 'web' (omitted for 'expo').
      keys:
        type: object
        required: false
        description: Web Push only — required when kind is 'web' (the p256dh/auth encryption keys).
      token:
        type: string
        required: false
        description: Expo only — required when kind is 'expo' (the device's Expo push token).
      userAgent:
        type: string
        required: false
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - push_subscriptions
    purpose: instant_call_ring_delivery
    retentionClass: profile_long_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.push.unsubscribe
    version: 1.0.0
    description: Remove the signed-in member's push subscription for one device (issue #808 task 5; issue #884 for Expo) — they turned call alerts off on that device, or the browser/app revoked it. Identified by its endpoint (the Web Push endpoint URL, or the Expo push token for an Android device); the member acts only on their own subscription. Kind-agnostic — the same endpoint match removes a web or expo row.
    inputSchema:
      endpoint:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - push_subscriptions
    purpose: instant_call_ring_delivery
    retentionClass: profile_long_lived
    idempotency: true

  - pluginId: foundation
    command: foundation.push.vapid-public-key.read
    version: 1.0.0
    description: Return the public VAPID key the browser needs to create a Web Push subscription (issue #808 task 5). The public key is not secret and is safe to expose; when push is not configured (the owner has not set the VAPID env vars) this returns enabled false with an empty key so the client shows a clear "alerts unavailable" state. Read-only.
    inputSchema: {}
    outputSchema:
      enabled:
        type: boolean
      publicKey:
        type: string
    dataAccess: []
    purpose: instant_call_ring_delivery
    retentionClass: not_applicable
    idempotency: true

changelog:
  - date: 2026-02-24
    change: Initial Foundation v1 command contracts added for provider search, 1:1 text/voice/video, quote lifecycle, history, notifications, rate limiting, and capacity governance.
  - date: 2026-06-24
    change: Added provider instant 1:1 call settings commands (foundation.provider.instant-call.get / .set, issue #808) — the provider opt-in toggle, rate in ServiceCredits, and per-block interval. Settings only; no call or billing logic.
  - date: 2026-06-24
    change: foundation.search.providers now also returns each provider's read-only instant-call availability (instantCallEnabled, instantCallRateCredits, instantCallIntervalMinutes) read from foundation_user_extension, plus viewerUserId so the client can hide "Connect now" on the viewer's own card (Foundation "Connect now" button, issue #808). Read-only; the call lifecycle and billing are later tasks of #808.
  - date: 2026-06-25
    change: Added the instant 1:1 call ring/answer lifecycle commands (issue #808 task 3, audio-only v1) — foundation.connection.instant-call.ring / .answer / .decline / .end, plus foundation.connection.instant-call.state.read and foundation.connection.incoming-call.read. Reuses the Direct Line thread and the participant-only Stream token path. Ring is in-app only (push is task 5); no credits move (billing is task 4, hooked at the answer seam). Ring is rate limited per member.
  - date: 2026-06-25
    change: Added per-block billing (issue #808 task 4) to the instant 1:1 call. ring is now v1.1.0 — it takes an optional authorizedBlocks (buyer-set per-session block cap, default 6, never exceeded in v1), pre-checks the caller can afford the first block, and reads foundation_user_extension + service_credits_wallets (still moves no credits). answer is now v1.1.0 — it snapshots the provider's rate + interval onto the call and charges the first block via the canonical peer-to-peer ServiceCredits transfer (direct, no escrow), so its dataAccess now includes the service_credits_* tables and it is idempotent on the deterministic per-block key. Added foundation.connection.instant-call.extend (caller-only) to charge each subsequent block at the LOCKED rate under the authorized cap. Disputes/refunds and mid-session cap re-authorization are deferred follow-ups.
  - date: 2026-06-25
    change: Added Web Push delivery for the instant-call ring (issue #808 task 5) — foundation.push.subscribe / .unsubscribe / .vapid-public-key.read. A provider enables "call alerts on this device"; the device's Web Push subscription is stored in the user-global push_subscriptions table, and the ring sends a push so the device wakes with the app closed. The in-app incoming-call poll remains the fallback; push only augments it. The ring also writes a foundation_notification_events row of kind instant_call.ring for the in-app inbox. Server keys (VAPID_PUBLIC_KEY / VAPID_PRIVATE_KEY / VAPID_SUBJECT) are read from env and the send is a graceful no-op when unset. Android/Expo native push is deferred to the #808 Android parity ticket.
  - date: 2026-06-26
    change: Added Expo (Android native) push delivery for the instant-call ring (issue #884). foundation.push.subscribe is now v1.1.0 — it takes an optional kind field; kind 'expo' stores the Android app's Expo push token in the same push_subscriptions table (kind 'expo'; token as endpoint, no encryption keys). foundation.push.unsubscribe is kind-agnostic (matches by endpoint, so the same call removes a web or expo row). The ring now also sends an Expo push alongside the Web Push, best-effort and isolated so neither push can affect the ring. The optional EXPO_ACCESS_TOKEN secret is read from env for the send and the send is a graceful no-op-shaped degrade when unset (it still sends for projects without enhanced push security); never logged. A 'DeviceNotRegistered' Expo receipt prunes the dead token. Expo native push needs an EAS native build (expo-notifications cannot run in Expo Go).
  - date: 2026-07-11
    change: foundation.search.providers (and the by-id provider read) now also return each provider's location — city, state, country — read from their claimed directory profile (the shared member profile). Read-only; the fields come from the existing directory_provider_profiles_read_model already in dataAccess. No new table or write path.
  - date: 2026-07-25
    change: Added the provider listing blurb (short description) commands — foundation.provider.description.get / .update — reading and writing foundation_user_extension.short_description (nullable TEXT, capped 200 chars in the app; blank clears it). foundation.search.providers and foundation.provider.get now also return the provider's shortDescription read-only from foundation_user_extension. The blurb shows on the provider card and profile before a member requests a quote; separate from the Directory headline/bio and the offered-skill chips.
