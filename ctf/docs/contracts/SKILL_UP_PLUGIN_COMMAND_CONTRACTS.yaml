contracts:
  - pluginId: skill-up
    command: cohort.create
    version: 1.0.0
    description: Create a SkillUp training cohort with curriculum, milestones, and policy controls.
    inputSchema:
      idempotencyKey:
        type: string
        required: true
      title:
        type: string
        required: true
      track:
        type: string
        required: true
      seats:
        type: number
        required: true
      requiredCredits:
        type: number
        required: true
      milestones:
        type: array
        required: false
    outputSchema:
      cohortId:
        type: string
    dataAccess:
      - skill_up_cohorts
      - skill_up_curriculum_items
      - skill_up_milestones
      - skill_up_command_idempotency
    purpose: training_cohort_management
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: skill-up
    command: cohort.list
    version: 1.0.0
    description: List cohorts with status, track, and date filters.
    inputSchema:
      track:
        type: string
        required: false
      status:
        type: string
        required: false
      startDate:
        type: string
        required: false
    outputSchema:
      cohorts:
        type: array
    dataAccess:
      - skill_up_cohorts
      - skill_up_enrollments
    purpose: training_marketplace_discovery
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: skill-up
    command: enrollment.create
    version: 1.0.0
    description: Enroll learner in cohort with optional escrow deposit.
    inputSchema:
      cohortId:
        type: string
        required: true
      depositCredits:
        type: number
        required: false
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      enrollmentId:
        type: string
      creditsDeposited:
        type: number
    dataAccess:
      - skill_up_enrollments
      - skill_up_enrollment_milestone_escrows
      - service_credits_wallets
      - service_credits_escrow_holds
    purpose: training_enrollment
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: skill-up
    command: enrollment.list
    version: 1.0.0
    description: >-
      List the calling member's own cohort enrollments with a per-enrollment milestone tally.
      Read-only and always scoped to the caller — it takes no user id and can return no one else's
      enrollments.
    inputSchema: {}
    outputSchema:
      enrollments:
        type: array
    dataAccess:
      - skill_up_enrollments
      - skill_up_cohorts
      - skill_up_trainers
      - skill_up_enrollment_milestone_escrows
      - skill_up_milestone_validations
    purpose: training_enrollment_self_view
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: skill-up
    command: milestone.validate
    version: 1.0.0
    description: Record trainer/admin validation for milestone completion.
    inputSchema:
      enrollmentId:
        type: string
        required: true
      milestoneId:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      validationId:
        type: string
      status:
        type: string
    dataAccess:
      - skill_up_milestone_validations
      - skill_up_enrollments
      - skill_up_rate_limit_counters
    purpose: milestone_assurance
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: skill-up
    command: milestone.release
    version: 1.0.0
    description: Release learner escrow to spendable credits and issue trainer split/completion bonus.
    inputSchema:
      enrollmentId:
        type: string
        required: true
      milestoneId:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      userTransferId:
        type: string
      trainerPayoutGovernanceId:
        type: string
      completionBonusGovernanceId:
        type: string
    dataAccess:
      - skill_up_enrollment_milestone_escrows
      - skill_up_milestone_validations
      - service_credits_escrow_holds
      - service_credits_governance_events
    purpose: milestone_settlement
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: skill-up
    command: transfer.create
    version: 1.0.0
    description: Execute peer credit transfer inside SkillUp context.
    inputSchema:
      recipientUserId:
        type: string
        required: true
      amount:
        type: number
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      transferId:
        type: string
      status:
        type: string
    dataAccess:
      - service_credits_transfers
      - service_credits_wallets
    purpose: participant_value_transfer
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: skill-up
    command: dispute.open
    version: 1.0.0
    description: Open milestone/enrollment dispute with comments and attachments.
    inputSchema:
      enrollmentId:
        type: string
        required: true
      milestoneId:
        type: string
        required: false
      title:
        type: string
        required: true
      description:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      disputeId:
        type: string
    dataAccess:
      - skill_up_disputes
      - skill_up_dispute_comments
      - skill_up_milestone_validations
    purpose: dispute_intake
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: skill-up
    command: dispute.resolve
    version: 1.0.0
    description: Resolve dispute with optional credit adjustment transfer.
    inputSchema:
      disputeId:
        type: string
        required: true
      resolutionComment:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      disputeId:
        type: string
      status:
        type: string
      transferId:
        type: string
    dataAccess:
      - skill_up_disputes
      - skill_up_dispute_comments
      - service_credits_dispute_adjustments
    purpose: dispute_resolution
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: skill-up
    command: admin.adjust_credits
    version: 1.0.0
    description: Admin governance adjustment to learner or trainer balances.
    inputSchema:
      targetUserId:
        type: string
        required: true
      amount:
        type: number
        required: true
      reason:
        type: string
        required: true
      governanceTicketId:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      governanceEventId:
        type: string
      adjustmentId:
        type: string
    dataAccess:
      - service_credits_governance_events
      - service_credits_dispute_adjustments
      - service_credits_wallets
    purpose: governance_credit_control
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: skill-up
    command: trainer.list
    version: 1.0.0
    description: List the SkillUp trainer directory (read-only browse), optionally filtered by track.
    inputSchema:
      track:
        type: string
        required: false
    outputSchema:
      trainers:
        type: array
    dataAccess:
      - skill_up_trainers
      - skill_up_cohorts
    purpose: training_marketplace_discovery
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: skill-up
    command: achievement.list
    version: 1.0.0
    description: List grant-only achievement badges with the signed-in user's earned status. Never spends or deducts credits.
    inputSchema: {}
    outputSchema:
      achievements:
        type: array
    dataAccess:
      - skill_up_achievements
      - skill_up_user_achievements
    purpose: learner_progress_display
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: skill-up
    command: wallet.view
    version: 1.0.0
    description: Read the signed-in user's ServiceCredits balance plus a read-only history of credits earned/granted through SkillUp. Grant-only — exposes no spend or transfer action.
    inputSchema: {}
    outputSchema:
      wallet:
        type: object
    dataAccess:
      - service_credits_wallets
      - skill_up_milestone_validations
      - skill_up_enrollment_milestone_escrows
      - skill_up_disbursements
      - skill_up_user_achievements
      - skill_up_achievements
      - skill_up_enrollments
      - skill_up_cohorts
    purpose: learner_balance_display
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: skill-up
    command: cohort.auto_create
    version: 1.0.0
    description: Read the Workforce occupation training gaps and refresh the ranked, sector-diverse cohort proposal queue (does NOT create cohorts — an admin approves a proposal to open one). Also closes any expired auto cohort. Cron-triggered (CRON_SECRET, cadence-gated) or admin-triggered (force). Reads the Workforce/Skills Taxonomy gap signal only; never writes Workforce, Directory, or Skills Taxonomy.
    inputSchema:
      source:
        type: string
        required: false
      force:
        type: boolean
        required: false
    outputSchema:
      generated:
        type: number
      superseded:
        type: number
      closed:
        type: array
    dataAccess:
      - skill_up_auto_cohort_config
      - skill_up_auto_cohort_term_overrides
      - skill_up_cohort_proposals
      - skill_up_cohorts
      - skill_up_audit_events
      - skills_taxonomy_sectors
      - skills_taxonomy_job_titles
      - skills_taxonomy_skills
      - directory_profiles
      - directory_profile_skills
      - workforce_config
    purpose: training_cohort_management
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: skill-up
    command: cohort.claim_trainer
    version: 1.0.0
    description: A trainer (or admin) claims an auto-created cohort that has no human trainer yet, becoming its trainer of record.
    inputSchema:
      cohortId:
        type: string
        required: true
    outputSchema:
      cohortId:
        type: string
    dataAccess:
      - skill_up_cohorts
      - skill_up_enrollments
      - skill_up_audit_events
    purpose: training_cohort_management
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: skill-up
    command: cohort.proposal_approve
    version: 1.0.0
    description: Admin approves a pending cohort proposal, opening a real cohort with the chosen term (1, 3, or 5 months). Guarded so a proposal cannot be double-approved; if the occupation already has an open auto cohort the proposal is superseded and no cohort is opened.
    inputSchema:
      proposalId:
        type: string
        required: true
      termMonths:
        type: number
        required: true
    outputSchema:
      status:
        type: string
      cohortId:
        type: string
    dataAccess:
      - skill_up_cohort_proposals
      - skill_up_auto_cohort_config
      - skill_up_cohorts
      - skill_up_curriculum_items
      - skill_up_milestones
      - skill_up_command_idempotency
      - skill_up_audit_events
    purpose: training_cohort_management
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: skill-up
    command: cohort.proposal_dismiss
    version: 1.0.0
    description: Admin dismisses a pending cohort proposal so it no longer appears in the queue. No cohort is created.
    inputSchema:
      proposalId:
        type: string
        required: true
    outputSchema:
      status:
        type: string
    dataAccess:
      - skill_up_cohort_proposals
      - skill_up_audit_events
    purpose: training_cohort_management
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: skill-up
    command: enrollment.leave
    version: 1.0.0
    description: A member leaves their own cohort enrollment. Every credit still held in escrow for that enrollment is refunded to them; milestones already validated keep their releases. Scoped to the caller's own enrollment - it takes no user id from the request. Idempotent on the supplied key so a repeated request cannot refund twice.
    inputSchema:
      enrollmentId:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      enrollmentId:
        type: string
      refundedCredits:
        type: number
    dataAccess:
      - skill_up_enrollments
      - skill_up_enrollment_milestone_escrows
      - skill_up_audit_events
      - service_credits_escrow_holds
      - service_credits_wallets
      - service_credits_transfers
    purpose: training_cohort_management
    retentionClass: transactional_long_lived
    idempotency: true
