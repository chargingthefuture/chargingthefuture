# Owner directive, 2026-08-28: every admin action is recorded, on every surface. Until that date these
# events were written by logComicAudit, which builds the whole shape below and ends in console.info —
# a line in the server's log, which nothing can query, no screen can show, and which ages out of the
# host's retention window. Every admin decision event here is now also a durable row in
# comic_admin_audit_trail, written by recordComicAdminAudit on every outcome including a refusal. The
# member-facing events keep the log line alone: a row per message would be volume, not accountability.
auditEvents:
  # ─── @comic message routing ────────────────────────────────────────────
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: comic
    command: comic.message.route
    commandVersion: 1.0.0
    purpose: assistant_message_routing
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        roleCheck: pass_or_fail
        mentionGateCheck: pass_or_fail
        rateLimitCheck: pass_or_fail
        contentModerationCheck: pass_or_fail
        safetyEvaluationCheck: pass_or_fail
    dataClassesAccessed:
      - comic_conversation_metadata
      - comic_turn_metadata
      - comic_review_queue_metadata
    targetContext:
      workspaceId: workspace_identifier
      conversationId: conversation_identifier
      turnId: turn_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: comic
    command: comic.reply.generate
    commandVersion: 1.0.0
    purpose: assistant_reply_generation
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        llmGateCheck: pass_or_fail
        humanReviewGateCheck: pass_or_fail
    dataClassesAccessed:
      - comic_turn_metadata
      - comic_inference_metadata
      - comic_review_queue_metadata
    targetContext:
      workspaceId: workspace_identifier
      conversationId: conversation_identifier
      draftTurnId: turn_identifier
      modelId: model_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: comic
    command: comic.conversation.read
    commandVersion: 1.0.0
    purpose: assistant_asker_stream
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        roleCheck: pass_or_fail
        ownConversationsCheck: pass_or_fail
        unreviewedDraftSuppressionCheck: pass_or_fail
    dataClassesAccessed:
      - comic_conversation_metadata
      - comic_turn_metadata
      - comic_review_queue_metadata
      - comic_answer_rating_metadata
    targetContext:
      workspaceId: workspace_identifier
      askerUserId: principal
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: comic
    command: comic.answer.rate
    commandVersion: 1.0.0
    purpose: assistant_answer_rating
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        roleCheck: pass_or_fail
        csrfCheck: pass_or_fail
        ratableAnswerCheck: pass_or_fail
    dataClassesAccessed:
      - comic_turn_metadata
      - comic_review_queue_metadata
      - comic_answer_rating_metadata
    targetContext:
      workspaceId: workspace_identifier
      turnId: turn_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  # ─── Owner review / training ───────────────────────────────────────────
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: comic
    command: comic.review.list
    commandVersion: 1.0.0
    purpose: admin_review_queue
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        roleCheck: pass_or_fail
    dataClassesAccessed:
      - comic_review_queue_metadata
      - comic_turn_metadata
      - comic_conversation_metadata
    targetContext:
      workspaceId: workspace_identifier
      page: page_number
      pageSize: page_size
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: comic
    command: comic.review.resolve
    commandVersion: 1.0.0
    purpose: assistant_human_review
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        roleCheck: pass_or_fail
        csrfCheck: pass_or_fail
        reviewStateCheck: pass_or_fail
    dataClassesAccessed:
      - comic_review_queue_metadata
      - comic_turn_metadata
      - comic_training_example_metadata
    targetContext:
      workspaceId: workspace_identifier
      reviewId: review_identifier
      turnId: turn_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: comic
    command: comic.training.export
    commandVersion: 1.2.0
    purpose: assistant_training_export
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        roleCheck: pass_or_fail
    dataClassesAccessed:
      - comic_training_example_metadata
      # The export now also includes the de-identified rated-answer signal (question/answer text +
      # rating value + timestamps, no user id or other PII).
      - comic_answer_rating_metadata
    targetContext:
      workspaceId: workspace_identifier
      exportFormat: export_format
      # How many training examples this run moved from awaiting export to exported (0 in preview).
      markedExported: count_of_rows_marked
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: comic
    command: comic.training.stats
    commandVersion: 1.0.0
    purpose: assistant_training_stats
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        roleCheck: pass_or_fail
    dataClassesAccessed:
      # Aggregate counts only — no question, answer, rating, or user data is returned.
      - comic_training_example_metadata
      - comic_answer_rating_metadata
    targetContext:
      workspaceId: workspace_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  # Records the CONSENT, never the contributed content: which wording the member agreed to, when,
  # how many public pieces survived intake, and which private sections were discarded. The content
  # itself lives in comic_contributions and is never copied into an audit line.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: comic
    command: comic.contribution.submit
    commandVersion: 1.0.0
    purpose: assistant_knowledge_contribution
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        consentVersion: consent_wording_version
        everyClauseAgreed: pass_or_fail
    dataClassesAccessed:
      - comic_contribution_metadata
    targetContext:
      contributionId: contribution_identifier
      entryCount: integer
      discardedSections: discarded_section_names
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: comic
    command: comic.contribution.withdraw
    commandVersion: 1.0.0
    purpose: assistant_knowledge_contribution
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        ownerCheck: pass_or_fail
    dataClassesAccessed:
      - comic_contribution_metadata
    targetContext:
      contributionId: contribution_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  # Written on every review decision. Records counts and the grant outcome, never the contributed
  # writing itself.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: comic
    command: comic.contribution.review
    commandVersion: 1.0.0
    purpose: assistant_knowledge_contribution
    policyDecision:
      status: allow_or_deny
      reason: accepted_or_declined
      evidence:
        roleCheck: pass_or_fail
    dataClassesAccessed:
      - comic_contribution_metadata
      - comic_knowledge_entry_metadata
    targetContext:
      contributionId: contribution_identifier
      promoted: integer
      alreadyPresent: integer
      excluded: integer
      # granted | already_granted | skipped_not_unlocked | failed
      grant: grant_outcome
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  # An admin reading the trail from the Audit log panel on /admin/comic/knowledge.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: comic
    command: comic.admin.audit.list
    commandVersion: 1.0.0
    purpose: governance_transparency
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - comic_admin_audit_trail
    targetContext:
      targetType: audit_trail
      targetId: row_count_requested
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  # Admin regenerates a draft answer. Added 2026-08-28 — the route had shipped with no audit event
  # template behind it.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: comic
    command: comic.review.regenerate
    commandVersion: 1.0.0
    purpose: assistant_supervision
    policyDecision:
      status: allow_or_deny
      reason: draft_attached_or_engine_unavailable
    dataClassesAccessed:
      - comic_review_queue
      - comic_turns
      - comic_admin_audit_trail
    targetContext:
      targetType: comic_review_queue
      targetId: review_identifier
    metadata:
      attached: boolean_did_a_draft_come_back
      failureReason: none_or_engine_reason
    result:
      status: success_or_failure
      errorCategory: none_or_error_class
