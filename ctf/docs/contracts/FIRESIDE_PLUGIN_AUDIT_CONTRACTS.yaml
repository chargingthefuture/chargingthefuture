# Fireside audit events. Every write is recorded in fireside_audit_events. The public thread read is
# not recorded, because it has no actor: it answers callers with no account at all.
auditEvents:
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: fireside
    command: comment.create
    commandVersion: 1.0.0
    purpose: blog_conversation
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    result: published_or_held_for_approval
    dataClassesAccessed:
      - comment_body
      - post_reference
    targetContext:
      commentId: comment_identifier
      postRepo: blog_repo
      postSlug: blog_slug
    requestId: request_identifier
    traceId: trace_identifier
    notes: The result says whether it went public at once or is waiting on the author's approval.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: fireside
    command: comment.withdraw
    commandVersion: 1.0.0
    purpose: author_removal
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    result: withdrawn
    dataClassesAccessed:
      - comment_body
    targetContext:
      commentId: comment_identifier
    requestId: request_identifier
    traceId: trace_identifier
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: fireside
    command: comment.set_export
    commandVersion: 1.0.0
    purpose: publication_consent
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    result: export_on_or_export_off
    dataClassesAccessed:
      - publication_preference
    targetContext:
      commentId: comment_identifier
    requestId: request_identifier
    traceId: trace_identifier
    notes: >-
      Recorded because it is the decision that lets a comment leave the app for somewhere it cannot
      be recalled from. Who chose it and when is worth being able to show.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: fireside
    command: reaction.toggle
    commandVersion: 1.0.0
    purpose: blog_conversation
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    result: added_or_removed
    dataClassesAccessed:
      - reaction_kind
    targetContext:
      commentId: comment_identifier
    requestId: request_identifier
    traceId: trace_identifier
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: fireside
    command: comment.remove
    commandVersion: 1.0.0
    purpose: moderation
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    result: removed_or_restored
    dataClassesAccessed:
      - comment_body
      - moderation_reason
    targetContext:
      commentId: comment_identifier
    requestId: request_identifier
    traceId: trace_identifier
    notes: Admin only. Separate from approval, so approving a person never resurrects a removed comment.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: fireside
    command: export.approve
    commandVersion: 1.0.0
    purpose: moderation
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    result: export_approved_or_export_refused
    dataClassesAccessed:
      - comment_body
      - moderation_reason
    targetContext:
      commentId: comment_identifier
    requestId: request_identifier
    traceId: trace_identifier
    notes: >-
      Admin only, and the second of two keys on copying a comment out to the blog's published build.
      Recorded separately from comment.remove because refusing an export is not the same judgment as
      taking a comment down, and a run of refusals against one account is its own signal.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: fireside
    command: export.refuse
    commandVersion: 1.0.0
    purpose: moderation
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    result: export_refused
    dataClassesAccessed:
      - comment_body
      - moderation_reason
    targetContext:
      commentId: comment_identifier
    requestId: request_identifier
    traceId: trace_identifier
    notes: Final for that comment. The author cannot re-queue it by switching their own request back on.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: fireside
    command: thread.close
    commandVersion: 1.0.0
    purpose: moderation
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    result: closed
    dataClassesAccessed:
      - post_reference
      - moderation_reason
    targetContext:
      threadId: thread_identifier
    requestId: request_identifier
    traceId: trace_identifier
    notes: >-
      Admin only. Recorded apart from comment.remove because it touches no comment: everything
      already written stays where it is and stays readable, and only new comments are refused.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: fireside
    command: thread.reopen
    commandVersion: 1.0.0
    purpose: moderation
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    result: reopened
    dataClassesAccessed:
      - post_reference
      - moderation_reason
    targetContext:
      threadId: thread_identifier
    requestId: request_identifier
    traceId: trace_identifier
    notes: The other direction of the same decision, recorded so a close and its undo both show who and when.
