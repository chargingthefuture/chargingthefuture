  # ServiceCredits reward minted to a scout on an accepted nomination. Triggered
  # by skills-hunt.submission.review (accept) and recorded in the ServiceCredits
  # admin audit trail; mirrors the Unlock approval reward audit.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: skills-hunt
    command: service-credits.governance.mint.grant.skills-hunt
    commandVersion: 1.0.0
    purpose: contribution_reward
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - skills_hunt_submissions
      - service_credits_governance_events
      - service_credits_admin_audit_trail
    # Recorded via insertServiceCreditsAudit into service_credits_admin_audit_trail,
    # so the shape is targetType/targetId + a metadata object (not the targetContext
    # block the skills-hunt audit log uses). targetId is the governance event id.
    targetType: governance_event
    targetId: governance_event_identifier
    # Two mint reasons share this command: 'skills_hunt_accept_reward' (the round's per-accept
    # reward, keyed by skillsHuntSubmissionId + roundId) and 'skills_hunt_mission_bonus' (a
    # completed mission's bonus, keyed by skillsHuntMissionId). Each carries the key for its own
    # source; both carry targetUserId, amount, and idempotencyKey.
    metadata:
      skillsHuntSubmissionId: submission_identifier
      skillsHuntMissionId: mission_identifier
      roundId: round_identifier
      targetUserId: scout_identifier
      amount: credit_amount
      idempotencyKey: idempotency_key
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

