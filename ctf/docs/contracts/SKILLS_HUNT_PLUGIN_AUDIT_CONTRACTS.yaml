changelog:
  - date: 2026-02-24
    change: Initial SkillsHunt audit contract set added with allow/deny policy evidence coverage for all v1 commands.
  - date: 2026-05-12
    change: Added audit event templates for skills-hunt.submission.report and skills-hunt.profile.delete.
  - date: 2026-06-20
    change: Bumped commandVersion to 1.1.0 for skills-hunt.round.create, skills-hunt.round.update, and skills-hunt.submission.review (ServiceCredits reward additions), and added the service-credits.governance.mint.grant.skills-hunt audit event for accept-reward minting.
  - date: 2026-08-27
    change: Added audit event templates for the mission commands (create/update/archive) and the auto-mission commands (auto_generate, auto_config_update).
  - date: 2026-08-27
    change: >-
      Removed skills-hunt.submission.report — community moderation reports are gone. A member
      could never file one (the route had no button anywhere in the app), resolving a report as
      'removed' only flipped a status column without deleting or blocking anything, and its first
      reason 'no_permission' described every community-generated profile by definition rather than
      singling one out. Directory owns this instead — an admin takes a community-generated profile
      down from the Directory admin screen, which deletes it and blocks its Quora URL from being
      listed again until the block is lifted.
  - date: 2026-08-27
    change: >-
      Removed skills-hunt.directory-profile.generate — regenerating a Directory profile is out of
      scope for SkillsHunt. Nothing in the app called it, and Directory owns the profile lifecycle
      end to end, including creating or repairing one from its own admin screen. SkillsHunt still
      creates the profile automatically on accept; that path is unchanged.
  - date: 2026-08-28
    change: >-
      Added skills-hunt.submission.restore, the inverse of skills-hunt.submission.remove. Without
      it a removed submission was a dead end — the row stayed in the admin list marked Removed with
      no action available on it. Restore clears the soft-delete and leaves the status untouched, so
      a row that was flagged comes back flagged and can then be un-flagged. It is refused when the
      person has been nominated again in the meantime, since two live nominations for one person is
      what the live-signature index exists to prevent.
  - date: 2026-08-28
    change: >-
      Added audit event templates for skills-hunt.audit.list and
      skills-hunt.notification.round_ending_soon, and recorded the review event's metadata shape.
      A review row now carries the status the submission moved from, the status it moved to, and
      whether the action also brought a removed row back, instead of only the action name. The
      auto-mission run, the auto-mission settings change and the mission create/update/archive
      events now write a durable row in skills_hunt_audit_log as well as an observability log line,
      so the readable trail is the whole set of admin mutations rather than a subset.
