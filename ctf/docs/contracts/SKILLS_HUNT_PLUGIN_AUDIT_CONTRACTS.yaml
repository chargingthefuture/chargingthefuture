changelog:
  - date: 2026-02-24
    change: Initial SkillsHunt audit contract set added with allow/deny policy evidence coverage for all v1 commands.
  - date: 2026-05-12
    change: Added audit event templates for skills-hunt.submission.report and skills-hunt.profile.delete.
  - date: 2026-06-20
    change: Bumped commandVersion to 1.1.0 for skills-hunt.round.create, skills-hunt.round.update, and skills-hunt.submission.review (ServiceCredits reward additions), and added the service-credits.governance.mint.grant.skills-hunt audit event for accept-reward minting.
  - date: 2026-08-27
    change: Added audit event templates for the mission commands (create/update/archive) and the auto-mission commands (auto_generate, auto_config_update).
  - date: 2026-08-27
    change: Added the skills-hunt.mission.bonus_grant audit event (mission completion bonus minted as ServiceCredits) and recorded the second mint reason on the service-credits.governance.mint.grant.skills-hunt template.
