# People is a read that writes nothing and changes nothing. This entry records the shape of the read.
auditEvents:
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: people
    command: people.list
    commandVersion: 1.0.0
    purpose: member_directory_browse
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - directory_profiles
      - foundation_provider_skills
    targetContext:
      workspaceId: workspace_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class
