auditEvents:
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: chyme
    command: chyme.room.state.fetch
    commandVersion: 1.0.0
    purpose: social_audio_presence
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
      evidence:
        authenticationCheck: pass_or_fail
        approvalGateCheck: pass_or_fail
        tenancyCheck: pass_or_fail
    dataClassesAccessed:
      - chyme_room_metadata
      - service_profile_lifecycle_metadata
      - participant_roster_metadata
    targetContext:
      workspaceId: workspace_identifier
      roomId: room_identifier
      roomKey: room_key
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: chyme
    command: chyme.transfer
    commandVersion: 1.0.0
    purpose: social_audio_tip
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code (approved_user_or_admin, invalid_tip_payload, account_restricted)
      evidence:
        authenticationCheck: pass_or_fail
        approvalGateCheck: pass_or_fail
        tipBoundsCheck: pass_or_fail
    dataClassesAccessed:
      - service_credits_transfer_metadata
    targetContext:
      toUserId: recipient_identifier
      amount: credits_amount
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class (validation, policy, transfer_error)

