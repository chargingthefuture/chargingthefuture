    command: feed.community.moderation.list
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      tenancy: same_workspace
      adminOnly: required
    consentRequirements:
      scopes:
        - feed_consumption
      fallbackLawfulBasis: legitimate_interest_safety_support
