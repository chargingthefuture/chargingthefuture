  # Added 2026-08-28. feed.question.category.relabel had shipped with no access policy; the audit
  # read command is new with the durable trail.
  - pluginId: feed
    command: feed.question.category.relabel
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      tenancy: same_workspace
