contracts:
  - pluginId: unlock
    command: unlock.verification.submit
    version: 1.1.0
    description: >-
      Submit or update Quora profile URL for staged unlock verification. A submitted URL that is on the
      spam denylist is auto-marked spam and app-blocked instead of entering the pending queue.
    inputSchema:
      quoraProfileUrl:
        type: string
        required: true
    outputSchema:
      submissionId:
        type: integer
      reviewStatus:
        type: string
      accessTier:
        type: string
      unlockWindowExpiresAt:
        type: string
    dataAccess:
      - unlock_verification_submissions
      - unlock_audit_log
      - unlock_spam_quora_urls
      - account_restrictions
      - account_restrictions_audit
    purpose: identity_signal_submission
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: unlock
    command: unlock.admin.submission.list
    version: 1.0.0
    description: List unlock verification submissions for admin moderation queues.
    inputSchema:
      reviewStatus:
        type: string
        required: false
      accessTier:
        type: string
        required: false
      limit:
        type: integer
        required: false
    outputSchema:
      items:
        type: array
    dataAccess:
      - unlock_verification_submissions
    purpose: moderation_queue
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: unlock
    command: unlock.admin.experiment.read
    version: 1.0.0
    description: Read the early-Commons A/B experiment split (per-bucket Quora-URL completion rate) for the admin readout.
    inputSchema: {}
    outputSchema:
      experimentSplit:
        type: array
    dataAccess:
      - unlock_audit_log
    purpose: experiment_measurement
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: unlock
    command: unlock.admin.submission.review
    version: 1.1.0
    description: >-
      Apply admin moderation decision and unlock access tier transition. A spam decision also places
      a platform-wide ('all'-scope) account restriction so the member loses Commons/app access; an
      approved or rejected decision lifts a restriction previously placed by a spam decision.
    inputSchema:
      submissionId:
        type: integer
        required: true
      reviewStatus:
        type: string
        required: true
      reviewNote:
        type: string
        required: false
    outputSchema:
      submissionId:
        type: integer
      reviewStatus:
        type: string
      accessTier:
        type: string
      reviewedAt:
        type: string
    dataAccess:
      - unlock_verification_submissions
      - unlock_audit_log
      - account_restrictions
      - account_restrictions_audit
      - unlock_spam_quora_urls
    purpose: moderation_and_unlock_transition
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: unlock
    command: unlock.admin.spam_denylist.remove
    version: 1.0.0
    description: >-
      Remove a normalized Quora URL from the spam denylist. Stops future submissions of that URL from
      being auto-blocked; does not lift the restriction on a member already blocked for it (that is
      reversed by re-reviewing their submission to approved/rejected).
    inputSchema:
      quoraProfileUrlNormalized:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - unlock_spam_quora_urls
      - unlock_audit_log
    purpose: moderation_denylist_maintenance
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: unlock
    command: unlock.admin.signups.read
    version: 1.0.0
    description: >-
      Read the Unlock admin sign-up panel: the full account roster from the auth provider joined to the
      verification submissions, so an admin can see how many people signed up and which of them never
      submitted a Quora URL. Read-only; performs no write.
    inputSchema: {}
    outputSchema:
      signupOverview:
        type: object
    dataAccess:
      - auth_provider_account_directory
      - unlock_verification_submissions
      - unlock_excluded_accounts
      - account_deletion_events
    purpose: onboarding_funnel_measurement
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: unlock
    command: unlock.admin.signups.exclude
    version: 1.0.0
    description: >-
      Mark one account as demo/test so the Unlock admin sign-up counters leave it out, or put it back in
      the counts. Counter-only: it never changes the member's access tier, submission, or reward.
    inputSchema:
      userId:
        type: string
        required: true
      excluded:
        type: boolean
        required: true
      note:
        type: string
        required: false
    outputSchema:
      ok:
        type: boolean
      userId:
        type: string
      excluded:
        type: boolean
    dataAccess:
      - unlock_excluded_accounts
      - unlock_audit_log
    purpose: onboarding_funnel_measurement
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: unlock
    command: unlock.admin.submission.url.edit
    version: 1.0.0
    description: Admin correction of a submission's Quora profile URL (e.g. fixing a typo). Re-validates and re-normalizes the URL with the same rules as the member submit path. Does not change review status, access tier, or the verification window.
    inputSchema:
      submissionId:
        type: integer
        required: true
      quoraProfileUrl:
        type: string
        required: true
    outputSchema:
      submissionId:
        type: integer
      quoraProfileUrl:
        type: string
      quoraProfileUrlNormalized:
        type: string
    dataAccess:
      - unlock_verification_submissions
      - unlock_audit_log
    purpose: moderation_data_correction
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: unlock
    command: unlock.incentive.approval.credit-grant
    version: 1.0.0
    description: Grant one-time ServiceCredits incentive after approved verification.
    inputSchema:
      userId:
        type: string
        required: true
      submissionId:
        type: integer
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      governanceEventId:
        type: string
      amount:
        type: number
    dataAccess:
      - unlock_verification_submissions
      - service_credits_governance_events
      - service_credits_ledger_entries
    purpose: incentive_award
    retentionClass: financial_audit_long_lived
    idempotency: true

  - pluginId: unlock
    command: unlock.admin.rewards.reconcile
    version: 1.0.0
    description: Admin-triggered drain that mints any approved-but-uncredited unlock verification reward. Same idempotent mint as the approval handler and the cron, so it can never double-grant.
    inputSchema: {}
    outputSchema:
      scanned:
        type: integer
      granted:
        type: integer
      alreadyGranted:
        type: integer
      withheld:
        type: integer
      failed:
        type: integer
      errors:
        type: array
    dataAccess:
      - unlock_verification_submissions
      - unlock_audit_log
      - service_credits_governance_events
      - service_credits_ledger_entries
      - service_credits_wallets
      - service_credits_command_idempotency
      - service_credits_adapter_outbox
      - service_credits_admin_audit_trail
    purpose: incentive_award_self_heal
    retentionClass: financial_audit_long_lived
    idempotency: true

  - pluginId: unlock
    command: unlock.admin.submission.revoke
    version: 1.0.0
    description: Duplicate-identity determination "loser" path. Claws a granted verification reward back (best-effort burn) and drops the account to rejected + locked_support_only with reward_revoked_at, so the reconcile never re-grants it. Used when a Quora identity was approved on more than one account, or for a perp impersonating a victim.
    inputSchema:
      submissionId:
        type: integer
        required: true
      reviewNote:
        type: string
        required: false
    outputSchema:
      submissionId:
        type: integer
      creditsReclaimed:
        type: boolean
      reclaimAmount:
        type: number
    dataAccess:
      - unlock_verification_submissions
      - unlock_audit_log
      - service_credits_governance_events
      - service_credits_ledger_entries
      - service_credits_wallets
      - service_credits_command_idempotency
      - service_credits_adapter_outbox
      - service_credits_admin_audit_trail
    purpose: incentive_revoke_duplicate_identity
    retentionClass: financial_audit_long_lived
    idempotency: true

  - pluginId: unlock
    command: unlock.admin.reward.grant
    version: 1.0.0
    description: Duplicate-identity determination "winner" path. Clears a held reward and grants it to the chosen account through the shared duplicate-identity guard. Refuses (409, with the current holderUserId) if another account still holds the identity's reward — that one must be revoked first.
    inputSchema:
      submissionId:
        type: integer
        required: true
    outputSchema:
      submissionId:
        type: integer
      incentiveGrantedAt:
        type: string
    dataAccess:
      - unlock_verification_submissions
      - unlock_audit_log
      - service_credits_governance_events
      - service_credits_ledger_entries
      - service_credits_wallets
      - service_credits_command_idempotency
      - service_credits_adapter_outbox
      - service_credits_admin_audit_trail
    purpose: incentive_award_determination
    retentionClass: financial_audit_long_lived
    idempotency: true
