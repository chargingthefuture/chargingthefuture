# Bug Reporting — a member says what went wrong from inside the app; the raw text stays private.
#
# The one thing to read before changing anything here: the raw report never leaves the database.
# `bug-reporting.report.create` runs a deterministic redaction pass (emails, phone numbers, card-like
# and token-like strings) the moment the row is stored, and every read in this file returns the
# redacted copy only. A report that trips any signal is born `held_for_review` and waits for an admin;
# a clean one is born `new` and is picked up by a job that runs outside the app, which publishes the
# redacted copy to the private triage repository (`BUG_REPORTS_TRIAGE_REPO`, default
# `chargingthefuture/bug-reports`). The app holds no GitHub credential and never creates the issue
# itself. Routes: `ctf/packages/web/app/api/bug-reports/**`; library `ctf/packages/web/lib/bug-reports/`.
commands:
  - pluginId: bug-reporting
    command: bug-reporting.report.create
    version: 1.0.0
    # POST /api/bug-reports. Every string is trimmed and cut at its cap rather than rejected; an
    # empty or non-string `message` is the only 400. `user_agent` is read from the request header,
    # not the body. At most 5 reports per member in a rolling 10 minutes (429 after that).
    inputSchema:
      type: object
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 5000
          description: What went wrong, in the member's words. Required.
        context:
          type: [string, 'null']
          maxLength: 5000
          description: Optional extra detail (what they were doing, what they expected).
        pageUrl:
          type: [string, 'null']
          maxLength: 512
        pluginSlug:
          type: [string, 'null']
          maxLength: 512
        appVersion:
          type: [string, 'null']
          maxLength: 512
    outputSchema:
      type: object
      properties:
        ok:
          type: boolean
        reportId:
          type: string
        status:
          type: string
          enum: [new, held_for_review]
          description: new when the redaction pass found nothing; held_for_review when it flagged something.
    dataAccess:
      - bug_reports (select, count of this member's rows inside the rate-limit window)
      - bug_reports (insert — raw text, redacted text, risk flags and level, page/plugin/version/user-agent context)
    purpose: File a problem report without leaving the app
    retentionClass: operational_triage_input
    idempotency: false
    notes: >-
      Stored, never forwarded by this command. The raw message and context are kept in the row as the
      private source of truth; the redacted copy and the risk flags land beside them in the same insert
      so nothing downstream ever has to look at the raw text to decide what to do with it. Error codes
      are bug_reports.invalid_payload (400), bug_reports.rate_limited (429),
      bug_reports.csrf_denied (403) and bug_reports.persistence_unavailable (503).
  - pluginId: bug-reporting
    command: bug-reporting.admin.report.list
    version: 1.0.0
    # GET /api/bug-reports/admin. No query parameters; the repository caps the list at 200 rows,
    # held reports first, newest within each group. The reporter's username comes from a left join
    # on the legacy `users` table when it exists (null on a fresh database); the handle is always set.
    inputSchema:
      type: object
      properties: {}
    outputSchema:
      type: object
      properties:
        ok:
          type: boolean
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              status:
                type: string
                enum: [new, held_for_review, issue_created, rejected, resolved]
              reporterUsername:
                type: [string, 'null']
              reporterHandle:
                type: string
                description: A stable per-member display handle, derived from the username or the user id.
              redactedMessage:
                type: [string, 'null']
              redactedContext:
                type: [string, 'null']
              riskFlags:
                type: array
                items:
                  type: string
                  enum: [pii_email, pii_phone, pii_card, secret_token, abusive_language]
              riskLevel:
                type: string
                enum: [clean, flagged, unknown]
              pageUrl:
                type: [string, 'null']
              pluginSlug:
                type: [string, 'null']
              appVersion:
                type: [string, 'null']
              triageRepo:
                type: [string, 'null']
              issueNumber:
                type: [integer, 'null']
              issueUrl:
                type: [string, 'null']
              createdAt:
                type: string
              updatedAt:
                type: string
    dataAccess:
      - bug_reports (select — redacted columns, status, risk, context and issue link; never raw_message or raw_context)
      - users (select, username only, legacy table, left join; probed with to_regclass first)
    purpose: Review what members reported, held reports first
    retentionClass: operational_triage_input
    idempotency: true
    notes: >-
      Reporter identity is on this admin surface so a report that is really a member asking for help
      can be followed up. It is never added to the triage-repository issue. user_agent is stored but
      not returned here.
  - pluginId: bug-reporting
    command: bug-reporting.admin.report.resolve
    version: 1.0.0
    # POST /api/bug-reports/admin/:id/resolve. The id must be a UUID (400 otherwise). `release` moves a
    # held_for_review row back to new so the outside job publishes its redacted copy; `reject` moves a
    # held_for_review or new row to rejected so it never goes anywhere. 409 when no row changed (already
    # published, already rejected, or no such report). The member is never told which happened.
    inputSchema:
      type: object
      required: [id, action]
      properties:
        id:
          type: string
          format: uuid
          description: Path parameter — the report to resolve.
        action:
          type: string
          enum: [release, reject]
    outputSchema:
      type: object
      properties:
        ok:
          type: boolean
        id:
          type: string
        status:
          type: string
          enum: [new, rejected]
    dataAccess:
      - bug_reports (update — status and updated_at, guarded by the current status)
      - bug_report_admin_audit_trail (insert — one row per attempt, success, refusal and failure alike)
    purpose: Decide whether a held report goes on to the triage repository
    retentionClass: operational_triage_input
    idempotency: false
    notes: >-
      Every attempt writes an audit row through lib/bug-reports/audit.ts, including the 409 refusal
      (policy_status deny, reason not_resolvable) and a storage failure (result failure,
      error_category persistence_error). The audit write never throws: a failed write is reported to
      observability and the resolve still answers, because an admin repeating a reject they already
      made is worse than a gap in the trail. Error codes are bug_reports.invalid_payload (400),
      bug_reports.csrf_denied (403), bug_reports.forbidden (409) and
      bug_reports.persistence_unavailable (503).
  - pluginId: bug-reporting
    command: bug-reporting.admin.audit.list
    version: 1.0.0
    # GET /api/bug-reports/admin/audit-events?limit=N. limit defaults to 100 and is clamped to 1..200;
    # a non-numeric value falls back to 100. Newest first.
    inputSchema:
      type: object
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 200
          default: 100
    outputSchema:
      type: object
      properties:
        events:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              actor_id:
                type: string
              command:
                type: string
                description: Always bug-reports.admin.resolve today — the only command that writes a row.
              policy_status:
                type: string
                enum: [allow, deny]
              reason:
                type: string
              target_type:
                type: string
                description: Always bug_report.
              target_id:
                type: string
              result:
                type: string
                enum: [success, failure]
              error_category:
                type: [string, 'null']
              metadata:
                type: object
                description: The requested action and, on success, the resulting status.
              created_at:
                type: string
    dataAccess:
      - bug_report_admin_audit_trail (select)
    purpose: Read which reports were decided and by whom
    retentionClass: audit_trail
    idempotency: true
    notes: >-
      Returns the decision, never the report: the trail has no content column and no reporter column,
      so this read cannot leak either. Backs the Audit log panel on /admin/bug-reports.
