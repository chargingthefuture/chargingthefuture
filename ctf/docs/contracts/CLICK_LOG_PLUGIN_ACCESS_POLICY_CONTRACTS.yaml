policies:
  - pluginId: click-log
    command: click-log.incident.create
    version: 3.0.0
    requiredRoles: [user]
    attributePolicies:
      - attribute: userId
        mustMatch: authenticatedUserId
      # The "Not listed" scheme flow (schemeTags contains 'other-scheme') additionally requires
      # the Weavers of the Commons badge (contributor_access_eligibility: eligible and not
      # revoked) — spam control on the scheme-suggestion intake. Enforced in the create route;
      # members without the badge get a 403 and the client hides the option. (2.0.0: schemeTags
      # is a list — see the command contract.)
      - attribute: schemeTags
        conditionalRequirement: weavers_badge_when_other_scheme
    # The schemeSuggestion text is member content explicitly shared with the owner; the field
    # states this in the form, so submission is the consent act.
    # A tagged create is always stored shared (3.0.0, owner decision 2026-08-18): picking a tag
    # is the consent act for trend sharing — the form locks the share checkbox on and says so,
    # and an explicit sharedWithOwner: false alongside tags is a 400, never a silent override.
    consentRequirements: [scheme_suggestion_shared_with_owner, tagging_shares_trend_data]
  - pluginId: click-log
    command: click-log.incident.list
    version: 1.0.0
    requiredRoles: [user, admin]
    attributePolicies:
      - attribute: userId
        mustMatch: authenticatedUserId
    consentRequirements: []
  - pluginId: click-log
    command: click-log.incident.delete
    version: 1.0.0
    requiredRoles: [user, admin]
    attributePolicies:
      - attribute: id
        mustBeOwnedBy: authenticatedUserId
    consentRequirements: []
  - pluginId: click-log
    command: click-log.incident.update
    version: 3.0.0
    # Deliberately no admin override: the note is the member's private content, so only the
    # incident's owner may edit it (mirrors click-log.incident.share.set).
    requiredRoles: [user]
    attributePolicies:
      - attribute: id
        mustBeOwnedBy: authenticatedUserId
      # The catch-all 'other-scheme' scheme tag may only be kept (already on the incident),
      # never newly picked on edit — the suggestion intake it requires happens at create.
      # (2.0.0: schemeTags is a list — see the command contract.)
      - attribute: schemeTags
        conditionalRequirement: other_scheme_only_if_already_set
    # Saving with a non-empty tag list turns shared_with_owner on (3.0.0, owner decision
    # 2026-08-18: tags require trend sharing). The editor states this before save — keeping or
    # adding tags is the consent act; saving with both lists empty leaves the flag alone.
    consentRequirements: [tagging_shares_trend_data]
  - pluginId: click-log
    command: click-log.incident.share.set
    version: 2.0.0
    # Deliberately no admin override: whether an incident is shared with the owner is the
    # member's consent decision alone, so only the incident's owner may change it.
    # sharedWithOwner: false is rejected on a tagged incident (2.0.0, owner decision
    # 2026-08-18: a tagged incident always shares its trend data — the member removes the
    # tags via click-log.incident.update first to make it private).
    requiredRoles: [user]
    attributePolicies:
      - attribute: id
        mustBeOwnedBy: authenticatedUserId
    consentRequirements: [owner_share_opt_in]
  - pluginId: click-log
    command: click-log.preferences.fetch
    version: 1.0.0
    requiredRoles: [user]
    attributePolicies:
      - attribute: userId
        mustMatch: authenticatedUserId
    consentRequirements: []
  - pluginId: click-log
    command: click-log.preferences.update
    version: 1.0.0
    requiredRoles: [user]
    attributePolicies:
      - attribute: userId
        mustMatch: authenticatedUserId
    consentRequirements: [owner_share_opt_in]
  - pluginId: click-log
    command: click-log.trends.fetch
    version: 1.0.0
    # Owner/admin-only aggregate view. Reads only member-opted-in rows, and only as coarse
    # buckets (day + ~11 km location cell + count + distinct-member counts + tag slugs).
    requiredRoles: [admin]
    attributePolicies: []
    consentRequirements: [owner_share_opt_in]
  - pluginId: click-log
    command: click-log.trends.image
    version: 1.1.0
    # Same gate and same data as click-log.trends.fetch — the image is drawn from that report and
    # reads nothing else. The ~11 km area coordinates are never in the image and no input can put
    # them back; the country rollup is.
    requiredRoles: [admin]
    attributePolicies: []
    consentRequirements: [owner_share_opt_in]
