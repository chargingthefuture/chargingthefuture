policies:
  - pluginId: click-log
    command: click-log.incident.create
    version: 1.1.0
    requiredRoles: [user]
    attributePolicies:
      - attribute: userId
        mustMatch: authenticatedUserId
      # The "Not listed" scheme flow (schemeTag = 'other-scheme') additionally requires the
      # Weavers of the Commons badge (contributor_access_eligibility: eligible and not revoked)
      # — spam control on the scheme-suggestion intake. Enforced in the create route; members
      # without the badge get a 403 and the client hides the option.
      - attribute: schemeTag
        conditionalRequirement: weavers_badge_when_other_scheme
    # The schemeSuggestion text is member content explicitly shared with the owner; the field
    # states this in the form, so submission is the consent act.
    consentRequirements: [scheme_suggestion_shared_with_owner]
  - pluginId: click-log
    command: click-log.incident.list
    version: 1.0.0
    requiredRoles: [user, admin]
    attributePolicies:
      - attribute: userId
        mustMatch: authenticatedUserId
    consentRequirements: []
  - pluginId: click-log
    command: click-log.incident.delete
    version: 1.0.0
    requiredRoles: [user, admin]
    attributePolicies:
      - attribute: id
        mustBeOwnedBy: authenticatedUserId
    consentRequirements: []
  - pluginId: click-log
    command: click-log.incident.share.set
    version: 1.0.0
    # Deliberately no admin override: whether an incident is shared with the owner is the
    # member's consent decision alone, so only the incident's owner may change it.
    requiredRoles: [user]
    attributePolicies:
      - attribute: id
        mustBeOwnedBy: authenticatedUserId
    consentRequirements: [owner_share_opt_in]
  - pluginId: click-log
    command: click-log.preferences.fetch
    version: 1.0.0
    requiredRoles: [user]
    attributePolicies:
      - attribute: userId
        mustMatch: authenticatedUserId
    consentRequirements: []
  - pluginId: click-log
    command: click-log.preferences.update
    version: 1.0.0
    requiredRoles: [user]
    attributePolicies:
      - attribute: userId
        mustMatch: authenticatedUserId
    consentRequirements: [owner_share_opt_in]
  - pluginId: click-log
    command: click-log.trends.fetch
    version: 1.0.0
    # Owner/admin-only aggregate view. Reads only member-opted-in rows, and only as coarse
    # buckets (day + ~11 km location cell + count).
    requiredRoles: [admin]
    attributePolicies: []
    consentRequirements: [owner_share_opt_in]
