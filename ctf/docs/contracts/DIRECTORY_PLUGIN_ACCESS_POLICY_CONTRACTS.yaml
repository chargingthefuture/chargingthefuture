policies:
  - pluginId: directory
    command: directory.profile.upsert
    version: 1.0.0
    requiredRoles:
      - member
      - admin
    attributePolicies:
      tenancy: same_workspace
      profileOwnershipOrAdmin: required
      claimedUnclaimedRules: enforced
    consentRequirements:
      scopes:
        - directory_profile_management
      fallbackLawfulBasis: explicit_consent_required
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - actor_not_authorized_for_profile
      - invalid_claimed_unclaimed_transition
      - cross_workspace_access

  - pluginId: directory
    command: directory.list.fetch
    version: 1.0.0
    requiredRoles:
      - member
      - admin
    attributePolicies:
      tenancy: same_workspace
      publicVisibilityFilter: required
    consentRequirements:
      scopes:
        - directory_discovery
      fallbackLawfulBasis: legitimate_interest_safety_support
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - actor_not_authenticated
      - cross_workspace_access

  - pluginId: directory
    command: directory.profile.get
    version: 1.0.0
    requiredRoles:
      - member
      - admin
    attributePolicies:
      tenancy: same_workspace
      publicVisibilityFilter: required
    consentRequirements:
      scopes:
        - directory_discovery
      fallbackLawfulBasis: legitimate_interest_safety_support
    regionRestrictions:
      allowedTransferMechanisms:
