# Removed 2026-08-28 (governance plan task 7): the nine Skills Taxonomy write commands —
# sector/job-title/skill create, update and delete. The taxonomy is governed by the append-only
# change list in ctf/scripts/lib/taxonomyChange.mjs: a change is appended in a PR, validated by the
# taxonomy-change-gate, and applied to production by the owner-run workflow. The HTTP write routes
# behind these commands were a second write path that bypassed all of it, and no screen ever called
# them. The read commands are unchanged.
# See ctf/docs/developer/SKILLS_TAXONOMY_CHANGE_GOVERNANCE_PLAN.md.
policies:
  - pluginId: skills-taxonomy
    command: skills-taxonomy.hierarchy.get
    version: 1.0.0
    requiredRoles:
      - member
      - moderator
      - admin
      - service
    attributePolicies:
      tenancy: same_workspace
      taxonomyReadScope: approved_consumers_only
    consentRequirements:
      scopes: []
      fallbackLawfulBasis: contract_performance
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - cross_workspace_access
      - unauthorized_consumer_binding

  - pluginId: skills-taxonomy
    command: skills-taxonomy.summary.get
    version: 1.0.0
    # PUBLIC: no authentication. The command returns only aggregate counts of active rows — no
    # taxonomy rows and no member data — so it is exposed to signed-out visitors for the splash teaser.
    requiredRoles: []
    publicAccess: true
    attributePolicies:
      tenancy: same_workspace
      taxonomyReadScope: public_counts_only
    consentRequirements:
      scopes: []
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - persistence_unavailable

  - pluginId: skills-taxonomy
    command: skills-taxonomy.flattened.get
    version: 1.0.0
    requiredRoles:
      - member
      - moderator
      - admin
      - service
    attributePolicies:
      tenancy: same_workspace
      taxonomyReadScope: approved_consumers_only
    consentRequirements:
      scopes: []
      fallbackLawfulBasis: contract_performance
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - cross_workspace_access
      - unauthorized_consumer_binding

  - pluginId: skills-taxonomy
    command: skills-taxonomy.dependency-impact.preview
    version: 1.0.0
    requiredRoles:
      - admin
      - taxonomy_admin
      - operations
    attributePolicies:
      tenancy: same_workspace
      targetExists: required
      dependencyGraphFreshness: required
    consentRequirements:
      scopes:
        - skills_taxonomy_admin
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - invalid_target
      - stale_dependency_graph

changelog:
  - date: 2026-02-25
    change: Initial Skills Taxonomy access policy skeleton added with hierarchy integrity, destructive-action safeguards, and dependency-impact enforcement.
