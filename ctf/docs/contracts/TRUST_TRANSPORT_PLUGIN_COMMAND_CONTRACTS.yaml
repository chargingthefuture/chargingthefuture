contracts:
  - pluginId: trust-transport
    command: trust-transport.request.create
    version: 1.0.0
    description: Create a trust-transport request for ride, package, or food mode.
    inputSchema:
      mode:
        type: string
        required: true
      requestPayload:
        type: object
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      requestId:
        type: string
      status:
        type: string
      createdAt:
        type: string
    dataAccess:
      - trust_transport_requests
      - trust_transport_status_events
    purpose: marketplace_request_creation
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: trust-transport
    command: trust-transport.offer.create
    version: 1.0.0
    description: Make an offer to fulfill an open trust-transport request.
    inputSchema:
      requestId:
        type: string
        required: true
      note:
        type: string
        required: false
      proposedAmount:
        type: number
        required: false
    outputSchema:
      offerId:
        type: string
      status:
        type: string
      createdAt:
        type: string
    dataAccess:
      - trust_transport_offers
      - trust_transport_requests
      - trust_transport_admin_audit_trail
    purpose: marketplace_offer_creation
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: trust-transport
    command: trust-transport.offer.accept
    version: 1.0.0
    description: Accept an offer and initialize trip/order execution lifecycle.
    inputSchema:
      offerId:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      tripId:
        type: string
      status:
        type: string
    dataAccess:
      - trust_transport_offers
      - trust_transport_trips
      - trust_transport_status_events
    purpose: marketplace_fulfillment_start
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: trust-transport
    command: trust-transport.trip.status.update
    version: 1.0.0
    description: >-
      Apply a canonical forward status transition for an active trip (assigned -> en_route ->
      picked_up -> delivered) or a terminal state (cancelled/disputed/emergency_frozen). A non-admin
      may NOT set 'completed' here — completion requires both parties to confirm via
      trust-transport.trip.completion.confirm. Admins keep a direct override to 'completed' (which
      settles), e.g. when resolving a dispute.
    inputSchema:
      tripId:
        type: string
        required: true
      nextStatus:
        type: string
        required: true
      proof:
        type: object
        required: false
    outputSchema:
      tripId:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    dataAccess:
      - trust_transport_trips
      - trust_transport_status_events
      - trust_transport_proof_artifacts
      # On an admin-override completion: ServiceCredits settlement moves credits requester -> provider;
      # fiat/crypto settlement credits the provider's earnings ledger in that currency. (For the normal
      # member path, settlement fires on trust-transport.trip.completion.confirm instead.)
      - service_credits_wallets
      - service_credits_transfers
      - service_credits_ledger_entries
      - trust_transport_earnings_ledger
    purpose: lifecycle_transition
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: trust-transport
    command: trust-transport.trip.completion.confirm
    version: 1.0.0
    description: >-
      Record one participant's confirmation that a delivered trip is complete. Only valid from the
      'delivered' state and only for the trip's requester or provider. The trip actually transitions to
      'completed' — and settlement fires (ServiceCredits move requester -> provider, or the provider's
      earnings ledger is credited for a fiat/crypto exchange settled off-platform) — only once BOTH the
      requester and the provider have confirmed. This exists because completion moves value: neither
      party may complete a trip unilaterally.
    inputSchema:
      tripId:
        type: string
        required: true
    outputSchema:
      tripId:
        type: string
      status:
        type: string
      bothConfirmed:
        type: boolean
      updatedAt:
        type: string
    dataAccess:
      - trust_transport_trips
      - trust_transport_status_events
      # Only when this confirmation is the second one (bothConfirmed) and settlement fires:
      - service_credits_wallets
      - service_credits_transfers
      - service_credits_ledger_entries
      - trust_transport_earnings_ledger
    purpose: lifecycle_transition
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: trust-transport
    command: trust-transport.payout.request
    version: 1.0.0
    description: Submit payout request from earnings ledger balance.
    inputSchema:
      providerId:
        type: string
        required: true
      amount:
        type: number
        required: true
      currency:
        type: string
        required: true
    outputSchema:
      payoutRequestId:
        type: string
      status:
        type: string
    dataAccess:
      - trust_transport_earnings_ledger
      - trust_transport_payout_requests
    purpose: provider_payouts
    retentionClass: financial_long_lived
    idempotency: true
