# Fireside access policy.
#
# Three postures, and the first is unusual enough to name: reading is not gated at all. No account,
# no sign-in, no tier. The blog is public, so the conversation under it is public — the inversion of
# a platform that gates viewing as well as writing.
policies:
  - pluginId: fireside
    command: fireside.thread.read
    version: 1.0.0
    requiredRoles: []
    minUnlockTier: none
    requiresAuthentication: false
    consentRequirements: []
    notes: >-
      Public. Returns a display name and never a user id or an email, because everything on this
      shape is on the open web. A signed-in reader additionally sees their own held comments so
      nobody is left wondering where their words went.
  - pluginId: fireside
    command: fireside.comment.create
    version: 1.0.0
    requiredRoles: [member]
    minUnlockTier: any_authenticated
    requiresAuthentication: true
    consentRequirements:
      - Writing is a route into verification. Nothing written is publicly visible until the author is
        approved in Unlock, and the person is told so at the moment of posting rather than left to
        discover it.
    notes: >-
      The fourth Unlock exception, decided 2026-09-13, on the same reasoning as the Knowledge Library
      contribution exception: judging what somebody wrote is the same look Unlock asks for, so gating
      it would review the same account twice. Recorded in
      ctf/config/unlock-tier-exception-allowlist.json and enforced by CI.
  - pluginId: fireside
    command: fireside.reaction.toggle
    version: 1.0.0
    requiredRoles: [member]
    minUnlockTier: any_authenticated
    requiresAuthentication: true
    consentRequirements: []
    notes: >-
      Same posture as a comment, and for the same reason: a reaction from an unverified account is
      how a brigade would work, so it is recorded and does not count in public until the person is
      approved.
  - pluginId: fireside
    command: fireside.comment.withdraw
    version: 1.0.0
    requiredRoles: [member]
    minUnlockTier: any_authenticated
    requiresAuthentication: true
    consentRequirements: []
    notes: Author-only. Scoped by author_user_id in the update, never by a client-supplied id alone.
  - pluginId: fireside
    command: fireside.comment.set_export
    version: 1.0.0
    requiredRoles: [member]
    minUnlockTier: any_authenticated
    requiresAuthentication: true
    consentRequirements:
      - Off by default. Exporting puts the text in the blog's published build, which is captured by
        the Internet Archive and cannot be withdrawn afterwards by anybody, this project included.
        The author has to ask for it.
      - Asking is one of two keys and grants nothing on its own. An admin has to approve the request
        as well, and the author can take the ask back at any point before the copy is made.
    notes: >-
      Author-only, scoped by author_user_id. A comment an admin has declined stays declined: the
      switch cannot re-queue it, because a refusal that can be toggled back is not a refusal.
  - pluginId: fireside
    command: fireside.own.read
    version: 1.0.0
    requiredRoles: [member]
    minUnlockTier: any_authenticated
    requiresAuthentication: true
    consentRequirements: []
    notes: >-
      Returns only the caller's own rows. It is the one read that carries `withdrawn_body`, the
      author's own copy of a comment they took down; the select behind the public thread read does
      not contain that column, so there is no shape that could return it to anybody else.
  - pluginId: fireside
    command: fireside.comment.remove
    version: 1.0.0
    requiredRoles: [admin]
    minUnlockTier: approved_full
    requiresAuthentication: true
    consentRequirements: []
    notes: >-
      Moderation, deliberately separate from approval. Removing also clears the blog-export flag, so
      nothing on its way out of the app can carry a removed comment with it.
  - pluginId: fireside
    command: fireside.export.queue.read
    version: 1.0.0
    requiredRoles: [admin]
    minUnlockTier: approved_full
    requiresAuthentication: true
    consentRequirements: []
    notes: >-
      Shows only comments whose authors asked for them. An unapproved author's comment is not
      publicly visible in the app yet, so it does not reach this queue until Unlock approves them.
  - pluginId: fireside
    command: fireside.export.approve
    version: 1.0.0
    requiredRoles: [admin]
    minUnlockTier: approved_full
    requiresAuthentication: true
    consentRequirements: []
    notes: >-
      The second of two keys. Approving publishes nothing by itself — the author's own opt-in still
      has to be on when the copy is made. Refusing is final for that comment.
