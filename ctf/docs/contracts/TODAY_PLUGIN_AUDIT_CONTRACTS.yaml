# Today is a read that writes nothing and changes nothing. Each source keeps the audit events its
# own feature defines; this entry records the shape of the read itself.
auditEvents:
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: today
    command: today.read
    commandVersion: 1.0.0
    purpose: member_daily_overview
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - today_card_sources
    targetContext:
      workspaceId: workspace_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class
