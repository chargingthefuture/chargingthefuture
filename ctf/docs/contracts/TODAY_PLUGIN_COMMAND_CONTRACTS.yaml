contracts:
  - pluginId: today
    command: today.read
    version: 1.0.0
    description: Read everything the 3.1 Today screen draws, in one answer (GET /api/today).
    inputSchema: {}
    outputSchema:
      today:
        type: object
        properties:
          generatedAtIso:
            type: string
          presence:
            type: integer
            nullable: true
          broadcast:
            type: object
            nullable: true
          rooms:
            type: array
            description: Each room carries speakers and up to five account ids in faces, speakers first.
          week:
            type: array
            description: TI Radio talks booked from now through the next 7 days, oldest first.
          cards:
            type: array
            maxItems: 30
          unavailable:
            type: array
    dataAccess:
      - peer_programming_goals
      - peer_programming_goal_tasks
      - peer_programming_cohort_members
      - socket_relay_requests
      - trust_transport_requests
      - lighthouse_properties
      - skill_up_cohorts
      - feed_announcements
      - directory_invites
      - what_works_problems
      - what_works_products
      - mood_client_identities
      - mood_submissions
      - directory_profile_skills
      - skills_taxonomy_skills
      - beacon_events
      - skills_hunt_rounds
      - skills_hunt_missions
      - skills_hunt_mission_progress
      - member_action_seconds_daily
      - foundation_call_sessions
      - member_mutes
      - chyme_rooms
      - chyme_room_members
      - chyme_guest_listeners
      - ti_radio_slots
      - contributor_access_config
      - contributor_access_eligibility
      - quora_deletion_survey_responses
      - admin_daily_post_exclusions
      - question_answers
      - question_matching_settings
      - question_match_messages
      - member_blocks
      - account_restrictions
    purpose: member_daily_overview
    retentionClass: none_read_only
    idempotency: true
  - pluginId: today
    command: today.public.read
    version: 1.0.0
    description: Read Today for a visitor who is not signed in (GET /api/today/public). Public cards only, with no names.
    inputSchema: {}
    outputSchema:
      today:
        type: object
        properties:
          generatedAtIso:
            type: string
          broadcast:
            type: object
            nullable: true
          rooms:
            type: array
            maxItems: 1
            description: The Main Room, with speakers; faces is always empty signed out.
          week:
            type: array
            description: TI Radio talks booked from now through the next 7 days, oldest first.
          cards:
            type: array
            maxItems: 30
          unavailable:
            type: array
    dataAccess:
      - trust_transport_requests
      - skill_up_cohorts
      - directory_profile_skills
      - skills_taxonomy_skills
      - beacon_events
      - skills_hunt_rounds
      - skills_hunt_missions
      - skills_hunt_mission_progress
      - member_action_seconds_daily
      - foundation_call_sessions
      - peer_programming_goal_tasks
      - chyme_rooms
      - chyme_room_members
      - chyme_guest_listeners
      - ti_radio_slots
      - admin_daily_post_exclusions
    purpose: public_daily_overview
    retentionClass: none_read_only
    idempotency: true
  - pluginId: today
    command: today.questions.answer
    version: 1.0.0
    description: Answer a 21 Questions question that is out (POST /api/today/questions/answers). The first answer stands. Each answer, and each refused attempt to give a different one, is recorded in question_answer_audit.
    inputSchema:
      questionId:
        type: string
      choice:
        type: integer
        minimum: 0
    outputSchema:
      saved:
        type: boolean
      next:
        type: string
        nullable: true
    dataAccess:
      - question_answers
      - question_answer_audit
    purpose: twenty_one_questions_answer
    retentionClass: until_account_deletion
    idempotency: true
  - pluginId: today
    command: today.questions.matching.read
    version: 1.0.0
    description: Read whether the member is matched in 21 Questions and how many questions they answered (GET /api/today/questions/matching). No row means on; the toggle shows from the first answer.
    inputSchema: {}
    outputSchema:
      answered:
        type: integer
      enabled:
        type: boolean
    dataAccess:
      - question_answers
      - question_matching_settings
    purpose: twenty_one_questions_matching
    retentionClass: none_read_only
    idempotency: true
  - pluginId: today
    command: today.questions.matching.set
    version: 1.0.0
    description: Turn 21 Questions matching on or off (POST /api/today/questions/matching), 20 a minute. Off takes the member out of every match, theirs and everyone else's, from the next read and keeps their answers. The only way matching changes; answering never does. Each real change is recorded in question_answer_audit.
    inputSchema:
      enabled:
        type: boolean
    outputSchema:
      answered:
        type: integer
      enabled:
        type: boolean
    dataAccess:
      - question_answers
      - question_matching_settings
      - question_answer_audit
    purpose: twenty_one_questions_matching
    retentionClass: until_account_deletion
    idempotency: true
  - pluginId: today
    command: today.questions.messages.read
    version: 1.0.0
    description: Read the conversation inside a 21 Questions match card and mark the other member's messages read (GET /api/today/questions/matches/[accountId]/messages). Only between a current match.
    inputSchema:
      accountId:
        type: string
    outputSchema:
      messages:
        type: array
        maxItems: 50
    dataAccess:
      - question_answers
      - question_matching_settings
      - question_match_messages
      - member_blocks
      - account_restrictions
    purpose: twenty_one_questions_conversation
    retentionClass: until_account_deletion
    idempotency: true
  - pluginId: today
    command: today.questions.messages.send
    version: 1.0.0
    description: Send a message inside a 21 Questions match card (POST /api/today/questions/matches/[accountId]/messages), 1 to 500 characters, 60 an hour. Only between a current match; the other member is told in Activity.
    inputSchema:
      accountId:
        type: string
      body:
        type: string
        maxLength: 500
    outputSchema:
      message:
        type: object
    dataAccess:
      - question_answers
      - question_matching_settings
      - question_match_messages
      - member_blocks
      - account_restrictions
      - notifications
    purpose: twenty_one_questions_conversation
    retentionClass: until_account_deletion
    idempotency: false
  - pluginId: today
    command: today.cards.conversation.read
    version: 1.0.0
    description: "Read a Today card's sheet: who answered and how, the public messages, and the viewer's own Just us two conversations on the card with where each stands. Leaves out anybody blocked either way and anybody the viewer muted. (GET /api/today/cards/[cardId])."
    inputSchema:
      cardId:
        type: string
    outputSchema:
      conversation:
        type: object
    dataAccess:
      - card_answers
      - card_messages
      - card_pair_requests
      - member_blocks
      - member_mutes
    purpose: card_conversation
    retentionClass: until_account_deletion
    idempotency: true
  - pluginId: today
    command: today.cards.answer
    version: 1.0.0
    description: "Answer a card with help, know-someone, want or helped-me; one per member per kind per card, answering again changes nothing; 30 a minute. (POST /api/today/cards/[cardId]/answers)."
    inputSchema:
      cardId:
        type: string
      kind:
        type: string
    outputSchema:
      saved:
        type: boolean
      conversation:
        type: object
    dataAccess:
      - card_answers
      - card_messages
      - card_pair_requests
      - account_restrictions
      - member_blocks
      - member_mutes
    purpose: card_conversation
    retentionClass: until_account_deletion
    idempotency: true
  - pluginId: today
    command: today.cards.message.send
    version: 1.0.0
    description: "Write in a card, 1 to 1000 characters, 60 an hour. Public, or private into an open Just us two conversation with partnerId, whose partner is told in Activity. Refused when the writer is restricted from contact or, for Just us two, either has blocked the other. (POST /api/today/cards/[cardId]/messages)."
    inputSchema:
      cardId:
        type: string
      body:
        type: string
      private:
        type: boolean
      partnerId:
        type: string
    outputSchema:
      conversation:
        type: object
    dataAccess:
      - card_messages
      - card_pair_requests
      - card_answers
      - account_restrictions
      - member_blocks
      - member_mutes
      - notifications
    purpose: card_conversation
    retentionClass: until_account_deletion
    idempotency: false
  - pluginId: today
    command: today.cards.pair.ask
    version: 1.0.0
    description: "Ask a member who took part on the card to talk just you two; they are told in Activity, and it opens once they agree. Asking a member who already asked agrees to their request. 20 an hour. (POST /api/today/cards/[cardId]/pair)."
    inputSchema:
      cardId:
        type: string
      partnerId:
        type: string
    outputSchema:
      conversation:
        type: object
    dataAccess:
      - card_pair_requests
      - card_answers
      - card_messages
      - account_restrictions
      - member_blocks
      - member_mutes
      - notifications
    purpose: card_conversation
    retentionClass: until_account_deletion
    idempotency: false
  - pluginId: today
    command: today.cards.pair.agree
    version: 1.0.0
    description: "Agree to a Just us two request made to the viewer on this card. 30 an hour. (POST /api/today/cards/[cardId]/pair/agree)."
    inputSchema:
      cardId:
        type: string
      partnerId:
        type: string
    outputSchema:
      conversation:
        type: object
    dataAccess:
      - card_pair_requests
      - card_answers
      - card_messages
      - account_restrictions
      - member_blocks
      - member_mutes
    purpose: card_conversation
    retentionClass: until_account_deletion
    idempotency: false
  - pluginId: today
    command: today.cards.report
    version: 1.0.0
    description: "Report a message the viewer can read in a card, or the card's author, into member_safety_reports with the card id and, for a message, its text cut to 500 characters. Never a self-report. 20 an hour. (POST /api/today/cards/[cardId]/report)."
    inputSchema:
      cardId:
        type: string
      messageId:
        type: string
      authorId:
        type: string
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - card_messages
      - member_safety_reports
    purpose: card_conversation
    retentionClass: until_account_deletion
    idempotency: false
