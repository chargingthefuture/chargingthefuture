contracts:
  - pluginId: today
    command: today.read
    version: 1.0.0
    description: Read everything the 3.1 Today screen draws, in one answer (GET /api/today).
    inputSchema: {}
    outputSchema:
      today:
        type: object
        properties:
          generatedAtIso:
            type: string
          presence:
            type: integer
            nullable: true
          broadcast:
            type: object
            nullable: true
          rooms:
            type: array
          cards:
            type: array
            maxItems: 30
          unavailable:
            type: array
    dataAccess:
      - peer_programming_goals
      - peer_programming_goal_tasks
      - peer_programming_cohort_members
      - socket_relay_requests
      - trust_transport_requests
      - lighthouse_properties
      - skill_up_cohorts
      - feed_announcements
      - directory_invites
      - what_works_problems
      - what_works_products
      - mood_client_identities
      - mood_submissions
      - directory_profile_skills
      - skills_taxonomy_skills
      - beacon_events
      - skills_hunt_rounds
      - skills_hunt_missions
      - skills_hunt_mission_progress
      - member_action_seconds_daily
      - foundation_call_sessions
      - member_mutes
      - chyme_rooms
      - chyme_room_members
      - chyme_guest_listeners
      - ti_radio_slots
      - contributor_access_config
      - contributor_access_eligibility
      - quora_deletion_survey_responses
    purpose: member_daily_overview
    retentionClass: none_read_only
    idempotency: true
  - pluginId: today
    command: today.public.read
    version: 1.0.0
    description: Read Today for a visitor who is not signed in (GET /api/today/public). Public cards only, with no names.
    inputSchema: {}
    outputSchema:
      today:
        type: object
        properties:
          generatedAtIso:
            type: string
          broadcast:
            type: object
            nullable: true
          rooms:
            type: array
            maxItems: 1
          cards:
            type: array
            maxItems: 30
          unavailable:
            type: array
    dataAccess:
      - trust_transport_requests
      - skill_up_cohorts
      - directory_profile_skills
      - skills_taxonomy_skills
      - beacon_events
      - skills_hunt_rounds
      - skills_hunt_missions
      - skills_hunt_mission_progress
      - member_action_seconds_daily
      - foundation_call_sessions
      - peer_programming_goal_tasks
      - chyme_rooms
      - chyme_room_members
      - chyme_guest_listeners
      - ti_radio_slots
    purpose: public_daily_overview
    retentionClass: none_read_only
    idempotency: true
