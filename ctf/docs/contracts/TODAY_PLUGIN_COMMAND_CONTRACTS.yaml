contracts:
  - pluginId: today
    command: today.read
    version: 1.0.0
    description: "Read everything the 3.1 Today screen draws, in one answer (GET /api/today). Touches the member's own member_presence row (at most once a minute) and answers presence, the number of signed-in members whose last read was in the last 10 minutes (one COUNT, never names), and storiesTomorrow, how many stories open at the next midnight. Stories and replays carry saved from today_card_saves. The member's own Done and Not for me marks (today_card_marks) are applied: Not for me never comes back; done stays the day it was marked (markedDoneAtIso) and leaves from the member's next day; a done blog story with a newer readable Fireside comment comes back with newComments. Open Mutual Time surveys show as Offer cards with only what their shared link shows anybody (title, description, where the group meets), never who picked what. A member placed in a PeerProgramming cohort gets one card naming their own cohort and who is in it with them, the names its room already lists to them. The Our numbers card carries figures: Workforce's skills coverage and, signed in, how much the Community Value Index grew this week (a relative index, never money), which stores the current week's reading in gdp_metric_snapshots (metric gdp_value_index, the row scripts/recognizeGdp.mjs writes) at most once every 10 minutes per server and compares it with last week's row. day (YYYY-MM-DD) and dayStart are the member's own day and when it began, from their phone or browser; stories, the puzzle, 21 Questions, the day's own cards and storiesTomorrow follow it, falling back to the UTC day. Another person's ask never carries a done mark."
    inputSchema:
      dayStart:
        type: string
        required: false
    outputSchema:
      today:
        type: object
        properties:
          generatedAtIso:
            type: string
          presence:
            type: integer
            nullable: true
          broadcast:
            type: object
            nullable: true
          rooms:
            type: array
            description: Each room carries speakers and up to five account ids in faces, speakers first.
          week:
            type: array
            description: TI Radio talks booked from now through the next 7 days, oldest first.
          cards:
            type: array
            maxItems: 30
          unavailable:
            type: array
    dataAccess:
      - peer_programming_goals
      - peer_programming_goal_tasks
      - peer_programming_cohort_members
      - socket_relay_requests
      - trust_transport_requests
      - lighthouse_properties
      - skill_up_cohorts
      - feed_announcements
      - directory_invites
      - what_works_problems
      - what_works_products
      - mood_client_identities
      - mood_submissions
      - directory_profile_skills
      - skills_taxonomy_skills
      - beacon_events
      - skills_hunt_rounds
      - skills_hunt_missions
      - skills_hunt_mission_progress
      - member_action_seconds_daily
      - foundation_call_sessions
      - member_mutes
      - chyme_rooms
      - chyme_room_members
      - chyme_guest_listeners
      - ti_radio_slots
      - contributor_access_config
      - contributor_access_eligibility
      - quora_deletion_survey_responses
      - admin_daily_post_exclusions
      - question_answers
      - question_matching_settings
      - question_match_messages
      - member_blocks
      - account_restrictions
      - today_card_windows
      - today_card_marks
      - today_card_saves
      - member_presence
      - today_daily_credit_cards
      - beacon_events
      - fireside_threads
      - fireside_comments
      - notifications
      - mutual_time_events
      - peer_programming_cohorts
      - peer_programming_settings
      - gdp_metric_snapshots
      - trust_transport_earnings_ledger
      - service_credits_governance_events
      - foundation_quote_requests
      - service_credits_transfers
      - lighthouse_matches
      - socket_relay_fulfillments
      - recurring_activities
    purpose: member_daily_overview
    retentionClass: none_read_only
    idempotency: true
  - pluginId: today
    command: today.public.read
    version: 1.0.0
    description: Read Today for a visitor who is not signed in (GET /api/today/public). Public cards only, with no names.
    inputSchema: {}
    outputSchema:
      today:
        type: object
        properties:
          generatedAtIso:
            type: string
          broadcast:
            type: object
            nullable: true
          rooms:
            type: array
            maxItems: 1
            description: The Main Room, with speakers; faces is always empty signed out.
          week:
            type: array
            description: TI Radio talks booked from now through the next 7 days, oldest first.
          cards:
            type: array
            maxItems: 30
          unavailable:
            type: array
    dataAccess:
      - trust_transport_requests
      - skill_up_cohorts
      - directory_profile_skills
      - skills_taxonomy_skills
      - beacon_events
      - skills_hunt_rounds
      - skills_hunt_missions
      - skills_hunt_mission_progress
      - member_action_seconds_daily
      - foundation_call_sessions
      - peer_programming_goal_tasks
      - chyme_rooms
      - chyme_room_members
      - chyme_guest_listeners
      - ti_radio_slots
      - admin_daily_post_exclusions
    purpose: public_daily_overview
    retentionClass: none_read_only
    idempotency: true
  - pluginId: today
    command: today.public.card.read
    version: 1.0.0
    description: Read a card opened on signed-out Today (GET /api/today/public/cards/[cardId]). A story's Fireside comments, or a sample card's sample conversation from the demo schema; never Just us two.
    inputSchema:
      cardId:
        type: string
        description: blog-story, trust-transport or skill-up card id; any other answers 404.
    outputSchema:
      conversation:
        type: object
        properties:
          sample:
            type: boolean
          messages:
            type: array
            maxItems: 100
    dataAccess:
      - fireside_threads
      - fireside_comments
      - commons_item_messages
    purpose: public_daily_overview
    retentionClass: none_read_only
    idempotency: true
  - pluginId: today
    command: today.questions.answer
    version: 1.0.0
    description: Answer a 21 Questions question that is out (POST /api/today/questions/answers). The first answer stands. Each answer, and each refused attempt to give a different one, is recorded in question_answer_audit.
    inputSchema:
      questionId:
        type: string
      choice:
        type: integer
        minimum: 0
    outputSchema:
      saved:
        type: boolean
      next:
        type: string
        nullable: true
    dataAccess:
      - question_answers
      - question_answer_audit
    purpose: twenty_one_questions_answer
    retentionClass: until_account_deletion
    idempotency: true
  - pluginId: today
    command: today.questions.matching.read
    version: 1.0.0
    description: Read whether the member is matched in 21 Questions and how many questions they answered (GET /api/today/questions/matching). No row means on; the toggle shows from the first answer.
    inputSchema: {}
    outputSchema:
      answered:
        type: integer
      enabled:
        type: boolean
    dataAccess:
      - question_answers
      - question_matching_settings
    purpose: twenty_one_questions_matching
    retentionClass: none_read_only
    idempotency: true
  - pluginId: today
    command: today.questions.matching.set
    version: 1.0.0
    description: Turn 21 Questions matching on or off (POST /api/today/questions/matching), 20 a minute. Off takes the member out of every match, theirs and everyone else's, from the next read and keeps their answers. The only way matching changes; answering never does. Each real change is recorded in question_answer_audit.
    inputSchema:
      enabled:
        type: boolean
    outputSchema:
      answered:
        type: integer
      enabled:
        type: boolean
    dataAccess:
      - question_answers
      - question_matching_settings
      - question_answer_audit
    purpose: twenty_one_questions_matching
    retentionClass: until_account_deletion
    idempotency: true
  - pluginId: today
    command: today.questions.messages.read
    version: 1.0.0
    description: Read the conversation inside a 21 Questions match card and mark the other member's messages read (GET /api/today/questions/matches/[accountId]/messages). Only between a current match.
    inputSchema:
      accountId:
        type: string
    outputSchema:
      messages:
        type: array
        maxItems: 50
    dataAccess:
      - question_answers
      - question_matching_settings
      - question_match_messages
      - member_blocks
      - account_restrictions
    purpose: twenty_one_questions_conversation
    retentionClass: until_account_deletion
    idempotency: true
  - pluginId: today
    command: today.questions.messages.send
    version: 1.0.0
    description: Send a message inside a 21 Questions match card (POST /api/today/questions/matches/[accountId]/messages), 1 to 500 characters, 60 an hour. Only between a current match; the other member is told in Activity.
    inputSchema:
      accountId:
        type: string
      body:
        type: string
        maxLength: 500
    outputSchema:
      message:
        type: object
    dataAccess:
      - question_answers
      - question_matching_settings
      - question_match_messages
      - member_blocks
      - account_restrictions
      - notifications
    purpose: twenty_one_questions_conversation
    retentionClass: until_account_deletion
    idempotency: false
  - pluginId: today
    command: today.cards.conversation.read
    version: 1.0.0
    description: "Read a Today card's sheet: who answered and how, the public messages, and the viewer's own Just us two conversations on the card with where each stands. Leaves out anybody blocked either way and anybody the viewer muted. (GET /api/today/cards/[cardId])."
    inputSchema:
      cardId:
        type: string
    outputSchema:
      conversation:
        type: object
    dataAccess:
      - commons_item_answers
      - commons_item_messages
      - commons_item_pair_requests
      - member_blocks
      - member_mutes
    purpose: card_conversation
    retentionClass: until_account_deletion
    idempotency: true
  - pluginId: today
    command: today.cards.answer
    version: 1.0.0
    description: "Answer a card with help, know-someone, want or helped-me; one per member per kind per card, answering again changes nothing; 30 a minute. (POST /api/today/cards/[cardId]/answers)."
    inputSchema:
      cardId:
        type: string
      kind:
        type: string
    outputSchema:
      saved:
        type: boolean
      conversation:
        type: object
    dataAccess:
      - commons_item_answers
      - commons_item_messages
      - commons_item_pair_requests
      - account_restrictions
      - member_blocks
      - member_mutes
    purpose: card_conversation
    retentionClass: until_account_deletion
    idempotency: true
  - pluginId: today
    command: today.cards.answer.confirm_helped
    version: 1.0.0
    description: "The card's author confirms a member's helped-me answer: the poster of the item (read where it lives), or an admin on a blog story, an announcement or What Works. Sets commons_item_answers.confirmed_at once; confirming again changes nothing. Never one's own answer (400 own_answer); 403 not_author; 404 no_answer when that member gave no helped-me on the card. Each confirmed one counts 10 action minutes toward Days won for the member who said it. 30 a minute. (POST /api/today/cards/[cardId]/answers/confirm)."
    inputSchema:
      cardId:
        type: string
      accountId:
        type: string
    outputSchema:
      conversation:
        type: object
    dataAccess:
      - feed_admin_audit_trail
      - commons_item_answers
      - commons_item_messages
      - commons_item_pair_requests
      - account_restrictions
      - member_blocks
      - member_mutes
    purpose: card_conversation
    retentionClass: until_account_deletion
    idempotency: true
  - pluginId: today
    command: today.cards.message.send
    version: 1.0.0
    description: "Write in a card, 1 to 1000 characters, 60 an hour. Public, or private into an open Just us two conversation with partnerId, whose partner is told in Activity unless they muted the card. Refused when the writer is restricted from contact or, for Just us two, either has blocked the other. (POST /api/today/cards/[cardId]/messages)."
    inputSchema:
      cardId:
        type: string
      body:
        type: string
      private:
        type: boolean
      partnerId:
        type: string
    outputSchema:
      conversation:
        type: object
    dataAccess:
      - commons_item_messages
      - commons_item_pair_requests
      - commons_item_answers
      - account_restrictions
      - member_blocks
      - member_mutes
      - notifications
    purpose: card_conversation
    retentionClass: until_account_deletion
    idempotency: false
  - pluginId: today
    command: today.cards.message.edit
    version: 1.0.0
    description: "The author changes their own message in a card, public or Just us two, 1 to 1000 characters; it is marked edited. 60 changes an hour, shared with delete. Refused when the author is restricted from contact or, for Just us two, either has blocked the other; 404 when the message is not the caller's own on that card. (PATCH /api/today/cards/[cardId]/messages/[messageId])."
    inputSchema:
      cardId:
        type: string
      messageId:
        type: string
      body:
        type: string
    outputSchema:
      conversation:
        type: object
    dataAccess:
      - commons_item_messages
      - commons_item_pair_requests
      - commons_item_answers
      - account_restrictions
      - member_blocks
      - member_mutes
    purpose: card_conversation
    retentionClass: until_account_deletion
    idempotency: true
  - pluginId: today
    command: today.cards.message.delete
    version: 1.0.0
    description: "The author removes their own message from a card for everyone. Signed in is enough, so a member whose writing is paused can still take back what they wrote. 60 changes an hour, shared with edit; 404 when the message is not the caller's own on that card. (DELETE /api/today/cards/[cardId]/messages/[messageId])."
    inputSchema:
      cardId:
        type: string
      messageId:
        type: string
    outputSchema:
      conversation:
        type: object
    dataAccess:
      - commons_item_messages
      - commons_item_pair_requests
      - commons_item_answers
      - member_blocks
      - member_mutes
    purpose: card_conversation
    retentionClass: until_account_deletion
    idempotency: true
  - pluginId: today
    command: today.cards.pair.ask
    version: 1.0.0
    description: "Ask a member who took part on the card to talk just you two; they are told in Activity unless they muted the card, and it opens once they agree. Asking a member who already asked agrees to their request. 20 an hour. (POST /api/today/cards/[cardId]/pair)."
    inputSchema:
      cardId:
        type: string
      partnerId:
        type: string
    outputSchema:
      conversation:
        type: object
    dataAccess:
      - commons_item_pair_requests
      - commons_item_answers
      - commons_item_messages
      - account_restrictions
      - member_blocks
      - member_mutes
      - notifications
    purpose: card_conversation
    retentionClass: until_account_deletion
    idempotency: false
  - pluginId: today
    command: today.cards.pair.agree
    version: 1.0.0
    description: "Agree to a Just us two request made to the viewer on this card. 30 an hour. (POST /api/today/cards/[cardId]/pair/agree)."
    inputSchema:
      cardId:
        type: string
      partnerId:
        type: string
    outputSchema:
      conversation:
        type: object
    dataAccess:
      - commons_item_pair_requests
      - commons_item_answers
      - commons_item_messages
      - account_restrictions
      - member_blocks
      - member_mutes
    purpose: card_conversation
    retentionClass: until_account_deletion
    idempotency: false
  - pluginId: today
    command: today.cards.report
    version: 1.0.0
    description: "Report a message the viewer can read in a card, or the card's author, into member_safety_reports with the card id and, for a message, its text cut to 500 characters. Never a self-report. 20 an hour. (POST /api/today/cards/[cardId]/report)."
    inputSchema:
      cardId:
        type: string
      messageId:
        type: string
      authorId:
        type: string
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - commons_item_messages
      - member_safety_reports
    purpose: card_conversation
    retentionClass: until_account_deletion
    idempotency: false
  - pluginId: today
    command: today.feedback.record
    version: 1.0.0
    description: "Count a Today card marked done (only the change to done, never back to not done) or Not for me: add one to the UTC day's total for the card's source and kind. Stores no account id and nothing about who marked it. 300 an hour per member. (POST /api/today/feedback)."
    inputSchema:
      source:
        type: string
        pattern: "^[a-z][a-z0-9-]{0,39}$"
      kind:
        type: string
        enum: [ask, offer, story, match, mood, numbers, replay, game]
      signal:
        type: string
        enum: [done, not_for_me]
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - today_card_feedback_counts
    purpose: today_card_feedback
    retentionClass: derived_medium_lived
    idempotency: false
  - pluginId: today
    command: today.feedback.admin.read
    version: 1.0.0
    description: "The last 30 days of Done and Not for me totals per card source and kind, with the share that is Not for me, most marks first, for the Adoption admin screen. Admin-only and read-only; counts only. (GET /api/admin/today-feedback)."
    inputSchema: {}
    outputSchema:
      days:
        type: integer
      lines:
        type: array
        description: "Each line: source, kind, done, notForMe, total, notForMeShare (a percent, rounded)."
    dataAccess:
      - today_card_feedback_counts
    purpose: today_card_feedback
    retentionClass: none_read_only
    idempotency: true
  - pluginId: today
    command: today.cards.close
    version: 1.0.0
    description: "The poster closes their own open ask from its Today card, with the outcome they pick: 'done' or 'not_done'. A goal is reached or withdrawn, a SocketRelay request closed or canceled, a ride request canceled; the outcome is kept in today_card_windows so unmet needs can be counted. Closed as done on the day's credit card, the first other member who answered I can help receives its 1 ServiceCredit (service-credits.today.daily-credit.grant). Poster only, at signed_in whatever their Unlock standing (owner decision, 2026-11-10); account restrictions apply; 20 a minute. (POST /api/today/cards/[cardId]/close)."
    inputSchema:
      cardId:
        type: string
      outcome:
        type: string
        enum: [done, not_done]
    outputSchema:
      ok:
        type: boolean
      outcome:
        type: string
    dataAccess:
      - today_card_windows
      - today_daily_credit_cards
      - commons_item_answers
      - peer_programming_goals
      - socket_relay_requests
      - socket_relay_request_events
      - trust_transport_requests
      - trust_transport_trips
    purpose: card_lifetime
    retentionClass: until_account_deletion
    idempotency: false
  - pluginId: today
    command: today.cards.renew
    version: 1.0.0
    description: "The poster keeps their own open ask or offer on Today for 14 more days from the tap (the card, or the day-14 notice in Activity). Refused on an ask with a deadline. Poster only, at signed_in whatever their Unlock standing (owner decision, 2026-11-10); account restrictions apply; 20 a minute. (POST /api/today/cards/[cardId]/renew)."
    inputSchema:
      cardId:
        type: string
    outputSchema:
      ok:
        type: boolean
      shownUntilIso:
        type: string
    dataAccess:
      - today_card_windows
      - peer_programming_goals
      - socket_relay_requests
      - trust_transport_requests
      - lighthouse_properties
      - mutual_time_events
    purpose: card_lifetime
    retentionClass: until_account_deletion
    idempotency: true
  - pluginId: today
    command: today.marks.save
    version: 1.0.0
    description: "Store the member's own mark on a Today card: done (the timeline dot), not_for_me (the ••• menu) or clear (Done taken away), or a batch of up to 500 with upload true, sent once by a device that kept marks before they were stored on the account (a card already marked keeps its mark). Scoped to the member's own rows. 600 an hour. (POST /api/today/marks)."
    inputSchema:
      cardId:
        type: string
      mark:
        type: string
        enum: [done, not_for_me, clear]
      marks:
        type: array
        maxItems: 500
      upload:
        type: boolean
    outputSchema:
      ok:
        type: boolean
      saved:
        type: integer
    dataAccess:
      - today_card_marks
    purpose: card_marks
    retentionClass: until_account_deletion
    idempotency: true
  - pluginId: today
    command: today.marks.list
    version: 1.0.0
    description: "List the member's own Today cards marked done or not_for_me that are still around, newest mark first, for Me → Read and Hidden. Read from the same sources as Today; at most 200 marks. (GET /api/today/marks?mark=done|not_for_me)."
    inputSchema:
      mark:
        type: string
        enum: [done, not_for_me]
    outputSchema:
      ok:
        type: boolean
      cards:
        type: array
        items: object
    dataAccess:
      - today_card_marks
    purpose: card_marks
    command: today.saves.list
    version: 1.0.0
    description: "List the member's own Save for later cards, newest first, up to 200, each with card id, kind, title, address and when it was saved, for Saved in Me (GET /api/today/saves)."
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      saves:
        type: array
    dataAccess:
      - today_card_saves
    purpose: card_saves
    retentionClass: none_read_only
    idempotency: true
  - pluginId: today
    command: today.saves.change
    version: 1.0.0
    description: "Save a story or replay from Today for later ({ cardId, saved: true, kind story or replay, title up to 300, href inside the app or https }), or take it off ({ cardId, saved: false }). Saving does not mark the card done and does not change how long it stays on Today. At most 200 saved per member (409 saves_full). Scoped to the member's own rows. 300 an hour. (POST /api/today/saves)."
    inputSchema:
      cardId:
        type: string
      saved:
        type: boolean
      kind:
        type: string
        enum: [story, replay]
      title:
        type: string
        maxLength: 300
      href:
        type: string
        maxLength: 1000
    outputSchema:
      ok:
        type: boolean
      result:
        type: string
        enum: [saved, removed]
    dataAccess:
      - today_card_saves
    purpose: card_saves
    retentionClass: until_account_deletion
    idempotency: true
  - pluginId: today
    command: today.renew_notices.run
    version: 1.0.0
    description: "Daily run (today-renew-notices.yml, CRON_SECRET): send the day-14 notice in Activity for every open ask and offer with no deadline whose 14 days on Today end within a day or ended in the past week, whether or not the poster opens the app. Keyed by card and window end, so a notice is never sent twice for one window. Answers counts only. (POST /api/internal/today/renew-notices)."
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      checked:
        type: integer
      due:
        type: integer
    dataAccess:
      - socket_relay_requests
      - trust_transport_requests
      - peer_programming_goals
      - lighthouse_properties
      - mutual_time_events
      - today_card_windows
      - notifications
      - notification_preferences
    purpose: card_lifetime
    retentionClass: none_read_only
    idempotency: true
