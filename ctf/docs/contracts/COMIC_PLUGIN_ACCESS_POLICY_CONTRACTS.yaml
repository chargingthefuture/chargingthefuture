policies:
  # ─── @comic message routing ────────────────────────────────────────────
  - pluginId: comic
    command: comic.message.route
    version: 1.0.0
    requiredRoles:
      - member
      - admin
    attributePolicies:
      tenancy: same_workspace
      contentModeration: required
      rateLimiting: required
      mentionGate: required
    consentRequirements:
      scopes:
        - feed_consumption
        - llm_processing
      fallbackLawfulBasis: legitimate_interest_safety_support
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - actor_not_authenticated
      - csrf_validation_failed
      - rate_limit_exceeded
      - content_policy_violation
      - llm_consent_missing

