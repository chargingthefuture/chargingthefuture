  - pluginId: comic
    command: comic.contribution.submit
    version: 1.1.0
    requiredRoles:
      - member
    # ANY signed-in member — deliberately looser than the rest of comic (owner decision, 2026-07-29).
    # Contributing is a route INTO verification: judging a contribution means opening the
    # contributor's Quora account, the same look Unlock asks for, so gating it behind Unlock would
    # review the same account twice.
    minUnlockTier: any_authenticated
    attributePolicies:
      tenancy: same_workspace
      # With no Quora URL on file, the submission opens a PENDING Unlock submission from the one
      # supplied. Never an auto-approval; the owner still reviews.
      maySeedPendingUnlockSubmission: true
      # Explicit, per-clause consent — every clause id must be present, and the version submitted
      # must match the wording currently served. This is the lawful basis for using the content, so
      # it is checked before the uploaded file is read at all.
      explicitConsentRequired: true
      consentVersionMustMatch: true
      # The archive is parsed in memory and discarded with the request; nothing is written to disk.
      uploadedFileNeverStored: true
      # Allowlist: only public sections survive intake. Inbox messages, drafts, and profile data are
      # dropped before any human reads the submission.
      privateSectionsStrippedBeforeReview: true
      rateLimitPerUserPerDay: 5
    consentRequirements:
      scopes:
        - comic_knowledge_contribution
      # Consent is the basis here, not legitimate interest — a contribution without it is unusable.
      fallbackLawfulBasis: none
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - actor_not_authenticated
      - consent_not_granted
      - consent_version_mismatch
      - archive_not_readable
      - rate_limit_exceeded

  - pluginId: comic
    command: comic.contribution.withdraw
    version: 1.1.0
    requiredRoles:
      - member
    minUnlockTier: any_authenticated
    attributePolicies:
      tenancy: same_workspace
      # A member may only withdraw their own contribution; ownership is enforced inside the query.
      ownerOnly: true
      # Withdrawal deactivates the knowledge rows in the same transaction, so the assistant cannot
      # still be quoting a contribution that reads as withdrawn.
      deactivatesKnowledgeRowsAtomically: true
    consentRequirements:
      scopes:
        - comic_knowledge_contribution
      fallbackLawfulBasis: none
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - actor_not_authenticated
      - contribution_not_found
      - contribution_not_owned

  - pluginId: comic
    command: comic.contribution.review
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      tenancy: same_workspace
      adminRouteGuard: required
      # Only an accept promotes anything. Until then a contribution is inert — it cannot reach the
      # assistant, which is what the knowledge page promises the contributor.
      promotionRequiresHumanAccept: true
      # A decline the contributor cannot understand reads as a judgment on what they lived through.
      declineReasonRequired: true
      # ServiceCredits recognition lands only for a member who has finished Unlock. Contributing is
      # open to anyone signed in; the grant is the part that waits. This also puts a real cost in
      # front of the obvious abuse — paying for contributions invites poisoned material.
      grantRequiresUnlockedContributor: true
      grantIdempotentPerContribution: true
    consentRequirements:
      scopes:
        - feed_admin_governance
      fallbackLawfulBasis: legitimate_interest_safety_support
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - actor_not_admin
      - contribution_not_pending
      - decline_reason_missing
