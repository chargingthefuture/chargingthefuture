# Contributions plugin audit events. Written to contributions_audit_log.
#
# Privacy rules:
# - A gift card code is NEVER written to audit metadata or logs. The reveal event records only
#   which claim, whose claim, and whether a code was shown.
# - Reading the member's own history (contributions.status.get) is not audited.
auditEvents:
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: contributions
    command: contributions.submission.create
    commandVersion: 2.0.0
    purpose: voluntary_contribution_claim
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - contributions_submissions
    targetContext:
      userId: user_identifier
      submissionId: submission_identifier
      kind: contribution_kind
      method: gift_card_method
      claimedAmountUsd: usd_amount
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: contributions
    command: contributions.admin.submission.list
    commandVersion: 2.0.0
    purpose: moderation_queue
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - contributions_submissions
    targetContext:
      adminUserId: user_identifier
      statusFilter: status_filter
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  # One row per reveal, successful or not. metadata is {targetUserId, revealed}; never the code.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: contributions
    command: contributions.admin.code.reveal
    commandVersion: 1.0.0
    purpose: gift_card_redemption
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - contributions_submissions
    targetContext:
      adminUserId: user_identifier
      submissionId: submission_identifier
      targetUserId: user_identifier
      revealed: boolean
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  # The review route emits two distinct actions, one per outcome, not a single
  # .review action: contributions.admin.submission.confirm and
  # contributions.admin.submission.reject.
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: contributions
    command: contributions.admin.submission.confirm
    commandVersion: 2.0.0
    purpose: moderation_and_thank_you_grant
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - contributions_submissions
      - contributions_runtime_config
      - service_credits_governance_events
      - service_credits_ledger_entries
    targetContext:
      adminUserId: user_identifier
      submissionId: submission_identifier
      targetUserId: user_identifier
      kind: contribution_kind
      confirmedAmountUsd: usd_amount
      creditsGranted: credit_amount
      creditGovernanceEventId: governance_event_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: contributions
    command: contributions.admin.submission.reject
    commandVersion: 2.0.0
    purpose: moderation
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - contributions_submissions
    targetContext:
      adminUserId: user_identifier
      submissionId: submission_identifier
      targetUserId: user_identifier
      kind: contribution_kind
      confirmedAmountUsd: usd_amount
      creditsGranted: credit_amount
      creditGovernanceEventId: governance_event_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: contributions
    command: contributions.admin.config.update
    commandVersion: 2.0.0
    purpose: configuration_update
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - contributions_runtime_config
    targetContext:
      adminUserId: user_identifier
      changedKnobs: config_field_names
      resultingConfig: creditsPerUsd_and_perUserYearCreditCap
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class
