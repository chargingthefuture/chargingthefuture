policies:
  - pluginId: contributor-access
    command: contributor-access.config.get
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      tenancy: same_workspace
    consentRequirements:
      scopes:
        - contributor_access_admin
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - insufficient_role

  - pluginId: contributor-access
    command: contributor-access.config.update
    version: 1.1.0
    requiredRoles:
      - admin
    attributePolicies:
      tenancy: same_workspace
      csrfHeader: required
      weightKeys: fixed_value_event_keys_only
      channelOpenPrecondition: eligible_count_at_least_min_eligible_to_open_channel
    consentRequirements:
      scopes:
        - contributor_access_admin
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - csrf_denied
      - invalid_payload
      - contributor_access_channel_below_minimum

  - pluginId: contributor-access
    command: contributor-access.eligible.list
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      tenancy: same_workspace
      outputScope: categorical_only_no_score
    consentRequirements:
      scopes:
        - contributor_access_admin
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - insufficient_role

  - pluginId: contributor-access
    command: contributor-access.member.revoke
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      tenancy: same_workspace
      csrfHeader: required
      revokeReason: non_empty_required
      revokeBasis: for_cause_only
    consentRequirements:
      scopes:
        - contributor_access_admin
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - csrf_denied
      - missing_reason
      - no_earned_eligibility

  - pluginId: contributor-access
    command: contributor-access.member.reinstate
    version: 1.0.0
    requiredRoles:
      - admin
    attributePolicies:
      tenancy: same_workspace
      csrfHeader: required
    consentRequirements:
      scopes:
        - contributor_access_admin
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - csrf_denied
      - not_revoked

  - pluginId: contributor-access
    command: contributor-access.eligibility.recompute
    version: 1.0.0
    requiredRoles: []
    attributePolicies:
      authentication: internal_service_secret_bearer
      callerScope: service_to_service_only
    consentRequirements:
      scopes: []
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - secret_unconfigured
      - invalid_bearer_token

  - pluginId: contributor-access
    command: contributor-access.channel.membership.sync
    version: 1.0.0
    requiredRoles: []
    attributePolicies:
      callerScope: server_internal_only_no_route
      membershipSource: eligibility_flag_only
      runsOnlyWhen: channel_open_true
      failureMode: guarded_never_fails_invoker
    consentRequirements:
      scopes: []
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - channel_closed
      - stream_unconfigured

  - pluginId: contributor-access
    command: contributor-access.channel.messages.list
    version: 1.0.0
    requiredRoles:
      - member
      - admin
    attributePolicies:
      tenancy: same_workspace
      channelGate: channel_open_and_eligibility_flag_or_admin
      denyShape: bare_404_no_channel_trace
      outputScope: member_content_no_score
    consentRequirements:
      scopes: []
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
