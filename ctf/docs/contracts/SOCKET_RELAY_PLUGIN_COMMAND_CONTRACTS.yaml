contracts:
  - pluginId: socket-relay
    command: socket-relay.request.create
    version: 1.2.0
    description: >-
      Create a relay request with ownership and lifecycle defaults. The request object
      carries title, details, tags (1-3 free-text tags, each up to 64 chars; a legacy
      single `category` string is still accepted and treated as one tag), optional
      location (city/state/country — defaulting from the member's directory profile in
      the create form, but overridable per request), isPublic (retained for backward
      compatibility but inert — v3 is members-only, so it no longer affects who can view a
      request; there is no public board), the settlement value type (priceCurrency +
      priceAmount), and acceptedCurrencies — a multi-select of every currency the poster
      accepts (split settlements, e.g. part ServiceCredits and part USD). Accepted codes
      are validated against the active currencies catalog; unknown/inactive codes are
      dropped, never a fiat-parity claim for ServiceCredits.
    inputSchema:
      request:
        type: object
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      requestId:
        type: string
      status:
        type: string
    dataAccess:
      - socket_relay_requests
      - socket_relay_request_events
      - socket_relay_request_accepted_currencies
      - currencies
    purpose: request_lifecycle
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: socket-relay
    command: socket-relay.request.update
    version: 1.1.0
    description: >-
      Owner (or admin) edits an existing relay request: title, details, tags (1-3,
      same rules as create), location (city/state/country), isPublic (retained but
      inert — see create; v3 is members-only), the settlement value type, and
      acceptedCurrencies (replace semantics: the stored set is cleared and re-written
      from the validated request payload). Lifecycle status is not changed here.
    inputSchema:
      requestId:
        type: string
        required: true
      request:
        type: object
        required: true
    outputSchema:
      requestId:
        type: string
      status:
        type: string
    dataAccess:
      - socket_relay_requests
      - socket_relay_request_events
      - socket_relay_request_accepted_currencies
      - currencies
    purpose: request_lifecycle
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: socket-relay
    command: socket-relay.fulfillment.claim
    version: 1.1.0
    description: >-
      Claim an eligible request for fulfillment. A helper whose earlier claim on the same request
      was canceled by the requester (resolve outcome unsuccessful_reopen) is not eligible to claim
      it again — the reopen is for other helpers (helper_previously_canceled, 409).
    inputSchema:
      requestId:
        type: string
        required: true
    outputSchema:
      fulfillmentId:
        type: string
      status:
        type: string
    dataAccess:
      - socket_relay_requests
      - socket_relay_fulfillments
      - socket_relay_request_events
      - member_blocks
    purpose: fulfillment_lifecycle
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: socket-relay
    command: socket-relay.fulfillment.resolve
    version: 1.0.0
    description: >-
      Requester-only resolution of a claimed request. The requester picks an outcome:
      successful / no_longer_needed close the request; unsuccessful_reopen cancels the helper and
      returns the request to open; unsuccessful_close closes it. Helpers cannot resolve.
    inputSchema:
      fulfillmentId:
        type: string
        required: true
      outcome:
        type: string
        required: true
        enum:
          - successful
          - no_longer_needed
          - unsuccessful_reopen
          - unsuccessful_close
    outputSchema:
      status:
        type: string
    dataAccess:
      - socket_relay_requests
      - socket_relay_fulfillments
      - socket_relay_request_events
    purpose: fulfillment_lifecycle
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: socket-relay
    command: socket-relay.fulfillment.message.send
    version: 1.0.0
    description: Send a participant-scoped message in a fulfillment thread.
    inputSchema:
      fulfillmentId:
        type: string
        required: true
      messageText:
        type: string
        required: true
      clientMessageId:
        type: string
        required: true
    outputSchema:
      messageId:
        type: string
      sentAt:
        type: string
    dataAccess:
      - socket_relay_messages
      - socket_relay_fulfillment_participants
    purpose: fulfillment_communication
    retentionClass: communication_medium_lived
    idempotency: true

  - pluginId: socket-relay
    command: socket-relay.service-credits.send
    version: 1.0.0
    description: >-
      Send a positive ServiceCredits amount from the signed-in member to another member from a
      SocketRelay surface. The canonical ledger lives in the ServiceCredits plugin; this command
      initiates the transfer (via createTransfer) and is declared here so the cross-plugin data
      access path is explicit and the mutation is audited at the SocketRelay boundary.
    inputSchema:
      toUserId:
        type: string
        required: true
      amount:
        type: number
        required: true
      message:
        type: string
        required: false
      idempotencyKey:
        type: string
        required: false
    outputSchema:
      transaction:
        type: object
    dataAccess:
      - service_credits_wallets
      - service_credits_transfers
      - service_credits_ledger_entries
    purpose: value_transfer
    retentionClass: transactional_long_lived
    idempotency: true
