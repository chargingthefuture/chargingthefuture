auditEvents:
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: contributor-access
    command: contributor-access.config.get
    commandVersion: 1.0.0
    purpose: eligibility_configuration
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - contributor_access_config
    targetContext:
      configId: singleton
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: contributor-access
    command: contributor-access.config.update
    commandVersion: 1.0.0
    purpose: eligibility_configuration
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - contributor_access_config
    targetContext:
      configId: singleton
      updatedFields: config_update_payload
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: contributor-access
    command: contributor-access.eligible.list
    commandVersion: 1.0.0
    purpose: eligibility_review
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - contributor_access_eligibility
      - users
    targetContext:
      listScope: earned_eligibility_rows
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: contributor-access
    command: contributor-access.member.revoke
    commandVersion: 1.0.0
    purpose: eligibility_moderation
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - contributor_access_eligibility
    targetContext:
      memberId: member_user_id
      revokedReason: for_cause_reason_text
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: contributor-access
    command: contributor-access.member.reinstate
    commandVersion: 1.0.0
    purpose: eligibility_moderation
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - contributor_access_eligibility
    targetContext:
      memberId: member_user_id
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: internal_service
    pluginId: contributor-access
    command: contributor-access.eligibility.recompute
    commandVersion: 1.0.0
    purpose: eligibility_recompute
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - contributor_access_config
      - contributor_access_eligibility
      - upstream_plugin_value_event_tables
    targetContext:
      evaluatedCount: member_count
      eligibleCount: member_count
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

changelog:
  - date: 2026-07-18
    change: >-
      Initial Contributor Access audit contract. Every admin allow AND deny writes a
      contributor_access_audit_trail row (actor, command, policy status, reason, target,
      metadata); the internal recompute is bearer-secret gated and its response carries counts
      only - never per-member data or a score.
