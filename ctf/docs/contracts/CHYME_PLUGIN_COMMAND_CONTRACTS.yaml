contracts:
  - pluginId: chyme
    command: chyme.room.state.fetch
    version: 1.0.0
    description: Fetch Chyme room state and upsert caller as active participant profile/member.
    inputSchema:
      roomKey:
        type: string
        required: false
        default: chyme-main-room
    outputSchema:
      roomId:
        type: string
      roomName:
        type: string
      roomKey:
        type: string
      callActive:
        type: boolean
      participants:
        type: array
    dataAccess:
      - chyme_rooms
      - chyme_service_profiles
      - chyme_room_members
    purpose: social_audio_presence
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.messages.list
    version: 1.0.0
    description: Read bounded Chyme message history for the deterministic room.
    inputSchema:
      limit:
        type: number
        required: false
        minimum: 1
        maximum: 100
    outputSchema:
      roomKey:
        type: string
      messages:
        type: array
    dataAccess:
      - chyme_rooms
      - chyme_service_profiles
      - chyme_room_members
      - chyme_messages
    purpose: social_audio_chat_read
    retentionClass: communication_medium_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.message.send
    version: 1.0.0
    description: Send a trimmed Chyme chat message after policy and size validation.
    inputSchema:
      text:
        type: string
        required: true
        minLength: 1
        maxLength: 1000
    outputSchema:
      ok:
        type: boolean
      message:
        type: object
    dataAccess:
      - chyme_rooms
      - chyme_service_profiles
      - chyme_room_members
      - chyme_messages
    purpose: social_audio_chat_write
    retentionClass: communication_medium_lived
    idempotency: false

  - pluginId: chyme
    command: chyme.call.join
    version: 1.0.0
    description: Provision Stream token and channel membership for Chyme room join flow.
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      roomId:
        type: string
      roomKey:
        type: string
      streamApiKey:
        type: string
      streamChannelId:
        type: string
      streamUserId:
        type: string
      streamToken:
        type: string
    dataAccess:
      - chyme_rooms
      - chyme_service_profiles
      - chyme_room_members
      - stream_channel_metadata
      - stream_user_token_metadata
    purpose: social_audio_call_join
    retentionClass: operational_medium_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.hand
    version: 1.0.0
    description: Persist the caller's raise/lower hand on their room presence row so the raised hand stays visible to everyone until lowered or the member leaves.
    inputSchema:
      raised:
        type: boolean
        required: true
    outputSchema:
      ok:
        type: boolean
      room:
        type: object
    dataAccess:
      - chyme_rooms
      - chyme_service_profiles
      - chyme_room_members
    purpose: social_audio_presence
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.back-channel.invite
    version: 1.0.0
    description: Invite another member who is in the same live room to a free 1:1 audio Back Channel. Block-aware (rejected either direction) and room-bound (both must be present). No credits.
    inputSchema:
      recipientUserId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
      callId:
        type: string
    dataAccess:
      - chyme_rooms
      - chyme_room_members
      - chyme_back_channel_calls
      - member_blocks
    purpose: social_audio_back_channel_invite
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.back-channel.accept
    version: 1.0.0
    description: Recipient accepts a Back Channel invite; the call goes live and Stream 1:1 audio join credentials are returned. Consent gate — no cold ringing.
    inputSchema:
      callId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
      callId:
        type: string
      streamCallId:
        type: string
      streamApiKey:
        type: string
      streamUserId:
        type: string
      streamToken:
        type: string
    dataAccess:
      - chyme_back_channel_calls
      - stream_user_token_metadata
    purpose: social_audio_back_channel_accept
    retentionClass: operational_medium_lived
    idempotency: false

  - pluginId: chyme
    command: chyme.back-channel.join
    version: 1.0.0
    description: Mint Stream 1:1 audio join credentials for a member already part of an active Back Channel call (the initiator, once the invite was accepted).
    inputSchema:
      callId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
      callId:
        type: string
      streamCallId:
        type: string
      streamApiKey:
        type: string
      streamUserId:
        type: string
      streamToken:
        type: string
    dataAccess:
      - chyme_back_channel_calls
      - stream_user_token_metadata
    purpose: social_audio_back_channel_join
    retentionClass: operational_medium_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.back-channel.decline
    version: 1.0.0
    description: Recipient declines a Back Channel invite. Returns only ok; no message is sent to the initiator.
    inputSchema:
      callId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - chyme_back_channel_calls
    purpose: social_audio_back_channel_decline
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.back-channel.leave
    version: 1.0.0
    description: Either party hangs up (or the initiator cancels a still-pending invite). Terminal; no history is retained.
    inputSchema:
      callId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - chyme_back_channel_calls
    purpose: social_audio_back_channel_leave
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.profile.delete.service
    version: 1.0.0
    description: Execute service-scoped Chyme deletion and record compliance event.
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      scope:
        type: string
      status:
        type: string
      requestedAtIso:
        type: string
    dataAccess:
      - chyme_service_profiles
      - chyme_room_members
      - chyme_messages
      - chyme_back_channel_calls
      - chyme_deletion_events
    purpose: service_scoped_deletion
    retentionClass: compliance_long_lived
    idempotency: true

  - pluginId: chyme
    command: account.profile.delete.full
    version: 1.0.0
    description: Record full-account deletion request for global orchestrator processing.
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      scope:
        type: string
      status:
        type: string
      requestedAtIso:
        type: string
    dataAccess:
      - chyme_deletion_events
      - service_credits_reclaim_dependency
    purpose: account_scoped_deletion_request
    retentionClass: compliance_long_lived
    idempotency: true
