contracts:
  - pluginId: chyme
    command: chyme.room.state.fetch
    version: 1.0.0
    description: Fetch Chyme room state and upsert caller as active participant profile/member.
    inputSchema:
      roomKey:
        type: string
        required: false
        default: chyme-main-room
    outputSchema:
      roomId:
        type: string
      roomName:
        type: string
      roomKey:
        type: string
      callActive:
        type: boolean
      participants:
        type: array
    dataAccess:
      - chyme_rooms
      - chyme_service_profiles
      - chyme_room_members
    purpose: social_audio_presence
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.messages.list
    version: 1.0.0
    description: Read bounded Chyme message history for the deterministic room.
    inputSchema:
      limit:
        type: number
        required: false
        minimum: 1
        maximum: 100
    outputSchema:
      roomKey:
        type: string
      messages:
        type: array
    dataAccess:
      - chyme_rooms
      - chyme_service_profiles
      - chyme_room_members
      - chyme_messages
    purpose: social_audio_chat_read
    retentionClass: communication_medium_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.message.send
    version: 1.0.0
    description: Send a trimmed Chyme chat message after policy and size validation.
    inputSchema:
      text:
        type: string
        required: true
        minLength: 1
        maxLength: 1000
    outputSchema:
      ok:
        type: boolean
      message:
        type: object
    dataAccess:
      - chyme_rooms
      - chyme_service_profiles
      - chyme_room_members
      - chyme_messages
    purpose: social_audio_chat_write
    retentionClass: communication_medium_lived
    idempotency: false

  - pluginId: chyme
    command: chyme.call.join
    version: 1.1.0
    description: Provision Stream token and channel membership for Chyme room join flow. Refused (409 CHYME_ROOM_FULL) when the room already holds as many members as the Stream quota policy's cap allows; checked before the Stream mint and again under a lock on the room row. Credits the presence gap to the Stream Video minute meter.
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      roomId:
        type: string
      roomKey:
        type: string
      streamApiKey:
        type: string
      streamChannelId:
        type: string
      streamUserId:
        type: string
      streamToken:
        type: string
    dataAccess:
      - chyme_rooms
      - chyme_service_profiles
      - chyme_room_members
      - stream_video_usage_daily
      - stream_channel_metadata
      - stream_user_token_metadata
    purpose: social_audio_call_join
    retentionClass: operational_medium_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.hand
    version: 1.0.0
    description: Persist the caller's raise/lower hand on their room presence row so the raised hand stays visible to everyone until lowered or the member leaves.
    inputSchema:
      raised:
        type: boolean
        required: true
    outputSchema:
      ok:
        type: boolean
      room:
        type: object
    dataAccess:
      - chyme_rooms
      - chyme_service_profiles
      - chyme_room_members
    purpose: social_audio_presence
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.back-channel.invite
    version: 1.0.0
    description: Invite another member who is in the same live room to a free 1:1 audio Back Channel. Block-aware (rejected either direction) and room-bound (both must be present). No credits.
    inputSchema:
      recipientUserId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
      callId:
        type: string
    dataAccess:
      - chyme_rooms
      - chyme_room_members
      - chyme_back_channel_calls
      - member_blocks
    purpose: social_audio_back_channel_invite
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.back-channel.accept
    version: 1.0.0
    description: Recipient accepts a Back Channel invite; the call goes live and Stream 1:1 audio join credentials are returned. Consent gate — no cold ringing.
    inputSchema:
      callId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
      callId:
        type: string
      streamCallId:
        type: string
      streamApiKey:
        type: string
      streamUserId:
        type: string
      streamToken:
        type: string
    dataAccess:
      - chyme_back_channel_calls
      - stream_user_token_metadata
    purpose: social_audio_back_channel_accept
    retentionClass: operational_medium_lived
    idempotency: false

  - pluginId: chyme
    command: chyme.back-channel.join
    version: 1.0.0
    description: Mint Stream 1:1 audio join credentials for a member already part of an active Back Channel call (the initiator, once the invite was accepted).
    inputSchema:
      callId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
      callId:
        type: string
      streamCallId:
        type: string
      streamApiKey:
        type: string
      streamUserId:
        type: string
      streamToken:
        type: string
    dataAccess:
      - chyme_back_channel_calls
      - stream_user_token_metadata
    purpose: social_audio_back_channel_join
    retentionClass: operational_medium_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.back-channel.decline
    version: 1.0.0
    description: Recipient declines a Back Channel invite. Returns only ok; no message is sent to the initiator.
    inputSchema:
      callId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - chyme_back_channel_calls
    purpose: social_audio_back_channel_decline
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.back-channel.leave
    version: 1.0.0
    description: Either party hangs up (or the initiator cancels a still-pending invite). Terminal; no history is retained.
    inputSchema:
      callId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - chyme_back_channel_calls
    purpose: social_audio_back_channel_leave
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.public.room.read
    version: 1.0.0
    description: Public, unauthenticated, read-only. Whether the one default room is live, how many members and signed-out listeners are in it, and whether listening without an account is open under the Stream quota policy. Touches nothing on Stream (since 2026-09-19 the guest identity is minted on the tap, by chyme.public.listen).
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      isLive:
        type: boolean
      participantCount:
        type: number
      guestCount:
        type: number
      guestListenAllowed:
        type: boolean
      listenUnavailable:
        type: string
    dataAccess:
      - chyme_rooms
      - chyme_room_members
      - chyme_guest_listeners
      - stream_video_usage_daily
    purpose: social_audio_public_listen
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.public.listen
    version: 1.0.0
    description: Public, unauthenticated; the visitor's tap. Admits one signed-out listener under the guest cap and the Stream quota policy (one transaction, room row locked), sets or reads the browser's random guest-id cookie, and mints that browser's one listen-only Stream identity (chyme-guest-<id>, one-hour token, restricted role when CHYME_GUEST_STREAM_ROLE is set). Refuses with the plain reason when the room is not live, guests are paused, every spot is taken, or Stream refused. Same-origin CSRF header required; per-IP rate limited.
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      isLive:
        type: boolean
      participantCount:
        type: number
      guestCount:
        type: number
      credentials:
        type: object
    dataAccess:
      - chyme_rooms
      - chyme_room_members
      - chyme_guest_listeners
      - stream_video_usage_daily
      - stream_user_token_metadata
    purpose: social_audio_public_listen
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.public.heartbeat
    version: 1.0.0
    description: Public, unauthenticated. The signed-out listener's presence keepalive (every 35s while listening), identified by the guest-id cookie. Refreshes the roster row and credits the gap since the previous beat to the Stream Video minute meter. Same-origin CSRF header required; per-IP rate limited.
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - chyme_guest_listeners
      - stream_video_usage_daily
    purpose: social_audio_public_listen
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.public.leave
    version: 1.0.0
    description: Public, unauthenticated. Drops the signed-out listener's roster row so the spot frees at once; the cookie stays. Same-origin CSRF header required; per-IP rate limited.
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - chyme_guest_listeners
    purpose: social_audio_public_listen
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.admin.stream-usage.read
    version: 1.0.0
    description: Admin-only, read-only. The Stream Video minute meter (month-to-date participant-minutes against STREAM_VIDEO_MINUTES_BUDGET, band, projection, per-surface and per-day rows), the quota policy in force, the main room's live state, and the four settings. Feeds the Live Audio Usage screen at /admin/chyme.
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      usage:
        type: object
      policy:
        type: object
      room:
        type: object
      config:
        type: object
    dataAccess:
      - stream_video_usage_daily
      - chyme_rooms
      - chyme_room_members
      - chyme_guest_listeners
    purpose: stream_quota_observability
    retentionClass: derived_short_lived
    idempotency: true

  # Moderation (owner decision, 2026-09-19). Admin-only; every command writes a durable row in
  # chyme_admin_audit_trail and applies the change in the Stream call (lib/chyme/stream-moderation.ts).
  # The database row is the record of the decision; a Stream failure is reported in the answer
  # (streamNotice), never turned into a failed action.
  - pluginId: chyme
    command: chyme.admin.mute
    version: 1.0.0
    description: Turn a member's microphone off in the room's Stream call. Nothing stored beyond the audit row.
    inputSchema:
      userId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
      streamApplied:
        type: boolean
      streamNotice:
        type: string
    dataAccess:
      - chyme_admin_audit_trail
      - stream_call_metadata
    purpose: social_audio_moderation
    retentionClass: compliance_long_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.admin.remove
    version: 1.0.0
    description: Remove a member from the room and keep them out — presence row deleted, a chyme_room_removals row kept until lifted (join and heartbeat answer 403 CHYME_REMOVED_FROM_ROOM), and the member blocked from the Stream call.
    inputSchema:
      userId:
        type: string
        required: true
      reason:
        type: string
        required: false
        maxLength: 300
    outputSchema:
      ok:
        type: boolean
      username:
        type: string
      streamApplied:
        type: boolean
      streamNotice:
        type: string
    dataAccess:
      - chyme_rooms
      - chyme_room_members
      - chyme_room_removals
      - chyme_admin_audit_trail
      - stream_call_metadata
    purpose: social_audio_moderation
    retentionClass: compliance_long_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.admin.lift-removal
    version: 1.0.0
    description: Let a removed member back in — the removal row is lifted (kept as the record) and the member unblocked from the Stream call. 409 when there was no live removal.
    inputSchema:
      userId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
      streamApplied:
        type: boolean
      streamNotice:
        type: string
    dataAccess:
      - chyme_rooms
      - chyme_room_removals
      - chyme_admin_audit_trail
      - stream_call_metadata
    purpose: social_audio_moderation
    retentionClass: compliance_long_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.admin.role
    version: 1.0.0
    description: Hand-raise mode — let a present member speak, or move them back to listening (which also mutes them in the call). Sets chyme_room_members.role and, when CHYME_GUEST_STREAM_ROLE is configured, the member's role on the Stream call. 409 when the member is not in the room.
    inputSchema:
      userId:
        type: string
        required: true
      role:
        type: string
        required: true
        enum: [speaker, listener]
    outputSchema:
      ok:
        type: boolean
      username:
        type: string
      role:
        type: string
      streamApplied:
        type: boolean
      streamNotice:
        type: string
    dataAccess:
      - chyme_rooms
      - chyme_room_members
      - chyme_admin_audit_trail
      - stream_call_metadata
    purpose: social_audio_moderation
    retentionClass: compliance_long_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.admin.speak-mode
    version: 1.0.0
    description: Switch the room between open mic (every joiner may speak; the default) and hand-raise mode (a joiner listens until an admin lets them speak). Switching to hand-raise turns everyone present except the acting admin into a listener and mutes them in the call.
    inputSchema:
      mode:
        type: string
        required: true
        enum: [open, hand_raise]
    outputSchema:
      ok:
        type: boolean
      mode:
        type: string
      demoted:
        type: number
      streamApplied:
        type: boolean
      streamNotice:
        type: string
    dataAccess:
      - chyme_rooms
      - chyme_room_members
      - chyme_admin_audit_trail
      - stream_call_metadata
    purpose: social_audio_moderation
    retentionClass: compliance_long_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.admin.removals.read
    version: 1.0.0
    description: Admin-only, read-only. Every member currently removed from a Chyme room, newest first, for the Chyme admin screen.
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      removals:
        type: array
    dataAccess:
      - chyme_room_removals
      - chyme_rooms
    purpose: social_audio_moderation
    retentionClass: compliance_long_lived
    idempotency: true

  - pluginId: chyme
    command: chyme.profile.delete.service
    version: 1.0.0
    description: Execute service-scoped Chyme deletion and record compliance event.
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      scope:
        type: string
      status:
        type: string
      requestedAtIso:
        type: string
    dataAccess:
      - chyme_service_profiles
      - chyme_room_members
      - chyme_messages
      - chyme_back_channel_calls
      - chyme_deletion_events
    purpose: service_scoped_deletion
    retentionClass: compliance_long_lived
    idempotency: true

  - pluginId: chyme
    command: account.profile.delete.full
    version: 1.0.0
    description: Record full-account deletion request for global orchestrator processing.
    inputSchema: {}
    outputSchema:
      ok:
        type: boolean
      scope:
        type: string
      status:
        type: string
      requestedAtIso:
        type: string
    dataAccess:
      - chyme_deletion_events
      - service_credits_reclaim_dependency
    purpose: account_scoped_deletion_request
    retentionClass: compliance_long_lived
    idempotency: true
