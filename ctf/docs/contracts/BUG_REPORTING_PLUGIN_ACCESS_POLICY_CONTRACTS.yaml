# Bug Reporting access policy.
#
# Written from the code as it stands on 2026-10-04 (docs only; no behavior changed). The gates live
# in ctf/packages/web/app/api/bug-reports/_lib.ts and call evaluatePluginAccess
# (ctf/packages/web/lib/auth/server-authz.ts).
#
# Two postures:
#   - Filing a report needs only a signed-in account. It is Unlock-exempt machinery, not a feature
#     exception: the member most likely to hit a bug is the one stuck in onboarding, and gating this
#     would silence exactly them. Listed in ctf/config/unlock-tier-exception-allowlist.json (kind
#     `machinery`, file app/api/bug-reports/_lib.ts) and enforced by
#     ctf/scripts/check-unlock-tier-exceptions.mjs.
#   - Everything under /api/bug-reports/admin needs the admin role. The tier is left at the
#     approved_full default, but evaluatePluginAccess lets an admin past the tier and restriction
#     checks, so the role is the real gate.
#
# denyConditions use the codes the routes actually return. The two AUTH_* codes come from the shared
# deny body (lib/auth/deny-taxonomy.ts); the bug_reports.* codes come from
# lib/bug-reports/constants.ts.
policies:
  - pluginId: bug-reports
    command: bug-reports.report.submit
    version: 1.0.0
    requiredRoles: []
    requiresAuthentication: true
    minUnlockTier: any_authenticated
    attributePolicies:
      tenancy: same_workspace
      unlockGated: false
      accountRestrictionChecked: false
      ownRowsOnly: enforced
      csrf: x-ctf-csrf header must be "1"; Origin, when sent, must be the same host
      rateLimit: 5 reports per person in a rolling 10 minutes
    consentRequirements:
      scopes:
        - product_problem_reporting
      fallbackLawfulBasis: legitimate_interest_service_operation
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - AUTH_UNAUTHORIZED (401) — not signed in
      - bug_reports.csrf_denied (403) — x-ctf-csrf header missing or not "1"
      - bug_reports.csrf_denied (403) — Origin header cannot be parsed
      - bug_reports.csrf_denied (403) — Origin header is from another host
      - bug_reports.invalid_payload (400) — body is not valid JSON, or message is missing or blank
      - bug_reports.rate_limited (429) — 5 or more reports from this person in the last 10 minutes
    notes: >-
      No role is checked: any signed-in account passes, whatever its Unlock tier. Because the tier is
      any_authenticated, evaluatePluginAccess also skips the full-account restriction check, so a
      member under an `all`-scope restriction can still file a report. A not-yet-verified member is
      the person this is kept open for. Submission is not written to an audit trail; the stored row
      itself (user_id, created_at) is the record that the person filed it.

  - pluginId: bug-reports
    command: bug-reports.admin.list
    version: 1.0.0
    requiredRoles:
      - admin
    requiresAuthentication: true
    minUnlockTier: approved_full
    attributePolicies:
      tenancy: same_workspace
      rawTextExposed: false
      reporterIdentityExposed: admin_surface_only
    consentRequirements:
      scopes:
        - product_problem_triage
      fallbackLawfulBasis: legitimate_interest_service_operation
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - AUTH_UNAUTHORIZED (401) — not signed in
      - AUTH_FORBIDDEN_ROLE (403) — signed in without the admin role
    notes: >-
      Read only, so no CSRF check. Returns redacted text, never raw_message or raw_context, and
      includes the reporter's username and handle so the admin can follow up. Reads are not audited.

  - pluginId: bug-reports
    command: bug-reports.admin.resolve
    version: 1.0.0
    requiredRoles:
      - admin
    requiresAuthentication: true
    minUnlockTier: approved_full
    attributePolicies:
      tenancy: same_workspace
      csrf: x-ctf-csrf header must be "1"; Origin, when sent, must be the same host
      allowedTransitions: release held_for_review to new; reject held_for_review or new to rejected
    consentRequirements:
      scopes:
        - product_problem_triage
      fallbackLawfulBasis: legitimate_interest_service_operation
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - AUTH_UNAUTHORIZED (401) — not signed in
      - AUTH_FORBIDDEN_ROLE (403) — signed in without the admin role
      - bug_reports.csrf_denied (403) — x-ctf-csrf header missing, or Origin unparseable or from another host
      - bug_reports.invalid_payload (400) — report id is not a UUID, body is not valid JSON, or action is not release or reject
      - bug_reports.forbidden (409) — report missing or not in a status the action can move (audited as deny, reason not_resolvable)
    notes: >-
      Every attempt that reaches the status update writes a bug_report_admin_audit_trail row: success,
      the 409 refusal, and a database failure. The 401, 403 and 400 refusals happen before that step
      and are not audited.

  - pluginId: bug-reports
    command: bug-reports.admin.audit-events.list
    version: 1.0.0
    requiredRoles:
      - admin
    requiresAuthentication: true
    minUnlockTier: approved_full
    attributePolicies:
      tenancy: same_workspace
      reportContentExposed: false
    consentRequirements:
      scopes:
        - admin_accountability
      fallbackLawfulBasis: legitimate_interest_service_operation
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - AUTH_UNAUTHORIZED (401) — not signed in
      - AUTH_FORBIDDEN_ROLE (403) — signed in without the admin role
    notes: >-
      Read only, so no CSRF check. Returns admin ids and report ids, never report text or the
      reporter. Reads of the trail are not themselves audited.
