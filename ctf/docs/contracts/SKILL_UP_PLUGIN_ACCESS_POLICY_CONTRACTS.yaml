policies:
  - pluginId: skill-up
    command: cohort.create
    version: 1.0.0
    requiredRoles:
      - admin
      - trainer
    attributePolicies:
      tenancy: same_workspace
      profileStatus: approved_user_or_admin
    consentRequirements:
      scopes:
        - skill_up_manage_cohorts
      fallbackLawfulBasis: contract_performance
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_role
      - profile_not_approved

  - pluginId: skill-up
    command: cohort.list
    version: 1.0.0
    requiredRoles:
      - member
      - trainer
      - admin
    attributePolicies:
      tenancy: same_workspace
    consentRequirements:
      scopes:
        - skill_up_read
      fallbackLawfulBasis: contract_performance
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - profile_not_approved

  - pluginId: skill-up
    command: enrollment.create
    version: 1.0.0
    requiredRoles:
      - member
      - admin
    attributePolicies:
      tenancy: same_workspace
      enrollmentRateLimit: enforced
      cohortStatusAllowed:
        - open
        - active
    consentRequirements:
      scopes:
        - skill_up_enroll
      fallbackLawfulBasis: contract_performance
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - insufficient_balance
      - rate_limit_exceeded
      - cohort_closed

  - pluginId: skill-up
    command: enrollment.list
    version: 1.0.0
    requiredRoles:
      - member
      - trainer
      - admin
    attributePolicies:
      tenancy: same_workspace
      # The read is filtered by the caller's own user id in the repository query; no id comes from
      # the request, so an admin calling it still sees only their own enrollments.
      scope: self_only
    consentRequirements:
      scopes:
        - skill_up_read
      fallbackLawfulBasis: contract_performance
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: false
    denyConditions:
      - profile_not_approved

  - pluginId: skill-up
    command: milestone.validate
    version: 1.0.0
    requiredRoles:
      - trainer
      - admin
    attributePolicies:
      tenancy: same_workspace
      trainerAssignmentOrAdmin: true
      validationRateLimit: enforced
    consentRequirements:
      scopes:
        - skill_up_validate_milestones
      fallbackLawfulBasis: legitimate_interest
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - trainer_not_assigned
      - rate_limit_exceeded

  - pluginId: skill-up
    command: milestone.release
    version: 1.0.0
    requiredRoles:
      - trainer
      - admin
    attributePolicies:
      tenancy: same_workspace
      trainerAssignmentOrAdmin: true
      milestoneMustBeValidated: true
    consentRequirements:
      scopes:
        - skill_up_release_credits
      fallbackLawfulBasis: contract_performance
    regionRestrictions:
      allowedTransferMechanisms:
        - local_processing
        - scc
    highRiskFlags:
      containsPHI: false
      requiresAdditionalAudit: true
    denyConditions:
      - milestone_not_validated
      - escrow_missing
      - invalid_release_state

  - pluginId: skill-up
    command: dispute.open
    version: 1.0.0
    requiredRoles:
      - member
      - trainer
      - admin
    attributePolicies:
      tenancy: same_workspace
      disputeWindowOpen: true
    consentRequirements:
      scopes:
        - skill_up_dispute
      fallbackLawfulBasis: legal_obligation
    regionRestrictions:
      allowedTransferMechanisms:
