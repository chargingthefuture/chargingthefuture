auditEvents:
  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: weekly-performance
    command: weekly-performance.week.list
    commandVersion: 1.0.0
    purpose: operational_metrics_review
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - weekly_performance_weeks
      - weekly_performance_metrics
    targetContext:
      workspaceId: workspace_identifier
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: weekly-performance
    command: weekly-performance.week.get
    commandVersion: 1.0.0
    purpose: operational_metrics_review
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - weekly_performance_weeks
    targetContext:
      workspaceId: workspace_identifier
      weekStart: week_start_iso
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: weekly-performance
    command: weekly-performance.metrics.get
    commandVersion: 1.0.0
    purpose: operational_metrics_review
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - weekly_performance_metrics
      - canonical_metrics_registry
    targetContext:
      workspaceId: workspace_identifier
      weekStart: week_start_iso
      metricSetVersion: metric_set_version
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

  - eventId: uuid
    timestamp: rfc3339
    actorId: principal
    pluginId: weekly-performance
    command: weekly-performance.comparison.get
    commandVersion: 1.0.0
    purpose: operational_metrics_comparison
    policyDecision:
      status: allow_or_deny
      reason: policy_reason_code
    dataClassesAccessed:
      - weekly_performance_metrics
      - canonical_metrics_registry
    targetContext:
      workspaceId: workspace_identifier
      weekStart: week_start_iso
      baselineWeekStart: baseline_week_start_iso
    requestId: request_identifier
    traceId: trace_identifier
    result:
      status: success_or_failure
      errorCategory: none_or_error_class

changelog:
  - date: 2026-07-19
    change: >-
      Removed the weekly-performance.report.export audit event (owner request to delete the export
      feature). The command and its route are gone.
  - date: 2026-02-25
    change: Initial Weekly Performance audit contract skeleton added with allow/deny evidence coverage for all v1 commands.
  - date: 2026-06-27
    change: Aligned dataClassesAccessed table names to the shipped schema — weekly_performance_week_windows -> weekly_performance_weeks, weekly_performance_metric_snapshots -> weekly_performance_metrics. Documentation alignment only; no schema or table rename.
