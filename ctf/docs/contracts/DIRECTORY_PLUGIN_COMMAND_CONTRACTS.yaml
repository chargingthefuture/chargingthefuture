contracts:
  - pluginId: directory
    command: directory.profile.upsert
    version: 1.0.0
    description: Create or update authenticated user profile within directory policy constraints.
    inputSchema:
      profile:
        type: object
        required: true
      isPublic:
        type: boolean
        required: true
    outputSchema:
      profileId:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    dataAccess:
      - directory_profiles
      - directory_profile_skills
      - directory_profile_proposed_skills
      - directory_profile_change_events
      - directory_admin_audit_trail
    purpose: profile_management
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: directory
    command: directory.admin.invite_queue.fetch
    version: 1.0.0
    description: >-
      Admin-only read of everybody listed in the Directory who does not yet have an invitation in
      directory_invites, with their Quora address and their skills. Returns an inviteKind per row:
      skill-specific when a skill other than the Advocacy placeholder is present, advocacy-only when
      every listed skill is that placeholder, and no-skill when nothing is recorded. The owner's own
      listing is queued like every other. The handles that already have an invitation are read from
      directory_invites and filtered out in the library.
    inputSchema: {}
    outputSchema:
      rows:
        type: array
    dataAccess:
      - directory_invites
      - directory_profiles
      - directory_profile_skills
      - directory_profile_proposed_skills
      - skills_taxonomy_skills
      - skills_taxonomy_sectors
      - skills_taxonomy_job_titles
    purpose: profile_management
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: directory
    command: directory.admin.pending_skill_proposals.fetch
    version: 1.0.0
    description: >-
      Admin-only read of every profile that still carries a free-text skill as a "pending review"
      chip: the member's own "skill not listed" entries (directory_profile_proposed_skills, status
      pending) and the SkillsHunt-nominated proposals linked to the profile through
      skills_hunt_directory_profiles (tracker status neither promoted nor dropped). Each row carries
      the skill label, its source, the skill-proposal issue if one was filed, whether an active
      taxonomy skill already has that exact name, and the taxonomy skills the profile already holds.
      Each row also names who added the chip: for a chip entered on a profile, the actor on the
      directory_profile_change_events row written in the same transaction (member self-edit or admin
      edit); for a nominated chip, the submission's scout. Nothing is filtered for the admin:
      unclaimed profiles and proposals whose profile was deleted are listed and marked.
    inputSchema: {}
    outputSchema:
      rows:
        type: array
    dataAccess:
      - directory_profiles
      - directory_profile_skills
      - directory_profile_proposed_skills
      - directory_profile_change_events
      - skills_hunt_directory_profiles
      - skills_hunt_proposed_skill_promotions
      - skills_hunt_submissions
      - skills_taxonomy_skills
    purpose: profile_management
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: directory
    command: directory.list.fetch
    version: 1.0.0
    description: >-
      Fetch directory list with selector filters and pagination. Also decorates each CLAIMED
      profile with the categorical "Weavers of the Commons" contributor-badge boolean
      (hasWeaversBadge) via a guarded read of contributor_access_eligibility — boolean only, never
      a score, and never set on a community-generated (unclaimed) profile.
    inputSchema:
      filters:
        type: object
        required: false
      page:
        type: integer
        required: false
      pageSize:
        type: integer
        required: false
    outputSchema:
      items:
        type: array
      total:
        type: integer
    dataAccess:
      - directory_profiles
      - directory_profile_tags
      - contributor_access_eligibility
    purpose: directory_discovery
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: directory
    command: directory.profile.service.get
    version: 1.0.0
    description: >-
      One directory profile by id, claimed or not, for One Percent's operator desk (owner decisions,
      2026-10-02 and 2026-10-06). GET /api/directory/service/profiles/[id]. Machine caller only,
      authenticated by a DIRECTORY_SERVICE_TOKENS consumer. Returns whether it is claimed, name,
      headline, job title, sector, skill names, profile address and city/state/country, and nothing
      else: never the bio, payment addresses, the claiming account id, or who nominated or invited
      the person. A missing profile is a 404, and so is a claimed one whose claiming account carries
      an account_restrictions row with scope 'all' or 'contact'; the answer never says a member is
      restricted. No list and no search.
    inputSchema:
      id:
        type: string
        required: true
    outputSchema:
      profile:
        type: object
    dataAccess:
      - directory_profiles
      - directory_profile_skills
      - skills_taxonomy_skills
      - skills_taxonomy_sectors
      - skills_taxonomy_job_titles
      - account_restrictions
    purpose: one_percent_introduction
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: directory
    command: directory.profile.service.by-account.get
    version: 1.0.0
    description: >-
      The claimed directory profile that belongs to one Skills Economy account, for One Percent's
      operator desk (owner decision, 2026-10-02). GET /api/directory/service/accounts/[accountId]/profile.
      One Percent's clients sign in there with their Skills Economy account, so it already holds the
      Clerk account id. Same consumer credential, rate limit and fields as
      directory.profile.service.get. 404 when the account has no claimed profile, is restricted with
      scope 'all' or 'contact', or doesn't exist; the answer never says which. The audit names the
      profile when found and never the account id. No list and no search.
    inputSchema:
      accountId:
        type: string
        required: true
    outputSchema:
      profile:
        type: object
    dataAccess:
      - directory_profiles
      - directory_profile_skills
      - skills_taxonomy_skills
      - skills_taxonomy_sectors
      - skills_taxonomy_job_titles
      - account_restrictions
    purpose: one_percent_introduction
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: directory
    command: directory.profile.service.list
    version: 1.0.0
    description: >-
      A page of directory profiles, claimed or not, for One Percent's Find matches on the owner's
      operator desk (owner decision, 2026-10-07). GET /api/directory/service/profiles. Machine caller
      only, the same DIRECTORY_SERVICE_TOKENS consumer as directory.profile.service.get, rate-limited
      per consumer to one page a second and sixty an hour. Each profile carries the same fields as
      the single read and nothing else; directory profiles hold no field for what somebody needs or
      is looking for, so none is returned. Profiles whose claiming account is restricted with scope
      'all' or 'contact' are left out without saying so. Ordered by creation time then id. No search
      and no filters. 400 DIRECTORY_INVALID_PAYLOAD for a bad limit or a cursor this route did not
      give out; 429 DIRECTORY_SERVICE_RATE_LIMITED past the page limits.
    inputSchema:
      limit:
        type: integer
        required: false
        default: 50
        maximum: 100
      cursor:
        type: string
        required: false
    outputSchema:
      profiles:
        type: array
      nextCursor:
        type: string_or_null
    dataAccess:
      - directory_profiles
      - directory_profile_skills
      - skills_taxonomy_skills
      - skills_taxonomy_sectors
      - skills_taxonomy_job_titles
      - account_restrictions
    purpose: one_percent_introduction
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: directory
    command: directory.profile.get
    version: 1.0.0
    description: >-
      Fetch one active directory profile by id behind the same read-access gate as the list. Backs
      the auth-gated deep-link page so a shared profile link opens that profile for a signed-in
      member. A CLAIMED profile is decorated with the categorical "Weavers of the Commons"
      contributor-badge boolean (hasWeaversBadge) via a guarded read of
      contributor_access_eligibility — boolean only, never a score, never on an unclaimed profile.
    inputSchema:
      id:
        type: string
        required: true
    outputSchema:
      member:
        type: object
    dataAccess:
      - directory_profiles
      - directory_profile_skills
      - directory_profile_proposed_skills
      - contributor_access_eligibility
    purpose: directory_discovery
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: directory
    command: directory.admin.announcement.upsert
    version: 1.0.0
    description: Create or update a directory announcement from the role-gated admin controls.
    inputSchema:
      announcementId:
        type: string
        required: false
      payload:
        type: object
        required: true
    outputSchema:
      announcementId:
        type: string
      status:
        type: string
    dataAccess:
      - directory_announcements
      - directory_profile_change_events
      - directory_admin_audit_trail
    purpose: admin_communications
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: directory
    command: directory.public.fetch
    version: 1.0.0
    description: Fetch privacy-minimized public directory list/detail projections for unauthenticated callers.
    inputSchema:
      filters:
        type: object
        required: false
      page:
        type: integer
        required: false
      pageSize:
        type: integer
        required: false
      profileId:
        type: string
        required: false
    outputSchema:
      items:
        type: array
      profile:
        type: object
        required: false
      total:
        type: integer
    dataAccess:
      - directory_public_projection
      - directory_profile_skills
    purpose: public_projection
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: directory
    command: directory.admin.profile.assign
    version: 1.0.0
    description: Assign an unclaimed directory profile to a target user under admin role guard. Refused (409) when the profile is already claimed, or when the target account already owns a claimed profile; an account owns at most one.
    inputSchema:
      profileId:
        type: string
        required: true
      userId:
        type: string
        required: true
    outputSchema:
      profileId:
        type: string
      claimedByUserId:
        type: string
      status:
        type: string
    dataAccess:
      - directory_profiles
      - directory_user_extension
      - directory_profile_change_events
      - directory_admin_audit_trail
    purpose: admin_profile_assignment
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: directory
    command: directory.admin.profile.delete
    version: 1.0.0
    description: Delete an unclaimed directory profile. Claimed profiles are denied by policy guardrail.
    inputSchema:
      profileId:
        type: string
        required: true
    outputSchema:
      status:
        type: string
      deleted:
        type: boolean
    dataAccess:
      - directory_profiles
      - directory_profile_change_events
      - directory_admin_audit_trail
    purpose: admin_profile_moderation
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: directory
    command: directory.admin.profile.takedown
    version: 1.0.0
    description: >-
      Remove a community-generated (unclaimed) profile at the person's request and add its Quora URL
      to the suppression list, so it cannot be listed in the directory again (auto-generated from a
      SkillsHunt accept, or added by an admin/member) until an admin lifts the block. Distinct from
      directory.admin.profile.delete, which is for duplicates/accidents and does NOT block re-adding.
      A reason is required and recorded in the audit trail. Claimed, non-community, or URL-less
      profiles are denied by policy.
    inputSchema:
      profileId:
        type: string
        required: true
      reason:
        type: string
        required: true
    outputSchema:
      status:
        type: string
    dataAccess:
      - directory_profiles
      - directory_profile_skills
      - directory_profile_proposed_skills
      - directory_suppressed_quora_urls
      - directory_profile_change_events
      - directory_admin_audit_trail
    purpose: admin_profile_moderation
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: directory
    command: directory.admin.takedown.override
    version: 1.0.0
    description: >-
      Lift an active Quora-URL suppression (override) so the URL can be listed in the directory again.
      A reason is required and recorded in the audit trail. Applying to an already-lifted or missing
      entry is denied by policy.
    inputSchema:
      suppressionId:
        type: string
        required: true
      reason:
        type: string
        required: true
    outputSchema:
      status:
        type: string
    dataAccess:
      - directory_suppressed_quora_urls
      - directory_profile_change_events
      - directory_admin_audit_trail
    purpose: admin_profile_moderation
    retentionClass: audit_long_lived
    idempotency: false

  - pluginId: directory
    command: directory.admin.pending_skill_proposal.drop
    version: 1.0.0
    description: >-
      Drop one pending free-text skill from one profile after the owner decided not to promote it.
      For a member-added entry the directory_profile_proposed_skills row is deleted; for a
      SkillsHunt-nominated proposal the skills_hunt_proposed_skill_promotions row is set to status
      dropped, which the profile's pending-chip readers exclude and the proposal intake never
      re-files. The audit row records the state before and after. Applying to a proposal that is
      no longer pending on that profile is denied as not found.
    inputSchema:
      profileId:
        type: string
        required: true
      skillLabel:
        type: string
        required: true
      source:
        type: string
        required: true
        enum: [skills-hunt, directory]
    outputSchema:
      ok:
        type: boolean
    dataAccess:
      - directory_profile_proposed_skills
      - skills_hunt_directory_profiles
      - skills_hunt_proposed_skill_promotions
      - directory_admin_audit_trail
    purpose: admin_profile_moderation
    retentionClass: audit_long_lived
    idempotency: false

  - pluginId: directory
    command: directory.profile.delete.service
    version: 1.0.0
    description: Perform plugin-scoped profile deletion/anonymization for the authenticated user.
    inputSchema:
      scope:
        type: string
        required: true
    outputSchema:
      status:
        type: string
      requestedAtIso:
        type: string
    dataAccess:
      - directory_profiles
      - directory_user_extension
      - directory_deletion_events
    purpose: deletion_request
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: directory
    command: directory.admin.announcement.deactivate
    version: 1.0.0
    description: >-
      Take an announcement down so members no longer see it. Split out from
      directory.admin.announcement.upsert on 2026-08-28: the DELETE handler recorded its events under
      the upsert command, so a takedown was written into the audit trail as a save.
    inputSchema:
      announcementId:
        type: string
        required: true
    outputSchema:
      status:
        type: string
    dataAccess:
      - directory_announcements
      - directory_admin_audit_trail
    purpose: admin_communications
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: directory
    command: directory.admin.audit.list
    version: 1.0.0
    description: >-
      Admin reads the Directory admin audit trail, newest first. Read-only; the trail is append-only
      and is not removed on a member's service-scoped deletion, so the record of what an admin did
      survives the deletion of what they did it to.
    inputSchema:
      limit:
        type: integer
        required: false
        description: How many rows to return. Defaults to 100, capped at 200.
    outputSchema:
      events:
        type: array
    dataAccess:
      - directory_admin_audit_trail
    purpose: governance_transparency
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: directory
    command: directory.invite.upsert
    version: 1.0.0
    description: >-
      Machine write from the private invite repository's job (POST /api/internal/directory/invites,
      Bearer INTERNAL_SERVICE_SECRET). Creates or replaces one invitation, keyed by slug; every field
      is replaced, the picture included. A Quora handle already held by another slug is refused with
      409. Each refusal names the field. The picture is base64 PNG, JPEG or WebP, at most 3 MB, its
      type read from its own bytes, with alt text required. public (default false) marks an invite
      already published on the blog before 2026-10-15, readable by anybody; blogUrl (also accepted
      as blog_url) is its post's address and is required when public is true.
    inputSchema:
      slug:
        type: string
        required: true
      quoraHandle:
        type: string
        required: true
      quoraUrl:
        type: string
        required: true
      name:
        type: string
        required: true
      title:
        type: string
        required: true
      opening:
        type: string
        required: true
      bodyMarkdown:
        type: string
        required: true
      publishedOn:
        type: string
        required: true
      directoryProfileId:
        type: string
        required: false
      image:
        type: object
        required: false
      public:
        type: boolean
        required: false
      blogUrl:
        type: string
        required: false
    outputSchema:
      id:
        type: string
      slug:
        type: string
      status:
        type: string
    dataAccess:
      - directory_invites
      - directory_admin_audit_trail
    purpose: profile_management
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: directory
    command: directory.invite.delete
    version: 1.0.0
    description: >-
      Machine delete from the private invite repository's job (DELETE
      /api/internal/directory/invites?slug=, Bearer INTERNAL_SERVICE_SECRET). Removes one invitation
      by slug; 404 when none has it.
    inputSchema:
      slug:
        type: string
        required: true
    outputSchema:
      slug:
        type: string
      status:
        type: string
    dataAccess:
      - directory_invites
      - directory_admin_audit_trail
    purpose: profile_management
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: directory
    command: directory.invites.public.fetch
    version: 1.0.0
    description: >-
      Public read (GET /api/directory/invites/public), rate limited per address. The newest ten
      invitations as cards (name, opening words, date, the app address that opens one) and how many
      people the Directory lists (directory_public_totals, restricted owners left out). ?invite=<handle>
      adds that one person's card. A card on a public invite (one already on the blog) also carries
      blogUrl. Nothing else about a private invite: no skills, location, picture, Quora address or
      title. openWall is one page (?page=, ten a page, clamped) of the public invites as cards with
      their blog addresses and no picture; lockedCount and lockedTeasers (name and opening only, newest ten) are the
      private invites the signed-out page shows blurred. Readable from the browser by the landing
      site and the blog.
    inputSchema:
      invite:
        type: string
        required: false
      page:
        type: integer
        required: false
    outputSchema:
      listed:
        type: integer
      invites:
        type: array
      invite:
        type: object
        required: false
      openWall:
        type: object
      lockedCount:
        type: integer
      lockedTeasers:
        type: array
    dataAccess:
      - directory_invites
      - directory_public_totals
    purpose: public_projection
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: directory
    command: directory.invites.fetch
    version: 1.0.0
    description: >-
      Signed-in read of the invite wall (GET /api/directory/invites), for any account, approved in
      Unlock or not (owner decision, 2026-10-15). One page of ten, newest first, ?page= clamped into
      range: each invitation's title, text, date, Quora address, Directory listing link and picture
      address. ?invite=<handle> adds that invitation on top. Picture bytes are served separately.
    inputSchema:
      page:
        type: integer
        required: false
      invite:
        type: string
        required: false
    outputSchema:
      listed:
        type: integer
      total:
        type: integer
      page:
        type: integer
      pageCount:
        type: integer
      invites:
        type: array
      invite:
        type: object
        required: false
    dataAccess:
      - directory_invites
      - directory_public_totals
    purpose: profile_management
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: directory
    command: directory.invite.image.fetch
    version: 1.0.0
    description: >-
      One invitation's picture (GET /api/directory/invites/[slug]/image), shown only inside the full
      invitation. A signed-in account of any tier gets any picture; a signed-out caller gets 401,
      since the cards a visitor sees carry no picture. Served with nosniff and a private cache header.
    inputSchema:
      slug:
        type: string
        required: true
    outputSchema:
      image:
        type: binary
    dataAccess:
      - directory_invites
    purpose: profile_management
    retentionClass: derived_short_lived
    idempotency: true
