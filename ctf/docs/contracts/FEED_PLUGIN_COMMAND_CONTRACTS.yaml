contracts:
  # ─── Channel: Timeline (unified) ───────────────────────────────────────
  - pluginId: feed
    command: feed.timeline.fetch
    version: 2.1.0
    description: Fetch feed timeline items across all channels (announcements, questions, community) with deterministic ordering and offset pagination.
    inputSchema:
      page:
        type: integer
        required: false
      pageSize:
        type: integer
        required: false
      channel:
        type: string
        enum: [all, announcements, questions, community]
        required: false
      mentions:
        type: string
        enum: [me]
        required: false
        note: When `me`, only items whose body @-mentions the caller are returned (case-insensitive match on `@<username>` and the `@user-<id token>` pseudonym, both derived server-side from the authenticated user — a client-supplied handle is never accepted). Matching uses parameterized, LIKE-escaped ILIKE patterns. Used by the Hub Commons "@ Mentions" toggle, which pairs it with channel=community.
      filters:
        type: object
        required: false
    outputSchema:
      items:
        type: array
      pagination:
        type: object
    dataAccess:
      - feed_items
      - feed_item_targets
      - feed_render_config
      - feed_questions
      - member_blocks
    purpose: timeline_discovery
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: feed
    command: feed.item.read.mark
    version: 1.0.0
    description: Mark a feed item as read for the current actor.
    inputSchema:
      itemId:
        type: string
        required: true
    outputSchema:
      itemId:
        type: string
      readAt:
        type: string
    dataAccess:
      - feed_user_read_state
    purpose: read_state_management
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: feed
    command: feed.item.dismiss
    version: 1.0.0
    description: Dismiss an optional feed item for the current actor.
    inputSchema:
      itemId:
        type: string
        required: true
    outputSchema:
      itemId:
        type: string
      dismissedAt:
        type: string
    dataAccess:
      - feed_user_dismissals
      - feed_items
    purpose: read_state_management
    retentionClass: transactional_long_lived
    idempotency: true

  # ─── Channel: Announcements ────────────────────────────────────────────
  - pluginId: feed
    command: feed.announcement.draft.create
    version: 1.0.0
    description: Create an announcement draft with targeting metadata and scheduling window.
    inputSchema:
      title:
        type: string
        required: true
      body:
        type: string
        required: true
      targeting:
        type: object
        required: true
      scheduleAt:
        type: string
        required: false
      linkedPluginSlugs:
        type: array
        items: string
        required: false
        description: Optional ordered plugin slugs to link (0–3). Validated against the visible plugin registry; unknown, admin-only, or duplicate slugs are dropped and the list is capped at 3. When set, the published feed item carries one "Open <Plugin>" link to /apps/<slug> per entry.
    outputSchema:
      announcementId:
        type: string
      status:
        type: string
      createdAt:
        type: string
    dataAccess:
      - announcements
      - announcement_revisions
      - announcement_delivery_events
    purpose: broadcast_authoring
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: feed
    command: feed.announcement.draft.update
    version: 1.0.0
    description: Update a draft announcement before publish.
    inputSchema:
      announcementId:
        type: string
        required: true
      title:
        type: string
        required: true
      body:
        type: string
        required: true
      targeting:
        type: object
        required: false
      linkedPluginSlugs:
        type: array
        items: string
        required: false
        description: Optional ordered plugin slugs to link (0–3; absent keeps the existing links, an empty array clears them). Validated against the visible plugin registry; unknown/admin-only/duplicate slugs dropped, capped at 3.
    outputSchema:
      announcementId:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    dataAccess:
      - announcements
      - announcement_revisions
    purpose: broadcast_authoring
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: feed
    command: feed.announcement.publish
    version: 1.0.0
    description: Publish a draft announcement and trigger fan-out projection.
    inputSchema:
      announcementId:
        type: string
        required: true
      publishAt:
        type: string
        required: false
    outputSchema:
      announcementId:
        type: string
      status:
        type: string
      publishedAt:
        type: string
    dataAccess:
      - announcements
      - announcement_delivery_events
    purpose: broadcast_delivery
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: feed
    command: feed.announcement.archive
    version: 1.0.0
    description: Archive a published announcement.
    inputSchema:
      announcementId:
        type: string
        required: true
    outputSchema:
      announcementId:
        type: string
      status:
        type: string
      archivedAt:
        type: string
    dataAccess:
      - announcements
      - announcement_delivery_events
    purpose: broadcast_delivery
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: feed
    command: feed.announcement.read.mark
    version: 1.0.0
    description: Mark an announcement as read for the requesting user.
    inputSchema:
      announcementId:
        type: string
        required: true
    outputSchema:
      announcementId:
        type: string
      readAt:
        type: string
    dataAccess:
      - announcement_user_state
    purpose: acknowledgement_tracking
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: feed
    command: feed.announcement.dismiss
    version: 1.0.0
    description: Dismiss an announcement for the current user.
    inputSchema:
      announcementId:
        type: string
        required: true
    outputSchema:
      announcementId:
        type: string
      dismissedAt:
        type: string
    dataAccess:
      - announcement_user_state
      - announcements
    purpose: acknowledgement_tracking
    retentionClass: derived_short_lived
    idempotency: true

  - pluginId: feed
    command: feed.announcement.render-mode.update
    version: 1.0.0
    description: Update feed rendering mode for announcements.
    inputSchema:
      renderMode:
        type: string
        required: true
    outputSchema:
      renderMode:
        type: string
      updatedAt:
        type: string
    dataAccess:
      - feed_render_config
    purpose: feed_governance
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: feed
    command: feed.announcement.targeting.validate
    version: 1.0.0
    description: Validate announcement targeting constraints before publish.
    inputSchema:
      targeting:
        type: object
        required: true
    outputSchema:
      valid:
        type: boolean
      normalizedTargeting:
        type: object
    dataAccess:
      - announcements
    purpose: broadcast_governance
    retentionClass: derived_short_lived
    idempotency: true

  # ─── Channel: Questions (LLM-assisted Q&A) ─────────────────────────────
  - pluginId: feed
    command: feed.question.submit
    version: 1.0.0
    description: Submit a natural-language question to the feed Q&A channel for LLM-assisted answering.
    inputSchema:
      body:
        type: string
        required: true
      category:
        type: string
        enum: [housing, services, general, safety, benefits]
        required: false
      location:
        type: object
        required: false
        properties:
          zipCode:
            type: string
          radiusMiles:
            type: integer
    outputSchema:
      questionId:
        type: string
      status:
        type: string
      createdAt:
        type: string
    dataAccess:
      - feed_questions
      - feed_items
    purpose: community_qa
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: feed
    command: feed.question.answer.generate
    version: 1.0.0
    description: Generate an LLM-assisted answer for a submitted question using approved data sources.
    inputSchema:
      questionId:
        type: string
        required: true
    outputSchema:
      answerId:
        type: string
      body:
        type: string
      sources:
        type: array
      confidence:
        type: number
      modelId:
        type: string
      generatedAt:
        type: string
    dataAccess:
      - feed_questions
      - feed_answers
      - llm_inference_log
    purpose: llm_assisted_response
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: feed
    command: feed.question.answer.rate
    version: 1.0.0
    description: Rate an LLM-generated or community answer for quality feedback.
    inputSchema:
      answerId:
        type: string
        required: true
      rating:
        type: string
        enum: [helpful, not_helpful, flagged]
        required: true
    outputSchema:
      answerId:
        type: string
      ratedAt:
        type: string
    dataAccess:
      - feed_answer_ratings
    purpose: llm_quality_feedback
    retentionClass: transactional_long_lived
    idempotency: true

  # ─── Channel: Community Support ─────────────────────────────────────────
  - pluginId: feed
    command: feed.community.post.create
    version: 1.0.0
    description: >-
      Create a community support post visible in the feed community channel. Body length and link
      count are capped as anti-spam: members up to 1200 characters and 3 links; admins up to 4000
      characters and 20 links (so the owner's detailed welcome/help posts are not blocked). Raw HTML
      (`<` / `>`) is rejected for everyone.
    inputSchema:
      body:
        type: string
        required: true
      category:
        type: string
        enum: [general, peer_support, resource_share, event]
        required: false
    outputSchema:
      postId:
        type: string
      status:
        type: string
      createdAt:
        type: string
    dataAccess:
      - feed_community_posts
      - feed_items
    purpose: community_engagement
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: feed
    command: feed.community.post.reply
    version: 1.0.0
    description: Reply to a community support post.
    inputSchema:
      postId:
        type: string
        required: true
      body:
        type: string
        required: true
    outputSchema:
      replyId:
        type: string
      createdAt:
        type: string
    dataAccess:
      - feed_community_replies
      - feed_community_posts
    purpose: community_engagement
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: feed
    command: feed.community.post.reaction.toggle
    version: 1.0.0
    description: >-
      Toggle the requesting member's emoji reaction on a community post. The emoji must be in the
      fixed quick set (👍 ❤️ 😂 🎉 🙏 😢 👋); a second toggle of the same emoji removes the reaction.
      Reactions are stored in our own database (not Stream).
    inputSchema:
      postId:
        type: string
        required: true
      emoji:
        type: string
        enum: ["👍", "❤️", "😂", "🎉", "🙏", "😢", "👋"]
        required: true
    outputSchema:
      ok:
        type: boolean
      reacted:
        type: boolean
    dataAccess:
      - feed_community_post_reactions
      - feed_community_posts
    purpose: community_engagement
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: feed
    command: feed.announcement.reaction.toggle
    version: 1.0.0
    description: >-
      Toggle the requesting member's emoji reaction on an official announcement. The emoji must be
      in the fixed quick set (👍 ❤️ 😂 🎉 🙏 😢 👋); a second toggle of the same emoji removes the
      reaction. The announcement must be published. Reactions are stored in our own database.
    inputSchema:
      announcementId:
        type: string
        required: true
      emoji:
        type: string
        enum: ["👍", "❤️", "😂", "🎉", "🙏", "😢", "👋"]
        required: true
    outputSchema:
      ok:
        type: boolean
      reacted:
        type: boolean
    dataAccess:
      - announcement_reactions
      - announcements
    purpose: community_engagement
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: feed
    command: feed.announcement.reply.create
    version: 1.0.0
    description: >-
      Reply to an official announcement. The announcement must be published; the body passes the
      same moderation as a community post and a per-member rate limit caps reply spam. Replies group
      under the announcement as a thread.
    inputSchema:
      announcementId:
        type: string
        required: true
      body:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
      reply:
        type: object
    dataAccess:
      - announcement_replies
      - announcements
    purpose: community_engagement
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: feed
    command: feed.announcement.reply.list
    version: 1.0.0
    description: >-
      List the accepted replies on an official announcement (oldest-first thread order), each author
      resolved to a display handle with an isMine flag for the requesting member.
    inputSchema:
      announcementId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
      announcementId:
        type: string
      replies:
        type: array
    dataAccess:
      - announcement_replies
    purpose: community_engagement
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: feed
    command: feed.community.post.delete
    version: 1.0.0
    description: >-
      Delete the requesting member's own community (peer) post. Author-only — the server rejects a
      delete of any post the caller does not own. There is no edit: to change a post a member deletes
      it and posts again, so a corrected message is a fresh row with its own moderation and no
      inherited reactions/replies. The delete cascades the post's replies and reactions and removes
      the projected timeline row (with its targets, read state, and dismissals).
    inputSchema:
      postId:
        type: string
        required: true
    outputSchema:
      ok:
        type: boolean
      postId:
        type: string
    dataAccess:
      - feed_community_posts
      - feed_community_replies
      - feed_community_post_reactions
      - feed_items
      - feed_item_targets
      - feed_user_read_state
      - feed_user_dismissals
    purpose: community_engagement
    retentionClass: transactional_long_lived
    idempotency: true

  # ─── Admin / Governance ─────────────────────────────────────────────────
  - pluginId: feed
    command: feed.admin.config.update
    version: 1.0.0
    description: Update feed rendering, channel display, and governance settings.
    inputSchema:
      renderMode:
        type: string
        required: true
      maxTimelinePageSize:
        type: integer
        required: true
      enabledChannels:
        type: array
        required: false
    outputSchema:
      config:
        type: object
      updatedAt:
        type: string
    dataAccess:
      - feed_render_config
    purpose: feed_governance
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: feed
    command: feed.membership.event.emit
    version: 1.0.0
    description: Emit membership change event for feed/announcement visibility recalculation.
    inputSchema:
      userId:
        type: string
        required: true
      pluginId:
        type: string
        required: true
      eventType:
        type: string
        required: true
      requestId:
        type: string
        required: false
      traceId:
        type: string
        required: false
    outputSchema:
      streamEmitted:
        type: boolean
    dataAccess:
      - feed_membership_events
      - announcement_membership_events
      - announcement_delivery_events
    purpose: visibility_recalculation
    retentionClass: transactional_long_lived
    idempotency: false

  - pluginId: feed
    command: feed.community.moderation.list
    version: 1.0.1
    description: >-
      List member-authored Commons posts and replies for admin review, newest first, with the count of
      rows currently hidden. Hidden rows are included by default so a moderator can see what has been
      taken down and put it back; `hidden=1` narrows to only those. Admin only, read-only. Deliberately
      Commons-only: Q&A answers are moderated through their own queue (feed.qa.moderation.flagged.list),
      which is flag-driven rather than a full listing. v1.0.1 removes feed_questions/feed_answers from
      dataAccess — the query never read them, and the listing was never meant to include Q&A rows.
    inputSchema:
      hidden:
        type: boolean
        required: false
      limit:
        type: number
        required: false
    outputSchema:
      rows:
        type: array
      hidden:
        type: object
    dataAccess:
      - feed_community_posts
      - feed_community_replies
    purpose: content_moderation
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: feed
    command: feed.community.moderation.hide
    version: 1.0.0
    description: >-
      Hide one member-authored Commons post or reply from every reader by setting
      `moderation_status = 'hidden'`. This is NOT deletion: the row is retained and the change is
      reversible via feed.community.moderation.restore. There is deliberately no admin edit command —
      a moderator may remove content from view but may never rewrite a member's words while leaving
      the member's name on them. Author self-deletion is unaffected. Admin only.
    inputSchema:
      target:
        type: string
        required: true
      id:
        type: string
        required: true
      hidden:
        type: boolean
        required: true
    outputSchema:
      changed:
        type: boolean
      moderationStatus:
        type: string
    dataAccess:
      - feed_community_posts
      - feed_community_replies
      - feed_questions
      - feed_answers
    purpose: content_moderation
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: feed
    command: feed.community.moderation.restore
    version: 1.0.0
    description: >-
      Put a previously hidden Commons post or reply back in front of members by setting
      `moderation_status = 'accepted'`. Same endpoint as the hide command with `hidden: false`; named
      separately here and in the audit trail because putting content back is a distinct decision from
      taking it down. Admin only.
    inputSchema:
      target:
        type: string
        required: true
      id:
        type: string
        required: true
      hidden:
        type: boolean
        required: true
    outputSchema:
      changed:
        type: boolean
      moderationStatus:
        type: string
    dataAccess:
      - feed_community_posts
      - feed_community_replies
      - feed_questions
      - feed_answers
    purpose: content_moderation
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: feed
    command: feed.qa.moderation.flagged.list
    version: 1.0.0
    description: >-
      List answers members have flagged, most-flagged first, with each answer's flag and not-helpful
      counts and its parent question. Closes a gap that existed for as long as flagging did: the counts
      were aggregated by feed.question.admin.list but no screen ever called it, so a member's flag
      reached nobody. Hidden answers are included so a moderator can reverse their own calls. Admin
      only, read-only.
    inputSchema:
      limit:
        type: number
        required: false
    outputSchema:
      answers:
        type: array
      pending:
        type: number
    dataAccess:
      - feed_answers
      - feed_answer_ratings
      - feed_questions
    purpose: content_moderation
    retentionClass: transactional_long_lived
    idempotency: true
