contracts:
  - pluginId: gross-domestic-product
    command: metrics.list
    version: 1.0.0
    description: List GDP canonical metrics available for authenticated transparency views.
    inputSchema:
      period:
        type: string
        required: false
        enum:
          - year
          - quarter
          - month
      year:
        type: integer
        required: false
      includeDefinitions:
        type: boolean
        required: false
    outputSchema:
      metrics:
        type: array
      snapshotVersion:
        type: string
      generatedAt:
        type: string
    dataAccess:
      - gdp_metric_snapshots
      - canonical_metrics_registry
    purpose: transparency_reporting
    retentionClass: derived_medium_lived
    idempotency: true

  - pluginId: gross-domestic-product
    command: metrics.get
    version: 1.0.0
    description: Retrieve a specific GDP metric time series and metadata.
    inputSchema:
      metricId:
        type: string
        required: true
      startDate:
        type: string
        required: false
      endDate:
        type: string
        required: false
    outputSchema:
      metric:
        type: object
      points:
        type: array
    dataAccess:
      - gdp_metric_snapshots
      - canonical_metrics_registry
    purpose: transparency_reporting
    retentionClass: derived_medium_lived
    idempotency: true

  - pluginId: gross-domestic-product
    command: dashboard.snapshot.get
    version: 1.1.0
    description: >-
      Get the aggregate GDP dashboard for the authenticated survivor-facing view. Computed LIVE on each
      request (no weekly publish/snapshot step): the Community Value Index is recognized from every
      registered non-incentive settled-value source right now, alongside live member counts. Reads only
      community-wide aggregates — never per-user figures. Also returns a SEPARATE `projection` block —
      what the posts still open would add if every one closed successfully — computed by
      lib/gdp/projection.ts and carried in its own field so it is never summed into the index, never
      written to a snapshot, and never read by the weekly recognition job.
    inputSchema:
      year:
        type: integer
        required: true
      includeRolloutProgress:
        type: boolean
        required: false
    outputSchema:
      totalGDP:
        type: number
      serviceGDP:
        type: number
      goodsGDP:
        type: number
      perCapita:
        type: number
      categoryBreakdown:
        type: array
      providerTierBreakdown:
        type: array
      rolloutProgress:
        type: object
      # Open, not-yet-closed posts, kept apart from every recognized figure above:
      # { projectedValueIndex, openPostCount, perSource: [{ pluginSlug, label, valueIndex, openCount }] }.
      # Null when the projection read fails, in which case the panel is simply not rendered.
      projection:
        type: object
    dataAccess:
      # Live recognition sources (non-incentive settled value) + activity counts read on each request:
      - foundation_call_sessions
      - trust_transport_earnings_ledger
      - service_credits_governance_events
      - service_credits_transfers
      - socket_relay_fulfillments
      - recurring_activities
      # LightHouse: an accepted match contributes one month of the listed rent (later months belong to
      # the recurring_activities source above, so no month is counted twice):
      - lighthouse_matches
      - lighthouse_properties
      - login_events
      - users
      # Projection sources — OPEN posts only, read for the separate projected figure. Each reads rows the
      # recognition sources deliberately skip, so nothing is counted in both figures. LightHouse is the
      # one shared table: the projection reads only listings with NO accepted/completed match:
      - trust_transport_requests
      - foundation_quote_requests
      - socket_relay_requests
      # Published-snapshot history (retained, not what the live dashboard shows):
      - gdp_metric_snapshots
      - gdp_category_breakdowns
      - gdp_provider_tier_snapshots
      - gdp_rollout_actuals
    purpose: transparency_reporting
    retentionClass: derived_medium_lived
    idempotency: true

  - pluginId: gross-domestic-product
    command: countries.read
    version: 1.0.0
    description: >-
      Real per-country member distribution for the dashboard's "Top Countries" panel — a people-count
      per country read from members' directory profiles (the shared member profile), most
      members first. Community-wide aggregate, never a per-user figure and never an invented per-country
      money figure. No small-count suppression (owner decision, 2026-07-11): every country with a member
      is shown.
    inputSchema: {}
    outputSchema:
      countries:
        type: array
      # Active members on the roster with no country recorded (totalMembers minus the located
      # per-country sum, floored at 0). The web shell renders it as one "Location not set" row.
      unspecified:
        type: integer
      totalMembers:
        type: integer
    dataAccess:
      - directory_profiles
    purpose: transparency_reporting
    retentionClass: derived_medium_lived
    idempotency: true

  - pluginId: gross-domestic-product
    command: rollout.progress.get
    version: 1.0.0
    description: Retrieve aggregate GDP rollout progress against yearly targets.
    inputSchema:
      startYear:
        type: integer
        required: false
      endYear:
        type: integer
        required: false
      includeCategoryGaps:
        type: boolean
        required: false
    outputSchema:
      milestones:
        type: array
      annualProgress:
        type: array
      categoryGaps:
        type: array
    dataAccess:
      - gdp_rollout_targets
      - gdp_rollout_actuals
      - gdp_category_breakdowns
    purpose: transparency_reporting
    retentionClass: derived_medium_lived
    idempotency: true

  - pluginId: gross-domestic-product
    command: scenario.assumptions.get
    version: 1.0.0
    description: Retrieve published GDP scenario assumptions and interpretation notes.
    inputSchema:
      scenarioId:
        type: string
        required: false
      effectiveYear:
        type: integer
        required: false
    outputSchema:
      assumptions:
        type: array
      caveats:
        type: array
      generatedAt:
        type: string
    dataAccess:
      - gdp_rollout_targets
      - canonical_metrics_registry
    purpose: transparency_reporting
    retentionClass: derived_medium_lived
    idempotency: true

  - pluginId: gross-domestic-product
    command: admin.metric.propose
    version: 1.0.0
    description: Propose a new canonical GDP metric definition or revision.
    inputSchema:
      proposedMetric:
        type: object
        required: true
      justification:
        type: string
        required: true
      changeType:
        type: string
        required: true
        enum:
          - add
          - revise
          - deprecate
    outputSchema:
      proposalId:
        type: string
      status:
        type: string
    dataAccess:
      - canonical_metrics_registry
      - gdp_metric_definition_events
    purpose: metric_governance
    retentionClass: audit_long_lived
    idempotency: false

  - pluginId: gross-domestic-product
    command: admin.metric.approve
    version: 1.0.0
    description: Approve a metric proposal and publish definition changes.
    inputSchema:
      proposalId:
        type: string
        required: true
      decision:
        type: string
        required: true
        enum:
          - approve
          - reject
      decisionNote:
        type: string
        required: false
    outputSchema:
      metricId:
        type: string
      status:
        type: string
      publishedVersion:
        type: string
    dataAccess:
      - canonical_metrics_registry
      - gdp_metric_definition_events
      - gdp_publish_events
    purpose: metric_governance
    retentionClass: audit_long_lived
    idempotency: false

  - pluginId: gross-domestic-product
    command: admin.snapshot.publish
    version: 1.0.0
    description: Publish an approved GDP snapshot for authenticated survivor access.
    inputSchema:
      year:
        type: integer
        required: true
      snapshotPayload:
        type: object
        required: true
      sourceRunId:
        type: string
        required: true
    outputSchema:
      snapshotId:
        type: string
      status:
        type: string
      publishedAt:
        type: string
    dataAccess:
      - gdp_metric_snapshots
      - gdp_category_breakdowns
      - gdp_provider_tier_snapshots
      - gdp_publish_events
    purpose: publication_governance
    retentionClass: audit_long_lived
    idempotency: false

  - pluginId: gross-domestic-product
    command: admin.backfill.run
    version: 1.0.0
    description: Run controlled historical GDP backfill to recompute aggregate snapshots.
    inputSchema:
      startYear:
        type: integer
        required: true
      endYear:
        type: integer
        required: true
      dryRun:
        type: boolean
        required: false
      reason:
        type: string
        required: true
    outputSchema:
      backfillRunId:
        type: string
      status:
        type: string
      yearsProcessed:
        type: array
      requiresPublishApproval:
        type: boolean
    dataAccess:
      - gdp_metric_snapshots
      - gdp_category_breakdowns
      - gdp_provider_tier_snapshots
      - gdp_rollout_actuals
      - gdp_publish_events
    purpose: publication_governance
    retentionClass: audit_long_lived
    idempotency: false
