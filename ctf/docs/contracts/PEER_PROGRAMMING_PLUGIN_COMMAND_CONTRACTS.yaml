contracts:
  - pluginId: peer-programming
    command: cohort.weekly.select
    version: 1.0.0
    description: Select weekly active users (login within the last 7 days) and form cohorts with target size of 5 members. Triggered either by an admin from the PeerProgramming admin screen, or automatically once a week by the scheduler (the `system` role) via the secret-guarded internal route. Idempotent per week. When the server flag `PEER_PROGRAMMING_SINGLE_OPEN_COHORT` is ON (its default — temporary low-population mode), the weekly split is paused: instead of forming C1/C2/C3, this command ensures the single standing cohort exists (the `peer_programming_cohorts` row with `is_standing = TRUE`, label C1, always open) and idempotently joins all active members into it, sending the same per-member assignment notifications. Set the flag to `0`/`false` to restore the original weekly cohorting.
    inputSchema:
      workspaceId:
        type: string
        required: true
      weekKey:
        type: string
        required: true
      activityWindowDays:
        type: integer
        required: true
      targetCohortSize:
        type: integer
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      selectionRunId:
        type: string
      selectedUserCount:
        type: integer
      cohortCount:
        type: integer
      status:
        type: string
    dataAccess:
      - canonical_user_profile
      - auth_login_activity
      # Read by the unlocked-members filter (listUnlockedUserIds): only approved_full members
      # may be placed into cohorts, so the admin route checks each recent-login user against
      # their unlock submission before assignment.
      - unlock_verification_submissions
      - peer_programming_cohorts
      - peer_programming_cohort_memberships
      - peer_programming_command_idempotency
    purpose: cohort_assignment
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: peer-programming
    command: cohort.assignment.notify
    version: 1.0.0
    description: Send in-app notifications for users assigned to weekly peer-programming cohorts.
    inputSchema:
      selectionRunId:
        type: string
        required: true
      cohortId:
        type: string
        required: true
      notificationTemplateId:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      notificationBatchId:
        type: string
      deliveredCount:
        type: integer
      failedCount:
        type: integer
      status:
        type: string
    dataAccess:
      - peer_programming_cohort_memberships
      - peer_programming_assignment_notifications
      - notification_delivery_log
      - peer_programming_command_idempotency
    purpose: assignment_notification
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: peer-programming
    command: cohort.fallback.open
    version: 1.0.0
    description: Open fallback cohort mode when fewer than 2 cohort members show for an active session window.
    inputSchema:
      cohortId:
        type: string
        required: true
      weekKey:
        type: string
        required: true
      observedMemberCount:
        type: integer
        required: true
      fallbackReason:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      fallbackActivationId:
        type: string
      roomMode:
        type: string
      activatedAt:
        type: string
      status:
        type: string
    dataAccess:
      - peer_programming_cohorts
      - peer_programming_rooms
      - peer_programming_room_presence
      - peer_programming_command_idempotency
    purpose: cohort_resilience
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: peer-programming
    command: room.state.get
    version: 1.0.0
    description: Retrieve current cohort room state including weekly topic guidance, participation summary, and fallback mode.
    inputSchema:
      roomId:
        type: string
        required: true
      weekKey:
        type: string
        required: true
      viewerTier:
        type: string
        required: true
        enum:
          - cohort_member
          - authenticated_audience
          - unauthenticated_audience
    outputSchema:
      roomId:
        type: string
      topicGuidance:
        type: object
      fallbackOpen:
        type: boolean
      participationSummary:
        type: object
      threadCounts:
        type: object
    dataAccess:
      - peer_programming_rooms
      - peer_programming_topic_guidance
      - peer_programming_cohort_memberships
      - peer_programming_threads
      - peer_programming_thread_replies
    purpose: room_experience
    retentionClass: derived_medium_lived
    idempotency: true

  - pluginId: peer-programming
    command: thread.post.create
    version: 1.0.0
    description: Create an async text-first root post in a cohort room timeline.
    inputSchema:
      roomId:
        type: string
        required: true
      authorUserId:
        type: string
        required: true
      body:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      threadId:
        type: string
      createdAt:
        type: string
      status:
        type: string
    dataAccess:
      - peer_programming_rooms
      - peer_programming_cohort_memberships
      - peer_programming_threads
      - peer_programming_command_idempotency
    purpose: async_collaboration
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: peer-programming
    command: thread.reply.create
    version: 1.0.0
    description: Create a threaded reply for an existing room thread.
    inputSchema:
      roomId:
        type: string
        required: true
      threadId:
        type: string
        required: true
      authorUserId:
        type: string
        required: true
      body:
        type: string
        required: true
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      replyId:
        type: string
      createdAt:
        type: string
      status:
        type: string
    dataAccess:
      - peer_programming_threads
      - peer_programming_thread_replies
      - peer_programming_cohort_memberships
      - peer_programming_command_idempotency
    purpose: async_collaboration
    retentionClass: transactional_long_lived
    idempotency: true

  - pluginId: peer-programming
    command: thread.list
    version: 1.0.0
    description: List room threads and replies with tier-aware visibility for 24/7 persistent conversation history.
    inputSchema:
      roomId:
        type: string
        required: true
      cursor:
        type: string
        required: false
      limit:
        type: integer
        required: false
      viewerTier:
        type: string
        required: true
        enum:
          - cohort_member
          - authenticated_audience
          - unauthenticated_audience
    outputSchema:
      threads:
        type: array
      nextCursor:
        type: string
      persistenceWindow:
        type: string
    dataAccess:
      - peer_programming_threads
      - peer_programming_thread_replies
      - peer_programming_rooms
      - peer_programming_cohort_memberships
    purpose: room_experience
    retentionClass: derived_medium_lived
    idempotency: true

  - pluginId: peer-programming
    command: participation.tier.resolve
    version: 1.0.0
    description: Resolve the viewer participation tier for cohort member, authenticated audience, or unauthenticated audience policies.
    inputSchema:
      roomId:
        type: string
        required: true
      userId:
        type: string
        required: false
      authState:
        type: string
        required: true
        enum:
          - authenticated
          - unauthenticated
    outputSchema:
      tier:
        type: string
      allowedActions:
        type: array
      reasonCode:
        type: string
    dataAccess:
      - peer_programming_cohort_memberships
      - peer_programming_rooms
      - canonical_user_profile
    purpose: access_tiering
    retentionClass: derived_medium_lived
    idempotency: true

  - pluginId: peer-programming
    command: feedback.submit
    version: 1.0.0
    description: Submit structured room feedback for weekly iteration loop analysis.
    inputSchema:
      roomId:
        type: string
        required: true
      weekKey:
        type: string
        required: true
      submitterUserId:
        type: string
        required: false
      issueCategory:
        type: string
        required: true
      suggestion:
        type: string
        required: true
      releaseSurface:
        type: string
        required: true
        enum:
          - web
          - android
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      feedbackId:
        type: string
      status:
        type: string
      createdAt:
        type: string
    dataAccess:
      - peer_programming_feedback
      - peer_programming_rooms
      - peer_programming_command_idempotency
    purpose: quality_iteration
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: peer-programming
    command: admin.topic-guidance.set
    version: 1.0.0
    description: Set or update admin-defined weekly topic guidance for cohort rooms.
    inputSchema:
      weekKey:
        type: string
        required: true
      guidanceTitle:
        type: string
        required: true
      guidanceBody:
        type: string
        required: true
      publicationStatus:
        type: string
        required: true
        enum:
          - draft
          - published
      revisionNote:
        type: string
        required: false
      idempotencyKey:
        type: string
        required: true
    outputSchema:
      topicGuidanceId:
        type: string
      status:
        type: string
      updatedAt:
        type: string
    dataAccess:
      - peer_programming_topic_guidance
      - peer_programming_admin_actions
      - peer_programming_command_idempotency
    purpose: topic_governance
    retentionClass: audit_long_lived
    idempotency: true

  - pluginId: peer-programming
    command: session.join
    version: 1.0.0
    description: Mint live video session credentials for the caller's own cohort. The cohort is resolved server-side from the signed-in member, so only a cohort member can obtain a call token and the call is always scoped to that member's cohort.
    inputSchema: {}
    outputSchema:
      cohortId:
        type: string
      displayName:
        type: string
      streamApiKey:
        type: string
      streamCallId:
        type: string
      streamUserId:
        type: string
      streamToken:
        type: string
    dataAccess:
      - peer_programming_cohorts
      - peer_programming_cohort_members
      - canonical_user_profile
    purpose: live_session
    retentionClass: transactional_short_lived
    idempotency: false

  - pluginId: peer-programming
    command: admin.topic-guidance.get
    version: 1.0.0
    description: Retrieve admin-defined weekly topic guidance and revision metadata.
    inputSchema:
      weekKey:
        type: string
        required: true
      includeRevisionHistory:
        type: boolean
        required: false
    outputSchema:
      topicGuidance:
        type: object
      revisionHistory:
        type: array
      publicationStatus:
        type: string
    dataAccess:
      - peer_programming_topic_guidance
      - peer_programming_admin_actions
    purpose: topic_governance
    retentionClass: derived_medium_lived
    idempotency: true

  - pluginId: peer-programming
    command: admin.single-open-cohort.get
    version: 1.0.0
    description: Read the effective single standing, always-open Cohort 1 mode and where it resolves from. Precedence is the persisted admin setting (peer_programming_settings.single_open_cohort_enabled) if set, then the env flag PEER_PROGRAMMING_SINGLE_OPEN_COHORT, then the built-in default (ON). Returns the resolved on/off decision, its source (admin_setting/env_flag/default), the stored admin value, and the env flag value so the admin surface can show why the mode is what it is.
    inputSchema: {}
    outputSchema:
      enabled:
        type: boolean
      source:
        type: string
        enum:
          - admin_setting
          - env_flag
          - default
      adminSetting:
        type: boolean
      envFlagEnabled:
        type: boolean
    dataAccess:
      - peer_programming_settings
    purpose: cohort_mode_governance
    retentionClass: derived_medium_lived
    idempotency: true

  - pluginId: peer-programming
    command: admin.single-open-cohort.set
    version: 1.0.0
    description: Set or clear the persisted admin toggle for single standing, always-open Cohort 1 mode. `enabled` true/false records the admin's explicit choice, which supersedes the env flag PEER_PROGRAMMING_SINGLE_OPEN_COHORT; `enabled` null clears the admin setting so the mode falls back to the env flag and then the built-in default (ON). Writes the one-row peer_programming_settings singleton and records an admin audit row. CSRF-guarded, admin-only.
    inputSchema:
      enabled:
        type: boolean
        required: false
    outputSchema:
      enabled:
        type: boolean
      source:
        type: string
        enum:
          - admin_setting
          - env_flag
          - default
      adminSetting:
        type: boolean
      envFlagEnabled:
        type: boolean
    dataAccess:
      - peer_programming_settings
      - peer_programming_admin_audit_trail
    purpose: cohort_mode_governance
    retentionClass: audit_long_lived
    idempotency: true
  - pluginId: peer-programming
    command: admin.cohort.end
    version: 1.0.0
    description: End (close) a cohort. Marks the peer_programming_cohorts row status='ended' and stamps ended_at / ended_by_user_id, freezing its Direct Line — the message and reply routes then reject posting to the cohort. The single standing Cohort 1 can never be ended (denied with policy_denied). Records an admin audit row. CSRF-guarded, admin-only. Idempotent — ending an already-ended cohort is a no-op that returns it unchanged.
    inputSchema:
      cohortId:
        type: string
        required: true
    outputSchema:
      cohort:
        type: object
    dataAccess:
      - peer_programming_cohorts
      - peer_programming_admin_audit_trail
    purpose: cohort_lifecycle_governance
    retentionClass: audit_long_lived
    idempotency: true
