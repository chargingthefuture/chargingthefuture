  - id: wp_value_beacon_broadcast_engagement
    name: Weekly Beacon Broadcast Engagement
    description: Count of distinct (member, broadcast) pairs that engaged with a Beacon broadcast's Commons replay post within the week window, via a reaction or a reply. One member engaging with the same broadcast many times counts once. Live in-event chat and reactions are held only in Stream and expire there, so they are not counted. Broadcast completion itself is not counted either — only the owner can start a session, so it would measure the admin, not members.
    owner: analytics-owner@chargingthefuture.org
    data_type: integer
    unit: engagements
    calculation: |
      SELECT COUNT(*) AS v FROM (
        SELECT r.user_id AS member_id, b.id AS broadcast_id
        FROM beacon_events b
        JOIN feed_community_post_reactions r ON r.post_id = b.commons_recording_post_id
        WHERE r.created_at >= :week_start AND r.created_at < :week_end
        UNION
        SELECT p.author_user_id AS member_id, b.id AS broadcast_id
        FROM beacon_events b
        JOIN feed_community_replies p ON p.post_id = b.commons_recording_post_id
        WHERE p.created_at >= :week_start AND p.created_at < :week_end
      ) engagement;
    inputs:
      - name: beacon_events.commons_recording_post_id
        type: uuid
      - name: feed_community_post_reactions.post_id
        type: uuid
      - name: feed_community_post_reactions.user_id
        type: uuid
      - name: feed_community_post_reactions.created_at
        type: datetime
      - name: feed_community_replies.post_id
        type: uuid
      - name: feed_community_replies.author_user_id
        type: uuid
      - name: feed_community_replies.created_at
        type: datetime
    example_values:
      - 15
      - 42
    last_updated: "2026-07-18T00:00:00Z"
    update_cadence: weekly
    retention: 24 months
    allowed_thresholds:
      min: 0

  - id: wp_adoption_daily_active_members
    name: Weekly Daily Active Members
    description: Average number of distinct members active on a day of the week window — the dashboard's daily-active-members reading. login_events holds at most one row per member per UTC day, so one row is one member-day; the distinct count is used anyway so a database cloned before the once-per-day unique index existed cannot inflate the average. The divisor is the number of days of the window that have already started (1-7), so the live current week averages over the days it has actually had and every past week divides by the full 7. Aggregate only — never a per-member figure. Adoption, not value; signing in is not a plugin's defining action and carries no positive weight in value scoring.
    owner: analytics-owner@chargingthefuture.org
    data_type: number
    unit: per day
    calculation: |
      SELECT ROUND(
               COUNT(DISTINCT (user_id, (created_at AT TIME ZONE 'UTC')::date))::numeric
                 / GREATEST(LEAST(7, (CURRENT_DATE - :week_start) + 1), 1),
               2) AS v
      FROM login_events
      WHERE created_at >= :week_start
        AND created_at < :week_end;
    inputs:
      - name: login_events.user_id
        type: string
      - name: login_events.created_at
        type: datetime
    example_values:
      - 12.43
      - 18
    last_updated: "2026-08-15T00:00:00Z"
    update_cadence: weekly
    retention: 24 months
    allowed_thresholds:
      min: 0

