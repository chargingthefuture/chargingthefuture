  - id: contributions_cycle_fiat_confirmed
    name: Contributions Cycle Fiat Confirmed
    description: USD value of confirmed gift-card contributions inside the current fundraiser cycle (the cycle whose window contains now), shown as collective progress toward the cycle's fiat goal.
    owner: economics-team@chargingthefuture.org
    data_type: currency
    unit: USD
    calculation: |
      WITH current_cycle AS (
        SELECT id
        FROM contributions_cycles
        WHERE starts_at <= NOW() AND ends_at > NOW()
        ORDER BY starts_at DESC
        LIMIT 1
      )
      SELECT COALESCE(SUM(s.confirmed_amount_usd), 0) AS contributions_cycle_fiat_confirmed
      FROM contributions_submissions s
      JOIN current_cycle c ON c.id = s.cycle_id
      WHERE s.kind = 'gift_card'
        AND s.status = 'confirmed';
    inputs:
      - name: contributions_submissions.kind
        type: string
      - name: contributions_submissions.status
        type: string
      - name: contributions_submissions.confirmed_amount_usd
        type: currency
      - name: contributions_submissions.cycle_id
        type: uuid
      - name: contributions_cycles.starts_at
        type: datetime
      - name: contributions_cycles.ends_at
        type: datetime
    example_values:
      - 45
