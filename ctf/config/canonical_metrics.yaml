canonical_metrics:
  - id: weekly_active_users
    name: Weekly Active Users
    description: Count of distinct users with at least one authenticated app session within the week window.
    owner: analytics-owner@chargingthefuture.org
    data_type: integer
    unit: users
    calculation: |
      SELECT COUNT(DISTINCT user_id)
      FROM login_events
      WHERE occurred_at >= :week_start
        AND occurred_at < :week_end
        AND is_test_user = FALSE
        AND deleted_at IS NULL;
    inputs:
      - name: login_events.user_id
        type: uuid
      - name: login_events.occurred_at
        type: datetime
      - name: users.is_test_user
        type: boolean
      - name: users.deleted_at
        type: datetime|null
    example_values:
      - 1820345
      - 1932210
    last_updated: "2026-02-24T00:00:00Z"
    update_cadence: weekly
    retention: 24 months
    allowed_thresholds:
      min: 0
      alert_rules:
        - "alert_if_7d_drop_percent >= 15"

  - id: median_real_wage_growth_rate
    name: Median Real Wage Growth Rate
    description: Median percentage change in inflation-adjusted wages for active users over a rolling 30-day window.
    owner: econ-metrics@chargingthefuture.org
    data_type: percent
    unit: percent
    calculation: |
      WITH wages AS (
        SELECT user_id,
               current_real_wage,
               prior_real_wage
        FROM user_economic_snapshots
        WHERE snapshot_date = :as_of_date
      )
      SELECT PERCENTILE_CONT(0.5)
             WITHIN GROUP (ORDER BY ((current_real_wage - prior_real_wage) / NULLIF(prior_real_wage, 0)) * 100)
      FROM wages;
    inputs:
      - name: user_economic_snapshots.current_real_wage
        type: currency
      - name: user_economic_snapshots.prior_real_wage
        type: currency
      - name: user_economic_snapshots.snapshot_date
        type: datetime
    example_values:
      - 1.8
      - 2.3
    last_updated: "2026-02-24T00:00:00Z"
    update_cadence: daily
    retention: 36 months
    allowed_thresholds:
      min: -100
      max: 100
      alert_rules:
        - "alert_if_value < -2"

  - id: gdp_population_total
    name: GDP Model Population Total
    description: Population baseline used for GDP per-capita calculations.
    owner: econ-metrics@chargingthefuture.org
    data_type: integer
    unit: people
    calculation: |
      SELECT population
      FROM gdp_rollout_assumptions
      WHERE scenario = :scenario
        AND year = :year;
    inputs:
      - name: gdp_rollout_assumptions.population
        type: integer
      - name: gdp_rollout_assumptions.scenario
        type: string
      - name: gdp_rollout_assumptions.year
        type: integer
    example_values:
      - 5000000
    last_updated: "2026-02-24T00:00:00Z"
    update_cadence: annual
    retention: 120 months
    allowed_thresholds:
      min: 0

  - id: gdp_total_revenue
    name: GDP Total Revenue
    description: Total GDP revenue (services plus goods/local economy), per the projection formula below; reported as a USD estimate (issue #121). Multi-currency transaction volume is normalized to USD via the currency_usd_rates factors only as live recognition is wired in — the GDP feature inventory documents that mechanism; the authoritative calculation here remains the projection.
    owner: economics-team@chargingthefuture.org
    data_type: currency
    unit: USD
    calculation: |
      SELECT service_gdp_target + goods_revenue AS gdp_total_revenue
      FROM gdp_yearly_projection
      WHERE year = :year;
    inputs:
      - name: gdp_yearly_projection.service_gdp_target
        type: currency
      - name: gdp_yearly_projection.goods_revenue
        type: currency
      - name: gdp_yearly_projection.year
        type: integer
    example_values:
      - 300000000000
    last_updated: "2026-02-24T00:00:00Z"
    update_cadence: annual
    retention: 120 months
    allowed_thresholds:
      min: 0
      alert_rules:
        - "alert_if_annual_value < 250000000000"

  - id: gdp_value_index
    name: Community Value Index
    description: One composite measure of all recognized economic activity in the community, folding every value type (fiat, crypto, ServiceCredits, barter) into a single relative figure via owner-set, non-binding contribution weights (USD is only the reference base = 1). A community-built transparency measure in the spirit of GDP — NOT money, NOT a price, and NOT an exchange or redemption value for any currency or token; displayed with no currency symbol. Augments, does not replace, the projection target (issue #121). Only eligible settled value is recognized; transfers and deletion/reclaim reallocations are excluded. Recognized sources include LightHouse housing arrangements at ONE month of the listed rent per accepted match; the months after the first are counted by the Recurring Activity source instead, so no month is counted twice and no plugin holds a running rent total. Declared recurring ServiceCredits values are scaled to a monthly figure by the arrangement's cadence (weekly 52/12, biweekly 26/12, monthly 1, quarterly 1/3) so two arrangements moving the same credits over a year contribute equally; recurring fiat lines are counted by number of relationships and carry no amount at all.
    owner: economics-team@chargingthefuture.org
    data_type: integer
    unit: index
    calculation: |
      -- Aggregated server-side by ctf/packages/web/lib/gdp/recognition.ts (and scripts/recognizeGdp.mjs):
      -- for each registered source, SUM(eligible settled value) grouped by value type, multiplied by the
      -- latest contribution weight per type (currency_usd_rates, USD = 1 reference base), summed across
      -- all sources and value types. ServiceCredits and barter are included; a type with no active weight
      -- is surfaced and excluded. The result is a relative index, never a monetary amount.
      SELECT COALESCE(SUM(amount * weight), 0) AS gdp_value_index
      FROM eligible_settled_value
      JOIN latest_contribution_weights USING (currency_code);
    inputs:
      - name: trust_transport_earnings_ledger.amount
        type: currency
      - name: service_credits_governance_events.amount
        type: integer
      - name: lighthouse_properties.monthly_rent
        type: currency
      - name: lighthouse_matches.status
        type: string
      - name: recurring_activities.sc_value
        type: number
      - name: recurring_activities.cadence
        type: string
      - name: currency_usd_rates.usd_rate
        type: number
      - name: currency_usd_rates.as_of
        type: datetime
    example_values:
      - 13340
    last_updated: "2026-06-11T00:00:00Z"
    update_cadence: weekly
    retention: 120 months
    allowed_thresholds:
      min: 0

  - id: gdp_projected_value_index
    name: Projected Community Value
    description: What the posts already on the board would add to the Community Value Index IF every one of them closed successfully — open TrustTransport requests, Foundation quotes awaiting a decision, LightHouse homes still available (at one month of the listed rent, and only where no match has been accepted), SocketRelay favors nobody has done yet, and recurring activities awaiting confirmation. A separate, marketing-facing figure computed by ctf/packages/web/lib/gdp/projection.ts and carried in its own field of the live report; it is NEVER added to gdp_value_index, never written to gdp_metric_snapshots, and never read by the weekly recognition job. Every source reads rows the recognition sources deliberately skip (open instead of settled), so a post can never be counted in both figures. Uses the same fixed contribution weights so the two numbers share a scale. Like the index it is NOT money, NOT a price, and NOT an exchange or redemption value; shown with no currency symbol, always beside the sentence that says most posts never close.
    owner: economics-team@chargingthefuture.org
    data_type: integer
    unit: index
    calculation: |
      -- Aggregated server-side by ctf/packages/web/lib/gdp/projection.ts on each dashboard request:
      -- for each registered projection source, SUM(open posted value) grouped by value type, multiplied
      -- by the same DEFAULT_CONTRIBUTION_WEIGHTS the real index uses, summed across all sources. Free,
      -- barter, and fiat recurring lines are counted by NUMBER of open posts, never by an amount. A type
      -- with no active weight is surfaced and excluded. The result is a relative index, never money.
      SELECT COALESCE(SUM(amount * weight), 0) AS gdp_projected_value_index
      FROM open_posted_value
      JOIN contribution_weights USING (currency_code);
    inputs:
      - name: trust_transport_requests.price_amount
        type: currency
      - name: trust_transport_requests.status
        type: string
      - name: foundation_quote_requests.quoted_amount
        type: currency
      - name: foundation_quote_requests.lifecycle_state
        type: string
      - name: lighthouse_properties.monthly_rent
        type: currency
      - name: lighthouse_properties.is_active
        type: boolean
      - name: socket_relay_requests.status
        type: string
      - name: recurring_activities.sc_value
        type: number
      - name: recurring_activities.cadence
        type: string
      - name: recurring_activities.status
        type: string
    example_values:
      - 387
    last_updated: "2026-08-03T00:00:00Z"
    update_cadence: live
    retention: not stored
    allowed_thresholds:
      min: 0

