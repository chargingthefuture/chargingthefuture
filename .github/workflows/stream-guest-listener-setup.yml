name: Stream — Guest Listener Setup

# The Chyme guest-listener Stream setup, owned by code instead of dashboard clicks.
#
# When CHYME_GUEST_STREAM_ROLE is set, every signed-out listener is minted with that Stream role, and
# Stream refuses the join unless the role exists and the `default` call type grants it `join-call`.
# Both were dashboard steps; the second was left undone once and every guest was refused for months
# ("role 'chyme_listener' is not allowed to perform action JoinCall in scope 'video:default'") while
# members in the room saw nothing wrong. This runs ctf/scripts/stream-guest-listener-setup.mjs,
# which owns the target state — role exists; on the call type it has join-call and read-call, not
# send-audio / send-video / screenshare, everything else untouched — and applies it through Stream's
# APIs. Members are unaffected: only that role changes, and only guests carry it. Never prints a
# secret; the api key is scrubbed from any Stream error text.
#
# Three modes:
#   plan   (manual default) read and print the state and what apply would change. Writes nothing.
#   check  (the weekly schedule) same, but the run goes red when anything is out of the target
#          state — so a half-done setup is caught before a member reports it.
#   apply  write what is missing, read it back, and go red if the read-back is still short.
#
# Run it from the browser: Actions tab → "Stream — Guest Listener Setup" → Run workflow. Plan first,
# then apply. Takes effect on the next page load — Stream checks the role at join time — so no
# redeploy is needed.
#
# Runbook: ctf/docs/plugins/chyme/guest-listener-stream-role.md

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = print only · check = print and fail on drift · apply = write"
        type: choice
        options:
          - plan
          - check
          - apply
        default: plan
      target:
        description: "Which Stream app"
        type: choice
        options:
          - production
          - staging
          - both
        default: production
  schedule:
    # Weekly drift check, Tuesdays 05:52 UTC — an unused, off-the-hour minute (rule 119). A red run
    # means the production Stream app has drifted from the target state; run with mode "apply".
    - cron: "52 5 * * 2"

jobs:
  setup:
    name: Guest listener role and call-type grants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          cd ctf
          pnpm install

      # Inject the production environment's secrets (env-slug "prod"), which is where the *_STAGING
      # Stream pair and CHYME_GUEST_STREAM_ROLE live too. If Infisical is unreachable this step fails
      # the job, by design.
      - name: Inject secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: ${{ secrets.INFISICAL_URL }}
          secret-path: /
          recursive: true

      # On the schedule there are no inputs: check production. A manual run uses what was picked.
      - name: Run the setup
        env:
          MODE: ${{ inputs.mode || 'check' }}
          TARGET: ${{ inputs.target || 'production' }}
        run: node ctf/scripts/stream-guest-listener-setup.mjs "--mode=$MODE" "--target=$TARGET"
