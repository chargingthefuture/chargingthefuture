name: Stream — Guest Listener Setup

# The Chyme guest-listener Stream setup, owned by code instead of dashboard clicks.
#
# When CHYME_GUEST_STREAM_ROLE is set, every signed-out listener is minted with that Stream role, and
# Stream refuses the join unless the role exists and the `default` call type grants it `join-call`.
# Both were dashboard steps; the second was left undone once and every guest was refused for months
# ("role 'chyme_listener' is not allowed to perform action JoinCall in scope 'video:default'") while
# members in the room saw nothing wrong. This runs ctf/scripts/stream-guest-listener-setup.mjs,
# which owns the target state — role exists; on the call type it has join-call and read-call, not
# send-audio / send-video / screenshare, everything else untouched — and applies it through Stream's
# APIs. No other role changes: a speaker's `user` role is never touched. Since 2026-09-19 the named
# role is also what Chyme's hand-raise mode gives a member an admin has moved to listening, so a red
# check run means guest listening and hand-raise mode are both affected. Never prints a
# secret; the api key is scrubbed from any Stream error text.
#
# Three modes:
#   plan   (manual default) read and print the state and what apply would change. Writes nothing.
#   check  (the weekly schedule) same, but the run goes red when anything is out of the target
#          state — so a half-done setup is caught before a member reports it.
#   apply  write what is missing, read it back, and go red if the read-back is still short.
#
# Run it from the browser: Actions tab → "Stream — Guest Listener Setup" → Run workflow. Plan first,
# then apply. Takes effect on the next page load — Stream checks the role at join time — so no
# redeploy is needed.
#
# Secrets come from Infisical, the single source of truth. When Infisical cannot be reached (every
# Infisical-backed workflow has failed with "Application not found" since 2026-09-10), the run falls
# back to the GitHub Actions secrets STREAM_API_KEY / STREAM_API_SECRET (and the staging pair) if
# they are set, and the log says which source it used — never a value. The role can be given as the
# "role" input for the same reason. Rule 123 allows GitHub Actions as a deliberate second store.
#
# Runbook: ctf/docs/plugins/chyme/guest-listener-stream-role.md

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = print only · check = print and fail on drift · apply = write"
        type: choice
        options:
          - plan
          - check
          - apply
        default: plan
      target:
        description: "Which Stream app"
        type: choice
        options:
          - production
          - staging
          - both
        default: production
      role:
        description: "Guest role name — leave empty to use CHYME_GUEST_STREAM_ROLE from Infisical; set it (chyme_listener) when Infisical is unreachable"
        type: string
        default: ""
  schedule:
    # Weekly drift check, Tuesdays 05:52 UTC — an unused, off-the-hour minute (rule 119). A red run
    # means the production Stream app has drifted from the target state; run with mode "apply".
    - cron: "52 5 * * 2"

jobs:
  setup:
    name: Guest listener role and call-type grants
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          cd ctf
          pnpm install

      # Inject the production environment's secrets (env-slug "prod"), which is where the *_STAGING
      # Stream pair and CHYME_GUEST_STREAM_ROLE live too. Infisical is the source of truth; when it
      # cannot be reached this step is allowed to fail so the fallback below can run.
      - name: Inject secrets from Infisical
        id: infisical
        continue-on-error: true
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: ${{ secrets.INFISICAL_URL }}
          secret-path: /
          recursive: true

      # On the schedule there are no inputs: check production. A manual run uses what was picked.
      # Each Stream value is taken from Infisical when it set one, else from the GitHub Actions
      # secret of the same name; the log names the source, never the value.
      - name: Run the setup
        env:
          MODE: ${{ inputs.mode || 'check' }}
          TARGET: ${{ inputs.target || 'production' }}
          INPUT_ROLE: ${{ inputs.role }}
          INFISICAL_OUTCOME: ${{ steps.infisical.outcome }}
          FALLBACK_STREAM_API_KEY: ${{ secrets.STREAM_API_KEY }}
          FALLBACK_STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
          FALLBACK_STREAM_API_KEY_STAGING: ${{ secrets.STREAM_API_KEY_STAGING }}
          FALLBACK_STREAM_API_SECRET_STAGING: ${{ secrets.STREAM_API_SECRET_STAGING }}
        run: |
          echo "Infisical step outcome: $INFISICAL_OUTCOME"
          for name in STREAM_API_KEY STREAM_API_SECRET STREAM_API_KEY_STAGING STREAM_API_SECRET_STAGING; do
            fallback_var="FALLBACK_$name"
            if [ -n "${!name:-}" ]; then
              echo "$name: from Infisical"
            elif [ -n "${!fallback_var:-}" ]; then
              export "$name=${!fallback_var}"
              echo "$name: from GitHub Actions secrets (fallback)"
            else
              echo "$name: not set in either store"
            fi
          done
          if [ -n "$INPUT_ROLE" ]; then
            export STREAM_GUEST_ROLE="$INPUT_ROLE"
            echo "role: from the workflow input"
          elif [ -n "${CHYME_GUEST_STREAM_ROLE:-}" ]; then
            echo "role: from Infisical"
          else
            echo "role: not set — give it as the workflow input while Infisical is unreachable"
          fi
          node ctf/scripts/stream-guest-listener-setup.mjs "--mode=$MODE" "--target=$TARGET"
