name: Neon — Update DB (Migrations + schema.sql)

# Brings the database referenced by DATABASE_URL up to the v3 spec, in order:
#   1. ctf/db/migrations/pre/*.sql   (structural fixes that must precede the canonical schema)
#   2. ctf/schema.sql                (the canonical v3 desired state)
#   3. ctf/db/migrations/post/*.sql  (data backfills / cleanups that need the tables to exist)
# Every migration is idempotent and guarded, so this is safe to run repeatedly.
#
# Runs automatically when the schema, a migration, or this workflow changes. It can also be run
# manually ("Run workflow"): to upgrade a fresh clone of the live v2 database to v3, point the
# DATABASE_URL secret at the clone and run it once. See ctf/db/migrations/README.md.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ctf/schema.sql"
      - "ctf/db/migrations/**"
      - ".github/workflows/update-neon-db.yml"

jobs:
  apply-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set DATABASE_URL
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || vars.DATABASE_URL }}" >> $GITHUB_ENV

      - name: Validate DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing DATABASE_URL in GitHub Actions secrets/variables."
            exit 1
          fi

      - name: Apply migrations and schema to Neon
        run: |
          cd ctf
          shopt -s nullglob

          echo "== pre-schema migrations =="
          for f in db/migrations/pre/*.sql; do
            echo ">> applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done

          echo "== canonical schema (schema.sql) =="
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema.sql

          echo "== post-schema migrations =="
          for f in db/migrations/post/*.sql; do
            echo ">> applying $f"
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$f"
          done
