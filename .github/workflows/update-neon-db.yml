name: Update Neon DB with schema.sql

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "ctf/schema.sql"
      - ".github/workflows/update-neon-db.yml"

jobs:
  apply-schema:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Set DATABASE_URL
        id: set_db_url
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || vars.DATABASE_URL }}" >> $GITHUB_ENV

      - name: Install dependencies
        run: |
          cd ctf
          pnpm install

      - name: Validate DATABASE_URL secret
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "Missing DATABASE_URL in GitHub Actions secrets/variables."
            exit 1
          fi

      - name: Apply schema.sql to Neon
        run: |
          cd ctf
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f schema.sql
