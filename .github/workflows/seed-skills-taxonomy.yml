name: Skills Taxonomy — Apply Change Ops (production)

# Applies the append-only taxonomy change-ops list (ctf/scripts/lib/taxonomyChangeOps.mjs) to the
# LIVE production taxonomy by running ctf/scripts/seedSkillsTaxonomy.mjs. This is the ONLY path
# that writes the taxonomy from the repo — see
# ctf/docs/developer/SKILLS_TAXONOMY_CHANGE_GOVERNANCE_PLAN.md. Idempotent: already-applied ops
# no-op, sectors are looked up by name (never created), there is no hard delete (deactivate +
# reparent only), and every real mutation is recorded in skills_taxonomy_change_events. Manual
# dispatch only — the owner runs this after an ops PR merges (the ops list is validated by the
# taxonomy-ops-gate CI job on every PR). The run fails visibly if any op names a sector or target
# the live database does not have.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  apply-change-ops:
    name: Apply taxonomy change-ops to production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # DATABASE_URL is a runtime secret; Infisical is the single source of truth (this matches how
      # skills-proposal-issues.yml and bug-reports-create-issues.yml get the database connection).
      - name: Inject secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: ${{ secrets.INFISICAL_URL }}
          secret-path: /
          recursive: true

      # Validate the ops list before touching the database (same check CI runs on PRs).
      - name: Validate taxonomy change-ops list
        run: node ctf/scripts/check-taxonomy-change-ops.mjs

      # The apply needs only the Postgres client. Install it standalone so we do not pay for a full
      # monorepo install on every run.
      - name: Install Postgres client
        run: npm install --no-save pg@8

      - name: Apply taxonomy change-ops
        # DATABASE_URL is injected by the Infisical step above.
        run: node ctf/scripts/seedSkillsTaxonomy.mjs
