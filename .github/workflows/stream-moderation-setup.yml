name: Stream — Moderation and Translation Setup

# Stream AI moderation and chat auto-translation (3.1.0 plan, Personal controls and safety), owned
# by code instead of dashboard clicks. Runs ctf/scripts/stream-moderation-setup.mjs, which owns the
# target state: chat auto-translation on, and the moderation configs se:posts (the app's posts and
# pictures) and chat:messaging (Stream chat channels) with AI text removing critical harm and
# flagging high, and AI pictures removing every label Stream offers at 90% confidence.
#
# Three modes:
#   plan   (manual default) read and print the state and what apply would change. Writes nothing.
#   check  (the weekly schedule) same, but the run goes red when anything is short of the target.
#   apply  write what is short, read it back, and go red if the read-back is still short.
#
# Run it from the browser: Actions tab → "Stream — Moderation and Translation Setup" → Run workflow.
# Plan first, then apply.
#
# Secrets come from Infisical; when it cannot be reached, the GitHub Actions secrets of the same
# names are the fallback, and the log names the source, never a value.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = print only · check = print and fail on drift · apply = write"
        type: choice
        options:
          - plan
          - check
          - apply
        default: plan
      target:
        description: "Which Stream app"
        type: choice
        options:
          - production
          - staging
          - both
        default: production
  schedule:
    # Weekly drift check, Wednesdays 05:47 UTC, an unused off-the-hour minute (rule 119).
    - cron: "47 5 * * 3"

permissions:
  contents: read

jobs:
  setup:
    name: Moderation configs and auto-translation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          cd ctf
          pnpm install

      - name: Inject secrets from Infisical
        id: infisical
        continue-on-error: true
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: ${{ secrets.INFISICAL_URL }}
          secret-path: /
          recursive: true

      - name: Run the setup
        env:
          MODE: ${{ inputs.mode || 'check' }}
          TARGET: ${{ inputs.target || 'production' }}
          INFISICAL_OUTCOME: ${{ steps.infisical.outcome }}
          FALLBACK_STREAM_API_KEY: ${{ secrets.STREAM_API_KEY }}
          FALLBACK_STREAM_API_SECRET: ${{ secrets.STREAM_API_SECRET }}
          FALLBACK_STREAM_API_KEY_STAGING: ${{ secrets.STREAM_API_KEY_STAGING }}
          FALLBACK_STREAM_API_SECRET_STAGING: ${{ secrets.STREAM_API_SECRET_STAGING }}
        run: |
          echo "Infisical step outcome: $INFISICAL_OUTCOME"
          for name in STREAM_API_KEY STREAM_API_SECRET STREAM_API_KEY_STAGING STREAM_API_SECRET_STAGING; do
            fallback_var="FALLBACK_$name"
            if [ -n "${!name:-}" ]; then
              echo "$name: from Infisical"
            elif [ -n "${!fallback_var:-}" ]; then
              export "$name=${!fallback_var}"
              echo "$name: from GitHub Actions secrets (fallback)"
            else
              echo "$name: not set in either store"
            fi
          done
          node ctf/scripts/stream-moderation-setup.mjs "--mode=$MODE" "--target=$TARGET"
