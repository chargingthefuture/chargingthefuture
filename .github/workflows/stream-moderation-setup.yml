name: Stream — Moderation and Translation Setup

# Stream AI moderation and chat auto-translation (3.1.0 plan, Personal controls and safety), owned
# by code instead of dashboard clicks. Calls the app's POST /api/internal/stream/moderation-setup,
# which applies the target state with the app's own Stream keys
# (ctf/packages/web/lib/integrations/stream-moderation-setup.ts), so this workflow holds no Stream
# key: chat auto-translation on, and the moderation configs se:posts (the app's posts and
# pictures) and chat:messaging (Stream chat channels) with AI text removing critical harm and
# flagging high, and AI pictures removing every label Stream offers at 90% confidence.
#
# Three modes:
#   plan   (manual default) read and print the state and what apply would change. Writes nothing.
#   check  (the weekly schedule) same, but the run goes red when anything is short of the target.
#   apply  write what is short, read it back, and go red if the read-back is still short.
#
# Run it from the browser: Actions tab → "Stream — Moderation and Translation Setup" → Run workflow.
# Plan first, then apply.
#
# Needs two GitHub Actions secrets the other app calls already use: NEXT_PUBLIC_APP_URL and
# CRON_SECRET. The log shows what is short of the target and what was done, never a key.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan = print only · check = print and fail on drift · apply = write"
        type: choice
        options:
          - plan
          - check
          - apply
        default: plan
      target:
        description: "Which Stream app"
        type: choice
        options:
          - production
          - staging
          - both
        default: production
  schedule:
    # Weekly drift check, Wednesdays 05:47 UTC, an unused off-the-hour minute (rule 119).
    - cron: "47 5 * * 3"

permissions:
  contents: read

jobs:
  setup:
    name: Moderation configs and auto-translation
    runs-on: ubuntu-latest
    steps:
      - name: Run the setup in the app
        env:
          MODE: ${{ inputs.mode || 'check' }}
          TARGET: ${{ inputs.target || 'production' }}
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "::error::NEXT_PUBLIC_APP_URL or CRON_SECRET is not set in GitHub Actions secrets."
            exit 1
          fi
          code=$(curl -sS -o /tmp/stream-setup.json -w '%{http_code}' -X POST \
            "${APP_URL%/}/api/internal/stream/moderation-setup?mode=${MODE}&target=${TARGET}" \
            -H "Authorization: Bearer ${CRON_SECRET}")
          echo "HTTP ${code}"
          jq -r '
            if .apps then
              (.apps[] | "\n\(.app): " +
                (if .configured | not then "no Stream keys in the app for this one, so it was not read."
                 elif .error then "Stream refused or could not be reached: \(.error)"
                 else "\(.imageLabels | length) picture label(s) offered.\n" +
                   (if (.shortBefore | length) == 0 then "Already at the target."
                    else "Short of the target:\n  - " + (.shortBefore | join("\n  - ")) end) +
                   (if .shortAfter == null then ""
                    elif (.shortAfter | length) == 0 then "\nApplied and read back: at the target."
                    else "\nStill short after apply:\n  - " + (.shortAfter | join("\n  - ")) end)
                 end))
            else .message end' /tmp/stream-setup.json
          [ "$code" = "200" ] && [ "$(jq -r '.ok' /tmp/stream-setup.json)" = "true" ]
