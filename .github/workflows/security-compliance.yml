name: Security and Compliance

on:
  pull_request:
    # No paths filter on purpose: these jobs report required status checks
    # (Dependency Review, Secret Scanning, Compliance Artifacts). With a paths
    # filter, a PR that only touches an unlisted file (e.g. the root
    # pnpm-lock.yaml / package.json) never triggers this workflow, so the
    # required checks stay "Expected" forever and the PR can never merge. This
    # mirrors ci.yml, which drops its pull_request paths filter for the same
    # reason. The jobs here are fast, so running them on every PR is cheap.
    branches: [main]
  push:
    branches: [main]
    paths:
      - "ctf/**"
      - ".claude/rules/**"
      - ".github/workflows/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  schedule:
    - cron: "30 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Review (PR)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4

  secrets-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest
    # gitleaks-action posts inline PR findings, so this job alone needs PR write.
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        continue-on-error: true
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: production
          domain: ${{ secrets.INFISICAL_URL }}

      - name: Gitleaks Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE || env.GITLEAKS_LICENSE }}

  compliance-artifacts:
    name: Compliance Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Collect rules artifacts
        run: |
          set -euo pipefail
          mkdir -p compliance-artifacts
          cp -R .claude/rules compliance-artifacts/rules

      - name: Upload rules artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compliance-rules-${{ github.run_id }}
          path: compliance-artifacts
          retention-days: 30
