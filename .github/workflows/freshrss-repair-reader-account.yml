name: FreshRSS — Repair the reader account

# Gives the reader an account matching what the identity provider sends, and
# makes it the administrator.
#
# FreshRSS looks an account up by the exact name of its folder and the provider
# sends the address in lower case, so an account whose folder carries a capital
# letter never matches. It also refuses to make the lower-case one, because it
# rejects a new name differing from an existing one only by case. The settings
# screen sits behind the same check, so none of it is fixable from inside.
#
# Render is the only way in, through the service's start command, and it expands
# anything beginning with a dollar sign before the container sees it while
# leaving quote characters as ordinary text. A shell one-liner sent that way
# exits 127 without running. So this is built out of single plain commands with
# no variables and no quotes, one service start per step. Those starts end with
# the container exiting rather than serving, which Render reports as a failed
# deploy — that is the expected shape of this. The work lands on the disk, which
# outlives the container, and the last step hands the start command back and
# waits for the service to be live again.
#
# The diagnose mode reads the last lines the container printed and changes
# nothing. Addresses are replaced before anything reaches this log, which is
# public.
#
# Delete this workflow, and the script only it uses, once the reader lets
# somebody in. It does one thing once. Git history keeps it if the reader is
# ever rebuilt, and a copy recovered from history gets read in full by whoever
# recovers it — which is the review a finished workflow sitting in the Actions
# list never gets.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'diagnose reads the service log and changes nothing. repair runs the steps.'
        required: true
        default: diagnose
        type: choice
        options:
          - diagnose
          - repair
      confirm:
        description: 'Type repair to confirm, when the mode is repair. The reader is down for a few minutes.'
        required: false
        type: string

jobs:
  repair:
    name: Repair the reader account
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the confirmation
        if: ${{ inputs.mode == 'repair' }}
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          typed=$(printf '%s' "$CONFIRM" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          if [ "$typed" != "repair" ]; then
            echo "::error title=Not confirmed::Type repair in the confirmation box to run this in repair mode."
            exit 1
          fi

      - name: Repair the account
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          ADMIN_USER: ${{ secrets.FRESHRSS_ADMIN_USER }}
          SERVICE_NAME: ctf-freshrss
          MODE: ${{ inputs.mode }}
        run: bash .github/scripts/freshrss-repair-reader-account.sh
