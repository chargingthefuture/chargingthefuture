name: Stream — Grant Guest Listener Join

# Manually-run repair: give the Chyme guest-listener role permission to join the audio room.
#
# When CHYME_GUEST_STREAM_ROLE is set, every signed-out listener is minted with that Stream role, and
# Stream refuses the join unless the `default` call type grants the role `join-call`. The public
# Chyme page then reads: "role 'chyme_listener' is not allowed to perform action JoinCall in scope
# 'video:default'". The grant is a Stream dashboard setting that does not work at phone width, so
# this applies it through Stream's Video API instead. It runs
# ctf/scripts/stream-grant-guest-listener.mjs, which sets the role to: join-call and read-call
# present, send-audio / send-video / screenshare absent, everything else untouched. Members are not
# affected — only the named role changes, and only guests carry it. Never prints a key or secret.
#
# Run it from the browser: Actions tab → "Stream — Grant Guest Listener Join" → Run workflow.
# Leave "apply" unticked first: the log shows the role's capabilities before and after without
# changing anything. Run again with "apply" ticked to write. Takes effect on the next page load —
# the role is read by Stream at join time, so no redeploy is needed.
#
# Runbook: ctf/docs/plugins/chyme/guest-listener-stream-role.md

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Write the grant (unticked = dry run, prints before/after only)"
        type: boolean
        default: false
      target:
        description: "Which Stream app"
        type: choice
        options:
          - production
          - staging
          - both
        default: production

jobs:
  grant:
    name: Grant join-call to the guest listener role
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          cd ctf
          pnpm install

      # Inject the production environment's secrets (env-slug "prod"), which is where the *_STAGING
      # Stream pair and CHYME_GUEST_STREAM_ROLE live too. If Infisical is unreachable this step fails
      # the job, by design.
      - name: Inject secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: ${{ secrets.INFISICAL_URL }}
          secret-path: /
          recursive: true

      - name: Apply (or preview) the listener grants
        env:
          APPLY: ${{ inputs.apply }}
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$APPLY" = "true" ]; then FLAG="--apply"; else FLAG=""; fi
          node ctf/scripts/stream-grant-guest-listener.mjs $FLAG "--target=$TARGET"
