name: Comic Knowledge — Scrub Third-Party Identifiers (production)

# ONE-TIME workflow (issue #1912). Re-runs the current redaction over rows already stored in
# comic_knowledge_entries, so live grounding data cannot carry a third party's Quora profile link
# or account handle into a model prompt.
#
# SAFE BY DEFAULT: the workflow previews (dry run) unless "apply" is set to true when starting it.
# Run it once as a preview, read the before/after lines in the log, then run again with apply=true.
#
# DELETE AFTER USE: once an apply run finishes green, delete this file and
# ctf/scripts/scrubComicKnowledgeIdentifiers.mjs (tracked on #1912). The parsers' redact() fix is
# permanent; this catch-up script is not needed again.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write changes? Leave false for a dry-run preview.'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: scrub-comic-knowledge
  cancel-in-progress: false

jobs:
  scrub:
    name: Scrub third-party identifiers from the knowledge base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # DATABASE_URL is a runtime secret; Infisical is the single source of truth.
      - name: Inject secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: ${{ secrets.INFISICAL_URL }}
          secret-path: /
          recursive: true

      - name: Install Postgres client
        run: npm install --no-save pg@8

      - name: Scrub identifiers
        run: |
          set -euo pipefail
          if [ "${{ inputs.apply }}" = "true" ]; then
            node ctf/scripts/scrubComicKnowledgeIdentifiers.mjs --apply | tee /tmp/scrub.txt
          else
            node ctf/scripts/scrubComicKnowledgeIdentifiers.mjs | tee /tmp/scrub.txt
          fi
          {
            echo '```'
            tail -60 /tmp/scrub.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
