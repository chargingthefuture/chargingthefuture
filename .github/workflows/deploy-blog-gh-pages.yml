name: Deploy Blog to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "wiki-site/**"
      - ".github/workflows/deploy-blog-gh-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages-blog
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wiki-site/wiki-blog

    steps:
      # submodules: true fetches the wiki-site submodule (which contains the
      # blog). It deliberately does NOT recurse: the blog build reads the
      # already-committed articles.ts and fetches wiki markdown at runtime, so
      # wiki-site's own nested submodules (wiki, design/mockups) are not needed.
      # Content validation / articles.ts sync are enforced by wiki-site's own CI.
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: wiki-site/wiki-blog/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for GitHub Pages
        run: pnpm blog:build:pages

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: wiki-site/wiki-blog/artifacts/blog/dist/public

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
