name: Unlock — Reward Reconciliation

# Self-heals missed Unlock approval rewards. The approval handler mints the 100-credit ServiceCredits
# reward as a best-effort follow-up; if that mint fails, the approval still stands but the reward never
# lands. Every hour this asks production to mint the reward for any approved verification whose reward is
# still pending. The mint is idempotent, so this can never double-grant.
#
# What it needs (Settings → Secrets and variables → Actions):
#   App URL  — the workflow reads the APP_BASE_URL variable, then the NEXT_PUBLIC_APP_URL secret. Set
#              either one to your production base URL (e.g. https://app.example.com).
#   CRON_SECRET secret — must match the CRON_SECRET the app reads at runtime (set the SAME value in the
#              app's runtime secrets, e.g. Infisical). The route rejects the call without it.
#
# If the app URL or CRON_SECRET is missing, the run does not silently pass: it emits a visible warning and
# writes a note to the run summary, then exits without error (so leaving the cron OFF does not spam red
# failures). Admins can always drain the backlog on demand from the Unlock admin screen instead.

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unlock-reward-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    name: Trigger reconciliation
    runs-on: ubuntu-latest
    steps:
      - name: Call the reconciliation route
        env:
          APP_BASE_URL: ${{ vars.APP_BASE_URL || secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_BASE_URL:-}" ]; then
            echo "::warning::Unlock reward reconciliation skipped: no app URL configured (set the APP_BASE_URL variable or the NEXT_PUBLIC_APP_URL secret)."
            echo "Skipped: app URL not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::warning::Unlock reward reconciliation skipped: CRON_SECRET is not set in GitHub Actions secrets. The hourly self-heal is OFF until it is added here AND matched in the app runtime. Admins can still use 'Retry pending rewards' in the Unlock admin screen."
            echo "Skipped: CRON_SECRET not set; automatic self-heal is OFF." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          code=$(curl -sS -o /tmp/reconcile.json -w '%{http_code}' -X POST \
            "${APP_BASE_URL%/}/api/internal/unlock/reconcile-rewards" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "HTTP ${code}"
          cat /tmp/reconcile.json
          echo
          if [ "${code}" != "200" ]; then
            echo "::error::Reconciliation request failed with HTTP ${code}. Check that CRON_SECRET matches the app runtime value and the route is deployed."
            exit 1
          fi
          echo "Reconciliation ran: $(cat /tmp/reconcile.json)" >> "$GITHUB_STEP_SUMMARY"
