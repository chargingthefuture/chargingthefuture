name: Backup Formance to Supabase

# Nightly backup of Formance Postgres to Supabase Storage.
# Runs daily at 3am UTC and on manual dispatch.

on:
  schedule:
    - cron: '0 3 * * *' # daily at 3am UTC, offset from 2am cleanup
  workflow_dispatch:

jobs:
  backup-formance:
    name: Backup Formance Postgres to Supabase
    runs-on: ubuntu-latest
    env:
      # Formance Postgres connection string (service-level, read access)
      FORMANCE_DATABASE_URL: ${{ secrets.FORMANCE_DATABASE_URL || secrets.FORMANCE_DATABASE_URL_FALLBACK }}
      # Supabase project URL (https://xyzcompany.supabase.co)
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.SUPABASE_URL_FALLBACK }}
      # Supabase service role key (write access to storage)
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY_FALLBACK }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client 17
        # The runner's bundled pg_dump may be missing or older than the
        # Formance/Neon server (Postgres 16/17). pg_dump refuses to dump a
        # server newer than itself, which fails the job in seconds. Install the
        # client matching the newest server from the official PostgreSQL apt
        # repository and put it first on PATH. A newer client dumps older
        # servers fine.
        run: |
          set -e
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Run Formance backup script
        id: backup
        run: |
          set -e
          node ctf/scripts/backupFormanceToSupabase.mjs 2> backup-error.log || {
            echo "Backup script failed. See backup-error.log." >&2
            exit 1
          }

      - name: Upload failure logs (if present)
        if: failure() && steps.backup.outcome == 'failure' && hashFiles('backup-error.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: formance-backup-failure-logs
          path: backup-error.log
          retention-days: 7
