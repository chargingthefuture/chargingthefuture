name: Build and push Docker images

# Builds each service image on push to main (with path filtering so Ollama
# only rebuilds when its Dockerfile changes) and pushes to GHCR. Render is
# then configured to pull pre-built images, consuming zero Render build minutes.
#
# FIRST-TIME SETUP (do once per service image):
#   After the workflow runs for the first time, go to:
#   github.com/orgs/chargingthefuture/packages → each ctf-* image →
#   Package settings → Change visibility → Public.
#   This lets Render pull images without registry credentials.
#
# REQUIRED GITHUB SECRETS (baked into the client bundle at build time):
#   These NEXT_PUBLIC_* values are read ONLY here, at image build time. Next.js
#   inlines every `NEXT_PUBLIC_*` value into the client JavaScript when the image
#   is built, so this workflow's GitHub Actions secrets — NOT Render/Infisical —
#   are the source of truth for what the browser loads. Updating the same key in
#   Infisical/Render at runtime does NOTHING for the client; to change any of
#   these you must update the GitHub Actions secret here and re-run this workflow
#   so the value is re-baked into a fresh image.
#   NEXT_PUBLIC_APP_URL               — production URL, e.g. https://app.chargingthefuture.com
#   NEXT_PUBLIC_AUTH_PUBLISHABLE_KEY  — Clerk publishable key (pk_live_…); must match the domain the app is served on (Clerk production keys are domain-locked)
#   NEXT_PUBLIC_AUTH_SIGN_IN_URL      — Clerk hosted Account Portal sign-in URL,
#       e.g. https://accounts.app.chargingthefuture.com/sign-in. Do NOT set this
#       to /sign-in (or any URL on the app's own domain): the in-app /sign-in
#       page only forwards to this URL, so a same-host value loops forever
#       (ERR_TOO_MANY_REDIRECTS). If unset/misconfigured the app derives the
#       Account Portal from the publishable key as a fallback.
#   NEXT_PUBLIC_AUTH_AFTER_SIGN_OUT_URL — e.g. / (the app home page)
#   NEXT_PUBLIC_AUTH_PROVIDER         — clerk
#
# OPTIONAL GITHUB SECRETS (enables auto-deploy to Render after image push):
#   RENDER_API_KEY                    — Render API key
#   RENDER_SERVICE_ID_WEB             — Render service ID for ctf-web
#   RENDER_SERVICE_ID_OLLAMA          — Render service ID for ctf-ollama
#   RENDER_SERVICE_ID_RASA            — Render service ID for ctf-rasa
#   RENDER_SERVICE_ID_FORMANCE        — Render service ID for ctf-formance-ledger

on:
  push:
    branches: [main]
    paths:
      - 'ctf/**'
      - 'render.yaml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  # ── Detect which services have changed ──────────────────────────
  changes:
    name: Detect changed services
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      ollama: ${{ steps.filter.outputs.ollama }}
      rasa: ${{ steps.filter.outputs.rasa }}
      formance: ${{ steps.filter.outputs.formance }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'ctf/packages/web/**'
              - 'ctf/packages/shared/**'
              - 'ctf/pnpm-lock.yaml'
              - 'ctf/package.json'
              - 'ctf/tsconfig.base.json'
              - 'ctf/pnpm-workspace.yaml'
            ollama:
              - 'ctf/ops/ollama/**'
            rasa:
              - 'ctf/ops/rasa/**'
            formance:
              - 'ctf/ops/formance/Dockerfile.ledger'

  # ── ctf-web ─────────────────────────────────────────────────────
  build-web:
    name: Build ctf-web
    needs: changes
    if: needs.changes.outputs.web == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ctf-web
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ctf
          file: ctf/packages/web/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ctf-web
          cache-to: type=gha,scope=ctf-web,mode=max
          # These NEXT_PUBLIC_* build-args are inlined into the client bundle now,
          # at build time. They are the ONLY source of the browser's Clerk config —
          # Render/Infisical runtime env does not change them. Re-run this workflow
          # after updating a secret so the new value is re-baked.
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_AUTH_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_AUTH_PUBLISHABLE_KEY }}
            NEXT_PUBLIC_AUTH_SIGN_IN_URL=${{ secrets.NEXT_PUBLIC_AUTH_SIGN_IN_URL }}
            NEXT_PUBLIC_AUTH_AFTER_SIGN_OUT_URL=${{ secrets.NEXT_PUBLIC_AUTH_AFTER_SIGN_OUT_URL }}
            NEXT_PUBLIC_AUTH_PROVIDER=${{ secrets.NEXT_PUBLIC_AUTH_PROVIDER }}

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_WEB: ${{ secrets.RENDER_SERVICE_ID_WEB }}
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID_WEB" ]; then
            echo "RENDER_API_KEY or RENDER_SERVICE_ID_WEB not set — skipping auto-deploy (image is pushed to GHCR; deploy ctf-web manually in Render)."
            exit 0
          fi
          # Do NOT use curl -f here: it exits 22 and hides the HTTP error. Capture
          # the status code + body so a failed trigger is readable, and never fail
          # the build on it — the image is already pushed and can be deployed
          # manually in Render (Manual Deploy → Deploy latest reference).
          http_status=$(curl -s -o /tmp/render-deploy.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID_WEB/deploys" || true)
          echo "Render deploy API responded with HTTP ${http_status:-<none>} for ctf-web"
          case "$http_status" in
            2*) echo "Render deploy triggered for ctf-web." ;;
            *)
              echo "::warning title=Render auto-deploy not triggered::HTTP ${http_status:-none} from Render for ctf-web. The image is already pushed to GHCR — deploy manually (Manual Deploy → Deploy latest reference) and verify RENDER_API_KEY (rnd_…, raw) and RENDER_SERVICE_ID_WEB. Response:"
              cat /tmp/render-deploy.json 2>/dev/null || true
              ;;
          esac

  # ── ctf-ollama ──────────────────────────────────────────────────
  # Only rebuilds when the Dockerfile changes — model bake takes ~1 hour.
  build-ollama:
    name: Build ctf-ollama
    needs: changes
    if: needs.changes.outputs.ollama == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ctf-ollama
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ctf/ops/ollama
          file: ctf/ops/ollama/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ctf-ollama
          cache-to: type=gha,scope=ctf-ollama,mode=max

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_OLLAMA: ${{ secrets.RENDER_SERVICE_ID_OLLAMA }}
        run: |
          # See ctf-web for why curl -f is avoided; print status, never fail the build.
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID_OLLAMA" ]; then
            echo "RENDER_API_KEY or RENDER_SERVICE_ID_OLLAMA not set — skipping auto-deploy (image is pushed to GHCR; deploy ctf-ollama manually in Render)."
            exit 0
          fi
          http_status=$(curl -s -o /tmp/render-deploy.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID_OLLAMA/deploys" || true)
          echo "Render deploy API responded with HTTP ${http_status:-<none>} for ctf-ollama"
          case "$http_status" in
            2*) echo "Render deploy triggered for ctf-ollama." ;;
            *)
              echo "::warning title=Render auto-deploy not triggered::HTTP ${http_status:-none} from Render for ctf-ollama. The image is already pushed to GHCR — deploy manually and verify RENDER_API_KEY (rnd_…, raw) and RENDER_SERVICE_ID_OLLAMA. Response:"
              cat /tmp/render-deploy.json 2>/dev/null || true
              ;;
          esac

  # ── ctf-rasa ────────────────────────────────────────────────────
  # Only rebuilds when ctf/ops/rasa/** changes — the NLU model is trained at build
  # time (rasa train nlu) and baked into the image, so the build can take a while.
  build-rasa:
    name: Build ctf-rasa
    needs: changes
    if: needs.changes.outputs.rasa == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ctf-rasa
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ctf/ops/rasa
          file: ctf/ops/rasa/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ctf-rasa
          cache-to: type=gha,scope=ctf-rasa,mode=max

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_RASA: ${{ secrets.RENDER_SERVICE_ID_RASA }}
        run: |
          # See ctf-web for why curl -f is avoided; print status, never fail the build.
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID_RASA" ]; then
            echo "RENDER_API_KEY or RENDER_SERVICE_ID_RASA not set — skipping auto-deploy (image is pushed to GHCR; deploy ctf-rasa manually in Render)."
            exit 0
          fi
          http_status=$(curl -s -o /tmp/render-deploy.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID_RASA/deploys" || true)
          echo "Render deploy API responded with HTTP ${http_status:-<none>} for ctf-rasa"
          case "$http_status" in
            2*) echo "Render deploy triggered for ctf-rasa." ;;
            *)
              echo "::warning title=Render auto-deploy not triggered::HTTP ${http_status:-none} from Render for ctf-rasa. The image is already pushed to GHCR — deploy manually and verify RENDER_API_KEY (rnd_…, raw) and RENDER_SERVICE_ID_RASA. Response:"
              cat /tmp/render-deploy.json 2>/dev/null || true
              ;;
          esac

  # ── ctf-formance-ledger ─────────────────────────────────────────
  build-formance-ledger:
    name: Build ctf-formance-ledger
    needs: changes
    if: needs.changes.outputs.formance == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/ctf-formance-ledger
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: ctf/ops/formance
          file: ctf/ops/formance/Dockerfile.ledger
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ctf-formance-ledger
          cache-to: type=gha,scope=ctf-formance-ledger,mode=max

      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID_FORMANCE: ${{ secrets.RENDER_SERVICE_ID_FORMANCE }}
        run: |
          # See ctf-web for why curl -f is avoided; print status, never fail the build.
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID_FORMANCE" ]; then
            echo "RENDER_API_KEY or RENDER_SERVICE_ID_FORMANCE not set — skipping auto-deploy (image is pushed to GHCR; deploy ctf-formance-ledger manually in Render)."
            exit 0
          fi
          http_status=$(curl -s -o /tmp/render-deploy.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID_FORMANCE/deploys" || true)
          echo "Render deploy API responded with HTTP ${http_status:-<none>} for ctf-formance-ledger"
          case "$http_status" in
            2*) echo "Render deploy triggered for ctf-formance-ledger." ;;
            *)
              echo "::warning title=Render auto-deploy not triggered::HTTP ${http_status:-none} from Render for ctf-formance-ledger. The image is already pushed to GHCR — deploy manually and verify RENDER_API_KEY (rnd_…, raw) and RENDER_SERVICE_ID_FORMANCE. Response:"
              cat /tmp/render-deploy.json 2>/dev/null || true
              ;;
          esac
