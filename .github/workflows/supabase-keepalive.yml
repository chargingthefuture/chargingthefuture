name: Supabase — Keepalive

# Keeps the free-tier Supabase project from being paused for inactivity.
#
# Supabase pauses a free project after ~7 days with no DATABASE activity. The nightly Formance
# backup only writes to Supabase *Storage*, and Storage writes do not reset that timer — which is
# why the project still gets flagged as inactive despite a daily backup. This runs a trivial
# `select 1` against the Supabase Postgres database twice a week, which is the activity Supabase
# actually counts, so the project stays awake. It reads no data and writes nothing.
#
# What it needs (Settings → Secrets and variables → Actions):
#   SUPABASE_DB_URL secret — the Supabase Postgres connection string (Dashboard → Project Settings →
#              Database → Connection string → URI; the pooled "Session" URI is fine). This is a new,
#              distinct value: the existing SUPABASE_URL is the REST/Storage project URL, not a
#              Postgres connection string, so it cannot be reused here.
#
# If SUPABASE_DB_URL is missing the run does not fail: it emits a visible warning and writes a note
# to the run summary, then exits without error — so the project simply is not kept awake until the
# secret is added. The connection string is never printed.

on:
  schedule:
    - cron: '0 6 * * 1,4' # Monday and Thursday 06:00 UTC — max gap 4 days, well under the 7-day window
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-keepalive
  cancel-in-progress: false

jobs:
  ping:
    name: Ping Supabase Postgres
    runs-on: ubuntu-latest
    steps:
      - name: Run select 1 against Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::warning::Supabase keepalive skipped: SUPABASE_DB_URL is not set in GitHub Actions secrets. The project is NOT being kept awake until it is added."
            echo "Skipped: SUPABASE_DB_URL not set; keepalive is OFF." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # psql is preinstalled on the runner; a select 1 works against any Postgres version, so no
          # version-matched client install is needed (unlike pg_dump in the backup job).
          psql "${SUPABASE_DB_URL}" -tAc 'select 1' > /tmp/keepalive.out
          result="$(cat /tmp/keepalive.out)"
          echo "Supabase responded: ${result}"
          if [ "${result}" != "1" ]; then
            echo "::error::Supabase keepalive query did not return 1 (got '${result}'). Check SUPABASE_DB_URL."
            exit 1
          fi
          echo "Supabase keepalive OK (select 1 → 1)." >> "$GITHUB_STEP_SUMMARY"
