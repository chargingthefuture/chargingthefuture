name: Demo — Seed Schema

on:
  workflow_dispatch:
    inputs:
      demo_owner_id:
        description: "Clerk user ID of the demo account. Leave empty to use the DEMO_VIDEO_CLERK_USER_ID repository variable"
        required: false
        type: string
        default: ""
      demo_second_owner_id:
        description: "Optional: a SECOND Clerk user ID to be the two-sided marketplace counterparty (for testing both sides). Also target the demo-mode Unleash flag at this ID."
        required: false
        type: string
        default: ""
      demo_tester_admin_id:
        description: "Optional: the ADMIN demo Clerk user ID. Leave empty to use the DEMO_VIDEO_CLERK_ADMIN_ID repository variable. The seed grants entry + wallet + profile; set role=admin on it in Clerk and target the demo-mode Unleash flag at it."
        required: false
        type: string
        default: ""
      start_fresh:
        description: "Empty every demo table first, so the demo data is rebuilt from nothing (demo schema only; real member data is never touched). Anything made by hand in demo mode is removed."
        required: true
        type: boolean
        default: true
      demo_tester_member_id:
        description: "Optional: the hired tester's MEMBER Clerk user ID (issue #2037). The seed grants entry + wallet + profile; also target the demo-mode Unleash flag at it."
        required: false
        type: string
        default: ""

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          cd ctf
          pnpm install

      - name: Regenerate schema.demo.sql from schema.sql
        run: node ctf/scripts/generateDemoSchema.mjs

      - name: Install psql client
        run: sudo apt-get install -y postgresql-client

      - name: Empty the demo schema (start fresh)
        if: ${{ inputs.start_fresh }}
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DB="${DATABASE_URL_DIRECT:-$DATABASE_URL}"
          if [ -z "$DB" ]; then
            echo "::error::DATABASE_URL_DIRECT or DATABASE_URL secret is not set."
            exit 1
          fi
          psql "$DB" -v ON_ERROR_STOP=1 -f ctf/scripts/sql/demo-schema-empty.sql

      - name: Bring the demo schema up to date
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          DB="${DATABASE_URL_DIRECT:-$DATABASE_URL}"
          if [ -z "$DB" ]; then
            echo "DATABASE_URL_DIRECT or DATABASE_URL secret is not set."
            exit 1
          fi
          # Re-applying is safe: every statement uses IF NOT EXISTS / IF EXISTS
          # guards. This makes sure the demo schema has every table, column, and
          # constraint the seed relies on (for example the unique keys the seed
          # upserts against) before we try to seed it.
          psql "$DB" -v ON_ERROR_STOP=1 -f ctf/schema.demo.sql
          echo "Demo schema is up to date."

      - name: Run demo seed
        env:
          DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          # A box filled in wins; otherwise the repository variable (or a secret of the same name).
          DEMO_OWNER_ID: ${{ inputs.demo_owner_id || vars.DEMO_VIDEO_CLERK_USER_ID || secrets.DEMO_VIDEO_CLERK_USER_ID }}
          DEMO_SECOND_OWNER_ID: ${{ inputs.demo_second_owner_id }}
          DEMO_TESTER_ADMIN_ID: ${{ inputs.demo_tester_admin_id || vars.DEMO_VIDEO_CLERK_ADMIN_ID || secrets.DEMO_VIDEO_CLERK_ADMIN_ID }}
          DEMO_TESTER_MEMBER_ID: ${{ inputs.demo_tester_member_id }}
        run: |
          if [ -z "$DATABASE_URL_DIRECT" ] && [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL_DIRECT or DATABASE_URL secret is not set."
            exit 1
          fi
          if [ -z "$DEMO_OWNER_ID" ]; then
            echo "::error::No demo account: fill in demo_owner_id, or set the DEMO_VIDEO_CLERK_USER_ID repository variable."
            exit 1
          fi
          cd ctf
          node scripts/seedDemo.mjs
          echo "Demo schema seeded for $DEMO_OWNER_ID."
          if [ -n "$DEMO_SECOND_OWNER_ID" ]; then
            echo "Two-sided counterparty seeded: $DEMO_SECOND_OWNER_ID (also target the demo-mode Unleash flag at this ID)."
          fi
          if [ -n "$DEMO_TESTER_ADMIN_ID" ]; then
            echo "Tester admin seeded: $DEMO_TESTER_ADMIN_ID (set role=admin on it in Clerk, and target the demo-mode Unleash flag at it)."
          fi
          if [ -n "$DEMO_TESTER_MEMBER_ID" ]; then
            echo "Tester member seeded: $DEMO_TESTER_MEMBER_ID (target the demo-mode Unleash flag at it)."
          fi
