name: Formance — Restore from Private Repo

# On-demand restore of a Formance pg_dump backup (produced by
# backup-formance.yml) into a TARGET database — for disaster recovery or
# spinning up a fresh Formance environment. Manual trigger only.
#
# The backup is a GitHub Release asset on the PRIVATE BACKUP_REPO.
#
# Safety: it restores into FORMANCE_RESTORE_TARGET_DATABASE_URL — a DISTINCT
# secret from the backup's FORMANCE_DATABASE_URL — so a misconfiguration can never
# overwrite the production ledger. Point that secret at the NEW environment's Railway
# Postgres connection string before running. See ctf/ops/formance/DISASTER_RECOVERY.md.
#
# Required secrets: GH_PAT (read access to BACKUP_REPO), BACKUP_REPO (owner/name),
# FORMANCE_RESTORE_TARGET_DATABASE_URL (the target DB to restore INTO).

on:
  workflow_dispatch:
    inputs:
      backup_tag:
        description: 'Release tag to restore (e.g. formance-backup-<ts>). Blank = latest release.'
        required: false
        type: string
      backup_file:
        description: 'Specific asset filename (e.g. formance-backup-<ts>.dump). Blank = the dump on the chosen release.'
        required: false
        type: string

jobs:
  restore-formance:
    name: Restore Formance backup into target DB
    runs-on: ubuntu-latest
    env:
      # TARGET DB to restore INTO — a new/recovery database, never production.
      FORMANCE_DATABASE_URL: ${{ secrets.FORMANCE_RESTORE_TARGET_DATABASE_URL }}
      # Token with read access to the private backup repo
      GH_PAT: ${{ secrets.GH_PAT }}
      # Private backup repo as owner/name
      BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
      FORMANCE_BACKUP_TAG: ${{ inputs.backup_tag }}
      FORMANCE_BACKUP_FILE: ${{ inputs.backup_file }}
      FORMANCE_RESTORE_CONFIRM: '1'
    steps:
      - name: Guard — require an explicit target database
        run: |
          if [ -z "${FORMANCE_DATABASE_URL}" ]; then
            echo "FORMANCE_RESTORE_TARGET_DATABASE_URL is not set. Set it to the NEW environment's Railway Postgres connection string before running. Refusing to restore." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        # Install the ctf workspace (same as ci.yml) — its lockfile is validated on every PR.
        # The root workspace lockfile is not CI-gated and has drifted before (issue #1229).
        run: pnpm install --frozen-lockfile --dir ctf

      - name: Install PostgreSQL client 18
        # Must match (or exceed) the client that produced the backup. The backup
        # workflow now dumps with pg_dump 18, and pg_restore refuses to read a
        # custom-format archive written by a newer pg_dump — so a client older
        # than 18 fails at the archive header before touching the target DB. The
        # runner's bundled client may also be missing or too old. Install client
        # 18 from the official PostgreSQL apt repository and put it first on PATH.
        # Keep this in lockstep with the client version in backup-formance.yml.
        run: |
          set -e
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Run Formance restore script
        id: restore
        run: |
          set -e
          # Capture stderr to a file AND print it to the job log on failure, so
          # the real reason shows up directly in the log (not only in the
          # uploaded artifact, which needs a separate download to read).
          if ! node ctf/scripts/restoreFormanceFromPrivateRepo.mjs 2> restore-error.log; then
            echo "::error::Formance restore failed. Error output from the restore script:"
            cat restore-error.log >&2
            exit 1
          fi

      - name: Upload failure logs (if present)
        if: failure() && steps.restore.outcome == 'failure' && hashFiles('restore-error.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: formance-restore-failure-logs
          path: restore-error.log
          retention-days: 7
