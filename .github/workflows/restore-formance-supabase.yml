name: Restore Formance from Supabase

# On-demand restore of a Formance pg_dump backup (produced by
# backup-formance-supabase.yml) into a TARGET database — for disaster recovery or
# spinning up a fresh Formance environment. Manual trigger only.
#
# Safety: it restores into FORMANCE_RESTORE_TARGET_DATABASE_URL — a DISTINCT
# secret from the backup's FORMANCE_DATABASE_URL — so a misconfiguration can never
# overwrite the production ledger. Point that secret at the NEW environment's Railway
# Postgres connection string before running. See ctf/ops/formance/DISASTER_RECOVERY.md.

on:
  workflow_dispatch:
    inputs:
      backup_file:
        description: 'Specific backup filename (e.g. formance-backup-<ts>.dump). Blank = latest.'
        required: false
        type: string

jobs:
  restore-formance:
    name: Restore Formance backup into target DB
    runs-on: ubuntu-latest
    env:
      # TARGET DB to restore INTO — a new/recovery database, never production.
      FORMANCE_DATABASE_URL: ${{ secrets.FORMANCE_RESTORE_TARGET_DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.SUPABASE_URL_FALLBACK }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY_FALLBACK }}
      FORMANCE_BACKUP_FILE: ${{ inputs.backup_file }}
      FORMANCE_RESTORE_CONFIRM: '1'
    steps:
      - name: Guard — require an explicit target database
        run: |
          if [ -z "${FORMANCE_DATABASE_URL}" ]; then
            echo "FORMANCE_RESTORE_TARGET_DATABASE_URL is not set. Set it to the NEW environment's Railway Postgres connection string before running. Refusing to restore." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install PostgreSQL client 17
        # Match the newest target server (Postgres 16/17). The runner's bundled
        # client may be missing or too old, and pg_restore must be at least the
        # server version. Install from the official PostgreSQL apt repository and
        # put it first on PATH.
        run: |
          set -e
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      - name: Run Formance restore script
        id: restore
        run: |
          set -e
          # Capture stderr to a file AND print it to the console on failure, so
          # the real reason shows up directly in the job log (not only in the
          # uploaded artifact, which needs a separate download to read).
          if ! node ctf/scripts/restoreFormanceFromSupabase.mjs 2> restore-error.log; then
            echo "::error::Formance restore failed. Error output from the restore script:"
            cat restore-error.log >&2
            exit 1
          fi

      - name: Upload failure logs (if present)
        if: failure() && steps.restore.outcome == 'failure' && hashFiles('restore-error.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: formance-restore-failure-logs
          path: restore-error.log
          retention-days: 7
