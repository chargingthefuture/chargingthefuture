name: One-off — Remediate duplicate SkillsHunt submission

# ONE-TIME remediation for an accidental double-accept in SkillsHunt (the same
# person nominated twice in a round). It voids the duplicate submission and
# soft-deletes its auto-generated Directory profile. The ServiceCredits reward is
# reversed separately in the admin burn UI (the script prints the reminder).
#
# Manual trigger only. To run: Actions tab -> this workflow -> "Run workflow" ->
# type REMEDIATE in the confirm box.
#
# DELETE this workflow (and ctf/scripts/oneoffRemediateDuplicateKatieLarkin.mjs)
# once it has run successfully.
#
# Needs the DATABASE_URL Actions secret (same one the reclaim sweep uses).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type REMEDIATE to run the one-off remediation'
        required: true
        default: ''

permissions:
  contents: read

concurrency:
  group: oneoff-remediate-duplicate-katie-larkin
  cancel-in-progress: false

jobs:
  remediate:
    name: Void the duplicate submission
    if: ${{ inputs.confirm == 'REMEDIATE' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the remediation
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: node ctf/scripts/oneoffRemediateDuplicateKatieLarkin.mjs
