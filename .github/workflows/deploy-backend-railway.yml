name: Deploy Backend to Railway

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-backend-railway-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actions-budget-gate:
    name: Actions Budget Gate
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    outputs:
      status: ${{ steps.budget.outputs.status }}
      enforce_block: ${{ steps.budget.outputs.enforce_block }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Evaluate GitHub Actions budget
        id: budget
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTIONS_MONITOR_TOKEN: ${{ secrets.GH_ACTIONS_BILLING_TOKEN }}
          GITHUB_ACTIONS_MONITOR_SCOPE: org
          GITHUB_ACTIONS_BUDGET_MINUTES: "2000"
          GITHUB_ACTIONS_BUDGET_ARTIFACT_MB: "500"
          GITHUB_ACTIONS_BUDGET_CACHE_GB: "10"
          GITHUB_ACTIONS_BUDGET_THRESHOLDS: "60,80,90"
        run: node ctf/scripts/githubActionsBudgetMonitor.mjs

  main-quality-gate:
    name: Main Branch Quality Gate
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' && github.ref == 'refs/heads/main'
    defaults:
      run:
        working-directory: ctf
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Run quality checks when scripts exist
        run: |
          set -euo pipefail

          run_script() {
            local script_name="$1"
            local exists
            exists=$(node -e "const p=require('./package.json'); process.stdout.write(p.scripts && p.scripts['${script_name}'] ? 'yes' : 'no')")
            if [ "$exists" = "yes" ]; then
              pnpm run "$script_name"
            else
              echo "Skipping '$script_name' (not defined in ctf/package.json)"
            fi
          }

          run_script lint
          run_script typecheck
          run_script test

  schema-drift-gate:
    name: Schema Drift Gate
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce schema drift policy
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            bash ctf/scripts/check-schema-drift.sh --ref-range "${{ github.event.before }}...${{ github.sha }}"
          else
            bash ctf/scripts/check-schema-drift.sh
          fi

  schema-query-audit:
    name: Schema Query Audit
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run schema query audit
        run: |
          set -euo pipefail
          node ctf/scripts/audit-schema-queries.mjs

  drift-staging:
    name: Drift Check (staging)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL_STAGING != '' && secrets.DATABASE_URL_STAGING || vars.DATABASE_URL_STAGING }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate staging DATABASE_URL secret
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "Missing DATABASE_URL_STAGING in GitHub Actions secrets/variables."
            exit 1
          fi

      - name: Install dependencies
        working-directory: ctf
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --frozen-lockfile

      - name: Run live schema drift report (staging)
        working-directory: ctf
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm run schema:report-live-drift | tee ../schema-drift-staging-report.txt

      - name: Upload drift report artifact (staging)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-staging-report
          path: schema-drift-staging-report.txt

  drift-production:
    name: Drift Check (production)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    continue-on-error: true
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL != '' && secrets.DATABASE_URL || vars.DATABASE_URL }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate production DATABASE_URL secret
        run: |
          if [ -z "${DATABASE_URL}" ]; then
            echo "Missing DATABASE_URL in GitHub Actions secrets/variables."
            exit 1
          fi

      - name: Install dependencies
        working-directory: ctf
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --frozen-lockfile

      - name: Run live schema drift report (production)
        working-directory: ctf
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm run schema:report-live-drift | tee ../schema-drift-production-report.txt

      - name: Upload drift report artifact (production)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-drift-production-report
          path: schema-drift-production-report.txt

  railway-deploy:
    name: Railway Deploy
    runs-on: ubuntu-latest
    needs: [actions-budget-gate, main-quality-gate, schema-drift-gate, schema-query-audit]
    if: ${{ github.event_name != 'schedule' && needs.actions-budget-gate.outputs.enforce_block != 'true' && needs.schema-drift-gate.result == 'success' && needs.schema-query-audit.result == 'success' && (needs.main-quality-gate.result == 'success' || needs.main-quality-gate.result == 'skipped') }}
    environment: ${{ github.ref == 'refs/heads/main' && 'rewrite-railway-production' || 'rewrite-railway-staging' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}
          domain: ${{ secrets.INFISICAL_URL }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: ctf
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            pnpm install --frozen-lockfile
          else
            pnpm install --no-frozen-lockfile
          fi

      - name: Validate Railway secret
        run: |
          set -euo pipefail
          [ -n "$RAILWAY_TOKEN" ] || { echo "Missing RAILWAY_TOKEN — check Infisical secrets"; exit 1; }

      - name: Validate Clerk env contract for Railway target
        working-directory: ctf
        env:
          CLERK_ENV_TARGET: ${{ github.ref == 'refs/heads/main' && 'railway-production' || 'railway-staging' }}
        run: |
          set -euo pipefail
          echo "Skipping Clerk environment check as Clerk auth is disabled"

      - name: Build web package before deploy
        working-directory: ctf
        run: |
          set -euo pipefail
          corepack pnpm --filter @ctf/web run build

      - name: Deploy to Railway
        run: |
          set -euo pipefail
          if [ -d ctf ]; then
            cd ctf
            npm exec --yes @railway/cli@latest -- up --ci
          else
            echo "ctf directory does not exist. Cannot deploy to Railway."
            exit 1
          fi


  claude-issue-remediation:
    name: Claude Issue Remediation
    runs-on: ubuntu-latest
    needs: railway-deploy
    if: always() && needs.railway-deploy.result == 'failure'
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Auto-fix with Claude Code
        id: claude-fix
        uses: anthropics/claude-code-action@476e359e6203e73dad705c8b322e333fabbd7416 # v1.0.119
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          timeout_minutes: "30"
          direct_prompt: |
            The Railway backend deployment workflow failed on branch `${{ github.ref_name }}` (commit `${{ github.sha }}`).

            Workflow run for logs and context: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Please investigate the repository to determine what caused the Railway deployment to fail and open a pull request with a fix. Steps:

            1. Review recent commits on this branch vs main to find likely causes
            2. Check for TypeScript or build errors in `ctf/packages/web/` — the build step runs `pnpm --filter @ctf/web run build`
            3. Check `ctf/railway.json` or `railway.toml` for Railway configuration issues
            4. Check for schema drift issues using `ctf/scripts/check-schema-drift.sh`
            5. Check for missing or misconfigured environment variables referenced in code
            6. Create a branch named `fix/railway-deploy-${{ github.run_id }}`, commit the fix, and open a PR targeting `${{ github.ref_name }}`

            REQUIRED PR formatting (the CI will reject the PR without these):
            - Title must follow conventional commits and start with `fix: `
            - Body must include exactly this line: `Parity Status: web+android complete`
            - All modified `.ts`, `.tsx`, `.js`, `.json`, `.yml`, `.yaml`, `.css` files must end with exactly one newline and no trailing blank lines

      - name: Fallback failure issue
        if: always() && steps.claude-fix.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "Railway deploy failed: ${{ github.ref_name }} @ ${{ github.sha }}" \
            --label "railway-failure" \
            --body "## Railway Deployment Failure

          **Branch:** \`${{ github.ref_name }}\`
          **Commit:** \`${{ github.sha }}\`
          **Run:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          Claude Code auto-fix did not run or failed. Review the workflow run logs to diagnose."
