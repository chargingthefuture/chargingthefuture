name: Code Review — Sweep and File Issues

# Reviews ONE slice of the codebase per run and files GitHub issues for the findings, then
# advances the rotation ledger so the next run moves on. This is the incremental,
# review-the-whole-codebase-over-time alternative to a per-merge review bot. It never writes
# code or opens a PR — findings it judges to have a small, safe fix get the
# `code-review:actionable` label, which `code-review-implement.yml` can turn into a PR.
#
# Runs on a daily schedule (one slice per run) and can also be kicked by hand. The schedule
# is deliberately modest — one bounded model call per day — so it works through the codebase
# over time without much cost. Change or remove the cron below to adjust the cadence. See
# ctf/scripts/reviewCodebaseSlice.mjs.
on:
  workflow_dispatch:
    inputs:
      slice:
        description: "Review this exact plugin/module name (blank = least-recently-reviewed)"
        required: false
        type: string
      dry_run:
        description: "Print findings only — do not file issues or advance the ledger"
        type: boolean
        default: false
  schedule:
    - cron: "23 6 * * *"   # daily at 06:23 UTC (one slice per run)

permissions:
  issues: write
  contents: write
  pull-requests: write

jobs:
  sweep:
    name: Review least-recently-reviewed slice
    runs-on: ubuntu-latest
    steps:
      # Full checkout so the script can read the slice it is reviewing.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The rotation ledger lives on its own branch (`code-review-ledger`), never on main.
      # main is gated by a ruleset that requires status checks, which a direct push can't
      # satisfy, so the daily bot must not push there. Restore the latest ledger from its
      # branch into the working tree before reviewing.
      #
      # CRITICAL — never silently reset the ledger. There are two very different situations and
      # only the first may fall back to the in-repo stub:
      #   1. The branch does NOT exist yet (first run ever) → seeding from the stub is correct.
      #   2. The branch EXISTS but the fetch/parse failed (transient network blip, or a corrupt
      #      ledger) → falling back to the empty stub here would, at the commit step, FORCE-PUSH a
      #      blank ledger over real rotation state and wipe every slice's review history. That is
      #      the bug that reset the whole sweep before. In that case we FAIL LOUDLY (non-zero) so
      #      the run can simply be retried, instead of destroying the rotation.
      - name: Restore rotation ledger from its branch
        run: |
          set -euo pipefail
          LEDGER=ctf/config/code-review-ledger.json

          if ! git ls-remote --exit-code --heads origin code-review-ledger >/dev/null 2>&1; then
            echo "No code-review-ledger branch yet (first run); seeding from the in-repo stub on main."
            exit 0
          fi

          echo "code-review-ledger branch exists; restoring it (a fallback to the stub here would wipe rotation state)."
          ok=0
          for attempt in 1 2 3; do
            if git fetch --depth=1 origin code-review-ledger 2>/dev/null \
              && git cat-file -e "FETCH_HEAD:$LEDGER" 2>/dev/null; then
              ok=1
              break
            fi
            echo "Ledger fetch attempt $attempt failed; retrying..." >&2
            sleep $((attempt * 3))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::code-review-ledger branch exists but its ledger could not be fetched after 3 attempts. Refusing to fall back to the empty stub (that would wipe all rotation state). Re-run the workflow." >&2
            exit 1
          fi

          git show "FETCH_HEAD:$LEDGER" > "$LEDGER"

          # A corrupt or truncated ledger would otherwise reconcile to "everything never-reviewed"
          # and overwrite the good history on commit. Require a valid ledger (a JSON object with a
          # non-empty `slices` array — the rotation always has at least one slice) or fail loudly.
          if ! jq -e 'type == "object" and (.slices | type == "array") and (.slices | length > 0)' "$LEDGER" >/dev/null 2>&1; then
            echo "::error::Restored code-review-ledger is not a valid, non-empty ledger (expected a JSON .slices array). Refusing to proceed and overwrite rotation state." >&2
            exit 1
          fi
          echo "Restored ledger from the code-review-ledger branch ($(jq '.slices | length' "$LEDGER") slices)."

      # ANTHROPIC_API_KEY is a runtime secret; Infisical is the single source of truth
      # (this matches the other AI workflows in this folder).
      - name: Inject secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: ${{ secrets.INFISICAL_URL }}
          secret-path: /
          recursive: true

      - name: Review one slice and file issues
        env:
          # ANTHROPIC_API_KEY is injected by the Infisical step above.
          # GITHUB_TOKEN is the automatic Actions token (issues: write granted above).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CODE_REVIEW_SLICE: ${{ inputs.slice }}
          CODE_REVIEW_DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: node ctf/scripts/reviewCodebaseSlice.mjs

      # Persist the rotation pointer so the next run reviews a different slice. Pushes to the
      # dedicated `code-review-ledger` branch — never to main (main is PR-gated by a ruleset
      # that a direct push can't satisfy). Force-push because this machine branch only carries
      # the latest ledger on top of whatever main was checked out; its history is not
      # meaningful. The script re-stamps the reviewed slice every run, so there is always a
      # real change to commit. Skipped on a dry run.
      - name: Commit ledger to its branch
        if: ${{ inputs.dry_run != true }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet -- ctf/config/code-review-ledger.json; then
            echo "Ledger unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "CTF CI Bot"
          git config user.email "ci@chargingthefuture.org"
          git add ctf/config/code-review-ledger.json
          git commit -m "chore: advance code-review sweep ledger"
          git push --force "https://x-access-token:${GH_PAT}@github.com/${GITHUB_REPOSITORY}.git" HEAD:code-review-ledger

      # One rotation, two artifacts: regenerate the MANUAL test script for the SAME plugin the
      # review above just completed (it reads the most-recently-reviewed slice from the ledger that
      # the review step already updated in the working tree). This is the auto/rotation half of the
      # manual-testing system; the on-demand half is .github/workflows/manual-test-script.yml.
      # Skipped on a dry run. No-ops cleanly if the rotation landed on a non-plugin slice.
      - name: Refresh the rotated plugin's manual test script
        if: ${{ inputs.dry_run != true }}
        env:
          # ANTHROPIC_API_KEY is injected by the Infisical step above.
          TEST_SCRIPT_FROM_REVIEW: '1'
        run: node ctf/scripts/generateManualTestScript.mjs

      # Land the refreshed script via a low-risk, auto-merging PR (main is PR-gated by a ruleset, so a
      # scheduled job can't push to it directly). Uses GH_PAT so the PR triggers CI and auto-merge can
      # complete. No change -> no PR. Reuses a stable per-plugin branch so a re-run updates the same PR.
      - name: Open an auto-merge PR for the refreshed script
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          changed="$(git status --porcelain -- ctf/docs/developer/test-scripts/ | awk '{print $2}')"
          if [ -z "$changed" ]; then
            echo "No manual test script changed this run; nothing to open."
            exit 0
          fi
          slug="$(basename "$(echo "$changed" | head -n1)" -test-script.md)"
          branch="test-script/auto-${slug}"
          git config user.name "CTF CI Bot"
          git config user.email "ci@chargingthefuture.org"
          git checkout -B "$branch"
          git add ctf/docs/developer/test-scripts/
          git commit -m "docs: refresh ${slug} manual test script"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${branch}"
          body=$'Auto-refresh of the manual test script for the plugin the code-review sweep just covered.\n\nParity Status: web + mobile-responsive + android complete'
          if gh pr view "$branch" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "PR already open for ${branch}; the force-push updated it."
          else
            gh pr create --repo "$GITHUB_REPOSITORY" --head "$branch" --base main \
              --title "docs: refresh ${slug} manual test script" --body "$body"
            gh pr merge "$branch" --repo "$GITHUB_REPOSITORY" --auto --squash || \
              echo "Could not enable auto-merge (it may already be enabled or not permitted); leaving the PR open."
          fi
