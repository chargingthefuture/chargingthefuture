name: Comic Knowledge — Rename Quora Space Title (production)

# ONE-TIME workflow. The owner renamed the Quora space "TI Skills Network" to "Skills Economy".
# The seed import maps a row's space to its knowledge-entry title, so rows already in
# comic_knowledge_entries still carry the old title and can inject it into a model prompt. This
# updates the live rows to the new name.
#
# SAFE BY DEFAULT: previews (dry run) unless "apply" is set to true when starting it. Run once as a
# preview, read the before/after lines in the log, then run again with apply=true.
#
# Scope: it changes only the `title` column, matched exactly against the old space name. It does not
# touch `content` (a member's verbatim words) and does not recompute content_hash (title is not part
# of the hash), so import idempotency is unaffected.
#
# DELETE AFTER USE: once an apply run finishes green, delete this file and
# ctf/scripts/renameComicSpaceTitle.mjs. The seed file already carries the new name, so no further
# correction is needed.
on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'Write changes? Leave false for a dry-run preview.'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: rename-comic-space-title
  cancel-in-progress: false

jobs:
  rename:
    name: Rename the old Quora space title in the knowledge base
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # DATABASE_URL is a runtime secret; Infisical is the single source of truth.
      - name: Inject secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: ${{ secrets.INFISICAL_URL }}
          secret-path: /
          recursive: true

      - name: Install Postgres client
        run: npm install --no-save pg@8

      - name: Rename space title
        run: |
          set -euo pipefail
          if [ "${{ inputs.apply }}" = "true" ]; then
            node ctf/scripts/renameComicSpaceTitle.mjs --apply | tee /tmp/rename.txt
          else
            node ctf/scripts/renameComicSpaceTitle.mjs | tee /tmp/rename.txt
          fi
          {
            echo '```'
            tail -60 /tmp/rename.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
