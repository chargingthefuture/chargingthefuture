name: SkillsHunt — Auto Missions from Workforce Gaps

# Tops up every active SkillsHunt round with missions for the sectors Workforce shows the largest
# talent gaps in (owner decision 2026-08-27). Weekly, not daily: the gap model moves with Directory
# sign-ups, which is slow at the current member count, and round creation already opens each new
# round's gap missions inline — this run only covers rounds that were active when the gaps or the
# admin config changed. The run is idempotent (at most one live auto mission per round and sector,
# enforced in the database), so re-runs open nothing new. Admins can force the same run any time
# with "Run now" on the SkillsHunt admin missions tab, and the config kill switch turns the whole
# mechanism off.
#
# What it needs (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_APP_URL secret — your production base URL (e.g. https://app.example.com). This is
#              the same secret the image build already uses; nothing new to add.
#   CRON_SECRET secret — must match the CRON_SECRET the app reads at runtime (set the SAME value in
#              the app's runtime secrets, e.g. Infisical). The route rejects the call without it.
#
# If the app URL or CRON_SECRET is missing, the run does not silently pass: it emits a visible
# warning and writes a note to the run summary, then exits without error (so leaving the cron OFF
# does not spam red failures). Admins can always run it on demand from the admin screen instead.

on:
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skills-hunt-auto-missions
  cancel-in-progress: false

jobs:
  run:
    name: Trigger auto-mission run
    runs-on: ubuntu-latest
    steps:
      - name: Call the auto-mission route
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::warning::SkillsHunt auto-mission run skipped: NEXT_PUBLIC_APP_URL is not set in GitHub Actions secrets."
            echo "Skipped: app URL not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::warning::SkillsHunt auto-mission run skipped: CRON_SECRET is not set in GitHub Actions secrets. The weekly run is OFF until it is added here AND matched in the app runtime. Admins can still use 'Run now' on the SkillsHunt admin missions tab."
            echo "Skipped: CRON_SECRET not set; automatic auto-mission run is OFF." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          code=$(curl -sS -o /tmp/auto-missions.json -w '%{http_code}' -X POST \
            "${APP_URL%/}/api/internal/skills-hunt/auto-missions/run" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "HTTP ${code}"
          cat /tmp/auto-missions.json
          echo
          if [ "${code}" != "200" ]; then
            echo "::error::Auto-mission request failed with HTTP ${code}. Check that CRON_SECRET matches the app runtime value and the route is deployed."
            exit 1
          fi
          echo "Auto-mission run ran: $(cat /tmp/auto-missions.json)" >> "$GITHUB_STEP_SUMMARY"
