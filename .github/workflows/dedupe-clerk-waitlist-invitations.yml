name: Clerk — Dedupe Waitlist Invitations

# ONE-SHOT: cleans up the messy Clerk "Invitations" list (duplicate/expired invites piled up
# from waitlist sign-ups) and sends a fresh invitation email to every address that does not
# already have a live invitation or an account. Delete this workflow and its script
# (ctf/scripts/dedupeClerkWaitlistInvitations.mjs) once it has been run for real and the
# backlog is confirmed cleaned up.
#
# Run it once with "execute: false" (the default) first to see the counts. Nothing in Clerk
# changes on that run. Run it again with "execute: true" to actually revoke the duplicate
# invitations and send the new ones — this sends real email to everyone on the list.
#
# Needs (from Infisical): CLERK_SECRET_KEY.

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Actually revoke duplicates and send invitations (leave false for a dry-run count first)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: dedupe-clerk-waitlist-invitations
  cancel-in-progress: false

jobs:
  dedupe:
    name: Dedupe and invite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Install dependencies
        run: |
          cd ctf
          pnpm install

      - name: Inject secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: ${{ secrets.INFISICAL_URL }}
          secret-path: /
          recursive: true

      - name: Dedupe invitations and invite outstanding addresses
        run: |
          set -euo pipefail
          if [ -z "${CLERK_SECRET_KEY:-}" ]; then
            echo "::error::CLERK_SECRET_KEY is not set in Infisical — cannot call Clerk."
            exit 1
          fi
          cd ctf
          if [ "${EXECUTE_INPUT}" = "true" ]; then
            node scripts/dedupeClerkWaitlistInvitations.mjs --execute | tee /tmp/dedupe-output.txt
          else
            node scripts/dedupeClerkWaitlistInvitations.mjs | tee /tmp/dedupe-output.txt
          fi
          {
            echo "### Clerk waitlist invitation dedupe"
            echo '```'
            cat /tmp/dedupe-output.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          EXECUTE_INPUT: ${{ inputs.execute }}
