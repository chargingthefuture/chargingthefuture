name: CI

on:
  pull_request:
    # No paths filter on purpose: CI must run on EVERY PR to main so its required
    # status checks always report. With a paths filter, a PR that only touches an
    # unlisted file (e.g. .claude/**, a docs-only file) never triggers CI, so the
    # required checks stay "expected" forever and the PR can never merge. Instead,
    # the heavy jobs (modularity-governance, quality-gates) skip fast for non-code
    # changes via the `changes` job below — and a skipped required job counts as a
    # pass — so config/docs-only PRs stay green and merge quickly.
    branches: [main]
  push:
    branches: [main]
    paths:
      - "ctf/**"
      - ".claude/rules/**"
      - ".github/workflows/**"
      - "docs/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect whether app/build code changed
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            code:
              - "ctf/**"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"

  rules-integrity:
    name: Rules Integrity
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate required rule files
        run: |
          set -euo pipefail
          required=(
            "CLAUDE.md"
            ".claude/rules/100-product-context-and-experience-rules.mdc"
            ".claude/rules/014-compliance-rules-index.mdc"
            ".claude/rules/101-monorepo-layout-rules.mdc"
            ".claude/rules/102-shared-boundary-rules.mdc"
            ".claude/rules/103-web-nextjs-structure-rules.mdc"
            ".claude/rules/104-mobile-react-native-android-rules.mdc"
            ".claude/rules/105-web-android-feature-parity-rules.mdc"
            ".claude/rules/106-expo-eas-mobile-workflow-rules.mdc"
            ".claude/rules/112-platform-architecture-rules.mdc"
            ".claude/rules/113-platform-coding-rules.mdc"
            ".claude/rules/115-neon-migration-delivery-rules.mdc"
            ".claude/rules/116-file-size-and-modularity-rules.mdc"
            ".claude/rules/117-agent-readability-and-cost-rules.mdc"
            ".claude/rules/118-platform-testing-and-release-rules.mdc"
            ".claude/rules/119-github-actions-ci-rules.mdc"
            ".claude/rules/122-schema-drift-predeployment-rules.mdc"
            ".claude/rules/107-integration-stack-rules.mdc"
            ".claude/rules/108-observability-provider-abstraction-rules.mdc"
            ".claude/rules/109-sentry-implementation-rules.mdc"
            ".claude/rules/110-stream-maker-tier-rules.mdc"
            ".claude/rules/200-plugin-command-contract-templates.mdc"
            ".claude/rules/201-plugin-command-schema-template.mdc"
            ".claude/rules/202-plugin-access-policy-schema-template.mdc"
            ".claude/rules/203-plugin-audit-schema-template.mdc"
          )

          for file in "${required[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required rules file: $file"
              exit 1
            fi
          done

  plugin-contract-templates:
    name: Plugin Contract Templates
    runs-on: ubuntu-latest
    needs: rules-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate template required keys
        run: |
          set -euo pipefail

          grep -q "pluginId" .claude/rules/201-plugin-command-schema-template.mdc
          grep -q "inputSchema" .claude/rules/201-plugin-command-schema-template.mdc
          grep -q "requiredRoles" .claude/rules/202-plugin-access-policy-schema-template.mdc
          grep -q "consentRequirements" .claude/rules/202-plugin-access-policy-schema-template.mdc
          grep -q "eventId" .claude/rules/203-plugin-audit-schema-template.mdc
          grep -q "policyDecision" .claude/rules/203-plugin-audit-schema-template.mdc

  rules-link-coverage:
    name: Rules Link Coverage
    runs-on: ubuntu-latest
    needs: rules-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ensure all rule files are linked from index files
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path
          import re
          import sys

          root = Path('.claude/rules')
          index = Path('CLAUDE.md')
          compliance = root / '014-compliance-rules-index.mdc'

          if not index.exists() or not compliance.exists():
              print('Missing required index files for rule coverage check.')
              sys.exit(1)

          all_rules = sorted(p.name for p in root.glob('*.mdc'))

          link_re = re.compile(r'\[[^\]]+\]\(([^)]+\.mdc)\)')

          def links(path: Path):
              text = path.read_text(encoding='utf-8')
              return [Path(match).name for match in link_re.findall(text)]

          linked = set(links(index) + links(compliance))
          allowed_unlinked = {
              '098-agent-communication-rules.mdc',
              '123-environment-and-clerk-auth-rules.mdc',
          }

          missing = [name for name in all_rules if name not in linked and name not in allowed_unlinked]
          if missing:
              print('Unlinked rule files detected:')
              for name in missing:
                  print(f'- {name}')
              sys.exit(1)

          print('Rule link coverage check passed.')
          PY

  formatting-eof:
    name: Formatting EOF
    runs-on: ubuntu-latest
    needs: rules-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate single trailing newline
        run: |
          set -euo pipefail
          bash ctf/scripts/check-eof-format.sh

  modularity-governance:
    name: Modularity and Complexity Governance
    runs-on: ubuntu-latest
    needs: [rules-integrity, changes]
    # Only run the heavy install+scan when app/build code changed. For config/docs-only
    # PRs this job is skipped, and a skipped required job counts as a pass downstream.
    if: needs.changes.outputs.code == 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the gate can diff changed files against the PR's base branch
          # (check-modularity-governance.sh needs the merge base to find what this PR changed).
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: ctf/pnpm-lock.yaml

      - name: Install ctf dependencies
        run: pnpm install --frozen-lockfile --dir ctf

      - name: Enforce modularity and complexity governance
        run: |
          set -euo pipefail
          bash ctf/scripts/check-modularity-governance.sh

  prompt-leak-guard:
    name: Prompt Leak Guard
    runs-on: ubuntu-latest
    needs: rules-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block AI prompt content in changed files
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            bash scripts/check-no-ai-prompts.sh --ref-range "$base_sha...$head_sha"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            bash scripts/check-no-ai-prompts.sh --ref-range "${{ github.event.before }}...${{ github.sha }}"
          else
            bash scripts/check-no-ai-prompts.sh --all
          fi

  stream-quota-policy:
    name: Stream Quota Policy
    runs-on: ubuntu-latest
    needs: rules-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Stream Maker tier policy coverage
        run: |
          set -euo pipefail

          file=".claude/rules/110-stream-maker-tier-rules.mdc"

          test -f "$file"
          grep -q "Chat: 2,000 MAU per month" "$file"
          grep -q "Activity Feeds: 125,000 API calls per month" "$file"
          grep -q "Video: 333,000 participant minutes per month" "$file"
          grep -q "AI Moderation: \$100 monthly credits" "$file"
          grep -q "Green: 0–70% budget used" "$file"
          grep -q "Yellow: 70–85% budget used" "$file"
          grep -q "Orange: 85–95% budget used" "$file"
          grep -q "Red: 95–100% budget used" "$file"
          grep -q "fallback UX behavior" "$file"
          grep -q "feature flag/kill switch" "$file"

  stream-quota-impact-note:
    name: Stream Quota Impact Note
    runs-on: ubuntu-latest
    needs: rules-integrity
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Require quota-impact note for Stream-related changes
        run: |
          set -euo pipefail

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"

          # Files whose entire diff is a British-to-US spelling rewrite are excluded: rewriting a
          # word in a comment inside a Stream file consumes no Stream quota, and demanding a quota
          # note for it would only produce a note that says "nothing changed". See
          # ctf/scripts/changed-files.mjs — it drops dialect-only files and nothing else.
          changed_files=$(node ctf/scripts/changed-files.mjs --base "$base_sha")

          # Documentation is excluded from the trigger for the same reason: a markdown file consumes
          # no Stream quota, whatever its name says. The trigger matches file paths, so a document
          # whose title merely contains the word — ctf/docs/developer/BEACON_PHONE_STREAMING_GUIDE.md
          # is the one that exposed this — was read as a Stream code change and demanded a quota note
          # describing a change in consumption that had not happened. Quota notes themselves live
          # under ctf/docs/quota-impact/ and are the answer to this gate, never the thing that fires
          # it. Code under ctf/ is unaffected: every real Stream change still has to carry its note.
          stream_changes=$(echo "$changed_files" | grep -Ev '^ctf/docs/' | grep -Ei '^ctf/.*(stream|getstream)' || true)

          if [ -n "$stream_changes" ]; then
            echo "Detected Stream-related code changes in this PR:"
            echo "$stream_changes"

            quota_notes=$(echo "$changed_files" | grep -E '^ctf/docs/quota-impact/.+\.md$' | grep -Ev '^ctf/docs/quota-impact/TEMPLATE\.md$' || true)

            if [ -z "$quota_notes" ]; then
              echo "Missing required quota impact note."
              echo "Add or update a file under ctf/docs/quota-impact/, e.g.:"
              echo "ctf/docs/quota-impact/2026-02-19-stream-feature-name.md"
              exit 1
            fi

            required_headings=(
              "## Summary"
              "## Stream Surfaces Affected"
              "## Estimated Monthly Impact"
              "## Budget Threshold Risk"
              "## Fallback and Degradation Plan"
              "## Observability"
              "## Validation"
            )

            while IFS= read -r note_file; do
              [ -z "$note_file" ] && continue
              echo "Validating quota note headings in $note_file"
              for heading in "${required_headings[@]}"; do
                if ! grep -Fq "$heading" "$note_file"; then
                  echo "Missing required heading '$heading' in $note_file"
                  exit 1
                fi
              done
            done <<< "$quota_notes"
          else
            echo "No Stream-related code changes detected; quota impact note not required."
          fi

  schema-drift-gate:
    name: Schema Drift Gate
    runs-on: ubuntu-latest
    needs: rules-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Enforce schema drift policy
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
            head_sha="${{ github.event.pull_request.head.sha }}"
            bash ctf/scripts/check-schema-drift.sh --ref-range "$base_sha...$head_sha"
          elif [ "${{ github.event_name }}" = "push" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            bash ctf/scripts/check-schema-drift.sh --ref-range "${{ github.event.before }}...${{ github.sha }}"
          else
            bash ctf/scripts/check-schema-drift.sh
          fi

      - name: Validate account deletion registry against schema
        run: node ctf/scripts/check-deletion-registry.mjs

      - name: Validate account deletion engine SQL generation
        run: node ctf/scripts/check-deletion-engine.mjs

      - name: Validate account data-export engine SQL generation
        run: node ctf/scripts/check-export-engine.mjs

  inventory-drift-gate:
    name: Inventory Drift Gate
    runs-on: ubuntu-latest
    needs: rules-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enforce feature-inventory coverage of tables and routes
        run: node ctf/scripts/check-inventory-drift.mjs

  notice-formatting-gate:
    name: Notice Formatting Gate
    runs-on: ubuntu-latest
    needs: rules-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Standing-notice bodies must not carry source wrapping as content. Authoring one as an array of
      # source-wrapped lines joined with "\n" put hard breaks mid-sentence in front of members, and every
      # existing gate passed it — nothing knew the difference between a newline that is formatting and a
      # newline that is content.
      - name: Fail on notice text that would render with unintended line breaks
        run: node ctf/scripts/check-notice-formatting.mjs

  unlock-tier-gate:
    name: Unlock Tier Exception Gate
    runs-on: ubuntu-latest
    needs: rules-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Unlock approval is what grants access to this app, and `minUnlockTier: 'any_authenticated'`
      # bypasses it. An agent building a new surface copies whatever nearby code does, so every
      # unreviewed bypass makes the next one likelier and the whole gate weaker. The exceptions are
      # a closed, owner-approved list; this fails the build on any that is not on it.
      - name: Fail on unapproved Unlock tier bypasses
        run: node ctf/scripts/check-unlock-tier-exceptions.mjs

  us-spelling-gate:
    name: US Spelling Gate
    runs-on: ubuntu-latest
    needs: rules-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A recurring Commons notice reached production using the British form of "realize". Every
      # other gate passed it: a British spelling is a correctly-spelled word, so typecheck, lint,
      # and the copy gates have nothing to say about it. The product writes US English, so this
      # checks the dialect directly — across comments and identifiers too, since those set the
      # example the next writer copies.
      - name: Fail on British spellings
        run: node ctf/scripts/check-us-spelling.mjs

  orphan-route-gate:
    name: Orphan Route Gate
    runs-on: ubuntu-latest
    needs: rules-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The inventory gate above asks whether every route is DOCUMENTED. This one asks whether every
      # route is CALLED. Documented-but-dead is the worse failure: the inventory then asserts a
      # capability the product does not have. That is exactly how a member flagging an answer reached
      # nobody — the admin route existed, was documented, and no page ever called it.
      - name: Fail on API routes that nothing calls
        run: node ctf/scripts/check-orphan-routes.mjs

  error-verbosity-gate:
    name: Error Verbosity Gate
    runs-on: ubuntu-latest
    needs: rules-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rule 137: when a route fails, its answer must say what failed and why. Fails the build on an
      # answering catch with no binding, a 5xx that never reports the error, and an operator-surface
      # message with no reason. A fixed sentence with no reason costs a round of guessing every time it
      # reaches someone, which is why this is a gate and not a review note.
      - name: Fail on opaque error paths
        run: node ctf/scripts/check-error-verbosity.mjs

  taxonomy-change-gate:
    name: Taxonomy Change Gate
    runs-on: ubuntu-latest
    needs: rules-integrity
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Statically validate the append-only skills-taxonomy change list (the only repo path
      # that writes the taxonomy). Catches non-sequential ids, unknown change types, missing targets,
      # duplicates, and deactivations without an acknowledged-impact note before merge.
      - name: Validate taxonomy change list
        run: node ctf/scripts/check-taxonomy-change.mjs

  test-script-drift-gate:
    name: Test Script Drift Gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch the base branch
        run: git fetch --no-tags origin "${{ github.event.pull_request.base.ref }}"

      - name: Flag any inventory that changed without its manual test script
        env:
          TEST_SCRIPT_DRIFT_BASE: origin/${{ github.event.pull_request.base.ref }}
        run: node ctf/scripts/check-test-script-drift.mjs

  pr-parity-status:
    name: PR Parity Status
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Parity status note (informational)
        uses: actions/github-script@v7
        with:
          script: |
            // The native Android app is narrowed to Chyme (owner decision, 2026-07-20 — rule 105):
            // it carries only Clerk auth, Chyme (+ what it links to), bug reporting, and settings.
            // Web↔Android parity therefore applies ONLY to Chyme surfaces, which the Quality Gates job
            // enforces directly with check-web-android-parity.mjs. A per-PR "Parity Status:" line in the
            // description is no longer required for the (near-universal) web-only change, so this gate no
            // longer fails on its absence — it only surfaces a note. The check name is kept so branch
            // protection stays satisfied and the job always passes.
            const body = context.payload.pull_request.body || '';
            const mentionsParity = /Parity (Status|Ticket):/i.test(body);
            if (!mentionsParity) {
              core.notice(
                'No "Parity Status:" line in the description — fine under the Chyme-only Android scope (rule 105). '
                + 'Only changes to a Chyme keep-list surface need an Android side; everything else is web-only.'
              );
            }

  quality-gates:
    name: Quality Gates
    runs-on: ubuntu-latest
    needs:
      - changes
      - plugin-contract-templates
      - rules-link-coverage
      - formatting-eof
      - modularity-governance
      - prompt-leak-guard
      - stream-quota-policy
      - stream-quota-impact-note
      - schema-drift-gate
      - error-verbosity-gate
      - pr-parity-status
    # Run the expensive build/lint/typecheck gate only when app/build code changed.
    # For config/docs-only PRs this job is skipped (which counts as a pass downstream),
    # so those PRs stay green and merge quickly without waiting on a full install+build.
    if: |
      always() &&
      needs.changes.outputs.code == 'true' &&
      needs.plugin-contract-templates.result == 'success' &&
      needs.rules-link-coverage.result == 'success' &&
      needs.formatting-eof.result == 'success' &&
      (needs.modularity-governance.result == 'success' || needs.modularity-governance.result == 'skipped') &&
      needs.prompt-leak-guard.result == 'success' &&
      needs.stream-quota-policy.result == 'success' &&
      (needs.stream-quota-impact-note.result == 'success' || needs.stream-quota-impact-note.result == 'skipped') &&
      needs.schema-drift-gate.result == 'success' &&
      needs.error-verbosity-gate.result == 'success' &&
      (needs.pr-parity-status.result == 'success' || needs.pr-parity-status.result == 'skipped')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: ctf/pnpm-lock.yaml

      - name: Check lockfile/package.json sync
        run: bash ctf/scripts/check-lockfile-sync.sh

      # Strict plugin isolation (owner decision 2026-08-03): one plugin's code must not import
      # another plugin's code. Cross-plugin capability use goes through the narrow
      # lib/shared/*-interface.ts modules only.
      - name: Run plugin boundary gate
        run: node ctf/scripts/check-plugin-boundaries.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --dir ctf

      - name: Run lint gate
        run: pnpm --dir ctf run lint

      - name: Run web accessibility gate
        run: pnpm --dir ctf run lint:a11y

      - name: Run typecheck gate
        run: pnpm --dir ctf run typecheck

      - name: Run web production build gate
        run: pnpm --dir ctf --filter @ctf/web run build:ci

      - name: Run Android export build gate
        run: pnpm --dir ctf --filter @ctf/mobile run build:android:ci

      - name: Run web-android parity gate
        run: node ctf/scripts/check-web-android-parity.mjs

      - name: Run performance budget audit (warning mode)
        run: pnpm --dir ctf run perf:budgets:ci

      - name: Upload performance budget artifact
        uses: actions/upload-artifact@v4
        with:
          name: perf-budget-${{ github.run_id }}
          path: ctf/artifacts/performance/perf-budget-report.json
          if-no-files-found: warn
          retention-days: 14
