name: Peer Programming — Weekly Cohort Assignment

# Forms Peer Programming cohorts once a week without an admin clicking "Run weekly assignment". The
# app forms cohorts from members who logged in during the last 7 days; if no admin runs it, no cohort
# forms that week. This asks production to run the assignment early every Monday (UTC), the same day
# the app's week key rolls over. The run is idempotent — cohorts are upserted per (week, label) and
# notifications are idempotent per (user, week) — so a re-run can never double-form or double-notify.
# The manual admin run on the Peer Programming admin screen still works as a fallback/override.
#
# What it needs (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_APP_URL secret — your production base URL (e.g. https://app.example.com). This is the
#              same secret the image build already uses; nothing new to add.
#   CRON_SECRET secret — must match the CRON_SECRET the app reads at runtime (set the SAME value in the
#              app's runtime secrets). The route rejects the call without it.
#
# If the app URL or CRON_SECRET is missing, the run does not silently pass: it emits a visible warning
# and writes a note to the run summary, then exits without error (so leaving the cron OFF does not spam
# red failures). Admins can always form cohorts on demand from the Peer Programming admin screen.

on:
  schedule:
    - cron: '7 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: peer-programming-weekly-assignment
  cancel-in-progress: false

jobs:
  assign:
    name: Trigger weekly assignment
    runs-on: ubuntu-latest
    steps:
      - name: Call the weekly assignment route
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::warning::Peer Programming weekly assignment skipped: NEXT_PUBLIC_APP_URL is not set in GitHub Actions secrets."
            echo "Skipped: app URL not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::warning::Peer Programming weekly assignment skipped: CRON_SECRET is not set in GitHub Actions secrets. The weekly run is OFF until it is added here AND matched in the app runtime. Admins can still form cohorts from the Peer Programming admin screen."
            echo "Skipped: CRON_SECRET not set; automatic weekly assignment is OFF." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          code=$(curl -sS -o /tmp/assignment.json -w '%{http_code}' -X POST \
            "${APP_URL%/}/api/internal/peer-programming/assignments/run" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "HTTP ${code}"
          cat /tmp/assignment.json
          echo
          if [ "${code}" != "200" ]; then
            echo "::error::Weekly assignment request failed with HTTP ${code}. Check that CRON_SECRET matches the app runtime value and the route is deployed."
            exit 1
          fi
          echo "Weekly assignment ran: $(cat /tmp/assignment.json)" >> "$GITHUB_STEP_SUMMARY"
