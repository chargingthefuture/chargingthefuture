name: Dependency Audit

# Watches the LOCKED production dependency tree for newly published security advisories (owner
# decision, 2026-08-03). The PR-diff dependency review only inspects newly added dependencies, so an
# advisory published against a package already in the lockfile used to arrive silently. This runs
# `ctf/scripts/check-dependency-audit.mjs` — pnpm audit compared against a burn-down allowlist that
# may only shrink — daily, on any dependency change, and on demand. A red run means either a NEW
# advisory (update the package) or a listed advisory that cleared (remove it from the list).

on:
  schedule:
    - cron: '17 6 * * *'
  pull_request:
    paths:
      - 'ctf/pnpm-lock.yaml'
      - 'ctf/package.json'
      - 'ctf/packages/*/package.json'
      - 'ctf/scripts/check-dependency-audit.mjs'
      - 'ctf/scripts/dependency-audit-allowlist.json'
      - '.github/workflows/dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit locked production dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        run: npm install -g pnpm

      - name: Run the dependency audit gate
        run: node ctf/scripts/check-dependency-audit.mjs
