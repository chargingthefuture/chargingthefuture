name: Expo — Preview APK

# Builds an installable Android APK in Expo's cloud (EAS) for a pull request that
# touches the mobile app, then posts a comment with the install link so a
# reviewer can download and run it on a phone — no desktop or Android Studio
# needed.
#
# Quota gate: EAS Android builds on the free plan are a small, fixed monthly
# allotment, so this does NOT build on every mobile PR. It is opt-in: the build
# runs only when the PR carries the `build-apk` label (add it when you actually
# intend to install the app on a phone), or when you start it by hand from the
# Actions tab ("Run workflow"). While the label is on, pushing new commits
# rebuilds so you get a fresh APK; remove the label to stop spending builds.
#
# There is ONE environment: production. A preview build is just an install
# channel — it points at the SAME production backend and the SAME Clerk sign-in
# key as a release build. Demo/sample data is a runtime Unleash flag, not a
# separate deploy environment.

on:
  pull_request:
    types: [labeled, synchronize, reopened]
    paths:
      - "ctf/packages/mobile/**"
      - ".github/workflows/expo-preview.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if this month's Android build cap (15) is reached."
        required: false
        type: boolean
        default: false

concurrency:
  group: expo-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    name: Build preview APK
    # Opt-in only: a manual run, or a PR that carries the `build-apk` label. This
    # keeps the scarce free-plan Android builds tied to a deliberate request
    # instead of firing on every mobile-touching PR.
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'build-apk') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      MOBILE_ENV_TARGET: preview
      EAS_BUILD_PROFILE: preview
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # Manual "Run workflow" with force=true overrides the monthly-cap guard.
      EXPO_QUOTA_FORCE: ${{ (github.event_name == 'workflow_dispatch' && inputs.force) && '1' || '0' }}
      # The app secrets (Clerk keys, app URL, Expo project id/updates URL) are no
      # longer GitHub Actions secrets — Infisical is the single source of truth.
      # The "Inject secrets from Infisical" step below loads them into the job env
      # for all later steps, so app.config.ts and check:mobile-env read them from
      # process.env exactly as before.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Infisical is the single source of truth for app secrets. This step injects
      # the Clerk keys, the app URL, and the Expo project id/updates URL into the
      # job env for every later step. env-slug is the environment *slug* (not its
      # display name): the Production environment's slug is "prod", so
      # env-slug: production returns a 404. recursive:true also reads secrets
      # nested in sub-folders, not just the root path.
      - name: Inject secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: ${{ secrets.INFISICAL_URL }}
          secret-path: /
          recursive: true

      - name: Fail fast when EXPO_TOKEN is missing
        if: ${{ env.EXPO_TOKEN == '' }}
        run: |
          echo "EXPO_TOKEN secret is not set. Add it in repository settings before preview builds can run."
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: ctf/pnpm-lock.yaml

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install ctf dependencies
        run: pnpm install --frozen-lockfile --dir ctf

      # Guard against blowing past the free-tier monthly Android build cap (15),
      # reading the budget from ctf/packages/mobile/expo-free-tier-quota.json. On
      # this on-demand path it only blocks at the real ceiling, not the lower
      # automated budget — a deliberate preview request should build unless the
      # month is genuinely exhausted. force=true (Run workflow) overrides it.
      - name: Check Expo build quota
        id: quota
        run: node ctf/scripts/check-expo-build-quota.mjs hard

      - name: Quota reached — skip and tell the PR
        if: ${{ steps.quota.outputs.build_allowed != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const reason = process.env.REASON || 'Monthly Android build cap reached.';
            const marker = '<!-- expo-preview-build -->';
            const body = `${marker}\n**Android preview build skipped — free-tier quota reached.**\n\n${reason}\n\nRe-run from the Actions tab with **force** enabled if you must spend one of the remaining monthly builds.`;
            if (!context.issue.number) { core.info(reason); return; }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          REASON: ${{ steps.quota.outputs.reason }}

      - name: Check mobile env contract
        if: ${{ steps.quota.outputs.build_allowed == 'true' }}
        run: pnpm --dir ctf --filter @ctf/mobile run check:mobile-env

      - name: Build preview APK on EAS
        id: build
        if: ${{ steps.quota.outputs.build_allowed == 'true' }}
        working-directory: ctf/packages/mobile
        run: |
          set -euo pipefail
          # --no-wait returns immediately with the build record (id + expo.dev page).
          # Expo enforces the free-plan cap per ACCOUNT, so the guard above can undercount and let
          # a build through that Expo then rejects (see issue #2030). That rejection is an expected
          # monthly condition — surface it as a skip, not a red check on the PR.
          if ! eas build --platform android --profile preview --non-interactive --no-wait --json > build.json 2> eas-stderr.txt; then
            cat eas-stderr.txt >&2 || true
            if grep -qi "used its Android builds" eas-stderr.txt build.json 2>/dev/null; then
              echo "quota_exhausted=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit 1
          fi
          # Read the build page URL straight from the EAS response so we do not
          # need an EXPO_OWNER secret. Different EAS versions expose it under
          # slightly different keys, so check the known ones in order.
          BUILD_URL=$(node -e "
            const b = JSON.parse(require('fs').readFileSync('build.json','utf8'))[0] || {};
            const owner = (b.project && b.project.ownerAccount && b.project.ownerAccount.name) || (b.initiatingActor && b.initiatingActor.username);
            const url = b.buildPageUrl || (owner ? 'https://expo.dev/accounts/' + owner + '/projects/charging-the-future/builds/' + b.id : 'https://expo.dev/builds/' + b.id);
            process.stdout.write(url);
          ")
          echo "build_url=${BUILD_URL}" >> "$GITHUB_OUTPUT"

      - name: Quota rejected at build time — tell the pull request
        if: ${{ steps.quota.outputs.build_allowed == 'true' && steps.build.outputs.quota_exhausted == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- expo-preview-build -->';
            const body = `${marker}\n**Android preview build skipped — free-tier quota reached.**\n\nExpo rejected the build: the account's free-plan Android builds for this month are used up (the pre-check undercounted — Expo's cap is account-wide). Builds resume after the monthly reset.`;
            if (!context.issue.number) { core.info(body); return; }
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }

      - name: Comment install link on the pull request
        if: ${{ steps.quota.outputs.build_allowed == 'true' && steps.build.outputs.quota_exhausted != 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.BUILD_URL;
            const marker = '<!-- expo-preview-build -->';
            const body = `${marker}\n**Android preview build started.**\n\nProfile: \`preview\` · Channel: \`preview\` · Backend: production\n\nOpen this page on your phone once the build finishes, then tap **Install** to put it on your Android device:\n\n${url}\n\nThe first build can take several minutes and may set up an Android signing key automatically.`;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            const comments = await github.rest.issues.listComments({ owner, repo, issue_number });
            const existing = comments.data.find(c => c.body && c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
        env:
          BUILD_URL: ${{ steps.build.outputs.build_url }}
