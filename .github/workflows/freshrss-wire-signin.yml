name: FreshRSS — Wire sign-in with the app

# Turns on "sign in with the Skills Economy account" for the reader.
#
# It sets both sides in one run, so neither can be left half configured: the
# OAuth application at the auth provider that knows FreshRSS's callback
# address, and the OIDC_* variables on the Render service that tell FreshRSS
# which provider to ask. Then it deploys, because a variable change is not read
# until the service restarts.
#
# Re-running is safe. The provider shows a client secret once, so a second run
# does not create a second application — it finds the existing one and rotates
# the secret, then writes the new pair. People already signed in stay signed in.
#
# One secret this repository does not already hold: CLERK_SECRET_KEY, the auth
# provider's backend key. Everything else is here — the issuer address is
# decoded from the publishable key rather than typed.

on:
  workflow_dispatch:
    inputs:
      host:
        description: 'The reader hostname, with no scheme — e.g. rss.chargingthefuture.com'
        required: true
        default: 'rss.chargingthefuture.com'
        type: string

jobs:
  wire:
    name: Wire sign-in
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wire the provider and the service together
        env:
          CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
          PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_AUTH_PUBLISHABLE_KEY }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          READER_HOST: ${{ inputs.host }}
          SERVICE_NAME: ctf-freshrss
        run: bash .github/scripts/freshrss-wire-signin.sh
