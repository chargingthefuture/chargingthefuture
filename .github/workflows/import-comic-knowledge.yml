name: Comic Knowledge — One-Time Seed Import (production)

# ONE-TIME workflow (issue #504, retrieval step). Loads the seed knowledge base
# (ctf/scripts/data/comic-knowledge-seed.jsonl — redacted, all-public-source excerpts of the
# owner's Quora writing and the repo wiki) into the comic_knowledge_entries table in production,
# so @comic drafts start grounding in the community's own answers.
#
# The owner starts it by hand from the Actions tab (Run workflow). The import is idempotent
# (content-hash keyed), so an accidental re-run inserts nothing twice.
#
# DELETE AFTER USE: once a run finishes green and the review dashboard shows grounded drafts,
# delete BOTH this file and ctf/scripts/data/comic-knowledge-seed.jsonl (tracked on #504). Future
# imports (e.g. the second account's Quora export) should ship the same way: temporary data file +
# this workflow pattern, removed after the run.
on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: import-comic-knowledge
  cancel-in-progress: false

jobs:
  import:
    name: Import seed knowledge into production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # DATABASE_URL is a runtime secret; Infisical is the single source of truth (this matches
      # seed-skills-taxonomy.yml and skills-proposal-issues.yml).
      - name: Inject secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: ${{ secrets.INFISICAL_URL }}
          secret-path: /
          recursive: true

      # The import needs only the Postgres client. Install it standalone so the run does not pay
      # for a full monorepo install.
      - name: Install Postgres client
        run: npm install --no-save pg@8

      - name: Import seed knowledge
        # DATABASE_URL is injected by the Infisical step above. The script prints
        # inserted / already-present / invalid counts.
        run: |
          set -euo pipefail
          node ctf/scripts/importComicKnowledge.mjs ctf/scripts/data/comic-knowledge-seed.jsonl | tee /tmp/import-result.txt
          echo "$(cat /tmp/import-result.txt)" >> "$GITHUB_STEP_SUMMARY"
          echo "Reminder: delete .github/workflows/import-comic-knowledge.yml and ctf/scripts/data/comic-knowledge-seed.jsonl now that the import is done (#504)." >> "$GITHUB_STEP_SUMMARY"
