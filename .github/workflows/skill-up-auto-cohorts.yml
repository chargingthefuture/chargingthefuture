name: SkillUp — Auto Cohorts from Workforce Gaps

# Keeps the SkillUp cohort-proposal queue and auto-cohort lifecycle current from the Workforce talent
# gaps (issue #904, proposal-queue model, owner decision 2026-07-23). Workforce shows where the
# population is short of workers; each day this asks production to (1) close any auto cohort past its
# term and (2) — at most every generation_interval_days (default 90) — re-read the largest gaps into a
# ranked, sector-diverse proposal queue. It does NOT create cohorts: an admin approves a proposal on the
# SkillUp admin screen (choosing the term) to open one. The daily schedule keeps expiry-close frequent
# while the cadence guard keeps proposal regeneration to ~every 90 days. The run is idempotent (cadence
# guard + one pending proposal per occupation). The admin "Refresh proposals" button forces a re-read.
#
# What it needs (Settings → Secrets and variables → Actions):
#   NEXT_PUBLIC_APP_URL secret — your production base URL (e.g. https://app.example.com). This is the
#              same secret the image build already uses; nothing new to add.
#   CRON_SECRET secret — must match the CRON_SECRET the app reads at runtime (set the SAME value in the
#              app's runtime secrets, e.g. Infisical). The route rejects the call without it.
#
# If the app URL or CRON_SECRET is missing, the run does not silently pass: it emits a visible warning
# and writes a note to the run summary, then exits without error (so leaving the cron OFF does not spam
# red failures). Admins can always run it on demand from the SkillUp admin screen instead.

on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: skill-up-auto-cohorts
  cancel-in-progress: false

jobs:
  run:
    name: Trigger auto-cohort run
    runs-on: ubuntu-latest
    steps:
      - name: Call the auto-cohort route
        env:
          APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ]; then
            echo "::warning::SkillUp auto-cohort run skipped: NEXT_PUBLIC_APP_URL is not set in GitHub Actions secrets."
            echo "Skipped: app URL not configured." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          if [ -z "${CRON_SECRET:-}" ]; then
            echo "::warning::SkillUp auto-cohort run skipped: CRON_SECRET is not set in GitHub Actions secrets. The daily run is OFF until it is added here AND matched in the app runtime. Admins can still use 'Run now' on the SkillUp admin screen."
            echo "Skipped: CRON_SECRET not set; automatic auto-cohort run is OFF." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          code=$(curl -sS -o /tmp/auto-cohorts.json -w '%{http_code}' -X POST \
            "${APP_URL%/}/api/internal/skill-up/auto-cohorts/run" \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            -H 'Content-Type: application/json' \
            -d '{}')
          echo "HTTP ${code}"
          cat /tmp/auto-cohorts.json
          echo
          if [ "${code}" != "200" ]; then
            echo "::error::Auto-cohort request failed with HTTP ${code}. Check that CRON_SECRET matches the app runtime value and the route is deployed."
            exit 1
          fi
          echo "Auto-cohort run ran: $(cat /tmp/auto-cohorts.json)" >> "$GITHUB_STEP_SUMMARY"
