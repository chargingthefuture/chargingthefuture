name: Generate — Product Update

on:
  schedule:
    - cron: "33 0 * * 4"   # weekly: 00:33 UTC every Thursday, offset off the top of the hour to avoid a stampede. Thursday keeps it clear of the Monday Community Stats draft (generate-community-stats.yml) so the owner gets at most one Quora draft to review per day.
  workflow_dispatch:
    inputs:
      force:
        description: "Force update even with no feat/fix/perf commits (testing)"
        type: boolean
        default: false

jobs:
  # ── Job 1: decide whether this window warrants a product update ─────────────
  check-changes:
    name: Check for meaningful commits
    runs-on: ubuntu-latest
    outputs:
      has_changes: ${{ steps.check.outputs.has_changes }}
      commits: ${{ steps.check.outputs.commits }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find feat/fix/perf commits since last update tag
        id: check
        run: |
          LAST_TAG=$(git tag -l "update/*" --sort=-version:refname | head -1)
          if [ -z "$LAST_TAG" ]; then
            RANGE="$(git rev-list --max-parents=0 HEAD)..HEAD"
          else
            RANGE="${LAST_TAG}..HEAD"
          fi

          # The has_changes gate keys on subjects only (a body can contain the word
          # "fix:" mid-sentence, which must not inflate the count).
          SUBJECTS=$(git log "$RANGE" --pretty=format:"%h %s" | head -30)
          COUNT=$(echo "$SUBJECTS" | grep -cE " (feat|fix|perf):" || true)

          # The model is fed the subject AND the full message body of each commit —
          # the body is the real, factual description of what changed (it carries the
          # merged PR's "what changed" context), which grounds the generator so it
          # stops inventing capabilities from a five-word subject (see issue #1471).
          # Trailer lines (session URL, co-author, the Claude attribution, and the
          # Parity Status gate line) are stripped as noise, and the whole block is
          # capped so it can never overflow the $GITHUB_OUTPUT size limit.
          COMMITS=$(git log "$RANGE" --max-count=30 --pretty=format:"=== %h %s%n%b%n" \
            | grep -vaiE '^(co-authored-by:|claude-session:|https://claude\.ai/code/|🤖 generated with|generated with \[claude|parity status:|parity ticket:)' \
            | head -c 18000)

          echo "commits<<EOF" >> "$GITHUB_OUTPUT"
          echo "$COMMITS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

          if [ "$COUNT" -gt 0 ]; then
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Found $COUNT meaningful commit(s) — will generate update."
          else
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No feat/fix/perf commits found — skipping update."
          fi

  # ── Job 2: generate content and publish to all destinations ─────────────────
  generate-and-publish:
    name: Generate and publish product update
    needs: check-changes
    if: >-
      needs.check-changes.outputs.has_changes == 'true' ||
      inputs.force == true
    runs-on: ubuntu-latest
    # Stamp all dates (wiki page slug, Quora draft issue, update tag) in US
    # Eastern rather than the runner's UTC, so they match the project's local
    # day. Applies to shell `date` and Node `new Date()`/toLocaleString in the
    # steps below.
    env:
      TZ: America/New_York
    permissions:
      contents: write   # push update/* tag
      issues: write     # create Quora draft issue

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── Secrets (Infisical → env) ─────────────────────────────────────────────
      # Infisical is the single source of truth for runtime secrets. This step
      # injects APP_URL and INTERNAL_SERVICE_SECRET into the job env for the
      # "Post to in-app feed" step. env-slug is the environment *slug* (not its
      # display name): the Production environment's slug is "prod", so
      # env-slug: production returns a 404. recursive:true also reads secrets
      # nested in sub-folders, not just the root path. If Infisical is
      # unreachable this step fails the job, by design.
      # GitHub-native secrets (cannot live in Infisical): GH_PAT, GITHUB_TOKEN,
      # and the INFISICAL_* bootstrap credentials below.
      - name: Inject secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: ${{ secrets.INFISICAL_URL }}
          secret-path: /
          recursive: true

      # ── Generate ─────────────────────────────────────────────────────────────
      - name: Generate update content via Claude
        id: content
        env:
          # ANTHROPIC_API_KEY is injected by the Infisical step (single source).
          COMMITS: ${{ needs.check-changes.outputs.commits }}
        run: |
          OUTPUT=$(node ctf/scripts/generate-update.mjs)
          echo "json<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      # ── Feed (in-app) ─────────────────────────────────────────────────────────
      # DISABLED: the in-app feed/announcements feature is still in final
      # validation and not ready to receive product updates. Re-enable this step
      # once the announcements backend is live. (APP_URL and INTERNAL_SERVICE_SECRET
      # are injected by the Infisical step above when this runs again.)
      # - name: Post to in-app feed
      #   env:
      #     UPDATE_JSON: ${{ steps.content.outputs.json }}
      #   run: node ctf/scripts/publish-product-update.mjs

      # ── GitHub wiki page ──────────────────────────────────────────────────────
      - name: Create GitHub wiki page
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          UPDATE_JSON: ${{ steps.content.outputs.json }}
        run: |
          WIKI_PAGE_NAME=$(echo "$UPDATE_JSON" | jq -r '.wikiPageName')
          echo "$UPDATE_JSON" | jq -r '.wikiContent' > /tmp/wiki-page.md

          git clone \
            "https://x-access-token:${GH_PAT}@github.com/chargingthefuture/chargingthefuture.wiki.git" \
            /tmp/ctf-wiki

          cd /tmp/ctf-wiki
          git config user.email "ci@chargingthefuture.org"
          git config user.name "CTF CI Bot"
          cp /tmp/wiki-page.md "${WIKI_PAGE_NAME}.md"
          git add "${WIKI_PAGE_NAME}.md"
          git commit -m "Add product update: ${WIKI_PAGE_NAME}"
          git push

      # ── Blog registry (wiki-site) ─────────────────────────────────────────────
      # Adds the update to the wiki-site blog (category "Updates") on wiki-site's
      # main branch, then triggers deploy-blog-gh-pages.yml to rebuild the live
      # site. wiki-site is a separate repo with its own layout: the pnpm
      # workspace lives in the nested wiki-site/ directory, with scripts
      # wiki:validate / wiki:sync and articles at artifacts/wiki/src/lib.
      - name: Publish to wiki-site blog registry
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          UPDATE_JSON: ${{ steps.content.outputs.json }}
        run: |
          set -euo pipefail

          SLUG=$(echo "$UPDATE_JSON"     | jq -r '.wikiPageName')
          TITLE=$(echo "$UPDATE_JSON"    | jq -r '.feedTitle')
          EXCERPT=$(echo "$UPDATE_JSON"  | jq -r '.wikiSiteExcerpt // .feedTitle')
          CATEGORY="Updates"
          DATE=$(date +%Y-%m-%d)

          # Recurse submodules: wiki:sync infers extra "folder" articles from the
          # nested wiki/ submodule, so it must be present or sync drops them.
          git clone --recurse-submodules \
            "https://x-access-token:${GH_PAT}@github.com/chargingthefuture/wiki-site.git" /tmp/wiki-site

          cd /tmp/wiki-site/wiki-site
          SLUG="$SLUG" TITLE="$TITLE" EXCERPT="$EXCERPT" CATEGORY="$CATEGORY" DATE="$DATE" \
          yq -i '.articles += [{
            "slug": strenv(SLUG), "title": strenv(TITLE),
            "repo": "chargingthefuture/chargingthefuture",
            "date": strenv(DATE), "excerpt": strenv(EXCERPT),
            "category": strenv(CATEGORY)
          }]' content-index.yaml

          corepack enable
          pnpm install --frozen-lockfile
          pnpm wiki:validate
          pnpm wiki:sync

          cd /tmp/wiki-site
          git config user.name  "CTF CI Bot"
          git config user.email "ci@chargingthefuture.org"
          git add wiki-site/content-index.yaml wiki-site/artifacts/wiki/src/lib/articles.ts
          if git commit -m "feat(blog): publish ${DATE} product update — ${SLUG}"; then
            git push
            PUBLISHED=1
          else
            echo "No content-index changes; nothing to publish."
            PUBLISHED=0
          fi

          # Trigger the Pages deploy, which clones wiki-site main and rebuilds.
          if [ "$PUBLISHED" = "1" ]; then
            curl -fsS -X POST \
              -H "Authorization: Bearer ${GH_PAT}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/chargingthefuture/chargingthefuture/dispatches \
              -d '{"event_type":"wiki-site-updated"}'
            echo "Dispatched wiki-site-updated to trigger Pages deploy."
          fi

      # ── Quora draft issue ─────────────────────────────────────────────────────
      - name: Create Quora draft issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_JSON: ${{ steps.content.outputs.json }}
        run: |
          TODAY=$(date +%Y-%m-%d)
          FEED_TITLE=$(echo "$UPDATE_JSON" | jq -r '.feedTitle')
          echo "$UPDATE_JSON" | jq -r '.quoraDraft' > /tmp/quora-draft.md

          gh label create "quora-draft" \
            --color "0075ca" \
            --description "Auto-generated Quora post draft" \
            --force 2>/dev/null || true

          gh label create "posted" \
            --color "0e8a16" \
            --description "Posted to Quora" \
            --force 2>/dev/null || true

          gh issue create \
            --title "Quora Draft: ${TODAY} — ${FEED_TITLE}" \
            --body-file /tmp/quora-draft.md \
            --label "quora-draft"

      # ── Tag for next run's range ──────────────────────────────────────────────
      - name: Tag this update
        run: |
          git config user.email "ci@chargingthefuture.org"
          git config user.name "CTF CI Bot"
          TAG="update/$(date +%Y-%m-%d-%H%M)"
          git tag "$TAG"
          git push origin "$TAG"
