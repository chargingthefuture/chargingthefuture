name: Skills Hunt — Propose Skill Promotions (no AI, manual)

# The no-credit companion to skills-proposal-issues.yml. That scheduled workflow classifies
# each proposed skill with the Anthropic API and goes red, on purpose, for as long as the
# account is unfunded — nothing is filed and the proposals wait. This one is for the months
# when that is the state and the owner wants the queue filed anyway: an agent session starts
# it, it files one `skill-proposal` issue per candidate with the placement left open (no API
# call, no key needed), and that session then reads each issue and adds the suggested sector
# and occupation itself. The owner approves from the issue as before.
#
# Same script, same dedupe: the tracking row is written exactly as a scheduled run writes it,
# so a later funded scheduled run does not file the same skills again. Manual only — it has no
# schedule and must not get one, or the scheduled workflow's red run would stop meaning what it
# means. Recurring (it has a next run whenever the account is unfunded), so it stays.
on:
  workflow_dispatch:
    inputs:
      proposal_limit:
        description: "Max skills to file this run (blank = 10)"
        required: false
        type: string

permissions:
  issues: write
  contents: read

jobs:
  propose-skill-promotions:
    name: File skill-promotion issues without the AI placement step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # DATABASE_URL is a runtime secret; Infisical is the single source of truth (this
      # matches skills-proposal-issues.yml). ANTHROPIC_API_KEY is injected too but not read.
      - name: Inject secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: ${{ secrets.INFISICAL_URL }}
          secret-path: /
          recursive: true

      # The script needs only the Postgres client. Install it standalone so we do not
      # pay for a full monorepo install on every run.
      - name: Install Postgres client
        run: npm install --no-save pg@8

      - name: Propose skill promotions without classification
        env:
          # DATABASE_URL is injected by the Infisical step above.
          # GITHUB_TOKEN is the automatic GitHub Actions token (issues: write granted above).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          SKIP_CLASSIFICATION: 'true'
          PROPOSAL_LIMIT: ${{ inputs.proposal_limit }}
        run: node ctf/scripts/proposeSkillPromotions.mjs
