name: User Guide — Regenerate

# Regenerates the public user guide (/guide + docs/USER_GUIDE.md) from each member-facing plugin's
# own documentation — its inventory "User Features" section and its test script "Core smoke" steps —
# rewritten in the project's plain voice by ctf/scripts/generate-user-guide.mjs. The generator is
# grounded: it can only describe what those docs already say (see issue #1471 for why that matters).
#
# Runs when a plugin's user-facing docs change, and on manual dispatch. It never publishes directly:
# it opens a pull request so the generated wording is reviewed before it goes live on the public
# page. A manual run with publish_wiki=true also pushes the markdown copy to the GitHub wiki.

on:
  workflow_dispatch:
    inputs:
      publish_wiki:
        description: 'Also push the markdown copy to the GitHub wiki page (User-Guide).'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - 'ctf/docs/developer/ctf-plugin-feature-inventories/**'
      - 'ctf/docs/developer/test-scripts/**'
      - 'ctf/scripts/generate-user-guide.mjs'
      - 'ctf/config/manual-test-script-manifest.json'

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: Regenerate the user guide
    runs-on: ubuntu-latest
    # Stamp per-section "Last updated" dates in US Eastern rather than the runner's UTC, so they
    # match the project's local day.
    env:
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the generator's `git log` can date each section from its source docs.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ANTHROPIC_API_KEY comes from Infisical (single source of truth). Without it the generator
      # still runs, falling back to a plain, un-polished extraction — but the polished voice needs it.
      - name: Inject secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: ${{ secrets.INFISICAL_URL }}
          secret-path: /
          recursive: true

      - name: Regenerate the guide
        run: node ctf/scripts/generate-user-guide.mjs

      - name: Open a pull request if the guide changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet -- ctf/packages/web/app/guide/guide-content.json ctf/docs/USER_GUIDE.md; then
            echo "No change to the user guide — nothing to open."
            exit 0
          fi

          DATE=$(date +%Y-%m-%d)
          BRANCH="docs/user-guide-refresh-${DATE}-${GITHUB_RUN_ID}"
          git config user.name  "CTF CI Bot"
          git config user.email "ci@chargingthefuture.org"
          git checkout -b "$BRANCH"
          git add ctf/packages/web/app/guide/guide-content.json ctf/docs/USER_GUIDE.md
          git commit -m "docs: refresh the user guide from plugin docs (auto)"
          git push -u origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: refresh user guide from plugin docs (auto)" \
            --body $'Regenerated by generate-user-guide.yml from each member plugin\'s inventory "User Features" section and test-script "Core smoke" steps.\n\nReview the wording before merging — this is what shows on the public /guide page.\n\nParity Status: web + mobile-responsive + android complete'

      # Optional: push the markdown copy to the GitHub wiki (manual dispatch only).
      - name: Mirror to the GitHub wiki
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_wiki }}
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          git clone \
            "https://x-access-token:${GH_PAT}@github.com/chargingthefuture/chargingthefuture.wiki.git" \
            /tmp/ctf-wiki
          cd /tmp/ctf-wiki
          git config user.email "ci@chargingthefuture.org"
          git config user.name "CTF CI Bot"
          cp "${GITHUB_WORKSPACE}/ctf/docs/USER_GUIDE.md" "User-Guide.md"
          git add "User-Guide.md"
          if git diff --cached --quiet; then
            echo "Wiki already current."
          else
            git commit -m "Update User Guide"
            git push
          fi
