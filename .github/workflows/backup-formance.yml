name: Formance — Nightly Backup to Private Repo

# Nightly backup of Formance Postgres to a PRIVATE GitHub repo as a Release asset.
# Runs daily at 3am UTC and on manual dispatch.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   FORMANCE_DATABASE_URL — Formance Postgres connection string (read access).
#   GH_PAT                — a token with `contents: write` on the backup repo.
#   BACKUP_REPO           — the PRIVATE backup repo as `owner/name`.
#
# Owner setup: create a PRIVATE GitHub repo to hold the backups, set BACKUP_REPO
# (= owner/name) as an Actions secret, and make sure GH_PAT has contents: write
# on that repo. If any required secret is missing the backup script exits
# non-zero and this job FAILS red — backups must fail loudly, never silently.

on:
  schedule:
    - cron: '40 3 * * *' # daily at 03:40 UTC, off the top of the hour and offset from the 02:13 cleanup
  workflow_dispatch:

jobs:
  backup-formance:
    name: Backup Formance Postgres to Private Repo
    runs-on: ubuntu-latest
    env:
      # Formance Postgres connection string (service-level, read access)
      FORMANCE_DATABASE_URL: ${{ secrets.FORMANCE_DATABASE_URL }}
      # Token with contents: write on the private backup repo
      GH_PAT: ${{ secrets.GH_PAT }}
      # Private backup repo as owner/name
      BACKUP_REPO: ${{ secrets.BACKUP_REPO }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        # Install the ctf workspace (same as ci.yml) — its lockfile is validated on every PR.
        # The root workspace lockfile is not CI-gated and has drifted before (issue #1229).
        run: pnpm install --frozen-lockfile --dir ctf

      - name: Install PostgreSQL client 18
        # The runner's bundled pg_dump may be missing or older than the
        # Formance Postgres server (now Postgres 18). pg_dump refuses to
        # dump a server newer than itself, which fails the job in seconds. Install
        # the client matching the newest server from the official PostgreSQL apt
        # repository and put it first on PATH. A newer client dumps older
        # servers fine, so bump this whenever the server's major version moves up.
        run: |
          set -e
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(. /etc/os-release && echo "$VERSION_CODENAME")-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"

      - name: Run Formance backup script
        id: backup
        run: |
          set -e
          # Capture stderr to a file AND print it to the job log on failure, so
          # the real reason shows up directly in the log (not only in the
          # uploaded artifact, which needs a separate download to read).
          if ! node ctf/scripts/backupFormanceToPrivateRepo.mjs 2> backup-error.log; then
            echo "::error::Formance backup failed. Error output from the backup script:"
            cat backup-error.log >&2
            exit 1
          fi

      - name: Upload failure logs (if present)
        if: failure() && steps.backup.outcome == 'failure' && hashFiles('backup-error.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: formance-backup-failure-logs
          path: backup-error.log
          retention-days: 7
