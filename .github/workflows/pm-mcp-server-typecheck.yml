name: pm-mcp-server TypeScript Type-Check

on:
  push:
    paths:
      - 'ctf/packages/pm-mcp-server/**'
  pull_request:
    paths:
      - 'ctf/packages/pm-mcp-server/**'

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v2
        with:
          version: 8
      - name: Install dependencies
        run: pnpm install
      - name: Type-check pm-mcp-server
        run: pnpm --filter ./ctf/packages/pm-mcp-server run type-check
