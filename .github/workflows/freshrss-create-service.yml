name: FreshRSS — Create the service on Render

# Creates the reader's Render service, once, from the Actions tab.
#
# This spends money: a starter instance plus a small disk, billed monthly for as
# long as the service exists. So it does not run on a push, on a schedule, or on
# a merge — only when somebody presses Run and types the confirmation below.
#
# Running it twice is harmless. The script checks for the service by name first
# and changes nothing if it is already there.
#
# What happens after it runs is in the job summary: complete the installer in a
# browser (the admin password is chosen there, never here), attach the domain in
# the Render dashboard, then come back for sign-in with the app — that part
# needs the final hostname, so it waits for the domain.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "create" to confirm this starts a paid service'
        required: true
        type: string
      disk_gb:
        description: 'Disk size in GB — this is the archive, so it can only grow later'
        required: false
        default: '1'
        type: string

jobs:
  create:
    name: Create ctf-freshrss
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$CONFIRM" != "create" ]; then
            echo "::error title=Not confirmed::Type create in the confirmation box to start a paid service."
            exit 1
          fi

      - name: Create the service
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_NAME: ctf-freshrss
          DISK_GB: ${{ inputs.disk_gb }}
        run: bash .github/scripts/render-create-freshrss.sh
