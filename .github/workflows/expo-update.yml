name: Expo Update (OTA)

# Publishes a JavaScript/asset-only over-the-air update via EAS Update when
# `main` is pushed. This does NOT rebuild native code — installed apps pick it up
# on next launch. Use a fresh EAS build (expo-preview / expo-android-release)
# whenever native dependencies or config change.
#
# There is ONE environment: production. `main` publishes to the `production`
# channel. Demo/sample data is a runtime Unleash flag, not a separate channel.

on:
  push:
    branches:
      - main
    paths:
      - "ctf/packages/mobile/**"
      - ".github/workflows/expo-update.yml"

concurrency:
  group: expo-update-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    name: Publish EAS update
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MOBILE_ENV_TARGET: production
      # Same names the web app and app.config.ts read — reused production secrets.
      NEXT_PUBLIC_AUTH_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_AUTH_PUBLISHABLE_KEY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
      NEXT_PUBLIC_AUTH_PROVIDER: ${{ secrets.NEXT_PUBLIC_AUTH_PROVIDER }}
      NEXT_PUBLIC_AUTH_SIGN_IN_URL: ${{ secrets.NEXT_PUBLIC_AUTH_SIGN_IN_URL }}
      EXPO_MOBILE_PROJECT_ID: ${{ secrets.EXPO_MOBILE_PROJECT_ID }}
      EXPO_MOBILE_UPDATES_URL: ${{ secrets.EXPO_MOBILE_UPDATES_URL }}
    steps:
      - name: Fail fast when EXPO_TOKEN is missing
        if: ${{ secrets.EXPO_TOKEN == '' }}
        run: |
          echo "EXPO_TOKEN secret is not set. Add it in repository settings before OTA updates can run."
          exit 1

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: ctf/pnpm-lock.yaml

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install ctf dependencies
        run: pnpm install --frozen-lockfile --dir ctf

      - name: Check mobile env contract
        run: pnpm --dir ctf --filter @ctf/mobile run check:mobile-env

      - name: Publish EAS update
        working-directory: ctf/packages/mobile
        run: |
          set -euo pipefail
          eas update --channel production --message "${GITHUB_SHA}: ${{ github.event.head_commit.message }}" --non-interactive
