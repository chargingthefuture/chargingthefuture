name: Generate — Community Stats Draft

# Weekly sibling of generate-product-update.yml. Instead of turning commits into
# a product update, this turns privacy-safe, whole-community activity totals
# (open SocketRelay posts, Directory profiles and skills, ServiceCredits
# aggregates, and the two Community Value Index figures — real and projected)
# into a short Quora draft, filed as a GitHub issue for the owner to review and
# post. No individual person, post, or profile is ever read — only aggregate
# counts, and the index figures are index numbers, never money.

on:
  schedule:
    - cron: "48 14 * * 1" # Mondays 14:48 UTC (off the top of the hour)
  workflow_dispatch: {}

jobs:
  generate-and-file:
    name: Generate and file community stats draft
    runs-on: ubuntu-latest
    # Stamp the draft date in US Eastern rather than the runner's UTC so it
    # matches the project's local day.
    env:
      TZ: America/New_York
    permissions:
      issues: write # create the community-stats draft issue

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install pg (DB client for the stats queries)
        run: npm install pg@^8.16.3 --no-save

      # Infisical is the single source of truth for runtime secrets. This step
      # injects DATABASE_URL (for the aggregate queries) and ANTHROPIC_API_KEY
      # (to draft the post) into the job env. env-slug is the environment *slug*:
      # the Production environment's slug is "prod". If Infisical is unreachable
      # this step fails the job, by design.
      - name: Inject secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: ${{ secrets.INFISICAL_URL }}
          secret-path: /
          recursive: true

      - name: Generate community stats draft via Claude
        id: content
        run: |
          OUTPUT=$(node ctf/scripts/generate-community-stats.mjs)
          echo "json<<EOF" >> "$GITHUB_OUTPUT"
          echo "$OUTPUT" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create community stats draft issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATE_JSON: ${{ steps.content.outputs.json }}
        run: |
          set -euo pipefail
          TODAY=$(date +%Y-%m-%d)
          TITLE=$(echo "$UPDATE_JSON" | jq -r '.title')

          {
            echo "$UPDATE_JSON" | jq -r '.quoraDraft'
            echo
            echo "---"
            echo "## Source numbers (whole-community totals)"
            echo
            echo "$UPDATE_JSON" | jq -r '.statsMarkdown'
          } > /tmp/community-stats-draft.md

          gh label create "community-stats" \
            --color "5319e7" \
            --description "Auto-generated weekly community activity draft" \
            --force 2>/dev/null || true

          gh label create "posted" \
            --color "0e8a16" \
            --description "Posted to Quora" \
            --force 2>/dev/null || true

          gh issue create \
            --title "Community Stats Draft: ${TODAY} — ${TITLE}" \
            --body-file /tmp/community-stats-draft.md \
            --label "community-stats"
