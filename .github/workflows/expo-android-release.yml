name: Expo Android Release

# Builds a signed production Android APK in Expo's cloud (EAS) and attaches it to
# a GitHub Release when a tag like `mobile-v1.2.3` is pushed. This is the "real
# version" build users install, as opposed to the throwaway preview APKs on PRs.
#
# There is ONE environment: production. This build uses the same production
# backend and Clerk sign-in key as every other build.

on:
  push:
    tags:
      - "mobile-v*"

concurrency:
  group: expo-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      MOBILE_ENV_TARGET: production
      EAS_BUILD_PROFILE: production
      # The app secrets (Clerk keys, app URL, Expo project id/updates URL) are no
      # longer GitHub Actions secrets — Infisical is the single source of truth.
      # The "Inject secrets from Infisical" step below loads them into the job env
      # for all later steps, so app.config.ts and check:mobile-env read them from
      # process.env exactly as before.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Infisical is the single source of truth for app secrets. This step injects
      # the Clerk keys, the app URL, and the Expo project id/updates URL into the
      # job env for every later step. env-slug is the environment *slug* (not its
      # display name): the Production environment's slug is "prod", so
      # env-slug: production returns a 404. recursive:true also reads secrets
      # nested in sub-folders, not just the root path.
      - name: Inject secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        with:
          client-id: ${{ secrets.INFISICAL_CLIENT_ID }}
          client-secret: ${{ secrets.INFISICAL_CLIENT_SECRET }}
          project-slug: ${{ secrets.INFISICAL_PROJECT_SLUG }}
          env-slug: prod
          domain: ${{ secrets.INFISICAL_URL }}
          secret-path: /
          recursive: true

      - name: Fail fast when EXPO_TOKEN is missing
        if: ${{ secrets.EXPO_TOKEN == '' }}
        run: |
          echo "EXPO_TOKEN secret is not set. Add it in repository settings before release builds can run."
          exit 1

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: ctf/pnpm-lock.yaml

      - name: Setup EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install ctf dependencies
        run: pnpm install --frozen-lockfile --dir ctf

      - name: Check mobile env contract
        run: pnpm --dir ctf --filter @ctf/mobile run check:mobile-env

      - name: Build signed production APK on EAS
        working-directory: ctf/packages/mobile
        run: |
          set -euo pipefail
          # Wait for the build, then download the signed APK locally for upload.
          eas build --platform android --profile production --non-interactive --json --wait > build.json
          APK_URL=$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync('build.json','utf8'))[0].artifacts.buildUrl)")
          curl -fSL "$APK_URL" -o charging-the-future-${GITHUB_REF_NAME}.apk

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: ctf/packages/mobile/charging-the-future-${{ github.ref_name }}.apk
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
