name: Port v2 Quora verifications into v3 Unlock (manual)

# One-time data migration. v3's database is a clone of v2 prod, so the v2 `public.users.quora_profile_url`
# values are still present. This inserts an APPROVED v3 Unlock submission for each member who gave a
# Quora URL in v2 and does not already have a v3 submission, so they skip the Unlock screen when they
# return. It does not grant credits directly — the existing Unlock reward reconcile mints each ported
# member's 100 credits idempotently on its next run.
#
# Run a DRY RUN first (the default): Actions → this workflow → Run workflow with "apply" = false. It
# prints how many it would port and a sample of user ids without writing. Confirm the ids look like
# Clerk ids, then run again with "apply" = true to insert.
#
# What it needs (Settings → Secrets and variables → Actions): DATABASE_URL (the app database). If it is
# missing the run FAILS (the script throws) rather than silently passing.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: 'true = WRITE the approved submissions. false = dry run (print only, write nothing).'
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: port-v2-quora-unlocks
  cancel-in-progress: false

jobs:
  port:
    name: Port v2 Quora verifications
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the port (dry run unless apply = true)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          APPLY: ${{ inputs.apply == true && '1' || '0' }}
        run: node ctf/scripts/portV2QuoraUnlocks.mjs
