# CodeRabbit configuration
# Docs: https://docs.coderabbit.ai/reference/configuration
#
# This repo has agents opening PRs frequently. To control review spend,
# auto-review is gated on a label: CodeRabbit only reviews PRs that carry
# the "coderabbit" label. Apply that label to large or complex PRs (or any
# PR you want reviewed). For an unlabeled PR, trigger a one-off review by
# commenting "@coderabbitai review".
#
# Note: a committed .coderabbit.yaml overrides the CodeRabbit org-UI settings
# for this repository.
reviews:
  # Suppress the "Review skipped / in progress / completed" status COMMENT in the
  # PR thread. Real reviews (walkthrough + inline comments) still post when a review
  # actually runs; the skipped state remains visible as the CodeRabbit commit status.
  review_status: false
  auto_review:
    enabled: true
    # Never spend review credits on draft PRs.
    drafts: false
    # Only auto-review PRs that carry one of these labels.
    labels:
      - coderabbit
  tools:
    # Disable CodeRabbit's bundled ESLint. It runs ESLint 10 (flat-config only),
    # which errors on this repo's classic .eslintrc.cjs ("'root' key not supported
    # in flat config") and produces a recurring false failure on every PR. Our CI
    # lints authoritatively with the repo's pinned ESLint 9, so CodeRabbit's copy is
    # redundant noise. Revisit if/when the repo migrates to ESLint flat config.
    eslint:
      enabled: false
