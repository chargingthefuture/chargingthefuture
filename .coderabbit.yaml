# CodeRabbit configuration
# Docs: https://docs.coderabbit.ai/reference/configuration
#
# CodeRabbit review is DISABLED (owner directive, 2026-06-20): the owner uses a
# different code-review tool. Auto-review is turned off below, and the CLI review
# workflow (coderabbit-review.yml) and the draft-pacing workflow
# (pace-coderabbit-reviews.yml) have been removed. This file is kept (not deleted)
# because a committed .coderabbit.yaml overrides the CodeRabbit org-UI settings, so
# keeping it with auto_review disabled guarantees the app does not review PRs here.
reviews:
  # Suppress the "Review skipped / in progress / completed" status COMMENT in the
  # PR thread. Real reviews (walkthrough + inline comments) still post when a review
  # actually runs; the skipped state remains visible as the CodeRabbit commit status.
  review_status: false
  # Skip the whimsical poem at the end of the walkthrough comment.
  poem: false
  pre_merge_checks:
    # Turn off the "Docstring Coverage" warning. It compares doc-comment coverage
    # of the changed files against CodeRabbit's generic 80% default and complains
    # when fewer functions carry a JSDoc block (e.g. 23.53% on a small PR). It is a
    # non-blocking warning — it never fails our CI — and an 80% doc-comment target
    # is a number this repo never chose and does not want: our coding rules favour
    # plain, self-explanatory code over blanket JSDoc on every helper. Measured per
    # diff, the percentage also swings wildly and carries no useful signal.
    docstrings:
      mode: "off"
  auto_review:
    # Disabled: the owner uses a different code-review tool (2026-06-20).
    enabled: false
  tools:
    # Disable CodeRabbit's bundled ESLint. It runs ESLint 10 (flat-config only),
    # which errors on this repo's classic .eslintrc.cjs ("'root' key not supported
    # in flat config") and produces a recurring false failure on every PR. Our CI
    # lints authoritatively with the repo's pinned ESLint 9, so CodeRabbit's copy is
    # redundant noise. Revisit if/when the repo migrates to ESLint flat config.
    eslint:
      enabled: false
