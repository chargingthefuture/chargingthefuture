# render.yaml — Render Blueprint for chargingthefuture v3
# All v3 services migrated from Railway to Render.
# v2 (legacy) remains on Railway until v3 is production-ready.
#
# ENVIRONMENT MODEL
# ───────────────────────────────
# Production is the only persistent environment — it deploys from `main`.
# Every pull request gets a full ephemeral preview environment (all services
# below), which Render destroys automatically when the PR merges or closes.
# There is no permanent staging environment; test branches via previews.
#
# SECRET MANAGEMENT ARCHITECTURE
# ───────────────────────────────
# Infisical (self-hosted on Railway) is the single source of truth for secrets.
# Its Render Sync integration pushes secrets into each production service below.
#
# Preview environments get suffixed service names that Infisical's per-service
# syncs do not target, so preview secrets come from the linked Render env group
# `ctf-preview-secrets` (env groups are inherited by previews). Services that
# need secrets reference it via `fromGroup` below.
#
# IMPORTANT — populating `ctf-preview-secrets`:
#   * Add the staging values as ENV VARS (use the env group's "Add from .env"
#     bulk paste), NOT as a secret file. Render secret files are mounted on disk
#     only and are never loaded into process.env, so the app would not see them.
#   * Production must have Infisical sync every key the group contains. Service-
#     level vars (Infisical → Render Sync) override env-group vars, so any group
#     key NOT synced by Infisical would leak its staging value into production.
#
# For GitHub Actions (backup workflow), add two GitHub secrets:
# INFISICAL_CLIENT_ID + INFISICAL_CLIENT_SECRET; the workflow fetches the rest
# from Infisical at runtime.

# Ephemeral preview environment per PR; auto-destroyed on merge/close.
# expireAfterDays cleans up previews on abandoned-but-open PRs.
previews:
  generation: automatic
  expireAfterDays: 5

services:
  # ── Next.js web app ─────────────────────────────────────────────
  # All secrets injected by Infisical → Render Sync. No manual setup required
  # beyond configuring the Render Sync inside Infisical.
  - type: web
    name: ctf-web
    runtime: docker
    dockerfilePath: ctf/packages/web/Dockerfile
    dockerContext: ctf
    region: ohio
    # Standard (2GB/1CPU) — headroom for a production Next.js app (~159 routes).
    plan: standard
    healthCheckPath: /api/health
    envVars:
      # PREVIEW SECRETS: previews inherit staging values from this env group.
      # In production these are overridden by Infisical → Render Sync, since
      # service-level vars take precedence over env-group vars.
      - fromGroup: ctf-preview-secrets
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Observability — enables Sentry cron check-ins for workforce-incremental-sync
      - key: OBSERVABILITY_PROVIDER
        value: sentry
      # All remaining secrets (DATABASE_URL, CLERK_*, STREAM_*, SENTRY_DSN,
      # CRON_SECRET, INFISICAL_CLIENT_ID/SECRET, FORMANCE_POSTGRES_URI) are synced
      # automatically by Infisical via the Render Sync integration.

  # ── Agent MCP Server ─────────────────────────────────────────────
  # Background worker — stdio MCP transport for agentic build/deploy/debug.
  # Part of 100% agentic infrastructure orchestration.
  # Secrets injected by Infisical → Render Sync.
  - type: worker
    name: ctf-agent-mcp-server
    runtime: docker
    dockerfilePath: ctf/packages/agent-mcp-server/Dockerfile
    dockerContext: ctf
    region: ohio
    plan: starter
    envVars:
      # PREVIEW SECRETS (see ctf-web). Prod overridden by Infisical Render Sync.
      - fromGroup: ctf-preview-secrets

  # ── PM MCP Server ────────────────────────────────────────────────
  # Background worker — stdio MCP transport for PM feedback workflows.
  # Part of 100% agentic infrastructure orchestration.
  # Secrets injected by Infisical → Render Sync.
  - type: worker
    name: ctf-pm-mcp-server
    runtime: docker
    dockerfilePath: ctf/packages/pm-mcp-server/Dockerfile
    dockerContext: ctf
    region: ohio
    plan: starter
    envVars:
      # PREVIEW SECRETS (see ctf-web). Prod overridden by Infisical Render Sync.
      - fromGroup: ctf-preview-secrets
      - key: NODE_ENV
        value: production

  # ── Ollama ────────────────────────────────────────────────────────
  # Private service — reachable by other Render services via internal URL.
  # Render has no persistent volumes; models are baked into the image at build time.
  - type: pserv
    name: ctf-ollama
    runtime: docker
    dockerfilePath: ctf/ops/ollama/Dockerfile
    dockerContext: ctf/ops/ollama
    region: ohio
    plan: standard
    # No fromGroup: ctf-ollama only serves a baked-in model and reads no app
    # secrets, so previews need nothing from ctf-preview-secrets.
    envVars:
      - key: OLLAMA_MODEL
        value: llama3.2

  # ── Infisical (secrets management) ───────────────────────────────
  # DEFERRED to Railway (cost optimization: $5/mo on Railway vs $7/mo on Render).
  # Railway Infisical instance configured with Render Sync integration to push
  # secrets (DATABASE_URL, FORMANCE_POSTGRES_URI, CLERK_*, etc.) to all Render services.
  # TODO: migrate Infisical to Render when cost-benefit favors consolidation.
  # Original pserv config preserved below for future re-migration:
  #
  # - type: pserv
  #   name: ctf-infisical
  #   runtime: docker
  #   dockerfilePath: ctf/ops/infisical/Dockerfile
  #   dockerContext: ctf/ops/infisical
  #   region: ohio
  #   plan: starter
  #   envVars:
  #     - key: ENCRYPTION_KEY
  #       sync: false
  #     - key: AUTH_SECRET
  #       sync: false
  #     - key: SITE_URL
  #       sync: false
  #     - key: DATABASE_URL
  #       sync: false
  #     - key: REDIS_URL
  #       sync: false

  # ── Formance Ledger (financial ledger) ───────────────────────────
  # Private service — pinned to ghcr.io/formancehq/ledger:v2.3.15-dev.1
  # All state lives in Neon Postgres (no persistent disk on Render).
  # AUTO_UPGRADE=true handles schema migrations on container start.
  # Backups: daily pg_dump → Supabase Storage via backup-formance-supabase.yml.
  # FORMANCE_POSTGRES_URI injected by Infisical → Render Sync.
  - type: pserv
    name: ctf-formance-ledger
    runtime: docker
    dockerfilePath: ctf/ops/formance/Dockerfile.ledger
    dockerContext: ctf/ops/formance
    region: ohio
    plan: starter
    envVars:
      # PREVIEW SECRETS (see ctf-web): previews need FORMANCE_POSTGRES_URI from the
      # staging env group. Prod overridden by Infisical Render Sync.
      - fromGroup: ctf-preview-secrets
