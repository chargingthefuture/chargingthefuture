# render.yaml — Render Blueprint for chargingthefuture v3
# All v3 services migrated from Railway to Render.
# v2 (legacy) remains on Railway until v3 is production-ready.
#
# ENVIRONMENT MODEL
# ───────────────────────────────
# Production is the only environment — it deploys from `main`. Render preview
# environments are NOT used: they require a paid (non-Hobby) workspace, and a
# `previews:` block here blocks Blueprint sync on a Hobby workspace. Test
# changes locally / in Codespaces before merging to `main`. To get ephemeral
# per-PR previews later, upgrade the workspace and re-add a `previews:` block.
#
# SECRET MANAGEMENT ARCHITECTURE
# ───────────────────────────────
# Infisical (self-hosted on Railway) is the single source of truth for secrets.
# Its Render Sync integration pushes secrets into each production service below
# via service-level environment variables (which take precedence over env groups).
#
# For GitHub Actions (backup workflow), add two GitHub secrets:
# INFISICAL_CLIENT_ID + INFISICAL_CLIENT_SECRET; the workflow fetches the rest
# from Infisical at runtime.

services:
  # ── Next.js web app ─────────────────────────────────────────────
  # All secrets injected by Infisical → Render Sync. No manual setup required
  # beyond configuring the Render Sync inside Infisical.
  - type: web
    name: ctf-web
    runtime: docker
    dockerfilePath: ctf/packages/web/Dockerfile
    dockerContext: ctf
    region: ohio
    # Standard (2GB/1CPU) — headroom for a production Next.js app (~159 routes).
    plan: standard
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: "3000"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Observability — enables Sentry cron check-ins for workforce-incremental-sync
      - key: OBSERVABILITY_PROVIDER
        value: sentry
      # All remaining secrets (DATABASE_URL, CLERK_*, STREAM_*, SENTRY_DSN,
      # CRON_SECRET, INFISICAL_CLIENT_ID/SECRET, FORMANCE_POSTGRES_URI) are synced
      # automatically by Infisical via the Render Sync integration.

  # ── PM MCP Server ────────────────────────────────────────────────
  # Background worker — stdio MCP transport for PM feedback workflows.
  # Part of 100% agentic infrastructure orchestration.
  # Secrets injected by Infisical → Render Sync.
  - type: worker
    name: ctf-pm-mcp-server
    runtime: docker
    dockerfilePath: ctf/packages/pm-mcp-server/Dockerfile
    dockerContext: ctf/packages/pm-mcp-server
    region: ohio
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production

  # ── Ollama ────────────────────────────────────────────────────────
  # Private service — reachable by other Render services via internal URL.
  # Render has no persistent volumes; models are baked into the image at build time.
  - type: pserv
    name: ctf-ollama
    runtime: docker
    dockerfilePath: ctf/ops/ollama/Dockerfile
    dockerContext: ctf/ops/ollama
    region: ohio
    plan: standard
    # No fromGroup: ctf-ollama only serves a baked-in model and reads no app
    # secrets, so it needs nothing from ctf-preview-secrets.
    envVars:
      - key: OLLAMA_MODEL
        value: llama3.2

  # ── Infisical (secrets management) ───────────────────────────────
  # DEFERRED to Railway (cost optimization: $5/mo on Railway vs $7/mo on Render).
  # Railway Infisical instance configured with Render Sync integration to push
  # secrets (DATABASE_URL, FORMANCE_POSTGRES_URI, CLERK_*, etc.) to all Render services.
  # TODO: migrate Infisical to Render when cost-benefit favors consolidation.
  # Original pserv config preserved below for future re-migration:
  #
  # - type: pserv
  #   name: ctf-infisical
  #   runtime: docker
  #   dockerfilePath: ctf/ops/infisical/Dockerfile
  #   dockerContext: ctf/ops/infisical
  #   region: ohio
  #   plan: starter
  #   envVars:
  #     - key: ENCRYPTION_KEY
  #       sync: false
  #     - key: AUTH_SECRET
  #       sync: false
  #     - key: SITE_URL
  #       sync: false
  #     - key: DATABASE_URL
  #       sync: false
  #     - key: REDIS_URL
  #       sync: false

  # ── Formance Ledger (financial ledger) ───────────────────────────
  # Private service — pinned to ghcr.io/formancehq/ledger:v2.3.15-dev.1
  # All state lives in Neon Postgres (no persistent disk on Render).
  # AUTO_UPGRADE=true handles schema migrations on container start.
  # Backups: daily pg_dump → Supabase Storage via backup-formance-supabase.yml.
  # FORMANCE_POSTGRES_URI injected by Infisical → Render Sync.
  - type: pserv
    name: ctf-formance-ledger
    runtime: docker
    dockerfilePath: ctf/ops/formance/Dockerfile.ledger
    dockerContext: ctf/ops/formance
    region: ohio
    plan: starter
    envVars: []
