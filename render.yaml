# render.yaml — Render Blueprint for chargingthefuture v3
# All v3 services migrated from Railway to Render.
# v2 (legacy) remains on Railway until v3 is production-ready.
#
# ENVIRONMENT MODEL
# ───────────────────────────────
# Production is the only environment — it deploys from `main`. Render preview
# environments are NOT used: they require a paid (non-Hobby) workspace, and a
# `previews:` block here blocks Blueprint sync on a Hobby workspace. Test
# changes locally / in Codespaces before merging to `main`. To get ephemeral
# per-PR previews later, upgrade the workspace and re-add a `previews:` block.
#
# IMAGE BUILD ARCHITECTURE
# ───────────────────────────────
# Docker images are built by GitHub Actions (build-images.yml) and pushed to
# GHCR (ghcr.io/chargingthefuture/*:latest). Render pulls pre-built images —
# zero Render build pipeline minutes consumed.
#
# FIRST-TIME SETUP: after build-images.yml runs for the first time, go to
# github.com/orgs/chargingthefuture/packages → each ctf-* image →
# Package settings → Change visibility → Public.
# This lets Render pull images without registry credentials.
#
# SECRET MANAGEMENT ARCHITECTURE
# ───────────────────────────────
# Infisical (self-hosted on Railway) is the single source of truth for secrets.
# Its Render Sync integration pushes secrets into each production service below
# via service-level environment variables (which take precedence over env groups).
#
# For GitHub Actions (backup workflow), add two GitHub secrets:
# INFISICAL_CLIENT_ID + INFISICAL_CLIENT_SECRET; the workflow fetches the rest
# from Infisical at runtime.

services:
  # ── Next.js web app ─────────────────────────────────────────────
  # Image built by build-images.yml → ghcr.io/chargingthefuture/ctf-web:latest
  # All secrets injected by Infisical → Render Sync. No manual setup required
  # beyond configuring the Render Sync inside Infisical.
  - type: web
    name: ctf-web
    runtime: image
    image:
      url: ghcr.io/chargingthefuture/ctf-web:latest
    region: ohio
    # Standard (2GB/1CPU) — headroom for a production Next.js app (~159 routes).
    plan: standard
    healthCheckPath: /api/health
    envVars:
      # PORT is injected automatically by Render (default 10000) and consumed by
      # the container's CMD (PORT=${PORT:-3000}). Do NOT hardcode PORT here — an
      # explicit value makes the server bind to a port Render does not route to,
      # causing health-check timeouts.
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Observability — enables Sentry cron check-ins for workforce-incremental-sync
      - key: OBSERVABILITY_PROVIDER
        value: sentry
      # Server-side (runtime) secrets are synced automatically by Infisical →
      # Render Sync. These are read by the running container at request time:
      #   AUTH_SECRET_KEY               — Clerk secret key (sk_test_… / sk_live_…)
      #   CLERK_ENCRYPTION_KEY          — random 32-char string (openssl rand -hex 16); required when secretKey is passed dynamically
      #   DATABASE_URL                  — Neon Postgres connection string
      #   STREAM_API_KEY / STREAM_API_SECRET — Stream Chat
      #   SENTRY_DSN / SENTRY_AUTH_TOKEN
      #   CRON_SECRET
      #   INFISICAL_CLIENT_ID / INFISICAL_CLIENT_SECRET
      #   FORMANCE_POSTGRES_URI         — Neon Postgres URI for Formance ledger
      #
      # IMPORTANT — the browser-side Clerk values are NOT in this list and are
      # NOT read from Render/Infisical at runtime. Next.js inlines every
      # `NEXT_PUBLIC_*` value into the client JavaScript bundle at BUILD time, so
      # they come from the GitHub Actions secrets passed as --build-arg in
      # build-images.yml (NEXT_PUBLIC_AUTH_PUBLISHABLE_KEY,
      # NEXT_PUBLIC_AUTH_SIGN_IN_URL, NEXT_PUBLIC_AUTH_AFTER_SIGN_OUT_URL,
      # NEXT_PUBLIC_AUTH_PROVIDER, NEXT_PUBLIC_APP_URL). NEXT_PUBLIC_AUTH_SIGN_IN_URL
      # must be Clerk's hosted Account Portal URL (e.g.
      # https://accounts.<domain>/sign-in), NOT /sign-in on the app's own domain —
      # a same-host value sends the in-app /sign-in page into an endless redirect
      # loop. Changing the publishable
      # key in Infisical/Render has NO effect on the browser — you must update the
      # GitHub Actions secret and rebuild the image (build-images.yml) so the new
      # value is re-baked. Syncing a `NEXT_PUBLIC_*` value into Render at runtime
      # is a no-op for the client; do not rely on it.

  # ── route-weather (personal, no-UI plain-text weather) ───────────
  # Image built by build-images.yml → ghcr.io/chargingthefuture/ctf-route-weather:latest
  # Standalone service (NOT a plugin): no DB, no schema, no UI surface, not in the
  # plugin registry. Returns text/plain weather for a route or a point so an Apple
  # Shortcut / Siri can read it. See ctf/ops/route-weather/README.md.
  # First deploy: make the new GHCR package public so Render can pull it.
  - type: web
    name: ctf-route-weather
    runtime: image
    image:
      url: ghcr.io/chargingthefuture/ctf-route-weather:latest
    region: ohio
    # Cheapest tier is plenty — dependency-free Node, no DB. Starter avoids the
    # free-tier spin-down so the endpoint answers quickly when asked while driving.
    plan: starter
    healthCheckPath: /health
    envVars:
      # PORT is injected by Render and read by the server. Do NOT hardcode it.
      - key: NODE_ENV
        value: production
      # Shared access token — set in Render/Infisical, never committed. When set,
      # every /weather call must present it. Generate with: openssl rand -hex 16
      - key: ROUTE_WEATHER_TOKEN
        sync: false

  # ── Ollama ────────────────────────────────────────────────────────
  # Image built by build-images.yml → ghcr.io/chargingthefuture/ctf-ollama:latest
  # Private service — reachable by other Render services via internal URL.
  # Model (llama3.2) is baked into the image at build time. Image only rebuilt
  # when ctf/ops/ollama/Dockerfile changes (path-filtered in build-images.yml).
  # Render has no GPUs, so this runs a small model on CPU. To run a stronger model
  # (issue #502) move Ollama to an external GPU host and point the web service's
  # OLLAMA_BASE_URL/OLLAMA_MODEL (and OLLAMA_API_KEY if the host is behind a proxy)
  # at it — see ctf/docs/developer/OLLAMA.md — then remove this block. Until then
  # this stays as-is so production keeps a working (if weak) model.
  - type: pserv
    name: ctf-ollama
    runtime: image
    image:
      url: ghcr.io/chargingthefuture/ctf-ollama:latest
    region: ohio
    plan: standard
    envVars:
      - key: OLLAMA_MODEL
        value: llama3.2

  # ── Infisical (secrets management) AND Unleash (feature flags) ───
  # BOTH stay on Railway — re-confirmed June 2026 after re-examining a move to Render.
  # Reason: Render bills a FLAT per-instance tier 24/7 (Starter 512 MB = $7/mo,
  # Standard 2 GB = $25/mo), regardless of how idle a service is. Railway meters
  # actual RAM/CPU, so these two mostly-idle stateful services are cheaper there.
  #   • Infisical needs the Standard ($25/mo) tier — its own hardware docs say
  #     4 GB recommended and 512 MB is below spec; the older
  #     scripts/deploy-infisical-render.sh even force-upgrades it to Standard.
  #   • Unleash is lighter (Starter $7/mo may hold), but moving it alone buys
  #     little while splitting the secrets/flags stack across two platforms.
  # Moving both to Render would cost ~$32–50/mo vs the ~$5–15/mo metered on
  # Railway — i.e. MORE, not the same. The earlier Render attempt (PR #73) was
  # pulled for the same cost reason, not a deployment bug. Do NOT re-migrate
  # unless Render adds usage-based pricing or these services grow enough that a
  # fixed 2 GB tier is justified anyway.
  # Railway Infisical instance is configured with the Render Sync integration to
  # push secrets (DATABASE_URL, AUTH_SECRET_KEY, FORMANCE_POSTGRES_URI, etc.) to
  # all Render services; the web app reads Unleash via UNLEASH_API_URL /
  # UNLEASH_API_TOKEN_BACKEND. Original Infisical pserv config preserved below:
  #
  # - type: pserv
  #   name: ctf-infisical
  #   runtime: image
  #   image:
  #     url: ghcr.io/chargingthefuture/ctf-infisical:latest
  #   region: ohio
  #   plan: starter
  #   envVars:
  #     - key: ENCRYPTION_KEY
  #       sync: false
  #     - key: AUTH_SECRET
  #       sync: false
  #     - key: SITE_URL
  #       sync: false
  #     - key: DATABASE_URL
  #       sync: false
  #     - key: REDIS_URL
  #       sync: false

  # ── Formance Ledger (financial ledger) ───────────────────────────
  # Image built by build-images.yml → ghcr.io/chargingthefuture/ctf-formance-ledger:latest
  # Private service — wraps ghcr.io/formancehq/ledger with Render-compatible config.
  # All state lives in Neon Postgres (no persistent disk on Render).
  # AUTO_UPGRADE=true handles schema migrations on container start.
  # Backups: daily pg_dump → Supabase Storage via backup-formance-supabase.yml.
  # FORMANCE_POSTGRES_URI injected by Infisical → Render Sync.
  - type: pserv
    name: ctf-formance-ledger
    runtime: image
    image:
      url: ghcr.io/chargingthefuture/ctf-formance-ledger:latest
    region: ohio
    plan: starter
    envVars:
      # FORMANCE_POSTGRES_URI is synced from Infisical → Render Sync.
      # AUTO_UPGRADE=true (baked into image) runs schema migrations on startup —
      # no manual SQL needed. Ensure this var is set before first deploy.
      - key: FORMANCE_POSTGRES_URI
        sync: false
